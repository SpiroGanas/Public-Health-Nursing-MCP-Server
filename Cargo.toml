[workspace]
resolver = "3"
members = [
    "crates/phn-core",
    "crates/phn-content",
    "crates/phn-data",
    "crates/phn-epi",
    "crates/phn-cdsi",
    "crates/phn-local",
    "crates/phn-docs",
    "crates/phn-tools",
    "crates/phn-server",
    "xtask",
]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SpiroGanas/Public-Health-Nursing-MCP-Server"
authors = ["Public Health Nursing MCP Server contributors"]
publish = false

[workspace.dependencies]
phn-core = { path = "crates/phn-core" }
phn-content = { path = "crates/phn-content" }
phn-data = { path = "crates/phn-data" }
phn-epi = { path = "crates/phn-epi" }
phn-cdsi = { path = "crates/phn-cdsi" }
phn-local = { path = "crates/phn-local" }
phn-docs = { path = "crates/phn-docs" }
phn-tools = { path = "crates/phn-tools" }

rmcp = { version = "3.9", default-features = false }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"
toml = "1.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.11"
hex = "0.4"
strsim = "0.11"
unicode-normalization = "0.1"
regex = "1"
statrs = "0.19"
csv = "1.4"
calamine = "0.38"
rust_xlsxwriter = "0.102"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
lopdf = { version = "0.47", default-features = false }
scraper = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
skrifa = "0.44"
subsetter = "0.2"
resvg = { version = "0.49", default-features = false, features = ["text"] }
tantivy = "0.27"
walkdir = "2"
tempfile = "3"
jsonschema = { version = "0.60", default-features = false }
base64 = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Matrix code (tables, suppression, layout) reads more clearly with indices.
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev]
# Line tables keep backtraces useful while keeping target/ small.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
