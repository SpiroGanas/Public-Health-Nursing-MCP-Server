# Definitions, default settings, and plain-language interpretation rules for
# economic_evaluation_calculator (PLAN-10): cost per participant and per outcome, cost-effectiveness
# ratio and ICER, net benefit, benefit-cost ratio, return on investment, break-even, discounting,
# and one-way sensitivity analysis.
#
# REVIEW STATUS: pending. Drafted from pages read on 2026-11-12 (CDC MMWR 2024, a CDC commentary
# on the Second Panel, and the PubMed record of the Second Panel's report). The Second Panel report
# itself and OMB Circular A-94 could not be read (publisher and White House hosts blocked), so the
# 3 percent default discount rate rests on how CDC applied the Panel, and every item that depends
# on the Panel's own text or on Circular A-94 is marked low confidence.
# Schema: content/schemas/planning_economic_evaluation.schema.json
meta:
  id: planning-economic-evaluation
  title: Economic evaluation definitions, default discount rate, sensitivity defaults, and interpretation rules
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: "Health and Economic Benefits of Routine Childhood Immunizations in the Era of the Vaccines for Children Program, United States, 1994-2023 (MMWR 2024;73(31))"
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/mmwr/volumes/73/wr/mm7331a2.htm
  related_sources:
    - title: "Recommendations of the Second Panel on Cost Effectiveness in Health and Medicine: A Reference, Not a Rule Book (Am J Prev Med 2018;54(4):600-602)"
      publisher: Centers for Disease Control and Prevention authors; HHS Public Access manuscript
      url: https://stacks.cdc.gov/view/cdc/56871/cdc_56871_DS1.pdf
    - title: "Recommendations for Conduct, Methodological Practices, and Reporting of Cost-effectiveness Analyses: Second Panel on Cost-Effectiveness in Health and Medicine (JAMA 2016;316(10):1093-1103), PubMed record 27623463"
      publisher: JAMA; National Library of Medicine
      url: https://pubmed.ncbi.nlm.nih.gov/27623463/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The benefit-cost ratio and net savings definitions, the 3 percent annual discounting, and the
    payer and societal perspectives are read from the CDC MMWR report (high confidence for what the
    report did; the values in its Table 2 are the tool's golden test). The statements about
    dominant strategies, the choice of outcome, and the perspective come from the CDC commentary
    on the Second Panel (high). The JAMA abstract was read but not the report, so the Panel's own
    wording (reference case, impact inventory) is cited from the abstract only. The formulas for
    the average cost-effectiveness ratio, ICER, and return on investment are standard textbook
    definitions that no fetched page spells out; they are marked medium. OMB Circular A-94 (the
    federal benefit-cost guidance and its discount rates) could not be read: nothing from it is
    used. The default sensitivity ranges are this tool's illustrative choices, not published
    standards (low).

