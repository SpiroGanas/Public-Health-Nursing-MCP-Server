# Defaults. Every one can be overridden in the request.
defaults:
  discount_rate_percent: 3
  discount_rate_source: mmwr-2024
  discount_rate_section: Methods (all future benefits and costs discounted annually at 3 percent, as recommended by the Second Panel)
  discount_rate_confidence: medium
  discount_rate_note: >-
    CDC's 2024 immunization analysis discounted at 3 percent a year and cites the Second Panel for
    it. The Panel's report itself was not read. Some funders or federal guidance use other rates
    (OMB Circular A-94 was not read): use the rate your funder or course requires.
  discount_rate_sensitivity_low_percent: 0
  discount_rate_sensitivity_high_percent: 7
  discount_rate_sensitivity_note: >-
    0 and 7 percent are common sensitivity values in published analyses; this tool's choice, not
    read from a fetched source.
  sensitivity_swing_percent: 20
  sensitivity_swing_note: >-
    When you give no range for a number, the tool varies it by 20 percent up and down so you can
    see which inputs matter most. That range is illustrative: replace it with a range your data or
    literature supports.
  first_year_discounted: false
  timing_note: >-
    Year 1 amounts are treated as occurring at the start of the program and are not discounted;
    year 2 is discounted one year, and so on. Say so if you report the result.

# Definitions as the tool computes them.
definitions:
  - id: cost_per_participant
    label: Cost per participant
    formula: total cost / number of participants
    text: What the program spends for each person it serves. It is an average, and says nothing about whether anyone benefited.
    source: tool-definition
    section: definition
    confidence: medium
  - id: cost_per_outcome
    label: Average cost per outcome (average cost-effectiveness ratio)
    formula: total cost / number of outcomes achieved
    text: Cost for each outcome you counted (a case averted, a person who quit smoking). It compares the program with doing nothing and is not an incremental ratio.
    source: tool-definition
    section: definition
    confidence: medium
  - id: icer
    label: Incremental cost-effectiveness ratio (ICER)
    formula: (cost of the program - cost of the comparator) / (outcomes of the program - outcomes of the comparator)
    text: Extra cost for each extra outcome gained by choosing the program over the comparator.
    source: tool-definition
    section: definition
    confidence: medium
  - id: net_benefit
    label: Net benefit (net savings)
    formula: benefits - costs
    text: Benefits minus the program costs, both in present value.
    source: mmwr-2024
    section: Methods (Outcomes Estimated and Calculations)
    confidence: high
  - id: bcr
    label: Benefit-cost ratio
    formula: benefits / costs
    text: Dollars of benefits per dollar of program cost, both in present value.
    source: mmwr-2024
    section: Methods (Outcomes Estimated and Calculations)
    confidence: high
  - id: roi
    label: Return on investment
    formula: (benefits - costs) / costs
    text: Net benefit as a share of cost. It equals the benefit-cost ratio minus 1.
    source: tool-definition
    section: definition
    confidence: medium
  - id: break_even
    label: Break-even
    formula: value per outcome = present-value cost / present-value outcomes; outcomes needed = present-value cost / value per outcome
    text: The value of one outcome, or the number of outcomes, at which the benefits exactly equal the cost (benefit-cost ratio of 1).
    source: tool-definition
    section: definition
    confidence: medium
  - id: discounting
    label: Present value
    formula: amount in year t / (1 + rate)^(t - 1), year 1 undiscounted
    text: Puts costs and benefits that occur in different years on a common footing.
    source: mmwr-2024
    section: Methods (discounting)
    confidence: medium

perspectives:
  - id: program
    label: Program (the budget you manage)
    text: Counts only what the program spends and the savings or revenue it brings in. This is the usual view for a grant-funded program.
    source: tool-definition
    section: definition
    confidence: medium
  - id: payer
    label: Payer or health care sector
    text: Includes health care spending by all payers, whether public, private, or individual.
    source: ajpm-2018
    section: Recommendations (perspective)
    confidence: high
  - id: societal
    label: Societal
    text: Includes all costs and health benefits regardless of who incurs the costs or receives the benefits, including costs outside health care such as criminal justice and environmental effects.
    source: ajpm-2018
    section: Recommendations (perspective)
    confidence: high

# Plain-language reading rules. {name} fields are filled by the tool.
interpretation:
  always:
    - text: This is a calculation from the numbers you entered. It does not check that the program caused the outcomes, that the outcome counts are right, or that the dollar value of an outcome is right.
      source: tool-definition
      section: general
      confidence: medium
    - text: The Second Panel recommendations are a reference, not a rule book; choose the outcome and the perspective to fit the question and the audience.
      source: ajpm-2018
      section: Conclusions
      confidence: high
    - text: Costs and benefits should be counted from one stated perspective. Do not mix a program's costs with societal benefits unless you say that is what you did.
      source: ajpm-2018
      section: Recommendations (perspective)
      confidence: high
  no_comparator:
    text: Cost per outcome is an average against doing nothing. It does not show the program is better than another way to reach the same outcome; add a comparator to get an incremental ratio.
    source: tool-definition
    section: definition
    confidence: medium
  dominant:
    text: The program costs less and achieves more than the comparator (it dominates it). A ratio is not meaningful in that case because the magnitude of a negative ratio does not mean anything; report the cost savings and the outcomes instead.
    source: ajpm-2018
    section: Recommendations (outcome measure)
    confidence: high
  dominated:
    text: The program costs more and achieves less than the comparator (it is dominated). A ratio is not meaningful.
    source: tool-definition
    section: definition
    confidence: medium
  smaller_cheaper:
    text: The program costs less but also achieves less than the comparator. The ratio is the money saved for each outcome given up; whether that trade is acceptable is a judgment for decision makers.
    source: tool-definition
    section: definition
    confidence: medium
  no_difference:
    text: The program and the comparator have the same outcomes, so an incremental ratio cannot be calculated; compare costs only.
    source: tool-definition
    section: definition
    confidence: medium
  bcr_below_one:
    text: A benefit-cost ratio below 1 means the benefits you counted are smaller than the cost. Benefits you did not or could not put a dollar value on are not in the ratio.
    source: tool-definition
    section: definition
    confidence: medium
  threshold_none:
    text: No willingness-to-pay threshold was applied. There is no single threshold that fits every program or decision; if your funder or course names one, enter it.
    source: ajpm-2018
    section: Conclusions (one size does not fit all)
    confidence: medium
  sensitivity_flip:
    text: The conclusion changes within the ranges you tested for {parameters}; treat it as uncertain until those numbers are better known.
    source: tool-definition
    section: definition
    confidence: medium
  sensitivity_robust:
    text: The conclusion did not change within the ranges tested, one number at a time. Changing several at once could still change it.
    source: tool-definition
    section: definition
    confidence: medium
