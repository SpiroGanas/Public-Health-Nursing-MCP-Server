# Search aids and notes for find_evidence_based_interventions (PLAN-03): how the tool reads the
# evidence rating words in the Community Guide papers it bundles, which health topics it
# recognizes (so a search for "smoking" also finds "tobacco"), and what could not be read
# (the Community Guide and What Works for Health web sites).
#
# REVIEW STATUS: pending. Drafted 2026-11-12.
# Schema: content/schemas/planning_evidence_sources.schema.json
# The records themselves are in snapshots/cpstf_publications.json (builder:
# xtask/scripts/build_interventions_snapshots.py). Nothing in this file is a rating.
meta:
  id: planning-evidence-sources
  title: Evidence search aids and source notes (Community Guide papers, What Works for Health)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: Papers attributed to the Community Preventive Services Task Force, as indexed in PubMed
    publisher: National Library of Medicine (PubMed); Community Preventive Services Task Force
    url: https://pubmed.ncbi.nlm.nih.gov/
  related_sources:
    - title: The Community Guide (Community Preventive Services Task Force recommendations)
      publisher: Community Preventive Services Task Force and CDC
      url: https://www.thecommunityguide.org/
    - title: What Works for Health (strategies and evidence ratings)
      publisher: County Health Rankings & Roadmaps, University of Wisconsin Population Health Institute
      url: https://www.countyhealthrankings.org/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The Community Guide (www.thecommunityguide.org) and What Works for Health
    (www.countyhealthrankings.org) were both refused by the build network's egress policy on
    2026-11-12 (HTTP 403 to the connection request), so neither site, nor its terms of use, was
    read. The wording of the rating key comes from sentences in the PubMed abstracts of Community
    Guide papers (read on 2026-11-12) and is medium confidence: the exact Community Guide
    definitions of 'strong' and 'sufficient' evidence were not read. The topic list is this
    project's search aid (medium confidence): each topic's terms were chosen from the titles and
    MeSH headings of the papers in the snapshot, not from a Community Guide topic list. The two
    web addresses given for the sites were not opened; they are the sites' home pages and the
    nurse should search each site for the topic.

rating_key:
  - term: strong_evidence
    label: strong evidence of effectiveness
    meaning: >-
      The abstract says the review found 'strong evidence' (Community Guide papers describe this
      as a judgment from the number of studies, the size of the effect, and the consistency of the
      findings). Where the Task Force recommends an intervention it is on the basis of strong or
      sufficient evidence.
  - term: sufficient_evidence
    label: sufficient evidence of effectiveness
    meaning: The abstract says 'sufficient evidence' of effectiveness for the intervention.
  - term: insufficient_evidence
    label: insufficient evidence to determine effectiveness
    meaning: >-
      The abstract says there is not enough evidence to decide. The papers themselves note that
      this should not be read as evidence that the intervention does not work.
  - term: recommended
    label: Task Force recommends (in the abstract)
    meaning: The abstract says the Task Force recommends the intervention or a group of interventions.
  - term: recommended_against
    label: Task Force recommends against
    meaning: The abstract says the Task Force recommends against the intervention.

not_read:
  - id: community_guide
    name: The Community Guide
    url: https://www.thecommunityguide.org/
    reason: The site refused the connection from the build network (HTTP 403 to the proxy connection request), so its recommendation pages, ratings, and terms of use were not read.
    how_to_check: Search the site for your topic and open the recommendation page. It shows the Task Force's finding, the evidence summary, applicability, barriers, economic evidence, and any update or archive notice.
  - id: what_works_for_health
    name: What Works for Health (County Health Rankings and Roadmaps)
    url: https://www.countyhealthrankings.org/
    reason: The site refused the connection from the build network (HTTP 403 to the proxy connection request), so none of its strategies or evidence ratings are bundled and no live lookup exists.
    how_to_check: On the County Health Rankings site, open its strategies and solutions section and search What Works for Health for your topic; it rates strategies by evidence and lists what is known about equity and implementation.

