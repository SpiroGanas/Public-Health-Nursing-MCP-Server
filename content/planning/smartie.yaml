# SMARTIE objective elements, the structured checker's rules, and Healthy People 2030 notes for
# write_smartie_objectives (PLAN-02).
#
# REVIEW STATUS: pending. The SMARTIE questions are quoted from CDC's National Breast and Cervical
# Cancer Early Detection Program document "Writing Effective Objectives" (CDC Stacks 251674,
# 2021-09-23); the SMART list is from CDC's Program Evaluation Framework Action Guide. Healthy
# People 2030 definitions are from ODPHP's pages. The checker's rules (which fields each element
# needs) are this project's own reading of those questions (confidence medium).
# Schema: content/schemas/planning_smartie.schema.json
meta:
  id: planning-smartie
  title: SMARTIE objectives (CDC) and Healthy People 2030 notes
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2021-09-23
  source:
    title: "National Breast and Cervical Cancer Early Detection Program: Writing Effective Objectives (SMARTIE objectives)"
    publisher: Centers for Disease Control and Prevention, National Center for Chronic Disease Prevention and Health Promotion
    url: https://stacks.cdc.gov/view/cdc/251674
  related_sources:
    - title: CDC Program Evaluation Framework Action Guide, Step 4 (SMART indicators)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/evaluation/php/evaluation-framework-action-guide/step-4-gather-credible-evidence.html
    - title: Healthy People 2030 About the Objectives
      publisher: Office of Disease Prevention and Health Promotion, HHS
      url: https://odphp.health.gov/healthypeople/objectives-and-data/about-objectives
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The seven SMARTIE questions and the three traditional-versus-SMARTIE example pairs are copied
    from the CDC document (a U.S. government work) read on 2026-11-12 (high confidence). CDC's
    sheet names the letters Specific, Measurable, Attainable, Relevant, Time-based, Inclusive,
    and Equitable; the same agency's Action Guide writes Specific, Measurable, Achievable,
    Relevant, and Timebound for SMART, so this tool uses "achievable" and "time-bound" and notes
    CDC's variants. The CDC sheet's equity question ends with "cancer screening disparities"
    because it was written for the cancer screening program; the tool generalizes it to "health
    disparities" and says so. Who first coined SMART or SMARTIE was not established: CDC's
    sheet credits no originator and points to other organizations' pages that were not read
    (The Management Center, Massachusetts DPH's Racial Equity Data Road Map pages 52-53). The
    Doran 1981 article often cited for SMART could not be checked from here and is not cited.
    Which fields each element needs, the date formats, and the equity-dimension prompts are this
    project's own (medium to low confidence). Healthy People 2030 core, developmental, and
    research definitions and status meanings are quoted from ODPHP's About the Objectives page
    read 2026-11-12 (high confidence).

