# Phrases (lower case) that point to the kind of announcement. Counted, not decisive.
kind_cues:
  federal_nofo: [notice of funding opportunity, nofo, grants.gov, sam.gov, unique entity identifier, uei, assistance listing, sf-424, 2 cfr 200, cooperative agreement, merit review, funding opportunity number, authorizing legislation, applicant eligibility]
  ma_rfr: [request for response, request for responses, rfr, commbuys, 801 cmr 21, bidder, bidders, osd, commonwealth of massachusetts, sbpp, procurement contact, bid number, small business purchasing program]
  other_call: [request for proposals, request for applications, call for proposals, letter of inquiry, foundation, rfp, rfa]

# What kind of date a line is about (first group that matches the line or the line before it wins).
deadline_cues:
  submission: [responses due, response due, proposals due, applications due, application due, application deadline, submission deadline, must be received, no later than, due date, deadline for submission, submit by, closing date, closes, bid opening, due by]
  questions: [questions due, bidder questions, written questions, questions must, inquiries, q&a, question deadline]
  conference: [bidders conference, bidders' conference, applicants conference, applicant conference, pre-application, pre-bid, information session, webinar, technical assistance call, conference call]
  intent: [notice of intent, letter of intent, intent to apply, intent to respond, letter of inquiry]
  award: [award notification, notice of award, anticipated award, awards announced, notification of award, evaluative meeting, selection, contract start, negotiation]
  start: [project start, period of performance begins, start date, anticipated start, contract term begins, project period]

# Phrases that introduce a page, word, or character limit, and style rules to report.
limit_cues: [not exceed, no more than, maximum of, limited to, up to, page limit, must not be longer than, not to exceed, at most, maximum length, limit of]
format_cues: [font, times new roman, arial, calibri, point size, double spaced, double-spaced, single spaced, single-spaced, margin, margins, 8.5 x 11, letter size, pdf format, file format, pdf, docx, file name, naming convention]

eligibility_cues: [eligible applicant, eligible applicants, eligibility, who may apply, who can apply, may apply, must be a, are eligible, is eligible, not eligible, ineligible, only .* may, open to, eligible entities, applicants must]
