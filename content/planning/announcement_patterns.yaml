# Word lists the funding-announcement reader uses to find eligibility, deadlines, page limits,
# attachments, and scoring criteria in a notice of funding opportunity (NOFO) or a Massachusetts
# request for response (RFR), plus how scoring criteria map to narrative sections and the default
# response outline, for analyze_funding_announcement (PLAN-07) and draft_grant_narrative (PLAN-08).
#
# REVIEW STATUS: pending. THESE ARE THIS PROJECT'S OWN HEURISTICS (tool defaults), tried on two
# public Massachusetts announcements (retrieved 2026-11-12) and on synthetic fixtures; no federal
# NOFO could be fetched, because Grants.gov and the federal grant sites were blocked.
# Schema: content/schemas/planning_announcement_patterns.schema.json
meta:
  id: planning-announcement-patterns
  title: Funding announcement reading patterns, criterion types, and default response outline
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: This project's heuristics, calibrated on public Massachusetts announcements
    publisher: Public Health Nursing MCP Server (draft)
    url: https://www.mass.gov/doc/phn-2025-12-cafo-request-for-response-rfr/download
  related_sources:
    - title: "Notice of Funding Opportunity: FY2027 Transitional Crossing Site Selections"
      publisher: Massachusetts Division of Ecological Restoration
      url: https://www.mass.gov/doc/fy27-transitional-crossing-site-selections-notice-of-funding-opportunity/download
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Nothing here is regulatory or clinical content: it is word lists and a generic outline that
    decide what the reader looks for. They were written by this project (low confidence for
    federal NOFOs, which could not be fetched; medium for Massachusetts RFRs, tried on one public
    RFR from the Executive Office of Housing and Livable Communities, PHN 2025-12, and one
    notice of funding opportunity from the Division of Ecological Restoration). The reader can
    miss items written in tables, images, or linked documents, and can mistake a sentence for a
    requirement; the checklist it writes says what it could not find. Always read the
    announcement itself, and its amendments, before relying on the checklist.

sources:
  rfr-calibration:
    title: "Request for Responses: Pre-qualification of Entities to Serve as Chief Financial and Administrative Officer (PHN 2025-12), calibration document (not bundled)"
    publisher: Massachusetts Executive Office of Housing and Livable Communities
    url: https://www.mass.gov/doc/phn-2025-12-cafo-request-for-response-rfr/download
    effective_date: 2025-09-19
    retrieved: 2026-11-12
  nofo-calibration:
    title: "Notice of Funding Opportunity: FY2027 Transitional Crossing Site Selections, calibration document (not bundled)"
    publisher: Massachusetts Division of Ecological Restoration
    url: https://www.mass.gov/doc/fy27-transitional-crossing-site-selections-notice-of-funding-opportunity/download
