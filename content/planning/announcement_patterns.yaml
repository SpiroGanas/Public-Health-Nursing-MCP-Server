# What kind of narrative section a scoring criterion belongs to. keywords are matched as whole
# words or word starts in the criterion label (lower case); the first type that matches wins, in
# this order. narrative_section is one of needs_statement, project_narrative, sustainability, other.
criterion_types:
  - id: sustainability
    label: Sustainability and continuation
    keywords: [sustainab, continuation, long-term, long term, future funding, after the grant, beyond the grant, institutionalize]
    narrative_section: sustainability
  - id: budget
    label: Budget and cost
    keywords: [budget, cost, fee, fees, price, pricing, value, cost-effective, financial]
    narrative_section: other
  - id: evaluation
    label: Evaluation and performance measures
    keywords: [evaluation plan, evaluation, performance measure, performance measures, outcomes, outcome, data collection, monitoring, measurement, impact, accountab]
    narrative_section: project_narrative
  - id: capacity
    label: Organizational capacity and experience
    keywords: [capacity, organizational, experience, qualifications, qualification, staff, staffing, personnel, management, resumes, references, track record, readiness]
    narrative_section: project_narrative
  - id: partnerships
    label: Partnerships and collaboration
    keywords: [partnership, partnerships, collaboration, collaborat, coalition, stakeholder, stakeholders, community engagement, letters of support, coordination]
    narrative_section: project_narrative
  - id: equity
    label: Health equity and priority populations
    keywords: [equity, disparit, priority population, priority populations, underserved, culturally, language access, inclusion, reach]
    narrative_section: needs_statement
  - id: need
    label: Statement of need
    keywords: [need, needs, problem, background, community profile, data, rationale, justification, significance, population served, target population]
    narrative_section: needs_statement
  - id: approach
    label: Approach, work plan, and activities
    keywords: [approach, work plan, workplan, project design, program design, methodology, methods, activities, implementation, strategy, strategies, scope of services, scope of work, project description, narrative, goals, objectives, timeline, deliverables, innovation]
    narrative_section: project_narrative
  - id: cover
    label: Cover letter, abstract, and forms
    keywords: [cover letter, abstract, summary, forms, certifications, assurances, compliance, required documents, submission requirements]
    narrative_section: other

# Used when the announcement's own scoring criteria cannot be found.
default_outline:
  - id: summary
    label: Cover letter or project summary
    criterion_type: cover
    purpose: Who you are, what you will do, for whom, and the amount requested, in one page.
  - id: need
    label: Statement of need
    criterion_type: need
    purpose: The health problem in your community, cited data with source and year, who is most affected, and the gap in current services.
  - id: approach
    label: Project approach and work plan
    criterion_type: approach
    purpose: Goals and objectives, activities, timeline, staff and partners, and why the approach is expected to work (evidence).
  - id: evaluation
    label: Evaluation and performance measures
    criterion_type: evaluation
    purpose: How you will know the project worked, what you will measure, who collects it, and how results are used.
  - id: capacity
    label: Organizational capacity
    criterion_type: capacity
    purpose: Your agency's experience, staff, systems, and fiscal management for this kind of project.
  - id: sustainability
    label: Sustainability
    criterion_type: sustainability
    purpose: How the work continues after this funding ends.
  - id: budget
    label: Budget and budget narrative
    criterion_type: budget
    purpose: Costs by category with the basis for each (see build_program_budget).
  - id: attachments
    label: Required forms and attachments
    criterion_type: cover
    purpose: Every form, letter, and attachment the announcement requires.
