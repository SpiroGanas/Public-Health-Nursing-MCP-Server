# CDC Program Evaluation Framework content and RE-AIM lens for build_evaluation_plan (PLAN-05).
#
# REVIEW STATUS: pending. Steps, cross-cutting actions, standards, evaluation types, methods,
# data quality dimensions, and the example evaluation questions are from CDC's 2024 framework and
# Action Guide (fetched 2026-11-12). RE-AIM dimension definitions are paraphrased from an open
# access 2019 review. The indicator and data source suggestions, role names, timeline shares, and
# question templates for items the CDC tables do not cover are this project's own defaults.
# Schema: content/schemas/planning_evaluation_framework.schema.json
meta:
  id: planning-evaluation-framework
  title: CDC Program Evaluation Framework (2024) steps, evaluation types, methods, question bank, and RE-AIM lens
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2024-09-26
  source:
    title: "CDC Program Evaluation Framework, 2024 (MMWR Recommendations and Reports 2024;73(RR-6):1-37)"
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/mmwr/volumes/73/rr/rr7306a1.htm
  related_sources:
    - title: CDC Program Evaluation Framework Action Guide (PDF, December 2025)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/evaluation/media/pdfs/2025/12/CDC-Program-Evaluation-Framework-Action-Guide.pdf
    - title: RE-AIM Planning and Evaluation Framework, adapting to new science and practice with a 20-year review (Frontiers in Public Health 2019)
      publisher: Frontiers Media
      url: https://doi.org/10.3389/fpubh.2019.00064
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The six steps and their key products, the three cross-cutting actions, the five evaluation
    standards, the evaluation type table (formative, process, outcome, impact, economic), the
    experimental, quasi-experimental, and observational designs, the data collection methods,
    the data quality dimensions, the characteristics of good evaluation questions, the example
    process and outcome questions (MMWR Table 5), and the evaluation matrix columns (Action Guide
    Worksheet 4H) were read on the CDC pages and the Action Guide PDF on 2026-11-12 and are
    quoted or closely paraphrased (high confidence). CDC replaced its 1999 framework (engage
    stakeholders, describe the program, focus the evaluation design, gather credible evidence,
    justify conclusions, ensure use and share lessons learned; utility, feasibility, propriety,
    accuracy) with this 2024 version; the tool follows the 2024 version and CDC's term "interest
    holders". The RE-AIM definitions are paraphrased from the 2019 open access article (CC BY 4.0)
    that the article's Table 1 gives (high confidence for the definitions; the re-aim.org site
    could not be reached). The mapping of RE-AIM dimensions to process and outcome questions, the
    stage-to-evaluation-type suggestions, the indicator and data source suggestions, the role
    names, and the timeline shares are this project's own (low to medium confidence, marked
    below). The plan is decision support for the program team; the RE-AIM article itself
    encourages pragmatic use of the dimensions rather than full application of every element.

