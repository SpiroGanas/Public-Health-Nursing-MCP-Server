# A library of health behavior and behavior change theories for apply_behavior_change_theory
# (PLAN-04): each theory's constructs, what each construct means, intervention strategies that
# target it, and measure ideas, so a nurse can map a program's problem, population, and planned
# components onto theory.
#
# REVIEW STATUS: pending. Drafted 2026-11-12 from the open-access sources listed below.
# Schema: content/schemas/planning_behavior_theories.schema.json
#
# HOW EACH ENTRY WAS MADE
# * Construct names and definitions are paraphrased from the open-access reviews and the CDC page
#   in `sources`, which the author read in full text on 2026-11-12. The original theory papers
#   and books (for example by Rosenstock, Ajzen, Bandura, Prochaska, Rogers, and McLeroy) were NOT
#   available and were NOT read; the reviews summarize them.
# * A strategy with basis "source" comes from a table in one of those papers (the Social
#   Cognitive Theory strategies from a published construct-to-behavior-change-technique mapping,
#   the COM-B strategies from the Behaviour Change Wheel's published links, the Socio-Ecological
#   Model examples from CDC's violence prevention page). A strategy with basis "authored" is this
#   project's own suggestion, written in plain language for the nurse to judge; no source linked
#   it to the construct.
# * Measures are indicator IDEAS (what to count or ask), not validated instruments. No survey
#   instrument is copied. Use validated items from the literature where they exist, and check
#   each instrument's license.
# * "signals" are words a nurse might use to describe a problem; the tool uses them to suggest
#   which constructs a described barrier points to. They are this project's matching aid.
meta:
  id: planning-behavior-theories
  title: Health behavior and behavior change theories (constructs, strategies, and measures)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: Open-access reviews of behavior change theories (see sources)
    publisher: Various journals (PubMed Central open-access subset); CDC
    url: https://www.cdc.gov/violence-prevention/about/index.html
  related_sources: []
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The National Cancer Institute's Theory at a Glance (cancercontrol.cancer.gov) and similar
    primary-source pages were blocked from the build network, so constructs are taken from
    open-access systematic and scoping reviews (full text read through PubMed Central) and from
    the CDC's social-ecological model page. Construct names are the same across the sources that
    cover a theory (high confidence); definitions are paraphrases of what those reviews say
    (medium to high). The primary theory papers were not read; check a definition there before
    quoting it in a grant or paper. Strategies marked authored and all measure ideas are this
    project's drafts (medium to low confidence) and need your judgment. Not covered: the Health
    Action Process Approach, the Information-Motivation-Behavioral Skills model, the Extended
    Parallel Process Model, social marketing, community readiness, and intervention mapping (no
    source was read for them).

