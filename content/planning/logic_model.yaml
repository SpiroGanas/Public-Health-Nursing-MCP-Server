# Logic model components, wording checks, and diagram notes for build_logic_model (PLAN-01).
#
# REVIEW STATUS: pending. Component definitions are taken from the CDC Program Evaluation
# Framework Action Guide (fetched 2026-11-12). The W.K. Kellogg Foundation Logic Model
# Development Guide could not be fetched (wkkf.org, EPA's and NACCHO's copies are unreachable
# from the build network), so nothing here is attributed to it. The word lists the wording
# checks use are this project's own heuristics (provenance: tool default).
# Schema: content/schemas/planning_logic_model.schema.json
meta:
  id: planning-logic-model
  title: Logic model components, checks, and diagram notes (CDC Program Evaluation Framework, Step 2)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2025-12-16
  source:
    title: CDC Program Evaluation Framework Action Guide (Step 2 Describe the program; PDF dated December 2025)
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/evaluation/media/pdfs/2025/12/CDC-Program-Evaluation-Framework-Action-Guide.pdf
  related_sources:
    - title: "CDC Program Evaluation Framework, 2024 (MMWR Recommendations and Reports 2024;73(RR-6))"
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/mmwr/volumes/73/rr/rr7306a1.htm
    - title: "Step 2 Checklist: Describe the Program"
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/evaluation/php/evaluation-framework-action-guide/step-2-checklist.html
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Component definitions (activities, outcomes, inputs, contextual factors, outputs), the stage
    of development definitions, the "if-then" reading of a logic model, and the visualization
    tips are quoted or closely paraphrased from the CDC Action Guide PDF and its Step 2 web page
    and checklist, read on 2026-11-12 (high confidence). The CDC guide treats outputs as products
    of activities that "fit best in the narrative section that describes the evaluation measures",
    so the model shows them in their own column only because the nurse asked for one (a
    Kellogg-style layout); the CDC Step 2 checklist asks for inputs, activities, and outcomes. The
    word "assumptions" is not a CDC logic model term: the CDC checklist asks for "a rationale for
    why interest holders expect certain components to lead to desired outcomes (the theory of
    change)", and the model uses that as its basis for the assumptions row (medium confidence).
    The Kellogg guide was not read. The wording-check word lists, the limit of six boxes per
    column, and the prompts are this project's own defaults (low confidence).

