precaution_types:
  - id: standard
    label: Standard precautions
    definition: Refers to consistent and prudent preventive measures to be used at all times regardless of patient's infection status. The Department adopts, by reference, as standard precautions for infection control, the 2007 Guideline for Isolation Precautions.
    ppe: [Hand hygiene, Gloves for contact with blood and body fluids, Gown and eye or face protection when splashes are likely, Respiratory hygiene and cough etiquette]
    source: cmr300
    section: 105 CMR 300.020, Standard Precautions
  - id: contact
    label: Contact precautions
    definition: Measures designed to reduce the risk of transmission of infectious agents that can be spread through direct contact with the patient or indirect contact with potentially infectious items or surfaces. Gloves and gowns are required for all patient contact and contact with the patient's environment; strict hand hygiene practices must also be applied.
    ppe: [Gown, Gloves, Strict hand hygiene]
    source: cmr300
    section: 105 CMR 300.020, Contact Precautions
  - id: droplet
    label: Droplet precautions
    definition: Measures designed to reduce the risk of transmission of infectious agents via large particle droplets that do not remain suspended in air, usually generated by coughing, sneezing or talking. Masks must be used, but gowns, gloves and special air handling are not generally needed.
    ppe: [Facemask (surgical or procedure mask)]
    source: cmr300
    section: 105 CMR 300.020, Droplet Precautions
  - id: airborne
    label: Airborne precautions
    definition: Measures designed to reduce the risk of transmission of infectious agents that may be suspended in the air in either small particle aerosols or dust particles (i.e. droplet nuclei <= 5 microns). Patients in health care facilities must be given a private room with special air handling and ventilation (negative pressure with respect to the rest of the facility), and an appropriate level of respiratory protection is necessary when entering the patient's room.
    ppe: [Fit-tested N95 or higher respirator, Airborne infection isolation room (negative pressure)]
    source: cmr300
    section: 105 CMR 300.020, Airborne Precautions
  - id: enteric
    label: Enteric precautions
    definition: Measures designed to prevent direct or indirect fecal-oral transmission of disease. Gowns must be worn if soiling is likely, and gloves must be worn for touching contaminated materials; strict hand hygiene practices must also be applied. Masks are not indicated.
    ppe: [Gloves for contaminated materials, Gown if soiling is likely, Strict hand hygiene]
    source: cmr300
    section: 105 CMR 300.020, Enteric Precautions

