diseases:
  # =====================================================================================
  # Vaccine-preventable diseases
  # =====================================================================================
  - id: pertussis
    name: Pertussis
    aliases: [whooping cough, Bordetella pertussis]
    reportable_condition_id: pertussis
    guide_document: guide-pertussis-2022
    onset_event: cough onset
    confidence: high
    compute: true
    incubation:
      unit: days
      min: 5
      usual_low: 7
      usual_high: 10
      max: 21
      note: Rarely may be as long as 42 days.
      source: {source: guide-pertussis-2022, section: "Section 1E, Incubation Period", quote: "The incubation period is usually 7–10 days, with a range of 5–21 days, and rarely may be as long as 42 days."}
    infectious_period:
      anchor: onset
      start_day: -7
      end_day: 21
      ends_after_treatment_days: 5
      text: From one week before to three weeks after cough onset if not treated; if treated, through the fifth day of appropriate antibiotic treatment. Untreated infants (<1 year) can be infectious up to 42 days from cough onset.
      source: {source: guide-pertussis-2022, section: "Section 1F, Period of Communicability"}
    contact_monitoring:
      days_after_last_exposure: 21
      text: Refer asymptomatic close contacts for post-exposure prophylaxis if fewer than 21 days have passed since last exposure (within 42 days for infants under 1 year, in consultation with DPH); conduct surveillance for cough illness for two incubation periods (42 days).
      source: {source: guide-pertussis-2022, section: "Section 4D, General Control Measures for Close Contacts"}
    contact_definition: All household contacts are usually close contacts; in child care, entire classrooms (including staff) are usually considered close contacts. Prioritize contacts at high risk of severe disease (infants, especially under 6 months) and those who could transmit to them.
    contact_testing: Symptomatic close contacts are treated as suspect cases and referred for evaluation, testing, and treatment.
    pep:
      - name: Antibiotic post-exposure prophylaxis (azithromycin is generally first line)
        anchor: last_exposure
        within_hours: 504
        text: Initiate antibiotic prophylaxis within 21 days of exposure; consider within 42 days for infants under 12 months (particularly under 6 months), in consultation with DPH.
        source: guide-pertussis-2022
        section: "Section 4B, Antibiotics for Treatment and Prophylaxis"
    rules:
      - id: case_all
        role: case
        applies_to: Cases (and symptomatic contacts treated as suspect cases)
        settings: [all]
        action: exclude
        end: {through: {anchor: onset, day: 21}, or_treatment_days: 5}
        wording: Until 21 days from onset of cough or five days after initiation of appropriate antibiotic therapy.
        verbatim: true
        citation: 105 CMR 300.200(A), Pertussis, Minimum Period of Isolation of Patient
        source: cmr300
        confidence: high
        note: DPH guide Section 4A - the first full day of antibiotics is day 1; neither treatment nor exclusion is required for cases beyond 21 days after cough onset.
      - id: contact_symptomatic
        role: contact
        applies_to: Symptomatic contacts
        settings: [all]
        when: {symptomatic: true}
        action: exclude
        end: {through: {anchor: onset, day: 21}, or_treatment_days: 5}
        wording: If the contact is symptomatic, use same restrictions as for cases.
        verbatim: true
        citation: 105 CMR 300.200(A), Pertussis, Minimum Period of Quarantine of Contacts
        source: cmr300
        confidence: high
        note: Day 0 is the contact's own cough onset.
      - id: contact_hcw_no_pep
        role: contact
        applies_to: Asymptomatic health care worker contacts not receiving antibiotic prophylaxis
        settings: [health_care_worker]
        when: {symptomatic: false, received_prophylaxis: false}
        action: exclude
        start: {anchor: last_exposure, day: 0}
        end: {through: {anchor: last_exposure, day: 21}}
        wording: If the contact is an asymptomatic healthcare worker not receiving antibiotic prophylaxis, exclude from the workplace for 21 days after last exposure or, if unknown, for 21 days after the onset of the last case in the setting.
        verbatim: true
        citation: 105 CMR 300.200(A), Pertussis, Minimum Period of Quarantine of Contacts
        source: cmr300
        confidence: high
      - id: contact_hcw_pep
        role: contact
        applies_to: Asymptomatic health care worker contacts receiving post-exposure prophylaxis
        settings: [health_care_worker]
        when: {symptomatic: false, received_prophylaxis: true}
        action: no_restriction
        end: {}
        wording: Asymptomatic healthcare worker contacts who are receiving post-exposure prophylaxis do not need to be excluded.
        verbatim: true
        citation: DPH Guide, Pertussis (2022), Section 4A
        source: guide-pertussis-2022
        confidence: high
      - id: contact_asymptomatic_other
        role: contact
        applies_to: Asymptomatic contacts who are not health care workers
        settings: [child_care, school, food_handler, other]
        when: {symptomatic: false}
        action: prophylaxis_only
        end: {}
        wording: If the contact is asymptomatic, not a healthcare worker, and exposed within the last 21 days, s/he should receive antibiotic prophylaxis but no exclusion is generally required. In certain situations deemed to be high-risk, the public health authority may require exclusion of asymptomatic contacts not receiving antibiotic prophylaxis and/or other contacts, and/or may extend the exclusion period beyond 21 days up to a maximum of 42 days.
        verbatim: true
        citation: 105 CMR 300.200(A), Pertussis, Minimum Period of Quarantine of Contacts
        source: cmr300
        confidence: high
        note: DPH guide Section 4E - exclusion of unvaccinated or under-vaccinated students is usually not indicated.

  - id: measles
    name: Measles (rubeola)
    aliases: [rubeola, measles virus]
    reportable_condition_id: measles
    guide_document: guide-measles-2022
    onset_event: rash onset
    confidence: high
    compute: true
    incubation:
      unit: days
      min: 7
      usual_low: 11
      usual_high: 14
      max: 21
      note: Average 11-12 days from exposure to prodrome and 14 days from exposure to rash onset.
      source: {source: guide-measles-2022, section: "Section 1E, Incubation Period", quote: "The incubation period of measles ranges from 7 to 21 days. From exposure to prodrome the average is 11–12 days. From exposure to rash onset the average is 14 days."}
    infectious_period:
      anchor: onset
      start_day: -4
      end_day: 4
      text: From four days before to four days after the day of rash onset (rash onset is day zero). Immunocompromised patients may be infectious for the duration of illness.
      source: {source: guide-measles-2022, section: "Section 1F, Period of Communicability"}
    contact_monitoring:
      days_after_last_exposure: 21
      text: Exclusion of susceptible contacts runs through day 21 after exposure; all exposed in a health care setting, even with two doses of MMR, should self-monitor for 21 days; conduct surveillance for 2 incubation periods (42 days) after rash onset in the last case or the last exposure in the setting, whichever is later.
      source: {source: guide-measles-2022, section: "Section 4B and 4C"}
    contact_definition: Anyone who shared airspace with the case during the infectious period (4 days before through 4 days after rash onset), including anyone in a room at the same time as the case and for 2 hours after the case left the room. Measles is so contagious that everyone at an entire institution may be considered exposed.
    contact_testing: Contacts who develop symptoms should call ahead before seeking care and be evaluated and tested; consider serology for immunity (vaccinate right after the blood draw if not contraindicated).
    pep:
      - name: MMR vaccine
        anchor: first_exposure
        within_hours: 72
        text: Measles vaccine given within 72 hours of exposure can prevent disease. Vaccinate susceptibles even after 72 hours to protect against later exposures.
        source: guide-measles-2022
        section: "Section 4B, step 5a"
      - name: Immune globulin (IGIM 0.5 mL/kg, max 15 mL; IGIV 400 mg/kg)
        anchor: first_exposure
        within_hours: 144
        text: IG can prevent or modify measles in nonimmune persons if given within 6 days of exposure (infants under 12 months, pregnant people without evidence of immunity, severely immunocompromised people).
        source: guide-measles-2022
        section: "Section 4B, step 4a"
    rules:
      - id: case_all
        role: case
        applies_to: Cases (and symptomatic contacts)
        settings: [all]
        action: exclude
        end: {through: {anchor: onset, day: 4}}
        wording: Through four days after onset of rash (counting the day of rash onset as day zero).
        verbatim: true
        citation: 105 CMR 300.200(A), Measles, Minimum Period of Isolation of Patient
        source: cmr300
        confidence: high
        note: DPH guide Section 4B - may return to normal activities on the 5th day; criteria are more rigorous for immunocompromised people and in health care settings.
      - id: contact_susceptible
        role: contact
        applies_to: Contacts born in or after 1957 who are not appropriately immunized or do not have laboratory evidence of immunity
        settings: [child_care, school, food_handler, other]
        when: {susceptible: true}
        action: exclude
        start: {anchor: first_exposure, day: 5}
        end: {through: {anchor: last_exposure, day: 21}}
        wording: Contacts born in or after 1957, who are not appropriately immunized or do not have laboratory evidence of immunity, will be excluded from work, classes or other public activities from the fifth through the 21st day after their exposure even if they receive immune globulin.
        verbatim: true
        citation: 105 CMR 300.200(A), Measles, Minimum Period of Quarantine of Contacts
        source: cmr300
        confidence: high
