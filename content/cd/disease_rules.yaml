# Isolation, quarantine, and exclusion rules for communicable diseases in Massachusetts,
# with incubation and infectious periods, for calculate_isolation_and_exclusion (CD-03),
# plan_contact_tracing (CD-06), assess_measles_exposure (CD-07), and the outbreak tools.
#
# REVIEW STATUS: pending. Drafted by the developer FROM the fetched source documents listed
# under `sources` (retrieved 2026-11-07). Rules marked `verbatim: true` quote the source; the
# others are close paraphrases. Every rule has a citation and a confidence level. The nurse must
# verify every rule before Pilot 1 (see docs/acceptance/phase-3.md).
# Schema: content/schemas/disease_rules.schema.json
meta:
  id: ma-disease-rules
  title: Communicable disease isolation, quarantine, and exclusion rules (Massachusetts)
  version: 0.1.0
  prepared: 2026-11-07
  effective_date: 2022-05-27
  source:
    title: "105 CMR 300.200: Isolation and Quarantine Requirements (105 CMR 300.000, Mass. Register #1470, 5/27/22)"
    publisher: Massachusetts Department of Public Health
    url: https://www.mass.gov/doc/105-cmr-300-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements/download
  related_sources:
    - title: Guide to Surveillance, Reporting and Control (disease chapters)
      publisher: Massachusetts Department of Public Health, Bureau of Infectious Disease and Laboratory Sciences
      url: https://www.mass.gov/handbook/guide-to-surveillance-reporting-and-control
    - title: Infectious disease fact sheets
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/fact-sheets-on-infectious-diseases
    - title: "Guideline for Isolation Precautions (2007), Appendix A: Type and Duration of Precautions"
      publisher: CDC and the Healthcare Infection Control Practices Advisory Committee (HICPAC)
      url: https://www.cdc.gov/infection-control/hcp/isolation-precautions/appendix-a-type-duration.html
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted on 2026-11-07 from the documents listed under `sources`, each fetched from mass.gov
    or cdc.gov that day: the text of 105 CMR 300.200 (the Trial Court Law Libraries copy dated
    Mass. Register #1470, 5/27/22), DPH Guide to Surveillance, Reporting and Control chapters,
    DPH fact sheets and guidance, and CDC pages. Rules quoted from the regulation are marked
    verbatim and are high confidence; paraphrases of guide chapters are medium; anything not
    found in a fetched source is low. Some guide chapters are several years old and DPH guidance
    for respiratory viruses changed in 2024-2025. The subject matter expert must verify every
    disease (docs/acceptance/phase-3.md has a checklist), confirm that 105 CMR 300.000 has not
    been amended since 5/27/22, and confirm the current DPH guidance before Pilot 1.

conventions:
  day_counting: >-
    Day 0 is the anchor date named by the rule (for example the day of rash onset, counted as day
    zero as in 105 CMR 300.200). "Through day N" means the person is excluded on day N and may
    return on day N + 1. "From day A through day B after exposure" means excluded on days A to B
    inclusive. For "N days of treatment", the first full day of appropriate treatment is day 1,
    so the person may return on the day after day N (treatment start + N). "H hours after" is
    measured in clock hours; when only dates are known, the server reports the earliest calendar
    date on which the hours could have passed and says so. Stool specimens are counted from the
    date they were produced (collected).
  anchors:
    onset: The disease's onset event (see onset_event) for the case.
    positive_specimen: The date the positive specimen was collected.
    first_exposure: The first day the contact was exposed during the case's infectious period.
    last_exposure: The last day the contact was exposed during the case's infectious period.
    case_onset: The onset date of the case the contact was exposed to.
    last_case_onset: The onset date of the last case in the setting (continuous exposure or several cases).
    treatment_start: The first full day of appropriate antimicrobial treatment.
    symptom_resolution: The date symptoms (for gastrointestinal illness, diarrhea and vomiting) resolved.
  settings:
    child_care: Children (and staff) in child care programs. Staff who prepare food, feed children, or give oral medications are also food handlers under 105 CMR 300.020.
    school: Students and staff in K-12 schools. Students or staff who handle food are also food handlers.
    food_handler: >-
      Anyone who meets the 105 CMR 300.020 definition of Food Handler - directly preparing or
      handling food or clean dishes or utensils, and also anyone who dispenses medications by
      hand, assists in feeding, or provides mouth care (in health care facilities, child care,
      schools, and community residential programs).
    health_care_worker: Health care personnel in health care settings (DPH treats school health offices as health care settings).
    other: Everyone else (work, classes, and other public activities in the community).

