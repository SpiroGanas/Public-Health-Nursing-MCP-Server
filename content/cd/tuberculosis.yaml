# Tuberculosis contact investigation and latent TB infection (LTBI) treatment, for
# plan_tb_contact_investigation (CD-11) and ltbi_treatment_calendar (CD-12).
#
# REVIEW STATUS: pending. Drafted from the fetched sources below (retrieved 2026-11-08).
# Schema: content/schemas/tuberculosis.schema.json
#
# The contact-priority rules transcribe Figures 2-4 of the 2005 NTCA/CDC guidelines in order:
# the first rule whose condition is true gives the priority; `otherwise` applies when none is.
# This file never holds medication doses: dose calculation is out of scope (plan item CD-16).
meta:
  id: tb-investigation-and-ltbi
  title: Tuberculosis contact investigation and latent TB infection treatment (CDC/NTCA and Massachusetts DPH)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: 2020-02-14
  source:
    title: "Guidelines for the Investigation of Contacts of Persons with Infectious Tuberculosis: Recommendations from the National Tuberculosis Controllers Association and CDC (MMWR 2005;54(No. RR-15))"
    publisher: Centers for Disease Control and Prevention and the National Tuberculosis Controllers Association
    url: https://www.cdc.gov/mmwr/preview/mmwrhtml/rr5415a1.htm
  related_sources:
    - title: "Guidelines for the Treatment of Latent Tuberculosis Infection: Recommendations from the National Tuberculosis Controllers Association and CDC, 2020 (MMWR Recomm Rep 2020;69(No. RR-1))"
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/mmwr/volumes/69/rr/rr6901a1.htm
    - title: Treatment Regimens for Latent Tuberculosis Infection in Massachusetts
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/info-details/treatment-regimens-for-latent-tuberculosis-infection-in-massachusetts
    - title: Report a case of Tuberculosis Disease or Latent TB Infection
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/how-to/report-a-case-of-tuberculosis-disease-or-latent-tb-infection
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted on 2026-11-08 from the 2005 NTCA/CDC contact investigation guidelines (text and
    Tables 1-4, Figures 2-5 and 7, read from cdc.gov; CDC's TB guidelines page still lists them as
    current), the 2020 NTCA/CDC LTBI treatment guidelines, CDC's LTBI treatment page (updated
    2025-04-17) and regimen table, the 2000 ATS/CDC LTBI statement (completion criteria), the 2011
    and 2018 MMWR reports on 3HP, and DPH's LTBI regimen, reporting, contact, and outpatient
    clinic pages. Priority rules, time frames, the 8-10 week retest, and completion criteria are
    transcribed (high confidence). The 3HR completion window is not stated in any source found
    (left empty). The 3HP completion definition comes from the trial cited by CDC in 2011
    (medium). Clinic contacts come from DPH's 2025 list and change often. The subject matter
    expert must review before use.

