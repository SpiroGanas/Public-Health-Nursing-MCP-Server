ltbi:
  before_starting:
    - text: "Do not start LTBI treatment until TB disease is excluded."
      source: cdc-ltbi-page
      section: Treatment Considerations for Latent TB Infection
    - text: "Rifampin and rifapentine are not interchangeable; make sure the patient receives the medication for the intended regimen."
      source: cdc-ltbi-2020
      section: Summary
    - text: "Rifamycins interact with many medications (for example hormonal contraceptives, methadone, warfarin, anticonvulsants, some antiretrovirals); people using hormonal birth control should add or switch to a barrier method."
      source: cdc-ltbi-page
      section: Short-course rifamycin-based regimens
  regimens:
    - id: 3HP
      name: Isoniazid plus rifapentine, once weekly for 3 months
      drugs: [isoniazid, rifapentine]
      frequency: once_weekly
      interval_days: 7
      total_doses: 12
      duration_text: 3 months
      cdc_rank: preferred
      dph_listed: true
      dph_administration: "Directly observed: DPH recommends all doses under direct observation (DOT) by a trained worker or medical care provider."
      allowed_administration: [dot, vdot, sat]
      completion:
        doses_required: 11
        within_days: 112
        min_days_between_doses: 3
        text: "In the trial CDC cited, completion of 3HP was defined as 11 or 12 doses within 16 weeks, with doses more than 72 hours apart to count."
        source: cdc-3hp-2011
        section: Rationale and evidence
        confidence: medium
      recommended_for:
        - "People aged 2 years and older, including people with HIV taking antiretrovirals with acceptable interactions with rifapentine (CDC); DPH: healthy patients aged 2 and older."
      not_recommended_for:
