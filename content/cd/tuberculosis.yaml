        - text: "At each DOT encounter ask in detail about side effects; hold the next dose pending clinical evaluation after fever, yellow eyes or skin, abdominal pain, syncope, rash, or prodromal symptoms (nausea, dizziness, weakness, near-syncope, headache) following the previous dose."
