contact_investigation:
  transmission_factors:
    - text: "Characteristics of the index patient associated with increased risk of transmission: pulmonary, laryngeal, or pleural TB; AFB-positive sputum smear; cavitation on chest radiograph; adolescent or adult patient; no or ineffective treatment. Behaviors: frequent coughing, sneezing, singing, close social network."
      source: cdc-ci-2005
      section: Table 1
    - text: "With limited exceptions, only patients with pulmonary or laryngeal TB can transmit infection; pleural disease is grouped with pulmonary disease for contact investigations. Rarely, extrapulmonary TB causes transmission during aerosol-generating procedures (autopsy, embalming, irrigation of a draining abscess)."
      source: cdc-ci-2005
      section: Decisions to Initiate a Contact Investigation, Anatomical Site of Disease
    - text: "Transmission from children aged under 10 years is unusual; investigations around pediatric cases are usually source-case investigations."
      source: cdc-ci-2005
      section: Decisions to Initiate a Contact Investigation, Age
  initiate:
    - text: "Consider a contact investigation if the index patient has confirmed or suspected pulmonary, laryngeal, or pleural TB. An investigation is recommended if the sputum smear has AFB on microscopy (unless an approved NAA test is negative), and when three smears are negative but the plain chest radiograph shows cavities."
      source: cdc-ci-2005
      section: Initiating a Contact Investigation
    - text: "Investigations for AFB smear- or culture-positive and cavitary TB have the highest priority. Even without these, consider an investigation if the chest radiograph is consistent with pulmonary TB; a positive NAA test supports starting one. Do not wait for culture results if any contact is especially susceptible or vulnerable."
      source: cdc-ci-2005
      section: Initiating a Contact Investigation
    - text: "Investigations typically should not be started for suspected TB with minimal findings supporting pulmonary TB, except in outbreaks, when vulnerable or susceptible contacts are identified, or in source-case investigations."
      source: cdc-ci-2005
      section: Initiating a Contact Investigation
  infectious_period:
    start_rules:
      - id: symptomatic
        when: "TB symptoms present (any smear or radiograph result)"
        start: "3 months before symptom onset or first positive finding (e.g., abnormal chest radiograph) consistent with TB disease, whichever is longer"
        months_before: 3
        weeks_before: null
        anchor: earlier_of_onset_and_first_finding
        source: cdc-ci-2005
        section: Table 2, rows 1-2
      - id: asymptomatic_smear_or_cavity
        when: "No TB symptoms, but AFB smear positive or cavitary chest radiograph"
        start: "3 months before the first positive finding consistent with TB"
        months_before: 3
        weeks_before: null
        anchor: first_finding
        source: cdc-ci-2005
        section: Table 2, row 4 (the table lists AFB-positive and cavitary together; the tool applies the row when either is present)
        confidence: medium
      - id: asymptomatic_other
        when: "No TB symptoms, AFB smear negative, no cavity"
        start: "4 weeks before the date of suspected diagnosis"
        months_before: null
        weeks_before: 4
        anchor: suspected_diagnosis
        source: cdc-ci-2005
        section: Table 2, row 3
    earlier_start_note:
      text: "These are minimum starting points from expert opinion. Use an earlier start when the patient or associates describe protracted illness (in extreme cases more than a year), or with large cavities, which imply prolonged illness."
      source: cdc-ci-2005
      section: Determining the Infectious Period
    end_criteria:
      - text: "Effective treatment (as shown by M. tuberculosis susceptibility results) for more than 2 weeks."
        source: cdc-ci-2005
        section: Determining the Infectious Period
      - text: "Diminished symptoms."
        source: cdc-ci-2005
        section: Determining the Infectious Period
      - text: "Mycobacteriologic response (for example, a decrease in the grade of sputum smear positivity)."
        source: cdc-ci-2005
        section: Determining the Infectious Period
    stricter_end:
      text: "A patient returning to a congregate setting, or any setting with susceptible persons, should have at least three consecutive negative sputum AFB smears from sputum collected more than 8 hours apart (one early morning) before being considered noninfectious. Multidrug-resistant TB can extend infectiousness."
      source: cdc-ci-2005
      section: Determining the Infectious Period
  priority_trees:
    - case_type: smear_positive_or_cavitary
      label: "Pulmonary, laryngeal, or pleural TB with a cavity on chest radiograph or an AFB-positive sputum smear"
      source: cdc-ci-2005
      section: Figure 2
      rules:
        - {condition: household, priority: high}
        - {condition: age_under_5, priority: high}
        - {condition: medical_risk, priority: high}
        - {condition: medical_procedure, priority: high}
        - {condition: congregate_setting, priority: high}
        - {condition: exceeds_high_priority_limits, priority: high}
        - {condition: age_5_to_15, priority: medium}
        - {condition: exceeds_medium_priority_limits, priority: medium}
      otherwise: low
    - case_type: smear_negative_cxr_consistent
      label: "Suspected or confirmed pulmonary or pleural TB, AFB smear negative, abnormal chest radiograph consistent with TB (may be NAA- or culture-positive)"
      source: cdc-ci-2005
      section: Figure 3
      rules:
        - {condition: age_under_5, priority: high}
        - {condition: medical_risk, priority: high}
        - {condition: medical_procedure, priority: high}
        - {condition: household, priority: medium}
        - {condition: congregate_setting, priority: medium}
        - {condition: exceeds_medium_priority_limits, priority: medium}
      otherwise: low
    - case_type: abnormal_cxr_not_consistent
      label: "Suspected pulmonary TB, AFB smear negative, NAA and culture negative, abnormal chest radiograph not consistent with TB"
      source: cdc-ci-2005
      section: Figure 4
      rules:
        - {condition: household, priority: medium}
        - {condition: age_under_5, priority: medium}
        - {condition: medical_risk, priority: medium}
        - {condition: medical_procedure, priority: medium}
      otherwise: low
  conditions:
    - id: household
      label: Household contact
      definition: "Lived in the same household as the index patient during the infectious period."
    - id: age_under_5
      label: Aged under 5 years
      definition: "Children aged under 5 are more likely to progress to disease and to have severe forms."
    - id: medical_risk
      label: Medical risk factor
      definition: "HIV infection or another medical risk factor; also more than 15 mg/day of prednisone (or equivalent) for more than 4 weeks, cancer chemotherapy, antirejection drugs, or TNF-alpha antagonists. Silicosis, diabetes, and gastrectomy or jejunoileal bypass may be considered."
    - id: medical_procedure
      label: Exposed during a medical procedure
      definition: "Present during bronchoscopy, sputum induction, or autopsy."
    - id: congregate_setting
      label: Exposed in a congregate setting
      definition: "Exposure in a congregate setting (for example correctional facility, shelter, nursing home)."
    - id: exceeds_high_priority_limits
      label: Exceeds duration/environment limits for high priority
      definition: "Exposure exceeds the duration and environment limits per unit time that the health department sets for high-priority contacts (no national cut-off; one published criterion for noncavitary disease is 120 hours per month)."
    - id: age_5_to_15
      label: Aged 5 to 15 years
      definition: "Children aged 5 to 15 years."
    - id: exceeds_medium_priority_limits
      label: Exceeds duration/environment limits for medium priority
      definition: "Exposure exceeds the limits the health department sets for medium-priority contacts."
  exposure_notes:
    - text: "Grade exposure settings by size: 1 = vehicle, 2 = bedroom, 3 = house, 4 = larger than a house. The likelihood of infection depends on the intensity, frequency, and duration of exposure; airline passengers seated more than 8 hours in the same or adjoining row are at higher risk. The optimal duration cut-off is undetermined; set administrative limits from local experience and reassess."
      source: cdc-ci-2005
      section: Factors for Assigning Contact Priorities, Exposure
    - text: "Priority classifications are practical approximations and should be reconsidered throughout the investigation as findings are analyzed."
      source: cdc-ci-2005
      section: Classification of Contacts
  timeframes:
    - case_type: smear_positive_or_cavitary
      priority: high
      encounter_business_days: 7
      evaluation_business_days: 5
      source: cdc-ci-2005
      section: Table 3
    - case_type: smear_negative_cxr_consistent
      priority: high
      encounter_business_days: 7
      evaluation_business_days: 10
      source: cdc-ci-2005
      section: Table 3
    - case_type: any
      priority: medium
      encounter_business_days: 14
      evaluation_business_days: 10
      source: cdc-ci-2005
      section: Table 3
  timeframe_note:
    text: "Initial encounter = a face-to-face meeting to assess the contact's health, give a skin test, and schedule further evaluation; counted in business days from listing the contact. Medical evaluation is complete when the contact's status for M. tuberculosis infection or TB disease is determined (waiting for final mycobacteriologic results is a normal exception)."
    source: cdc-ci-2005
    section: Table 3, footnotes
  testing:
    window_weeks_min: 8
    window_weeks_max: 10
    positive_tst_mm: 5
    notes:
      - text: "High- and medium-priority contacts without a documented previous positive TST or TB disease should be tested at the initial encounter (or within 7 working days of listing high-priority and 14 days of listing medium-priority contacts). An induration of 5 mm or more is positive for any contact."
        source: cdc-ci-2005
        section: Tuberculin Skin Testing
      - text: "The window period between infection and a detectable test is 8-10 weeks after exposure ends. A negative result obtained less than 8 weeks after exposure is unreliable; repeat the test 8-10 weeks after the most recent exposure. A contact whose second test is positive after a negative first test is classified as recently infected. Two-step testing should not be used for contacts."
        source: cdc-ci-2005
        section: Tuberculin Skin Testing; Assigning Priorities to Contacts
      - text: "IGRA can be used in place of (not in addition to) the TST, including in contact investigations. For recent contacts, negative IGRA results typically should be confirmed with a repeat test 8-10 weeks after the end of exposure; time the IGRA as for the TST."
        source: cdc-ci-2005
        section: QuantiFERON-TB Gold (QFT-G) test
      - text: "Low-priority contacts: a single test, probably at the end of the window period, is preferred; the test may be delayed until after the window period so a second test is not needed. Any contact with TB symptoms needs immediate diagnostic evaluation regardless of test results."
        source: cdc-ci-2005
        section: Tuberculin Skin Testing; Figure 8
      - text: "All contacts with induration of 5 mm or more or symptoms consistent with TB should be examined, starting with a chest radiograph. Contacts assigned high priority because of susceptibility or vulnerability should be examined regardless of the test result."
        source: cdc-ci-2005
        section: Medical Evaluation
  special_groups:
    - id: age_under_5
      text: "Children aged under 5: full evaluation including chest radiograph. If the first test is negative and fewer than 8 weeks have passed since last exposure, begin treatment for presumed infection (window prophylaxis) after TB disease is excluded; repeat the test 8-10 weeks after exposure; stop treatment if the second test is negative (and the child is well), complete the full course if it is positive."
      source: cdc-ci-2005
      section: Evaluation and Follow-Up of Specific Groups of Contacts; Figure 5
    - id: immunocompromised
      text: "Contacts with HIV or other immunocompromising conditions: evaluate as for young children; even if a test 8 or more weeks after exposure is negative, a full course of LTBI treatment is recommended after TB disease is excluded."
      source: cdc-ci-2005
      section: Evaluation and Follow-Up of Specific Groups of Contacts; Figure 6
    - id: immunocompetent_5_plus
      text: "Immunocompetent adults and children aged 5 or older (high or medium priority): symptoms lead to full evaluation; a positive test (5 mm or more) leads to examination and chest radiograph and, if normal, a full course of LTBI treatment; a negative test before 8-10 weeks is repeated 8-10 weeks after exposure."
      source: cdc-ci-2005
      section: Figure 7
    - id: prior_positive
      text: "Contacts with a documented previous positive test or TB disease: risk is undetermined; obtain documentation before relying on a verbal report. Immunocompromised or otherwise susceptible contacts need testing to exclude disease and a full course of LTBI treatment regardless of history; anyone to be treated needs a chest radiograph first."
      source: cdc-ci-2005
      section: Evaluation and Follow-Up of Specific Groups of Contacts; Figure 9
  expansion:
    intro: "Expand beyond high- and medium-priority contacts only when objectives for them are being met and there is evidence of recent transmission. Review results at least weekly."
    triggers:
      - "An unexpectedly high rate of infection or TB disease among high-priority contacts (for example 10%, or at least twice the rate of a similar population without recent exposure, whichever is greater)"
      - "Evidence of secondary transmission (cases infected after exposure to the source patient)"
      - "TB disease in any contact assigned low priority"
      - "Infection in contacts aged under 5 years"
      - "Contacts whose test changed from negative to positive between the first and second test"
    source: cdc-ci-2005
    section: When to Expand a Contact Investigation
  index_case_data:
    source: cdc-ci-2005
    section: Table 4 (minimal recommended data concerning the index patient)
    groups:
      - heading: Identifiers and demographics (keep in local files only)
        items: [Case manager, Name and aliases, Guardian (for minors and dependents), Date of birth, Locating information and emergency contacts, Residences during the infectious period if unstably housed, RVCT number and local case number, Sex, Race, Ethnicity, Country of birth, Time in the United States if foreign born, Primary and preferred language, Translation or interpretation methods]
      - heading: Settings and time frames where transmission may have occurred
        items: [Living situation(s), Employment or school, Social and recreational activities, "Congregate settings (e.g., jail or homeless shelter)", Substance use with social implications]
      - heading: TB information
        items: [TB health care provider, Anatomic site of disease, Symptoms and their dates, "Chest radiograph results, including cavity", TB medications with start and stop dates, "Bacteriologic results (smear, culture, susceptibility) with dates", Previous TB disease and treatment, Previous exposure to persons with TB, Infectious period (updated as information arrives), HIV status]
      - heading: Contact investigation
        items: [Date of initial interview, Dates of follow-up interviews]
  interview_settings:
    text: "Ask where the patient spent nights, met friends, worked, ate, visited, and sought health care; ask specifically about congregate settings (high school, university, correctional facility, homeless shelter, nursing home) and about routine and nonroutine travel, including carpools."
    source: cdc-ci-2005
    section: Index Patient Interview, Transmission settings

