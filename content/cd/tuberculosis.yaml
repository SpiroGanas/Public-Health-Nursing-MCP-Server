  monitoring:
    - text: "Evaluate every patient at least monthly for adherence, signs and symptoms of TB disease, and adverse reactions."
      source: cdc-ltbi-page
      section: Clinical monitoring
    - text: "Baseline AST, ALT, and bilirubin are not routine; test at baseline for liver disorders or history of liver disease, regular alcohol or injection drug use, risk for chronic liver disease, HIV, pregnancy or within 3 months postpartum. Retest periodically if baseline is abnormal or hepatic risk is present, and at any time for symptoms of hepatitis or jaundice."
      source: cdc-ltbi-page
      section: Laboratory testing
    - text: "Medication is generally withheld if transaminases exceed 3 times the upper limit of normal with symptoms, or 5 times without symptoms."
      source: cdc-ltbi-page
      section: Laboratory testing
  stop_and_call:
    text: "Tell patients to stop the medication and seek care immediately for: unexplained anorexia, nausea or vomiting, dark urine, or jaundice; persistent numbness, tingling, or burning in hands or feet; persistent weakness, fatigue, fever, or abdominal pain; easy bruising or bleeding; blurred or changed vision; rash."
    source: cdc-ltbi-page
    section: Patient education
  education:
    - text: "Explain TB infection and why to take medication without symptoms; the importance of completing treatment; possible side effects."
      source: cdc-ltbi-page
      section: Patient education
    - text: "Rifampin and rifapentine can turn urine and other body fluids orange; this is harmless; soft contact lenses can be stained permanently."
      source: cdc-ltbi-page
      section: Patient education
  adherence:
    - text: "Prefer shorter regimens; recognize and address non-adherence as soon as possible."
      source: cdc-ltbi-page
      section: Helping patients complete treatment
    - text: "Techniques: collaborate with the health department; DOT for patients at high risk of progression (HIV, young children, contacts of active TB); case management; free or low-cost medication; incentives and enablers such as transportation vouchers; education in the patient's primary language at every visit; confidentiality; reminders such as a medication tracker, pill box, calendar, or timer."
      source: cdc-ltbi-page
      section: Techniques to improve adherence
  interruption:
    text: "Completion is based on the total number of doses, not duration alone. After missed doses, continue the original regimen as long as needed to complete it, or restart if interruptions were frequent or prolonged. When therapy resumes after an interruption of more than 2 months, a medical examination to rule out TB disease is indicated."
    source: cdc-ltbi-2000
    section: Completion of treatment
    interruption_days: 60
  post_treatment:
    text: "Give the patient documentation of the TB test and chest radiograph results, medication names and dosages, and duration of treatment, to present when future TB testing is required. Re-educate about TB symptoms. Most people will keep a positive test after treatment; repeat tests and serial chest radiographs are not advised unless symptoms develop."
    source: cdc-ltbi-page
    section: Post-treatment follow-up
