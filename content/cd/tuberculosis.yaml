          section: "Isoniazid + Rifapentine: Monitoring"
      monitoring_visit_weeks: [1, 5, 9]
      sources: [cdc-ltbi-2020, cdc-ltbi-page, dph-ltbi-regimens, cdc-3hp-2018]
