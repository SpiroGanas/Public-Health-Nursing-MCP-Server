    allows up to 24 hours for diseases listed in 300.100. Confirm with DPH Epidemiology
    (617-983-6800) before relying on an entry.

contacts:
  dph_epidemiology:
    name: MDPH Epidemiology Line (24/7)
    phone: "617-983-6800"
    note: >-
      DPH's provider list and May 20, 2026 memo direct providers and laboratories to call this line
      immediately for the conditions marked immediate, for any unusual illness, and for any
      suspected cluster or outbreak. Also for consultation.
  dph_24_hour_reporting:
    name: MDPH infectious disease reporting line (reports due within 24 hours)
    phone: "617-983-6801"
    note: >-
      DPH's laboratory list gives this number, and confidential fax 617-887-8789, for reports due
      within 24 hours that are not sent electronically.

timeframes:
  immediate: >-
    Report immediately by telephone, 24 hours a day, on suspicion of the diagnosis, without
    waiting for laboratory confirmation. DPH asks health care providers and laboratories to call
    the DPH Epidemiology Line (617-983-6800) for these conditions (DPH provider list, June 2026;
    DPH memo, May 20, 2026). Clusters, outbreaks, unusual illness, and illness believed to be due
    to food are reported immediately to the local board of health or to DPH (105 CMR
    300.131-300.134). The written or electronic report the regulation requires still follows.
  within_24_hours: >-
    Report immediately, and in no case more than 24 hours after diagnosis or identification. For
    diseases listed in 105 CMR 300.100, providers report to the board of health of the community
    where the case is diagnosed or the suspect case is identified, by telephone, in writing, by
    fax, or by secure electronic means (including from the electronic health record). A
    laboratory report to DPH may serve in lieu of the provider's report for diseases found mainly
    through laboratory testing. Laboratories report to DPH within 24 hours (300.170), and DPH
    notifies the board of health of the town where the case lives through MAVEN. Conditions under
    300.135 and 300.180 go directly to DPH within 24 hours.
  other: >-
    Reported on a different schedule or through a specific DPH program, for example work-related
    diseases (within ten days, 105 CMR 300.180(D)), antimicrobial resistance of a novel nature
    (within five business days, 300.171), or childhood lead poisoning (within three working days,
    105 CMR 460.040). See the entry notes.

reporters:
  health_care_provider: >-
    Physicians and other health care providers as defined in M.G.L. c. 111, section 1 (including
    registered nurses, hospitals, clinics, and nursing homes), household members, and other
    officials designated by DPH (105 CMR 300.100). For clusters, outbreaks, unusual illness, and
    illness believed to be due to food, anyone in a supervisory position at a school, child care
    program, hospital, institution, clinic, medical practice, laboratory, or camp, and employers,
    must also report (300.131-300.134).
  laboratory: >-
    All laboratories, including out-of-state laboratories testing specimens from Massachusetts
    residents, report the listed findings directly to DPH through secure electronic laboratory
    reporting within 24 hours, with the patient's identifying and contact details and the
    ordering provider (105 CMR 300.170). DPH notifies the board of health of the town where the
    case lives within 24 hours through MAVEN. Some isolates and specimens must also be sent to the
    State Public Health Laboratory (300.172).
  local_board_of_health: >-
    The local board of health reports every case or suspect case reported to it under 105 CMR
    300.100 to DPH through MAVEN immediately, and no later than 24 hours after receipt (300.110),
    and reports any cluster, outbreak, unusual illness, or suspected food poisoning to DPH
    immediately (300.160).

