# Diseases and conditions reportable in Massachusetts (105 CMR 300.000).
#
# REVIEW STATUS: pending. Re-checked against the regulation text and DPH's current reporting
# lists on 2026-11-07 (see meta.verification_note), but not yet reviewed by the subject matter
# expert. Only the subject matter expert may mark this file reviewed.
# Schema: content/schemas/reportable_conditions.schema.json
#
# Field conventions
#   timeframe  immediate       = report by telephone at once, on suspicion. Used where the
#                                regulation says "immediately by telephone" (300.131-300.136,
#                                300.175, 300.181) or where DPH's current provider list, May 20,
#                                2026 memo, or laboratory list designates the condition for an
#                                immediate call to the DPH Epidemiology Line.
#              within_24_hours = the regulation's "immediately, but in no case more than 24 hours
#                                after diagnosis or identification" (300.100), or "within 24
#                                hours" (300.135, 300.170, 300.180(A) and (C)).
#              other           = a different schedule or channel (see notes).
#   citation   the sections of 105 CMR 300.000 (or other source) the entry was transcribed from.
#   confidence high   = reportability, reporters, and recipients transcribed from the regulation
#                       text; any stricter telephone timeframe transcribed from a current DPH list.
#              medium = the regulation gives no timeframe (taken from a DPH list), or DPH sources
#                       disagree, or part of the entry could not be verified.
#              low    = could not be verified.
#
# Sources checked on 2026-11-07 (all retrieved that day from mass.gov)
#   1. 105 CMR 300.000 text: PDF linked from the regulation page (Mass. Register #1470, dated
#      5/27/22; the page gives the regulation date as 05/27/2022, and DPH's reporting page calls
#      the 2022 amendments the most recent). Sections read: 300.020, 300.100, 300.110,
#      300.131-300.136, 300.140, 300.150, 300.160, 300.170-300.175, 300.180, 300.181, 300.200.
#      Note: 300.180 (not 300.140) lists the diseases reportable directly to DPH; 300.140 covers
#      veterinarians.
#   2. "Healthcare Provider Responsibilities for Reporting Designated Communicable and Other
#      Infectious Diseases in Massachusetts" (DOCX last modified 2026-06-10): conditions to call the
#      DPH Epidemiology Line about immediately, conditions needing an online case report form
#      within 24 hours, and conditions to telephone within 24 hours.
#   3. "List of Diseases Reportable by Laboratories" (DOCX last modified 2024-05-20): agents
#      printed in red are reported immediately by phone; the rest within 24 hours electronically.
#   4. DPH memo "Notification by Phone for Reporting Certain Infectious Conditions" (May 20, 2026).
#   5. Commissioner's declaration making alpha-gal syndrome reportable under 105 CMR 300.150
#      (March 19, 2026; effective April 1, 2026 for 12 months) and the clinical advisory of the
#      same date.
#   6. 105 CMR 460.040 (Mass. Register #1353, 12/1/17) for blood lead.
#   7. Guide to Surveillance, Reporting and Control handbook page (26 chapters dated 2016-2023);
#      the Botulism, Measles, Mumps, Pertussis, Shiga toxin-producing E. coli, Tetanus, and
#      Chickenpox chapters were read for their reporting language. guide_chapter names a chapter
#      only when the current handbook page lists one.
# Changes from 0.1.0 (drafted from memory in Phase 0): corrected timeframes, reporters, and
# recipients; added citations; added 35 conditions; removed leptospirosis and Candida auris, which
# the regulation and DPH's lists do not name.
