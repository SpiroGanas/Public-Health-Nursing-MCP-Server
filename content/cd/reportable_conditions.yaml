# Diseases and conditions reportable in Massachusetts (105 CMR 300.000).
#
# REVIEW STATUS: pending. This is a developer draft. See meta.verification_note.
# Schema: content/schemas/reportable_conditions.schema.json
meta:
  id: ma-reportable-conditions
  title: Diseases and conditions reportable in Massachusetts (105 CMR 300.000)
  version: 0.1.0
  prepared: 2026-11-07
  effective_date: null
  source:
    title: "105 CMR 300.000: Reportable Diseases, Surveillance, and Isolation and Quarantine Requirements"
    publisher: Massachusetts Department of Public Health
    url: https://www.mass.gov/regulations/105-CMR-300000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
  related_sources:
    - title: Guide to Surveillance, Reporting and Control
      publisher: Massachusetts Department of Public Health, Bureau of Infectious Disease and Laboratory Sciences
      url: https://www.mass.gov/handbook/guide-to-surveillance-reporting-and-control
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted by the developer from general knowledge of 105 CMR 300.100 (diseases reportable to
    local boards of health), 300.140 (reportable directly to DPH), and 300.170 (laboratory
    findings). The current regulation text could not be retrieved while drafting. Each entry
    carries a developer confidence level. Before this item is marked reviewed, the product owner
    must check every entry, especially the reporting timeframe and who reports, against the
    current regulation and DPH's current reportable disease list.

contacts:
  dph_epidemiology:
    name: MDPH Division of Epidemiology (24/7 epidemiologist on call)
    phone: "617-983-6800"
    note: Use when the local board of health cannot be reached, for immediately reportable conditions, and for consultation.

timeframes:
  immediate: >-
    Report immediately by telephone, on suspicion of the diagnosis, without waiting for laboratory
    confirmation. Follow up with a written or electronic (MAVEN) report.
  within_24_hours: >-
    Report within 24 hours of diagnosis or identification, by telephone, fax, or electronic
    report as directed by DPH.
  other: >-
    Reported on a schedule or through a channel set by a specific DPH program (for example HIV,
    sexually transmitted infections, or lead). See the entry notes.

reporters:
  health_care_provider: >-
    Health care providers (physicians, nurses, and other clinicians) who suspect or diagnose the
    condition report to the local board of health of the town where the patient lives, or to DPH
    when instructed.
  laboratory: >-
    Clinical laboratories report the listed findings to DPH, normally by electronic laboratory
    reporting. DPH makes laboratory reports available to the local board of health through MAVEN.
  local_board_of_health: >-
    The local board of health investigates, enters or completes the case in MAVEN, and notifies DPH
    of immediately reportable conditions by telephone.

