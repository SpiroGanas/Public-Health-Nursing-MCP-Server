  verification_note: >-
    Re-checked on 2026-11-07 against the text of 105 CMR 300.000 (Mass. Register #1470, 5/27/22)
    and DPH's provider reporting list (June 2026), laboratory reporting list (May 2024), phone
    reporting memo (May 20, 2026), and alpha-gal declaration under 300.150 (March 19, 2026); each
