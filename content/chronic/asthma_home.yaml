# Asthma home assessment: the CDC/EPA/HUD home asthma trigger checklist for home visitors, the
# asthma control categories (as DPH adapts NHLBI's EPR-3 in its asthma surveillance report), the
# NHLBI asthma action plan template, and Massachusetts home-based asthma services, for
# asthma_home_assessment (CHR-05). Housing-code facts (105 CMR 410.000 for mold, moisture,
# ventilation, pests, and heat) are NOT repeated here: each checklist section points at a
# condition in content/env/housing_conditions.yaml (env-housing-conditions) and the tool reads
# them from there.
#
# REVIEW STATUS: pending. Drafted 2026-11-12 from the sources below (all fetched that day).
# Schema: content/schemas/chronic_asthma_home.schema.json
meta:
  id: chronic-asthma-home
  title: Asthma home assessment (trigger checklist, control categories, action plan template, Massachusetts home visiting)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: Home Characteristics and Asthma Triggers - Checklist for Home Visitors (June 2018)
    publisher: CDC, EPA, and HUD
    url: https://www.epa.gov/sites/default/files/2018-05/documents/asthma_home_environment_checklist.pdf
  related_sources:
    - title: Asthma Action Plan (NIH Publication No. 20-HL-5251, February 2021)
      publisher: National Heart, Lung, and Blood Institute (hosted by EPA)
      url: https://www.epa.gov/system/files/documents/2023-04/Asthma-Action-Plan-2020_rev_508.pdf
    - title: Factors Associated with Asthma Management in Massachusetts (2022)
      publisher: Massachusetts Department of Public Health, Asthma Prevention and Control Program
      url: https://www.mass.gov/doc/factors-associated-with-asthma-management-in-massachusetts-pdf/download
    - title: Community Health Worker-led asthma home visiting (Massachusetts Asthma Home Visiting Program Directory, last updated March 2025)
      publisher: Massachusetts Department of Public Health, Asthma Prevention and Control Program
      url: https://www.mass.gov/info-details/community-health-worker-led-asthma-home-visiting
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Checklist questions, options, and action steps are condensed from the CDC/EPA/HUD checklist
    PDF (June 2018) and the EPA "Asthma Triggers: Gain Control" page, both read 2026-11-12 (high
    confidence for what they say; the wording is shortened, so check the original before quoting).
    The asthma action plan zones, percentages, and fields follow the NHLBI form (NIH Publication
    No. 20-HL-5251) as hosted by EPA (high). The control categories are the table DPH prints in
    its 2022 asthma management report, where DPH adapts NHLBI's EPR-3 for the CDC Asthma Call-back
    Survey (30-day recall, adult cut points applied to all ages); EPR-3 itself (NCBI Bookshelf,
    nhlbi.nih.gov) and GINA were NOT reachable from here, so the clinical EPR-3 grid (weekly
    measures, age-specific columns, lung function, exacerbation risk) is not bundled and the
    categories are screening-level (medium confidence). The Asthma Control Test is licensed
    (QualityMetric) and is not reproduced. Services are DPH's directory as read (last updated by
    DPH in March 2025); DPH lists regions served, not towns, and the Boston Public Health Commission
    link in the directory points to a Boston Children's Hospital page, which is repeated as listed.
    MassHealth coverage of asthma home visits, flexible services, and local board of health or
    housing programs were not checked and no phone numbers are bundled beyond DPH's published
    email address.

