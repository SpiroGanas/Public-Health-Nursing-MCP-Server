  markdown: |
    # Asthma action plan

    For: {{client_name}}    Date: {{plan_date}}

    Doctor: {{doctor}}    Doctor's phone number: {{doctor_phone}}

    Hospital or emergency department phone number: {{hospital_phone}}

    My best peak flow is: {{best_peak_flow}}

    ## Green zone: doing well

    - No cough, wheeze, chest tightness, or shortness of breath during the day or night.
    - I can do my usual activities.
    - If I use a peak flow meter: {{green_peak_flow}}

    Daily medicine: {{daily_medicine}}. How much to take: {{daily_dose}}. When to take it: {{daily_when}}.

    Before exercise: {{exercise_medicine}}

    ## Yellow zone: asthma is getting worse

    - Cough, wheeze, chest tightness, or shortness of breath, or
    - Waking at night because of asthma, or
    - I can do some, but not all, usual activities, or
    - If I use a peak flow meter: {{yellow_peak_flow}}

    1. Add quick-relief medicine and keep taking my green zone medicine: {{quick_relief_medicine}}, {{quick_relief_puffs}} puffs. I can repeat every {{repeat_minutes}} minutes, up to a maximum of {{max_doses}} doses.
    2. If my symptoms (and peak flow, if used) return to the green zone after 1 hour of this treatment, I keep watching to be sure I stay in the green zone.
    3. If my symptoms (and peak flow, if used) do not return to the green zone after 1 hour: take {{quick_relief_medicine}}, {{quick_relief_puffs}} puffs, and add the oral steroid {{oral_steroid}}, {{oral_steroid_mg}} mg per day for {{oral_steroid_days}} days. Call the doctor before or within {{call_hours}} hours after taking the oral steroid.

    ## Red zone: medical alert

    - I am very short of breath, or
    - My quick-relief medicines have not helped, or
    - I cannot do my usual activities, or
    - My symptoms are the same or get worse after 24 hours in the yellow zone, or
    - If I use a peak flow meter: {{red_peak_flow}}

    Take this medicine now: {{quick_relief_medicine}}, {{red_puffs}} puffs, and the oral steroid {{oral_steroid}}, {{oral_steroid_mg}} mg. Then call my doctor NOW. Go to the hospital or call an ambulance if I am still in the red zone after 15 minutes and I have not reached my doctor.

    **Danger signs:** trouble walking and talking because of shortness of breath, or blue lips or fingernails. Take {{red_puffs}} puffs of {{quick_relief_medicine}} and go to the hospital or call for an ambulance ({{emergency_phone}}) NOW.

    ## Things that make my asthma worse

    My known triggers: {{triggers}}

    Ask the doctor to help find other triggers. Controlling an allergen usually takes a combination of steps, and reducing allergens is only one part of asthma care. See the home trigger checklist for steps for dust mites, pests, mold, pets, smoke, and strong odors.

    This plan is completed with the person's doctor. Update it at least once a year.
  trigger_guidance_source: nhlbi-plan

