  model_note: >-
    DPH describes the CHW-led asthma home visiting model as evidence-based and designed for
    high-risk pediatric patients with uncontrolled or poorly controlled asthma and a recent history
    of emergency room use: a series of home visits by a trained community health worker who
    provides asthma self-management education, helps with understanding and using medicines,
    reinforces the asthma action plan from the clinical team, and helps identify and reduce triggers
    in the home (advocating for owner action and connecting households with low-cost supplies such
    as mattress covers and HEPA vacuums where available).
