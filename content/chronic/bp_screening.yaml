# Community blood pressure screening kit: measurement technique checklist, blood pressure
# categories, severe-range thresholds and referral tiers, screening log template, follow-up
# letter templates, and a client handout, for community_bp_screening_toolkit (CHR-02).
#
# REVIEW STATUS: pending. Drafted from the sources below, retrieved 2026-11-12. The referral
# tiers and every "tool default" are this project's drafts, not guideline text.
# Schema: content/schemas/chronic_bp_screening.schema.json
meta:
  id: chronic-bp-screening
  title: Community blood pressure screening kit (categories, severe range, technique, log, letters)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2025-09-16
  source:
    title: 2025 AHA/ACC/AANP/AAPA/ABC/ACCP/ACPM/AGS/AMA/ASPC/NMA/PCNA/SGIM Guideline for the Prevention, Detection, Evaluation and Management of High Blood Pressure in Adults
    publisher: American Heart Association and American College of Cardiology (Circulation 2025;152:e114-e218)
    url: https://www.ahajournals.org/doi/10.1161/CIR.0000000000001356
  related_sources:
    - title: CDC pages on high blood pressure (about, measuring, high blood pressure during pregnancy)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/high-blood-pressure/about/index.html
    - title: Updates in the 2025 AHA/ACC Hypertension Guideline (Curr Hypertens Rep 2026)
      publisher: Springer Nature (open access in PubMed Central, PMC12995957)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12995957/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The 2025 AHA/ACC guideline retires and replaces the 2017 guideline (stated in its PubMed
    abstract, read 2026-11-12), so the 2025 text is the current ACC/AHA source. Its full text
    could NOT be read: ahajournals.org, professional.heart.org, acc.org, heart.org, nhlbi.nih.gov,
    and the PMC web pages were blocked. What was read: CDC's pages (public domain; updated
    2026-10-13) for normal below 120/80, elevated 120-129/below 80, high at 130/80 or above, the
    technique steps, and the pregnancy severe range of 160/110; and two open-access
    peer-reviewed papers that state the 2025 guideline's four categories (PMC13732403,
    PMC13683027) and a review whose last author chaired the writing committee that states the
    2025 term "severe hypertension" (above 180 systolic or above 120 diastolic, without acute
    target organ damage) and the pregnancy thresholds (PMC12995957). The stage 1 and stage 2
    ranges and the severe range are therefore MEDIUM confidence (secondary reports of the
    guideline, not the guideline's own table); check them against the guideline before use.
    Corrections to the guideline were published in Circulation and Hypertension in 2026 and
    were not reviewed. The referral tiers, the follow-up letters, the screening log columns,
    and the handout are THIS PROJECT'S DRAFTS (tool default, pending review). The list of
    emergency symptoms is from general patient guidance and is LOW confidence: it was not
    verified at a source. Referral timing is left to the agency's protocol and medical director.

