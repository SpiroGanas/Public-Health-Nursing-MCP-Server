# CDC Prediabetes Risk Test scoring, National DPP lifestyle change program eligibility and
# delivery modes, Medicare Diabetes Prevention Program coverage, and a plain-language client
# handout, for diabetes_prevention_finder (CHR-03). The Massachusetts program sites are in the
# snapshot ma-dpp-programs (snapshots/ma_dpp_programs.csv), not in this file.
#
# REVIEW STATUS: pending. Drafted from the CDC and CMS pages below, retrieved 2026-11-12.
# Schema: content/schemas/chronic_diabetes_prevention.schema.json
meta:
  id: chronic-diabetes-prevention
  title: Prediabetes Risk Test scoring, National DPP eligibility, delivery modes, and Medicare DPP coverage
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2024-05-15
  source:
    title: How Your Test is Scored (CDC Prediabetes Risk Test)
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/diabetes/widgets/risktest/how-your-test-is-scored.html
  related_sources:
    - title: Are You Eligible to Join the National DPP Lifestyle Change Program?
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/diabetes-prevention/eligible-lifestyle-change-program/index.html
    - title: Medicare Diabetes Prevention Program (MDPP) Expanded Model
      publisher: Centers for Medicare and Medicaid Services
      url: https://www.cms.gov/priorities/innovation/innovation-models/medicare-diabetes-prevention-program
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The risk test points, the cut-off of 5 or higher (maximum 10), the BMI points (lower cut
    point for Asian American people), the CDC example of BMI 21 for 5 feet 3 inches and 120
    pounds, the program eligibility rules, the delivery modes, the program length, and the
    Medicare program facts were read on CDC and CMS pages on 2026-11-12 (high confidence). CDC
    says most of its web content is public domain; the test was developed with the American
    Diabetes Association, so this file keeps only CDC's points and cut-offs and paraphrases the
    questions rather than copying them. The tool computes BMI from height and weight with the
    standard formula and applies CDC's BMI cut points; CDC's online test may use a height and
    weight table, so a score at a BMI cut point can differ by a pound or two (not verified).
    CDC's registry of recognized organizations (dprp.cdc.gov and dprpdataportal.cdc.gov) could
    NOT be reached, so no program's CDC recognition status or delivery mode is bundled. No
    source was found for MassHealth coverage of the lifestyle change program, so none is
    stated. The handout is THIS PROJECT'S DRAFT in plain language (medium confidence).

