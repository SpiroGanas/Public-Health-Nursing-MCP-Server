handout:
  id: dpp_handout
  title: Prediabetes risk and the lifestyle change program
  sources: [cdc-test-scoring, cdc-dpp-details, cdc-dpp-overview]
  markdown: |
    # Prediabetes Risk And The Lifestyle Change Program

    Date: {{date}}

    Your risk test score: {{score}} out of 10

    ## What your score means

    A score of 5 or more means you may be at high risk for prediabetes. Prediabetes means your blood sugar is higher than normal but not high enough to be called diabetes. Most people with prediabetes do not know they have it.

    A risk test is not a diagnosis. Only a blood test can tell you for sure. Please ask your doctor or nurse for a blood sugar test.

    ## What you can do

    Making healthy changes can cut your risk of type 2 diabetes in half. The lifestyle change program can help.

    - It lasts 1 year.
    - You meet in a group with a trained coach.
    - You meet about once a week for the first 6 months.
    - You meet once or twice a month for the next 6 months.
    - You learn to eat healthy, be more active, and deal with stress.

    ## Who can join

    You can join if you are 18 or older, are not pregnant, and have not been told you have diabetes. Your body mass index must be 25 or higher. It must be 23 or higher if you are Asian American. You also need one of these:

    - A blood test in the prediabetes range in the past year.
    - Diabetes during a past pregnancy.
    - A risk test score of 5 or more.

    ## Where to find a program

    Programs may be in person or online. Ask your nurse for programs near you.

    For help, call: {{program_phone}}

notices:
  decision_support: >-
    This tool scores a risk test and lists program sites as decision support. A risk score is
    not a diagnosis. Confirm each program's current schedule, delivery mode, cost, and CDC
    recognition status with the program or on CDC's registry before referring.
  copyright: >-
    CDC material is generally in the public domain; the CDC and ATSDR policy page asks for
    attribution, a no-endorsement disclaimer, and no change to substantive content. The
    Prediabetes Risk Test was developed with the American Diabetes Association; this tool
    reproduces only CDC's published points and cut-offs, with its own paraphrased questions.
    Confirm reuse terms for the full test with CDC. This is not an endorsement by CDC, CMS,
    HHS, or the ADA.
