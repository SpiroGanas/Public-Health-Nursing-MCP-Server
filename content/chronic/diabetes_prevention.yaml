risk_test:
  name: CDC Prediabetes Risk Test
  high_risk_at: 5
  maximum: 10
  scoring_note: >-
    Points for each risk factor are added. A total of 5 points or higher is considered high
    risk for having prediabetes. The test estimates risk only: only a blood test can diagnose
    prediabetes (CDC).
  source: cdc-test-scoring
  items:
    - id: age
      label: Age
      question: How old are you?
      points:
        - {when: under 40 years, points: 0}
        - {when: 40 to 49 years, points: 1}
        - {when: 50 to 59 years, points: 2}
        - {when: 60 years or older, points: 3}
    - id: sex
      label: Sex
      question: Are you a man or a woman? (Women are also asked if they ever had gestational diabetes.)
      points:
        - {when: man, points: 1}
        - {when: woman, points: 0}
        - {when: woman who has had gestational diabetes, points: 1}
    - id: family_history
      label: Family history
      question: Do you have a mother, father, sister, or brother with diabetes?
      points:
        - {when: "yes", points: 1}
        - {when: "no", points: 0}
    - id: high_blood_pressure
      label: High blood pressure
      question: Have you ever been diagnosed with high blood pressure?
      points:
        - {when: "yes", points: 1}
        - {when: "no", points: 0}
    - id: physical_activity
      label: Physical activity
      question: Are you physically active?
      points:
        - {when: "yes", points: 0}
        - {when: "no", points: 1}
    - id: bmi
      label: Body mass index (BMI)
      question: What are your height and weight (the test turns them into a BMI)?
      points:
        - {when: below 25 (below 23 if Asian American), points: 0}
        - {when: 25 to 29 (23 to 29 if Asian American), points: 1}
        - {when: 30 to 39, points: 2}
        - {when: 40 or higher, points: 3}
  bmi:
    formula: weight in pounds x 703 / (height in inches squared)
    example: "CDC's example: a person 5 feet 3 inches tall who weighs 120 pounds has a BMI of 21, the normal range (18.5 to 24.9)."
    overweight_from: 25
    asian_overweight_from: 23
    obese_from: 30
    severe_from: 40
  ethnicity_note: >-
    CDC lists ethnicities at higher risk (African American, Hispanic/Latino, American Indian,
    Asian American, and Pacific Islander people) but says the test uses ethnicity only to set
    the BMI cut point for Asian American people.

eligibility:
  source: cdc-dpp-eligibility
  must_meet_all:
    - Be 18 years or older.
    - Have a body mass index (BMI) of 25 or higher (23 or higher if you are an Asian American person).
    - Not be previously diagnosed with type 1 or type 2 diabetes.
    - Not be pregnant.
  must_meet_one:
    - "A blood test result in the prediabetes range within the past year: hemoglobin A1C 5.7% to 6.4%, fasting plasma glucose 100 to 125 mg/dL, or 2-hour plasma glucose (after a 75 g glucose load) 140 to 199 mg/dL."
    - A previous diagnosis of gestational diabetes.
    - A high-risk result (score of 5 or higher) on the Prediabetes Risk Test.
  medicare_note: If you are enrolling in the Medicare Diabetes Prevention Program, different criteria apply (CDC). The tool does not apply them; see the CMS page.
  a1c_range: [5.7, 6.4]
  fasting_range: [100, 125]
  two_hour_range: [140, 199]

program:
  source: cdc-dpp-details
  facts:
    - text: The program runs for 1 year. In the first 6 months participants meet about once a week; in the second 6 months, once or twice a month.
      source: cdc-dpp-details
      section: Time commitment
      confidence: high
    - text: A trained Lifestyle Coach leads a group that follows a CDC-approved curriculum. All offerings discuss the same topics over the year, and there is a Spanish-language curriculum, so some programs are offered completely in Spanish.
      source: cdc-dpp-details
      section: Key components; What you'll learn
      confidence: high
    - text: CDC says people who make certain lifestyle changes can cut their risk of type 2 diabetes in half. It is designed for people who have prediabetes or are at risk for type 2 diabetes but do not already have diabetes.
      source: cdc-dpp-overview
      section: Key points; Overview
      confidence: high
    - text: Massachusetts DPH describes groups of 8 to 15 people led by a trained Lifestyle Coach, and says the cost is set by each program and location, so ask the program coordinator.
      source: dph-dpp
      section: About DPP; Is there a fee?
      confidence: medium
  delivery_modes:
    source: cdc-dpp-find
    text: CDC says programs are offered through a variety of languages and modalities - in person sessions, live virtual sessions, non-live (on-demand) virtual sessions, or a combination. For the in-person option, the Lifestyle Coach and participants meet in a classroom or classroom-like setting. For the virtual options, participants can choose live, interactive group sessions by phone or video (for example Zoom) or on-demand sessions on a smartphone, tablet, or computer.
    how_to_filter: CDC's Find a Lifestyle Change Program page lets a person enter a city, state, or ZIP code and choose a delivery mode and a preferred language, and marks organizations that are Medicare Diabetes Prevention Program (MDPP) suppliers. CDC's national registry lists the contact information and recognition status of all CDC-recognized organizations.
  registry_gap: >-
    CDC's registry (dprp.cdc.gov/Registry) and program locator (dprpdataportal.cdc.gov) could
    not be read when this tool was built, so this tool cannot list online or distance-learning
    providers, and cannot say which Massachusetts sites are CDC-recognized or how each is
    delivered. Use the CDC page to find those and to check recognition status.

medicare:
  source: cms-mdpp
  facts:
    - text: The Medicare Diabetes Prevention Program (MDPP) is covered under Medicare Part B as a preventive service.
      source: cms-mdpp
      section: Overview
      confidence: high
    - text: MDPP is 16 weekly core sessions of the CDC-approved curriculum followed by 6 monthly follow-up sessions; Medicare pays for up to 22 sessions per eligible person.
      source: cms-mdpp
      section: Model details; Design
      confidence: high
    - text: Suppliers deliver the sessions in a group classroom setting, in a live virtual distance learning setting, or in a fully asynchronous online format.
      source: cms-mdpp
      section: Design
      confidence: high
    - text: The calendar year 2026 physician fee schedule final rule added coverage for asynchronous (online) delivery through December 31, 2029, and suppliers no longer need to keep in-person delivery sites to deliver the program online (through December 31, 2029). Weight can be self-reported.
      source: cms-mdpp
      section: Background
      confidence: high
  finder: CMS has an MDPP Supplier Finder (location and class type); CDC's locator also marks MDPP suppliers.
  eligibility_gap: The MDPP eligibility criteria differ from the CDC program and were not read, so the tool does not check them. Check the CMS page.

