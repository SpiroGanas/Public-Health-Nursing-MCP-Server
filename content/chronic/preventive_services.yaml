# Preventive services lookup: how the tool applies each USPSTF A or B recommendation (the simple,
# verifiable parts of the published population), plain-language client summaries, and the
# Massachusetts cancer screening and tobacco cessation program options, for
# preventive_services_lookup (CHR-04). The recommendations themselves (grade, date, population,
# wording) are in the uspstf-ab-recommendations snapshot built by
# xtask/scripts/build_prevent_snapshots.py; this file only adds the criteria and summaries.
#
# REVIEW STATUS: pending. Drafted 2026-11-12 from the sources below.
# Schema: content/schemas/chronic_preventive_services.schema.json
meta:
  id: chronic-preventive-services
  title: Preventive services lookup (criteria, client summaries, Massachusetts program options)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: USPSTF recommendation statements (A and B grades) read through PubMed
    publisher: U.S. Preventive Services Task Force
    url: https://www.uspreventiveservicestaskforce.org/
  related_sources:
    - title: Massachusetts Breast and Cervical Cancer Program (MBCCP) resources for patients
      publisher: Massachusetts Department of Public Health, Bureau of Community Health and Prevention
      url: https://www.mass.gov/info-details/massachusetts-breast-and-cervical-cancer-program-resources-for-patients
    - title: MA Colorectal Cancer Control Program (MCRCCP)
      publisher: Massachusetts Department of Public Health, Bureau of Community Health and Prevention
      url: https://www.mass.gov/ma-colorectal-cancer-control-program-mcrccp
    - title: MyHealthfinder (preventive services by age, sex, and pregnancy)
      publisher: Office of Disease Prevention and Health Promotion (ODPHP), HHS
      url: https://odphp.health.gov/myhealthfinder
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The USPSTF web site and API were blocked from the build network, so every grade, date,
    population, and recommendation sentence comes from the Task Force's published statements as
    PubMed abstracts (see the snapshot), and the builder refuses to write a grade that the text
    does not show. THIS FILE is the project's own layer on top: the age, sex, pregnancy, and
    risk-factor criteria are transcribed from the population wording the abstracts give
    (medium confidence; where an abstract gives no age range, the criteria block says so in
    'assumption' and the tool says so), and the client summaries are the project's plain-language
    drafts (medium confidence). The Massachusetts program entries are what the DPH pages said
    on 2026-11-12 (high confidence for what the page says; the pages show no last-updated date).
    Not verified: whether any USPSTF statement has been updated after the PubMed record, current
    USPSTF web page wording, and whether MBCCP, MCRCCP, or the quit line have changed since the
    pages were read. Massachusetts programs for lung, prostate, hepatitis, or HIV screening were
    not found on the pages read and are not listed.

