# Workforce competency frameworks for assess_workforce_competencies (LEAD-06): the eight domains and
# three tiers of the Council on Linkages Core Competencies for Public Health Professionals (2021) and
# of the Community/Public Health Nursing Competencies (Quad Council Coalition, 2018), a four-level
# self-rating scale, and how the Massachusetts workforce standards are tracked.
#
# REVIEW STATUS: pending. PARTIAL, and read from SECONDARY sources: the Public Health Foundation
# (phf.org, archive.phf.org) and the Quad Council site (quadcouncilphn.org) were blocked on the build
# network, so the competency STATEMENTS (the numbered items in each domain and tier) were not read and are
# NOT bundled. Domain names, the tier descriptions, and the rating scale were read in open-access articles
# found through PubMed Central and in CDC's page on competencies (all fetched 2026-11-12); each is marked
# with where it was read. Nothing here is copied from the frameworks' own text.
# Schema: content/schemas/leadership_workforce_competencies.schema.json
meta:
  id: leadership-workforce-competencies
  title: Public health workforce competency frameworks (domains and tiers only) and credential tracking rules
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: Competencies for Public Health Professionals
    publisher: Centers for Disease Control and Prevention, Public Health Infrastructure Center
    url: https://www.cdc.gov/infrastructure/training-professional-development/competencies-for-public-health-professionals.html
  related_sources:
    - title: Core Competencies for Public Health Professionals (2021)
      publisher: Council on Linkages Between Academia and Public Health Practice, Public Health Foundation
      url: https://phf.org/programs/core-competencies-for-public-health-professionals/
    - title: Community/Public Health Nursing Competencies (2018)
      publisher: Quad Council Coalition of Public Health Nursing Organizations (now the Council of Public Health Nursing Organizations)
      url: https://quadcouncilphn.org/
    - title: Performance Standards for Local Public Health, Workforce Standards sheet
      publisher: Massachusetts Department of Public Health, Office of Local and Regional Health
      url: https://www.mass.gov/doc/performance-standards/download
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The two frameworks' own documents could not be fetched (phf.org, archive.phf.org, and
    quadcouncilphn.org were refused by the network), so: (1) NO competency statements or statement IDs
    are bundled; the tool rates at the domain level (8 domains by 3 tiers) and accepts the nurse's own
    competency labels (typed from the framework she downloads) without checking them. (2) The domain
    names of the 2021 Core Competencies were read in one open-access journal article (Front Public Health
    2025) and the 2018 nursing domain names in another (Nurse Educ 2025); the 2018 names carry slightly
    different wording in different articles (for example "Assessment Analytic Skills" and "Analytic and
    Assessment Skills"). CDC's page confirms that the Core Competencies current edition was adopted on
    October 21, 2021 and that the Community/Public Health Nursing Competencies' latest edition is 2018.
    (3) The rating scale is the four-level none/aware/knowledgeable/proficient scale described in a 2024
    journal article that used the Core Competencies assessment; the Public Health Foundation's own
    wording of its assessment instruments was not read. (4) The copyright and reuse terms of both
    frameworks were not read: this file keeps only domain names and short tier descriptions in this
    project's words, and links to the owners. Check the terms before copying their text into your own forms.
    (5) The Massachusetts credential rules are not copied here; they come from the bundled
    ma-performance-standards snapshot (DPH's workbook, read for the strategy tools).

