      tool cannot say whether the 2018 domain names were renamed to match, so it keeps the two lists apart.

tiers:
  - id: tier1
    number: 1
    label: Tier 1 (front-line and program support)
    text: Front-line staff and program support; in the nursing framework the generalist public health nurse.
    source: amp_2024
    section: Introduction (tiers of the Core Competencies)
    confidence: medium
  - id: tier2
    number: 2
    label: Tier 2 (program management and supervisory)
    text: Program management and supervisory responsibilities; in the nursing framework, supervisory management (advanced practice nursing and leadership skill sets begin at Tier 2).
    source: amp_2024
    section: Introduction (tiers of the Core Competencies)
    confidence: medium
  - id: tier3
    number: 3
    label: Tier 3 (senior management and executive)
    text: Senior management and executive leadership: setting strategy and vision, working with policymakers, leading organizational efforts toward equity.
    source: amp_2024
    section: Introduction (tiers of the Core Competencies)
    confidence: medium
  nursing_tier_note:
    text: The 2025 Public Health Nursing article says each nursing domain is divided into three tiers (generalist, supervisory management, senior leadership/management), and that Tier 1 defines the generalist public health nurse while Tiers 2 and 3 define advanced practice and leadership skill sets.
    source: phn_2025
    section: Competencies for PHN and APHN
    confidence: medium

rating_scale:
  - {value: 1, label: None, meaning: "I am unaware of this skill or know very little about it."}
  - {value: 2, label: Aware, meaning: "I have heard of it but have limited knowledge or ability to apply it."}
  - {value: 3, label: Knowledgeable, meaning: "I am comfortable with my knowledge and my ability to apply it."}
  - {value: 4, label: Proficient, meaning: "I am very comfortable; I could teach it to others."}
rating_scale_source: amp_2024
rating_scale_section: Methods (the 1-to-4 scale)
rating_scale_confidence: medium
rating_scale_note: >-
  This is the four-level scale described in a 2024 article that used a Core Competencies assessment. The
  meanings above are this project's short paraphrases. The Public Health Foundation's own assessment
  instruments and their exact wording were not read. A blank or 0 means not rated and is left out.

defaults:
  target_rating:
    value: 3
    basis: >-
      A starting target of 3 (Knowledgeable) for every domain. This is a tool default with no published
      source; set your own target by domain or by tier (for example a higher target for the tier of a
      supervisor) from your workforce development plan.
  minimum_group_size:
    value: 3
    basis: >-
      A project rule, not a published standard: no result is shown for fewer than 3 people (the same
      threshold as the server's small-cell rule for counts), so no individual's rating can be read from
      team results.
  due_soon_days:
    value: 90
    basis: A tool default for "due soon" in the credential tracker; change it with due_soon_days.

training_use:
  - text: Agencies use competencies to write job descriptions, assess workforce development needs, inform workforce development plans, find training, coaching, and mentoring needs or gaps, and support accreditation (PHAB Domain 8).
    source: cdc_competencies
    section: Background
    confidence: high
  - text: TRAIN, the learning platform the Public Health Foundation supports, has a "Competencies and Capabilities" feature to search for trainings by tier or domain of the Core Competencies and some other competency sets.
    source: cdc_competencies
    section: Competency-Based Trainings
    confidence: high

training_actions:
  - id: search_train
    text: Search TRAIN (or your agency's learning system) for courses filed under this domain and tier.
  - id: mentor
    text: Pair staff who rated themselves lower here with a colleague who rated higher, or with a mentor outside the team.
  - id: practice_assignment
    text: Add a project or assignment that uses the skill, with a supervisor to review it.
  - id: peer_session
    text: Hold a peer session or journal club on the domain at a team meeting.
  - id: plan_entry
    text: Record the gap, the action, an owner, and a due date in the workforce development plan.
  note: These are generic steps from this project. No specific course, vendor, or curriculum is recommended or verified.

crosswalk:
  note: >-
    A rough pairing of the 2021 and 2018 domains by name, for a team that has rated itself against both.
    It is this project's reading of the names (confidence low); neither framework publishes this pairing in
    anything that was read. Ask your reviewer to confirm it.
  pairs:
    - {core_competencies_2021: 1, cphn_2018: 1, confidence: medium}
    - {core_competencies_2021: 2, cphn_2018: 2, confidence: medium}
    - {core_competencies_2021: 3, cphn_2018: 3, confidence: medium}
    - {core_competencies_2021: 4, cphn_2018: 4, confidence: low}
    - {core_competencies_2021: 5, cphn_2018: 5, confidence: low}
    - {core_competencies_2021: 6, cphn_2018: 6, confidence: medium}
    - {core_competencies_2021: 7, cphn_2018: 7, confidence: medium}
    - {core_competencies_2021: 8, cphn_2018: 8, confidence: medium}

credentials:
  snapshot_id: ma-performance-standards
  note: >-
    The Massachusetts local public health workforce standards come from the bundled DPH Performance
    Standards snapshot (positions and inspection types, with required and recommended items, each with a
    deadline "within N months or years of hire" where DPH gives one). The tool reads the deadline from
    DPH's wording and adds it to the hire date you give; it does not interpret waivers, prior service,
    or equivalents (DPH's notes allow a waiver for staff with seven years of service, and for the
    Registered Sanitarian requirement in some management positions).
  source: ma_performance_standards
  section: Workforce Standards
  confidence: medium
  position_aliases:
    - {position_id: WF-POS-04, words: [public health nurse, phn, public health nursing, nurse, community health nurse]}
    - {position_id: WF-POS-01, words: [director, assistant director, deputy director, health director, management]}
    - {position_id: WF-POS-02, words: [management agent, health agent, agent, health officer]}
    - {position_id: WF-POS-03, words: [inspector, environmental health specialist, sanitarian, environmental health]}
    - {position_id: WF-POS-05, words: [clerical, administrative assistant, clerk, office staff]}
    - {position_id: WF-POS-06, words: [board of health member, board member]}
  universal_items:
    - text: All personnel should have at least ICS 100 and NIMS 700 within 1 year of hire; those who might have a leadership role should have ICS 200 and above.
      source: ma_performance_standards
      section: Workforce Standards, notes
      confidence: medium
      label: ICS 100 and NIMS 700
      months_from_hire: 12
      kind: recommended

not_verified:
  - item: Competency statements and IDs
    detail: The numbered competency statements of both frameworks were not read (phf.org and quadcouncilphn.org were blocked). Rate at the domain level, or type your own competency labels from the framework you download; the tool does not check them.
  - item: Reuse terms of the frameworks
    detail: Not read. The tool stores only domain names and short tier descriptions in its own words and links to the owners.
  - item: Public Health Foundation assessment instruments
    detail: The PHF's assessment instruments, scoring rules, and any recommended proficiency targets were not read.
  - item: Whether the 2018 nursing domain names changed
    detail: See the note on the nursing framework; the two lists are kept apart.
  - item: "Massachusetts credential rules after the workbook date"
    detail: The workforce standards snapshot is DPH's workbook modified July 15, 2024 (retrieved 2026-11-12); check DPH for newer standards, the Foundations course schedule, and any waiver you hold.
  - item: Credential equivalents, waivers, and prior service
    detail: Not modeled.
