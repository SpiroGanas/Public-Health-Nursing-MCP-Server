fiscal_year:
  default_start_month: 7
  default_start_day: 1
  statements:
    - text: >-
        Massachusetts towns' fiscal year begins July 1 and ends the following June 30. DLS says the
        Commonwealth and municipalities share this fiscal year and name it for the calendar year in
        which it ends (FY2027 runs July 1, 2026 to June 30, 2027).
      source: dls_glossary
      section: Fiscal Year (FY)
      confidence: high
    - text: Chapter 44, section 56 sets the town fiscal year as July 1 through the following June 30.
      source: mgl_44_56
      section: Section 56
      confidence: high
    - text: >-
        The tool starts the fiscal year on July 1 by default. A grant or a regional shared services
        arrangement can run on another year (the federal government's begins October 1), so the start
        month can be changed for a file whose year is not the municipal one.
      source: dls_glossary
      section: Fiscal Year (FY)
      confidence: medium

definitions:
  - text: >-
      An encumbrance reserves money for a purchase order, contract, or salary commitment that is
      charged to an appropriation account but not yet paid. The tool therefore reports money
      'available' as budget minus spending to date minus encumbrances.
    source: dls_glossary
    section: Encumbrance
    confidence: high
  - text: >-
      An appropriation is an authorization from town meeting, a city council, or another legislative
      body to spend money and take on obligations for a public purpose, usually limited in amount
      and in the time in which it can be spent.
    source: dls_glossary
    section: Appropriation
    confidence: high
  - text: >-
      A revolving fund lets a community use revenue that comes directly from providing a specific
      service, such as user fees, to support that service without a new appropriation.
    source: dls_glossary
    section: Revolving Fund
    confidence: high

phe_program:
  statements:
    - text: >-
        The Public Health Excellence (PHE) Grant Program is run by DPH's Office of Local and Regional
        Health. For FY2027 DPH says up to $26.6 million in state and federal funding will be
        awarded through that office, to support the local public health workforce, shared services,
        and community-driven capacity-building.
      source: phe_page
      section: Public Health Excellence Grant Program
      confidence: high
    - text: >-
        For FY2026 DPH lists what PHE grants fund, by position: 77 environmental inspectors, 46
        public health nurses, 21 epidemiologists, 19 community health workers, health educators and
        behavioral health staff, 7 agency leadership staff, 22 operations staff, 51 program
        coordinators, and 16 other specialized roles. PHE funding therefore pays for positions as
        well as shared services.
      source: phe_page
      section: Strengthening the public health workforce
      confidence: high
    - text: >-
        Municipalities take part through Shared Service Arrangements, which pool staff and
        services, and DPH also funds three standalone municipalities (Boston, Springfield, and
        Worcester).
      source: phe_page
      section: Expanding shared services
      confidence: high
    - text: >-
        The program began in January 2020 as the Massachusetts Municipal Public Health Shared
        Services grant program and was renamed the State Action for Public Health Excellence
        (SAPHE) Grant Program in April 2020. A ledger may therefore label the same state money
        'SAPHE', 'shared services', or 'PHE'.
      source: saphe_archived
      section: Funding
      confidence: high
    - text: >-
        The SAPHE 2.0 law (Chapter 238 of the Acts of 2024) requires DPH and DEP to fund boards of
        health to meet the Performance Standards and to offer grants, subject to appropriation, and
        asks boards of health to supply specific health department cost data so DPH can make
        informed funding requests.
      source: saphe2_guidance
      section: DPH and DEP requirements; Conclusion
      confidence: high
    - text: >-
        In DPH's 2022-2023 capacity assessment, the 50 shared services arrangements reported 93.92
        FTE of shared staff paid by PHE grants in fall 2022, and the program requires each
        arrangement to hire a Shared Services Coordinator.
      source: capacity_assessment
      section: Shared Staffing
      confidence: high
  label_words:
    - public health excellence
    - phe
    - saphe
    - shared services
  note: >-
    The tool treats a fund or source label that contains one of these words as PHE money. That is a
    label match, not a check against DPH's award records. What PHE may pay for, how awards are paid
    to the municipality or the arrangement's lead, and the reporting terms of an award come from
    the request for responses and the award contract, which were not read.

revenue_groups:
  - id: phe
    label: State Public Health Excellence (PHE) grants
    words: [public health excellence, phe, saphe, shared services]
    note: Matched by label (see phe_program).
  - id: federal
    label: Federal funds and federal pass-through grants
    words: [federal, cdc, hrsa, samhsa, fema, hhs, usda, phep]
    note: Tool default word list.
  - id: state_other
    label: Other state funds
    words: [state, dph, commonwealth, mdph]
    note: Tool default word list. A label that names the state and PHE is counted as PHE.
  - id: fees
    label: Fees, permits, licenses, and revolving funds
    words: [fee, fees, permit, permits, license, licenses, licence, inspection, inspections, charges for services, user charges, revolving]
    note: >-
      Includes revolving funds because DLS describes them as user-fee revenue spent on the
      service that earned it.
  - id: municipal
    label: Municipal appropriation (general fund)
    words: [general fund, appropriation, tax levy, municipal, town, city, operating budget]
    note: Tool default word list.
  - id: other_grants
    label: Other grants and gifts (foundation, donations)
    words: [grant, grants, foundation, donation, donations, gift, gifts]
    note: Grants that name neither the state nor the federal government.
  - id: other
    label: Other or not classified
    words: []
    note: Labels that matched no group. Name them in revenue_group_overrides to place them.

