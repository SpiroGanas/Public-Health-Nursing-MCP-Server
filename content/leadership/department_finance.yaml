# Reference content for analyze_health_department_budget (LEAD-01): the fiscal year, what the
# state's Public Health Excellence (PHE) grants are (as DPH describes them), the words the tool
# uses to sort a budget file's rows into revenue groups and to recognize salary lines, column
# name aliases, and the published per-capita budget figures from DPH's capacity assessment.
#
# REVIEW STATUS: pending. Drafted 2026-11-12.
# Schema: content/schemas/leadership_department_finance.schema.json
# Nothing here is a regulation about how a board of health must keep its books. The revenue
# group words, the personnel words, the pace tolerance, and the small-group rule are this
# project's defaults (basis: tool_default), not published standards.
