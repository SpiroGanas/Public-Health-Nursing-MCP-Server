defaults:
  - id: pace_tolerance_points
    label: Spending or revenue this many percentage points ahead of or behind the share of the year elapsed is flagged
    value: 10
    unit: percentage points
    basis: tool_default
    source: null
    note: This project's convention. Change it with pace_tolerance_points, or use your finance director's rule.
  - id: min_personnel_group
    label: Fewest positions in the personnel group before its amounts are shown
    value: 3
    unit: positions
    basis: tool_default
    source: null
    note: >-
      A privacy rule of this tool: a salary line for one or two people is close to personal data,
      so personnel amounts are combined into one row and hidden below this number of positions.
  - id: run_rate_months
    label: Months of recent spending averaged for the run-rate forecast
    value: 3
    unit: months
    basis: tool_default
    source: null
    note: Needs a month column. Change it with run_rate_months.

per_capita_benchmarks:
  - id: basic_capacity_budget
    label: Municipal local health department budget estimated to establish basic public health capacities
    value: 36.98
    unit: dollars per person
    source: capacity_assessment
    section: Funding (Figure 7 text)
    confidence: medium
    note: >-
      DPH's report says 'according to current research' that municipal budgets should be at least
      $36.98 per capita (adjusted for inflation) to establish even basic capacities within a shared
      services arrangement. The research is not named in the report, so the figure's origin and
      inflation year are not known. The report found only two of 50 arrangements above it.
  - id: ssa_average_municipal
    label: Average municipal health budget per capita across the 50 shared services arrangements (2022-2023)
    value: 17.56
    unit: dollars per person
    source: capacity_assessment
    section: Funding (Figure 7 text)
    confidence: high
    note: Half of the arrangements fell between $11.88 and $20.45 per capita.
  - id: ssa_average_combined
    label: Average combined municipal and grant funding per capita across the arrangements (2022-2023)
    value: 26.61
    unit: dollars per person
    source: capacity_assessment
    section: Funding
    confidence: high
    note: The reported range was $1.57 to $137.41 per capita. These are self-reported budgets of arrangements, not of single towns.

