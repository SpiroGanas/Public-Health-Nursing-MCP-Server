# Standing order skeleton for draft_standing_orders (LEAD-08): what the Massachusetts Board of
# Registration in Nursing requires every standing order or protocol to contain (Advisory Ruling 9324)
# and a vaccine standing order to contain (Advisory Ruling 9804), the outline of Immunize.org's and DPH's
# vaccine standing orders, and where DPH's own signed standing orders for local boards of health are.
# NO CLINICAL CONTENT is bundled: no vaccine, drug, dose, route, inclusion or exclusion criterion,
# contraindication, or precaution. Those come from the nurse's cited source and the medical director signs.
#
# REVIEW STATUS: pending. Advisory Rulings 9324 (revised April 11, 2018) and 9804 (revised September 9,
# 2015) were read in full on 2026-11-12 (mass.gov Word files); Immunize.org's influenza vaccine standing
# order for adults (Item P3074, dated 9/14/2026), DPH's 2026-2027 influenza standing order for local
# boards of health (Standing Order 2026-01), and DPH's "Vaccine Model Standing Orders" page were read on
# the same date. The 244 CMR provisions about orders are bundled by the nursing_scope_of_practice_guide
# tool (content id policy-nursing-scope-of-practice); this file points to them and does not repeat them.
# Schema: content/schemas/leadership_standing_orders.schema.json
meta:
  id: leadership-standing-orders
  title: Standing order skeleton (Board of Registration in Nursing Advisory Rulings 9324 and 9804; no clinical content)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: "2018-04-11"
  source:
    title: "Advisory Ruling 9324: Accepting, Verifying, Transcribing and Implementing Prescriber Orders (revised April 11, 2018)"
    publisher: Massachusetts Board of Registration in Nursing
    url: https://www.mass.gov/doc/ar-9324-accepting-verifying-transcribing-and-implementing-medication-orders/download
  related_sources:
    - title: "Advisory Ruling 9804: Administration of Immunizing Agents and Vaccines (revised September 9, 2015)"
      publisher: Massachusetts Board of Registration in Nursing
      url: https://www.mass.gov/doc/ar-9804-administration-of-immunizing-agents-and-vaccines/download
    - title: Vaccine Model Standing Orders
      publisher: Massachusetts Department of Public Health, Bureau of Infectious Disease and Laboratory Sciences
      url: https://www.mass.gov/lists/vaccine-model-standing-orders
    - title: Standing Orders Templates
      publisher: Immunize.org
      url: https://www.immunize.org/clinical/topic/standing-orders-templates/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The ten required elements, the three limits, and the vaccine elements are paraphrased from the two
    advisory rulings as read on 2026-11-12 (high confidence); the Board revises its rulings, so check the
    current versions. The outline of a vaccine standing order (eight numbered steps and an authorization
    block) is read from one Immunize.org template and one DPH template and is a structure only (medium
    confidence: other templates may differ). The skeleton's section list, the placeholder wording, and
    which sections are filled by whom are this project's design, not the Board's or DPH's. NOT verified:
    any federal or state time limit for a prescriber to authenticate a standing order (AR 9324 says "not
    to exceed Federal or State requirements" without naming them), the requirements of your agency, your
    insurer, or a collaborating pharmacy, other licensing boards' rules, and anything in
    Immunize.org's other 39 templates. Immunize.org's current template says it "may be adapted per a
    practice's discretion without obtaining permission" and asks that Immunize.org be acknowledged as
    its source; that statement was read in one template and is not a verified license for every
    Immunize.org document. This tool copies none of their text.

