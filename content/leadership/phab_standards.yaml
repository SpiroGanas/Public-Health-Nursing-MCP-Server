not_verified:
  - PHAB's Version 2022 document could not be read, so measure IDs and titles, documentation requirements, and the reaccreditation measure differences are not included.
  - The standard titles come from CDC's toolkit and may differ slightly from PHAB's wording.
  - The domain and standard numbering applies to Version 2022 (initial accreditation); check PHAB for reaccreditation, Pathways, and any newer version.
  - The month PHAB adopted Version 2022 (February 2022) is from a search summary only.
