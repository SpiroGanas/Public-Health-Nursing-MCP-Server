phab:
  version_label: "Version 2022"
  version_check: >-
    CDC's 2023 toolkit and DPH's accreditation page both refer to the Version 2022 Standards and
    Measures (10 domains). The month PHAB adopted Version 2022 (February 2022) came from a web
    search summary, not a page that could be opened: low confidence.
  version_check_confidence: low
  license_note: >-
    PHAB's Standards & Measures are PHAB's copyrighted work. This tool bundles only domain names,
    standard numbers, and short standard titles (as shown in CDC's toolkit) and keyword cues written
    for this project. It never copies PHAB's measure text. Read the document on PHAB's site and check
    PHAB's terms before copying any of it into your own files.
  link: https://phaboard.org/standards-and-measures-for-initial-accreditation/
  link_note: The PHAB page itself could not be opened to confirm this link; the PDF address is the one CDC's toolkit cites.
  measures_note: >-
    Measure IDs and titles (for example "1.1.1") are not bundled because PHAB's document could not be
    read. If you hold PHAB's document, give measures_path a CSV or workbook in /data with the columns
    "Measure ID", "Short title", and optionally "Keywords"; the tool then crosswalks those measures
    too, and the measure list stays in your files (the response shows IDs and evidence levels only).
  measure_columns:
    id: Measure ID
    title: Short title
    keywords: Keywords
  document_types_note: >-
    CDC says a documented community health assessment and improvement plan, developed
    collaboratively and dated within the last five years, are required for accreditation (CDC,
    Drivers). A 2025 study of plans from PHAB-accredited local health departments says strategic
    plans, community health improvement plans, and quality improvement plans align with accreditation
    requirements and that workforce development plans are also required.
  document_types:
    - id: cha
      label: Community health assessment (CHA)
      cues: ["community health assessment", "community health needs assessment", "cha"]
      standards: ["1.1"]
      source: cdc-drivers
      confidence: high
    - id: chip
      label: Community health improvement plan (CHIP)
      cues: ["community health improvement plan", "health improvement plan", "chip"]
      standards: ["5.2"]
      source: cdc-drivers
      confidence: high
    - id: strategic_plan
      label: Health department strategic plan
      cues: ["strategic plan", "strategic priorities", "strategic planning"]
      standards: ["10.1"]
      source: cdc-crosswalk
      confidence: medium
    - id: qi_plan
      label: Quality improvement plan
      cues: ["quality improvement plan", "qi plan", "performance management"]
      standards: ["9.1"]
      source: jphmp-2025-plans
      confidence: medium
    - id: workforce_plan
      label: Workforce development plan
      cues: ["workforce development plan", "training plan", "core competencies"]
      standards: ["8.2"]
      source: jphmp-2025-plans
      confidence: medium
    - id: emergency_plan
      label: Emergency operations or preparedness plan
      cues: ["emergency operations plan", "emergency preparedness", "continuity of operations"]
      standards: ["2.2"]
      source: cdc-crosswalk
      confidence: low
  match_rules:
    strong: "Two or more different cues in one section of one document, or cues in three or more different sections or documents."
    some: "At least one cue found in a section of a document, or a file name that names the kind of document (for example Strategic Plan)."
    none: "No cue found in the indexed documents."
    note: >-
      The index holds the first sections of each document as text (PDF pages, DOCX or Markdown
      headings). Matches are a starting point for the person who knows the documents: confirm each
      against the PHAB measure's documentation requirements and the document's date and approval.
      Passages are not shown from a document that holds phone numbers, email addresses, or street
      addresses, and files that look like client records or interview transcripts are not used.

domains:
  - id: 1
    name: "Assess and monitor population health status, factors that influence health, and community needs and assets"
    standards:
      - id: "1.1"
        title: "Participate in or lead a shared process resulting in a comprehensive community health assessment (CHA)"
        cues: ["community health assessment", "community health needs assessment", "community health profile", "health assessment", "key informant", "focus group", "community survey", "needs assessment"]
        document_types: ["cha"]
        source: cdc-crosswalk
        confidence: medium
      - id: "1.2"
        title: "Collect and share data that provides information on conditions of public health importance and on the health status of the population"
        cues: ["surveillance", "data sharing", "data use agreement", "vital statistics", "health data", "data dashboard", "reportable disease", "data source"]
        document_types: []
        source: cdc-crosswalk
        confidence: medium
