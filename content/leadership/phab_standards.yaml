# PHAB Standards & Measures Version 2022 (initial accreditation): domain and standard structure and this
# project's own keyword cues, for phab_accreditation_crosswalk (LEAD-04).
#
# REVIEW STATUS: pending. PHAB's own document (phaboard.org, "Standards & Measures for Initial
# Accreditation Version 2022") could NOT be reached from the build network (the proxy refused
# phaboard.org and every mirror tried), so measure numbers and measure titles are NOT bundled. What is
# here was read in CDC's "HAI/AR and Accreditation Crosswalk Toolkit" (2023 update, which uses Version
# 2022): the 10 domain names and the 20 standard numbers and titles, plus CDC statements on the
# community health assessment, the improvement plan, and the strategic plan. The keyword cues are this
# project's own words (they are not PHAB text). Retrieved 2026-11-12.
# PHAB's standards and measures are PHAB's copyrighted work: this file keeps only domain names,
# standard numbers, and short standard titles, and links to PHAB for the text. Check PHAB's terms.
# Schema: content/schemas/leadership_phab_standards.schema.json
meta:
  id: leadership-phab-standards
  title: PHAB Standards & Measures Version 2022 (structure and keyword cues for the document crosswalk)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: HAI/AR and Accreditation Crosswalk Toolkit (uses the PHAB Version 2022 Standards and Measures)
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/healthcare-associated-infections/media/pdfs/HAI-AR-Accreditation-Crosswalk-508.pdf
  related_sources:
    - title: PHAB Standards & Measures for Initial Accreditation Version 2022 (not reachable from the build network)
      publisher: Public Health Accreditation Board
      url: https://phaboard.org/wp-content/uploads/Standards-Measures-Initial-Accreditation-Version-2022.pdf
    - title: Community Health Assessment, Drivers (CDC Public Health Infrastructure Center)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/infrastructure/public-health-systems-emerging-practices/drivers.html
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The 10 domains and 20 standards (numbers and titles) were read in CDC's 2023 crosswalk toolkit
    (medium confidence: a secondary source for PHAB's wording, which can differ slightly). PHAB's own
    document could not be fetched, so NO measure IDs or measure titles are bundled and nothing about
    the documentation each measure requires is stated; use the PHAB document (and the optional
    measures_path file) for that. The keyword cues, document types, and the match rules are this
    project's drafts (low confidence): a keyword match shows a document mentions a topic, not that it
    meets a PHAB measure.

