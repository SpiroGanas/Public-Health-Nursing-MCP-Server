# Strategic planning scaffolding for build_strategic_plan (LEAD-05): SWOT and SOAR prompts, the
# stakeholder power/interest grid, the plan structure (priorities, goals, objectives, strategies),
# and the link to the community health improvement plan (CHIP).
#
# REVIEW STATUS: pending. PHAB's own Standards & Measures (phaboard.org) could not be reached from
# the build network, so PHAB's requirements for a health department strategic plan are NOT
# verified here: phab_requirements.status is "unverified". What was read: CDC's 2023 crosswalk
# toolkit (Standard 10.1 and Standard 5.2 descriptions), CDC's Drivers page, and a 2025 open
# access study of strategic plans, community health improvement plans, and quality improvement
# plans from PHAB-accredited local health departments. The SWOT, SOAR, and stakeholder-grid
# prompts, the plan outline, and the checks are this project's drafts built on those readings and
# on two published method papers; each says how well it is supported. The tool writes no facts:
# every priority, goal, objective, and strategy comes from the nurse. Retrieved 2026-11-12.
# Schema: content/schemas/leadership_strategic_planning.schema.json
meta:
  id: leadership-strategic-planning
  title: Strategic planning scaffolding (SWOT or SOAR, stakeholder grid, plan structure, CHIP link)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: HAI/AR and Accreditation Crosswalk Toolkit (Standards 10.1 and 5.2 in PHAB Version 2022)
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/healthcare-associated-infections/media/pdfs/HAI-AR-Accreditation-Crosswalk-508.pdf
  related_sources:
    - title: Strategic and Performance Planning in US Local Health Departments (J Public Health Manag Pract, 2025)
      publisher: Journal of Public Health Management and Practice
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12527733/
    - title: Stakeholder analysis, a review (Health Policy and Planning, 2000)
      publisher: Health Policy and Planning (Oxford University Press)
      url: https://pubmed.ncbi.nlm.nih.gov/11012397/
    - title: SOARing Into Strategic Planning, Engaging Nurses to Achieve Significant Outcomes (Nursing Administration Quarterly, 2016)
      publisher: Nursing Administration Quarterly
      url: https://pubmed.ncbi.nlm.nih.gov/27584888/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    PHAB's requirements for a health department strategic plan could not be verified (phaboard.org
    was not reachable); only CDC's one-sentence description of Standard 10.1 and a 2025 study of
    what accredited departments' plans contain were read. The SWOT, SOAR, and stakeholder prompts,
    the plan outline, and the draft checks are this project's drafts (medium or low confidence).
    Check the plan against PHAB's Version 2022 measures for Standard 10.1 and Standard 5.2 before
    you call it "PHAB-ready".

