suffolk_county_note: >-
  Evacuation Day (March 17) and Bunker Hill Day (June 17) are legal holidays with respect to Suffolk
  county only (Boston, Chelsea, Revere, Winthrop). The statute also says state and municipal offices in
  Suffolk county stay open on those days. Whether a Suffolk board of health counts them in the
  48-hour notice period is for its town counsel; the tool excludes them when you say the board is in Suffolk county.

