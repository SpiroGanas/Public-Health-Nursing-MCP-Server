# Massachusetts Open Meeting Law (M.G.L. c. 30A, sections 18 to 25; 940 CMR 29.00) as it applies to a
# local board of health, for board_of_health_meeting_assistant (LEAD-07): the notice rule, notice
# contents, executive session purposes and steps, minutes contents and approval, and the Attorney
# General's checklists. Short paraphrases only (the statute and the regulation control).
#
# REVIEW STATUS: pending. Read in full on 2026-11-12: c. 30A sections 18 to 25 (malegislature.gov),
# 940 CMR 29.00 (mass.gov PDF), the Attorney General's Open Meeting Law Guide, and five Division of
# Open Government checklists (notice, minutes, executive session, chair responsibilities; November
# 2024) and the Attorney General's FAQ page. The holiday list is in ma_legal_holidays.yaml.
# Schema: content/schemas/leadership_open_meeting_law.schema.json
