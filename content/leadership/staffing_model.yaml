# Reference content for model_staffing_needs (LEAD-02): the productive-hours defaults, the method,
# and the staffing benchmarks that were looked for and NOT bundled.
#
# REVIEW STATUS: pending. Drafted 2026-11-12.
# Schema: content/schemas/leadership_staffing_model.schema.json
# Every number in productive_hours is a tool default (basis: tool_default), a starting point
# for the nurse's own agency policy, union contract, and time study. Nothing here is a
# published staffing standard, and no staffing benchmark is bundled.
meta:
  id: leadership-staffing-model
  title: Public health nurse staffing model (productive hours, method, benchmarks not bundled)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: 2022-2023 Capacity Assessment Summary Report
    publisher: Massachusetts Department of Public Health, Office of Local and Regional Health
    url: https://www.mass.gov/doc/2022-2023-capacity-assessment-summary-report-0/download
  related_sources:
    - title: SAPHE 2.0 Guidance Document
      publisher: Massachusetts Association of Health Boards
      url: https://www.mass.gov/doc/saphe-20-guidance-document/download
    - title: Public Health Excellence Grant Program
      publisher: Massachusetts Department of Public Health, Office of Local and Regional Health
      url: https://www.mass.gov/info-details/public-health-shared-services
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    No published public health nurse staffing ratio or time standard could be read on 2026-11-12,
    so none is bundled. Read and searched: DPH's 2022-2023 Capacity Assessment (it reports budgets
    and shared staff FTE, not a nurse-to-population ratio), the SAPHE 2.0 guidance (workforce
    standards cover education, training, and credentials, not staffing levels), and DPH's PHE page.
    Blocked on the build network: NACCHO's local public health workforce staffing benchmarks, the
    PHAB workforce calculator, PubMed Central article pages, OPM, and BLS. Every productive-hours
    default is an editable starting value with no source; 2,080 is 40 hours times 52 weeks.

