# Foundational Public Health Services (FPHS) framework, Massachusetts' statute on the State Action for
# Public Health Excellence program (G.L. c. 111, s. 27D), and shared-service options, for
# assess_foundational_public_health_services (LEAD-03). The Performance Standards (mandated local
# responsibilities) and the Workforce Standards are in the snapshot ma-performance-standards; the
# shared service arrangement list is in the snapshot ma-shared-service-arrangements.
#
# REVIEW STATUS: pending. Every FPHS line below is a Headline Responsibility copied from the
# "FPHS Operational Definitions" file that DPH's Office of Local and Regional Health hosts
# (Word file last modified 2024-11-05). The statute text was read in full on malegislature.gov.
# The plan and the request that started this work said the law is "2020" and "2024 SAPHE 2.0":
# mass.gov and the statute say 2020 (see law.naming_check); no "SAPHE 2.0" page was found.
# Retrieved 2026-11-12. Schema: content/schemas/leadership_fphs_framework.schema.json
