law:
  naming_check: >-
    Checked 2026-11-12. The statute is G.L. c. 111, s. 27D, which establishes the "state action for
    public health excellence program". DPH's archived program page says the shared services grant
    program started in January 2020 and was renamed the State Action for Public Health Excellence
    (SAPHE) Grant Program in April 2020 "after the passage of the SAPHE Act". DPH's 2023 press
    release says the Performance Standards were developed under legislation enacted in 2020. So the
    year is 2020, not 2024. The names "SAPHE 2.0" and a "2024 SAPHE law" were not found on any page
    read; DPH now runs the grants as the Public Health Excellence (PHE) Grant Program. Ask DPH's
    Office of Local and Regional Health (LocalRegionalPublicHealth@mass.gov) if you have a source
    that uses "SAPHE 2.0".
  provisions:
    - text: >-
        DPH must run a state action for public health excellence program to give every resident
        uniform access to foundational public health services (which must further equity, including
        for historically underrepresented communities), help boards of health improve efficiency,
        develop standards for foundational public health services statewide, and provide resources.
      source: statute
      section: s. 27D(b)
      confidence: high
    - text: >-
        The standards must include inspections, epidemiology and communicable disease investigation
        and reporting, permitting, and other local responsibilities required by law or by DPH or
        DEP regulations; workforce education, training, and credentialing standards; and standards
        for contributing required data. They must consider applicable national standards.
      source: statute
      section: s. 27D(c)
      confidence: high
    - text: >-
        Subject to appropriation, boards of health must implement and comply with the standards,
        individually or through cross-jurisdictional sharing: comprehensive public health
        districts, formal shared services, or other arrangements.
      source: statute
      section: s. 27D(d)(1)
      confidence: high
    - text: >-
        Each year, not later than August 31, a board of health must report to DPH information
        showing compliance with the standards during the preceding fiscal year.
      source: statute
      section: s. 27D(d)(2)
      confidence: high
    - text: >-
        Subject to appropriation, DPH provides funds for implementation, including competitive
        grants for shared services across at least 2 municipalities and annual noncompetitive
        funding distributed by level of implementation of the standards and a formula using
        population, level of cross-jurisdictional sharing, and sociodemographic data. Grants
        supplement, and do not replace, existing funding.
      source: statute
      section: s. 27D(f)
      confidence: high
    - text: >-
        If DPH or DEP determines that failure to meet the standards in the required timeframe is a
        threat to public health, they notify the board of health in writing and may restrict future
        noncompetitive funding if the response is not sufficient.
      source: statute
      section: s. 27D(k)
      confidence: high
    - text: >-
        DPH and DEP provide core public health training and technical assistance free of charge,
        subject to appropriation, to help staff obtain the credentials and foundational capabilities
        the standards require.
      source: statute
      section: s. 27D(e)
      confidence: high
