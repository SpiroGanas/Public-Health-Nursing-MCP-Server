medicare:
  year: 2026
  effective_date: 2026-01-01
  next_update: CMS usually announces next year's Medicare premiums and deductibles in November.
  parts:
    - {part: "Part A (hospital insurance)", covers: "Inpatient hospital, skilled nursing facility, hospice, inpatient rehabilitation, and some home health care.", source: cms-2026-ab}
    - {part: "Part B (medical insurance)", covers: "Physicians' services, outpatient hospital services, certain home health services, durable medical equipment, and certain other medical and health services.", source: cms-2026-ab}
    - {part: "Medigap (Medicare Supplement Insurance)", covers: "With Original Medicare (Parts A and B), a private Medigap policy covers some costs Medicare does not, such as copayments, coinsurance, and deductibles.", source: ma-what-is-medicare}
    - {part: "Medicare Advantage", covers: "A Medicare-approved plan from a private company that bundles Part A, Part B, and usually Part D into one plan.", source: ma-what-is-medicare}
    - {part: "Part D (prescription drugs)", covers: "Drug coverage from private plans; premiums vary by plan. In 2026 the annual out-of-pocket threshold is $2,100, after which the enrollee pays no cost sharing for covered Part D drugs.", source: cms-2026-partd}
  costs:
    - {item: "Part A premium", amount: "$0 for about 99% of beneficiaries (40 or more quarters of Medicare-covered employment)", source: cms-2026-ab}
    - {item: "Part A premium, buy-in with 30-39 quarters", amount: "$311 per month", source: cms-2026-ab}
    - {item: "Part A premium, buy-in with fewer than 30 quarters", amount: "$565 per month", source: cms-2026-ab}
    - {item: "Part A inpatient hospital deductible (per benefit period)", amount: "$1,736", source: cms-2026-ab}
    - {item: "Part A hospital coinsurance, days 61-90", amount: "$434 per day", source: cms-2026-ab}
    - {item: "Part A lifetime reserve days", amount: "$868 per day", source: cms-2026-ab}
    - {item: "Skilled nursing facility coinsurance, days 21-100", amount: "$217 per day", source: cms-2026-ab}
    - {item: "Part B standard premium", amount: "$202.90 per month", source: cms-2026-ab}
    - {item: "Part B annual deductible", amount: "$283", source: cms-2026-ab}
    - {item: "Part B immunosuppressive drug premium (after kidney transplant coverage ends)", amount: "$121.60 per month", source: cms-2026-ab}
    - {item: "Part D annual out-of-pocket threshold", amount: "$2,100", source: cms-2026-partd}
  irmaa:
    note: "Higher-income beneficiaries (about 8%) pay an income-related monthly adjustment; total monthly Part B premium by modified adjusted gross income:"
    rows:
      - {individual: "$109,000 or less", joint: "$218,000 or less", total_premium: "$202.90"}
      - {individual: "over $109,000 to $137,000", joint: "over $218,000 to $274,000", total_premium: "$284.10"}
      - {individual: "over $137,000 to $171,000", joint: "over $274,000 to $342,000", total_premium: "$405.80"}
      - {individual: "over $171,000 to $205,000", joint: "over $342,000 to $410,000", total_premium: "$527.50"}
      - {individual: "over $205,000 and under $500,000", joint: "over $410,000 and under $750,000", total_premium: "$649.20"}
      - {individual: "$500,000 or more", joint: "$750,000 or more", total_premium: "$689.90"}
    source: cms-2026-ab

