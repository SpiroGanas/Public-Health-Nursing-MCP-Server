programs:
  - id: msp
    name: Medicare Savings Programs (MSPs; formerly MassHealth Buy-In)
    who: Massachusetts residents with Medicare and household income at or below 225% of the federal poverty level. You do not need to be on MassHealth to apply.
    benefits:
      - "QMB (income at or below 190% FPL): MassHealth pays the Part A premium (if any) and the Part B premium, and Medicare copays and deductibles (providers, including Medicare Advantage providers, cannot bill you for them; pharmacy copays may still apply); Health Safety Net coverage at acute care hospitals and community health centers; automatic Medicare Part D Extra Help."
      - "SLMB/QI (income above 190% up to 225% FPL): MassHealth pays the Part B premium; Health Safety Net; automatic Part D Extra Help."
    assets: "No asset limit since March 1, 2024."
    apply: "Apply by mail or online with the Medicare Savings Programs application (English, Chinese, Haitian Creole, Portuguese, Spanish, Vietnamese). MassHealth Customer Service (800) 841-2900, TDD/TTY 711; or a SHINE counselor through MassOptions (800) 243-4636."
    source: ma-msp
    section: "Do I qualify? Types of MSPs; How to apply"
  - id: masshealth_65
    name: MassHealth for people 65 and older living in the community
    who: "People with Medicare and household income at or below 225% FPL may qualify for both an MSP and MassHealth; certain MassHealth benefits also require countable assets at or below $2,000 (single) or $3,000 (married couple)."
    benefits:
      - "MassHealth Standard provides a full range of benefits (inpatient and outpatient hospital, physicians, clinics, dental, vision, and more)."
      - "Long-term care figures (2026): personal needs allowance $72.80; community spouse resource standard $32,532 to $162,660; maximum home equity $1,130,000; maximum monthly maintenance needs allowance $4,066.50."
    assets: "$2,000 (individual) or $3,000 (member of a married couple) for certain MassHealth benefits; the MSP itself has no asset limit."
    apply: "MassHealth Customer Service (800) 841-2900, TDD/TTY 711."
    source: ma-financial
    section: "Eligibility Figures for Community Residents Age 65 or Older; Residents of a Long-Term-Care Facility"
  - id: few
    name: Frail Elder Waiver (FEW)
    who: "Age 65+, or 60-64 with a disability; meets clinical eligibility (nursing facility level of care); needs at least one FEW service a month; lives in a community setting (own or a family member's home, or congregate housing; not assisted living, group homes, or rest homes); can be served safely in the community; meets MassHealth Standard financial requirements for the community (special rules apply); not in another HCBS waiver, One Care, or PACE."
    benefits:
      - "A case manager and a comprehensive service plan; services such as homemaker, personal care, home health aide, home-delivered meals, chore, companion, dementia coaching, assisted transportation, personal emergency response systems, home safety evaluations, and medication delivery."
    assets: "MassHealth Standard community rules, with special financial rules for waiver applicants."
    apply: "Apply at any time; contact the local ASAP or MassOptions (800) 243-4636."
    source: ma-few
    section: "Eligibility Criteria; Services Offered"
  - id: pace
    name: Program of All-inclusive Care for the Elderly (PACE)
    who: "Age 55+ (55-64 needs a disability determination); certified by the state as eligible for nursing home care; meets MassHealth Standard citizenship and residency rules; lives in a PACE organization's service area; can live safely in the community; agrees to get health services only through the PACE organization."
    benefits:
      - "Medicare and MassHealth together provide a wide range of medical, social, recreational, and wellness services. You do not need MassHealth to enroll; private pay and Medicare-only options exist."
    assets: "For MassHealth to pay the PACE premium: countable income at or below 300% of the federal benefit rate ($2,982 a month in 2026) and countable assets at or below $2,000 (single); a spouse's income is not counted against the limit."
    apply: "Contact a PACE organization serving your county."
    source: ma-pace
    section: "Who is eligible for PACE?"
  - id: sco
    name: Senior Care Options (SCO)
    who: "Age 65+; enrolled in Medicare Parts A and B (required for everyone from January 1, 2026); qualifies for Part D; has MassHealth Standard; lives at home or in a long-term care facility (not an inpatient of a chronic or rehabilitation hospital or living in an ICF/IID); not in a six-month MassHealth deductible period; lives in a SCO plan's area."
    benefits:
      - "One plan, one card, and one care team combining MassHealth and Medicare, with a care coordinator; generally no or low premiums and no copays; covers medical, mental health, prescriptions, and geriatric support services."
    assets: "MassHealth Standard rules."
    apply: "Find a SCO plan in your area (mass.gov); MassHealth (800) 841-2900."
    source: ma-sco
    section: "You can get SCO if you"
  - id: one_care
    name: One Care
    who: "Age 21-64 with a disability; Medicare Parts A and B; qualifies for Part D; MassHealth Standard or CommonHealth; no private health insurance; not in a Home and Community Based Services waiver; lives in a One Care plan's area."
    benefits:
      - "One plan, one card, and one care team combining MassHealth and Medicare."
    assets: "MassHealth Standard or CommonHealth rules."
    apply: "MassHealth (800) 841-2900, TDD/TTY 711."
    source: ma-onecare
    section: "You can get One Care if you"

