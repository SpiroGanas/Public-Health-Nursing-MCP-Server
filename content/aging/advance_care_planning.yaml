facilitator_script:
  confidence: medium
  note: Drafted for this server from the statute; adapt it to your audience and agency policy.
  segments:
    - {title: Welcome and ground rules, minutes: 5, script: "Introduce yourself and the purpose: planning ahead so the people you trust can speak for you. Everyone takes part at their own pace; no one has to share personal details. This is information, not legal or medical advice."}
    - {title: Why plan ahead, minutes: 10, script: "Ask: what would you want your family to know if you could not speak for yourself? Explain that a health care proxy names the person who decides only if a doctor finds you cannot decide or communicate, and that you stay in charge whenever you can."}
    - {title: Choosing a health care agent, minutes: 10, script: "Discuss who makes a good agent: someone 18 or older who knows your values, can be reached, and will honor your wishes even under pressure. Name an alternate. Staff of a facility where you live cannot be your agent unless related to you."}
    - {title: Completing the health care proxy, minutes: 15, script: "Walk through the form: your name, your agent and alternate, any limits. Sign in front of two adult witnesses; your agent cannot be a witness. Witnesses confirm you appeared to be 18 or older, of sound mind, and not under pressure."}
    - {title: Talking with your agent and family, minutes: 10, script: "Use a conversation starter (for example The Conversation Project's guides): what matters most, what worries you, what treatments you would or would not want. Encourage writing notes to share with the agent."}
    - {title: Serious illness and medical orders, minutes: 5, script: "For people with serious illness, clinicians can complete medical orders (MOLST) with them; ask your clinician. A health care proxy is for everyone 18 and older."}
    - {title: Next steps and questions, minutes: 5, script: "Give copies to your agent and clinicians, keep the original safe, review it when things change, and revoke it any time by telling your agent or provider. Offer one-to-one help and interpreters."}

handout_points:
  - A health care proxy names one person (and an alternate) to make health care decisions for you only if your doctor finds you cannot make or communicate them.
  - Sign it in front of two adult witnesses; the person you name cannot be a witness.
  - You stay in charge whenever you can decide; if you object to your agent's decision, your decision counts unless a court says otherwise.
  - Give copies to your agent, your clinicians, and your hospital; you can change or cancel it at any time.
