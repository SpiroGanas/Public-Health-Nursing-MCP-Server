proxy_rules:
  - {text: "Every competent adult has the right to appoint a health care agent by signing a health care proxy. Every adult is presumed competent.", source: mgl-201d-2, section: "s.2"}
  - {text: "The proxy must be in writing and signed by the adult (or at their direction) in the presence of two other adults who sign as witnesses and affirm in writing that the principal appeared to be at least 18, of sound mind, and under no constraint or undue influence.", source: mgl-201d-2, section: "s.2"}
  - {text: "The person named as agent may not be a witness.", source: mgl-201d-2, section: "s.2"}
  - {text: "An alternate agent may be named, to serve when the agent is not available, willing, or competent to make a timely decision, or is disqualified.", source: mgl-201d-2, section: "s.2"}
  - {text: "An operator, administrator, or employee of a facility cannot be the agent of a patient or resident of that facility (or an applicant) unless related by blood, marriage, or adoption.", source: mgl-201d-3, section: "s.3"}
  - {text: "The agent's authority begins only after the attending physician determines in writing, in the medical record, that the principal lacks capacity to make or communicate health care decisions; the principal and agent are told orally and in writing. If the principal regains capacity, the agent's authority stops.", source: mgl-201d-6, section: "s.6"}
  - {text: "If the principal objects to an agent's decision, the principal's decision prevails unless a court has found that the principal lacks capacity.", source: mgl-201d-6, section: "s.6"}
  - {text: "The agent may make any health care decision the principal could make, including about life-sustaining treatment, subject to limits written in the proxy; the agent decides by the principal's wishes (including religious and moral beliefs) or, if those are unknown, the principal's best interests, and may see the principal's medical information.", source: mgl-201d-5, section: "s.5"}
  - {text: "A physician given a proxy must put it (or a copy) in the medical record; providers follow the agent's decisions as if the principal made them.", source: mgl-201d-5, section: "s.5"}
  - {text: "The principal may revoke the proxy by telling the agent or a provider, orally or in writing, or by any act showing intent to revoke. A later proxy revokes an earlier one, and divorce or legal separation revokes a spouse's appointment as agent. Nursing staff told of a revocation must notify the attending physician immediately.", source: mgl-201d-7, section: "s.7"}
  - {text: "Providers who carry out an agent's decision in good faith, and agents who decide in good faith, are not liable.", source: mgl-201d-8, section: "s.8"}
  - {text: "A physician or a private religious facility may decline an agent's decision that conflicts with their moral or religious views (or the facility's stated policy), but must arrange transfer or seek a court's help.", source: mgl-201d-14, section: "ss.14-15"}
  - {text: "Not appointing an agent creates no presumption about a person's wishes; without a proxy, providers may rely on the informed consent of responsible parties as the law allows.", source: mgl-201d-16, section: "s.16"}
  - {text: "Providers, guardians, family, close friends, or the Commissioner of Public Health may ask a court to decide disputes, such as the proxy's validity or removing an agent acting in bad faith.", source: mgl-201d-17, section: "s.17"}

proxy_template:
  title: Health Care Proxy (Massachusetts General Laws chapter 201D)
  confidence: medium
  sections:
    - heading: Principal
      fields: ["Principal Name", "Principal Address"]
      text: "I, {{Principal Name}}, of {{Principal Address}}, appoint the health care agent named below to make health care decisions for me if my attending physician determines that I lack the capacity to make or communicate health care decisions."
    - heading: Health care agent
      fields: ["Agent Name", "Agent Address", "Agent Phone"]
      text: "Agent: {{Agent Name}}, {{Agent Address}}, telephone {{Agent Phone}}."
    - heading: Alternate agent (optional)
      fields: ["Alternate Name", "Alternate Address", "Alternate Phone"]
      text: "If my agent is not available, willing, or competent to act, I appoint {{Alternate Name}}, {{Alternate Address}}, telephone {{Alternate Phone}}."
    - heading: Limitations (optional)
      fields: ["Limitations"]
      text: "My agent has authority to make all health care decisions for me, including decisions about life-sustaining treatment, except: {{Limitations}}"
    - heading: Signature
      fields: ["Signature Date"]
      text: "Signed by me (or at my direction) in the presence of two adult witnesses on {{Signature Date}}. Signature: ____________________"
    - heading: Witnesses
      fields: ["Witness 1 Name", "Witness 2 Name"]
      text: "We, the undersigned, each witnessed the signing of this health care proxy by the principal or at the direction of the principal and state that the principal appeared to be at least 18 years of age, of sound mind, and under no constraint or undue influence. Neither of us is named as the health care agent or alternate. Witness 1: {{Witness 1 Name}} ____________________  Witness 2: {{Witness 2 Name}} ____________________"
  source: mgl-201d-2
  section: "s.2"

after_signing:
  - Give copies to the agent and alternate, to your primary care clinician, and to any hospital or facility where you get care; ask that it be put in your medical record.
  - Keep the original where it can be found; tell family who your agent is and what matters most to you.
  - Review it when your health, relationships, or wishes change; a new proxy revokes the old one.

molst:
  status: not_verified
  confidence: low
  text: >-
    MOLST (Medical Orders for Life-Sustaining Treatment) is the Massachusetts medical order form
    for people with serious illness, completed with a clinician; unlike a health care proxy it is
    a set of current medical orders. The program's former web domain (molst-ma.org) served
    unrelated content when checked on 2026-11-09, and no official mass.gov MOLST page
    could be found, so this description and the form's current rules are NOT verified. Get the
    current MOLST form and training from your health system or DPH, and do not use the old domain.
  warning: Do not link to or download from molst-ma.org; the domain no longer belongs to the MOLST program.

