programs:
  - id: asap
    category: home_care
    name: Aging Services Access Points (ASAPs)
    text: >-
      23 ASAPs contracted with AGE serve adults 60 and older and their caregivers: home care,
      senior nutrition, Options Counseling, the Family Caregiver Support Program, the Community
      Transition Liaison Program (adults 22+ moving from a nursing facility back to the community),
      supportive and congregate housing, and Information and Resources. 18 ASAPs are also
      protective services agencies; protective services areas may differ from the ASAP areas.
    source: age-asap
    section: "What is an Aging Services Access Point?"
  - id: coa
    category: community
    name: Councils on Aging and senior centers
    text: >-
      350 Councils on Aging are municipal agencies that run local senior centers. Services vary by
      town and may include outreach, transportation, meals, health screenings, health insurance
      counseling, social activities, fitness and wellness, and lifelong learning.
    source: age-coa
    section: "What is a Council on Aging?"
  - id: home_care
    category: home_care
    name: Home Care Program (through the ASAP)
    text: >-
      Care management and in-home and community supports for adults 60+, people with disabilities,
      and people under 60 with early-onset Alzheimer's disease or a related dementia. Services are
      based on assessed need, and cost depends on income; they include homemaker and personal
      care, home-delivered meals, adult day health, dementia day care and coaching, chore,
      companion, medication dispensing, money management, and home safety evaluations, among
      others. The Frail Elder Waiver is part of home care.
    source: age-home-care
    section: "About the Home Care Program; services"
  - id: meals
    category: meals
    name: Senior Nutrition Program (home-delivered and community meals)
    text: >-
      Home-delivered meals for older adults who are frail, isolated, or homebound (being homebound
      is not required); each delivery is also a daily safety check, emergency meals are provided
      for storms, and medically tailored and texture-modified meals are available. Community meals
      are served at more than 325 sites. Some areas offer culturally specific meals (for example
      Caribbean, Chinese, Haitian, Indian, Italian, kosher, Latino, Portuguese, Russian, Southern,
      or vegetarian).
    source: age-nutrition
    section: "About the Senior Nutrition Program; Home-Delivered Meals"
  - id: caregiver
    category: caregiver
    name: Family Caregiver Support Program
    text: >-
      Free Caregiver Specialists who refer, counsel, train, run support groups, and arrange
      respite. Eligible: unpaid caregivers 18+ caring for someone 60+ or anyone living with
      Alzheimer's disease or a related dementia; also grandparents and relatives 55+ caring for a
      child under 18 or an adult 18-59 with a disability. Call MassOptions to reach a Caregiver
      Specialist; fact sheets are available in Arabic, Chinese, Haitian Creole, Khmer, Portuguese,
      Russian, and other languages.
    source: age-caregiver
    section: "About; Eligibility and Cost; Contact"
  - id: options
    category: information
    name: Options Counseling
    text: >-
      Free, unbiased counseling for adults 60+, adults with a disability, and their families on
      long-term services, transportation, and where to live (home, with family, assisted living, or
      a nursing home). Call MassOptions.
    source: age-options
    section: "About; Eligibility and Cost"
  - id: shine
    category: insurance
    name: SHINE (Serving the Health Insurance Needs of Everyone on Medicare)
    text: >-
      Free health insurance information, counseling, and help for Massachusetts residents eligible
      for Medicare and their caregivers, from certified counselors (the federal SHIP program).
      Use explain_older_adult_coverage_options for the plans and costs.
    source: age-shine-program
    section: SHINE Program
  - id: dementia
    category: dementia
    name: Dementia supports
    text: >-
      AGE's dementia resource page lists statewide help: the Alzheimer's Association 24/7 Helpline,
      and MassOptions for referral to local services. Home care, Alzheimer's/dementia coaching,
      dementia day care, and the Family Caregiver Support Program also serve people living with
      dementia and their caregivers.
    source: age-dementia
    section: "Call for Immediate Help"
  - id: ombudsman
    category: long_term_care
    name: Long-Term Care Ombudsman
    text: >-
      Certified ombudsmen visit nursing homes, rest homes, and assisted living residences, mediate,
      and investigate complaints on behalf of residents; free for residents.
    source: age-ombudsman
    section: About

coa_lookup:
  text: >-
    Each city and town has a Council on Aging. AGE's map of Councils on Aging, and MassOptions at
    (800) 243-4636, give the contact for a town; the town hall can also connect you.
  map_url: https://experience.arcgis.com/experience/06e961a605cf4ee3bfd8c01b6516ef7d/page/Councils-on-Aging/
  source: age-coa
  section: "Find Your Local Council on Aging"
