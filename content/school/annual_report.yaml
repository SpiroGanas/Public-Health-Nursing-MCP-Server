      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/2012-program-update-essential-school-health-services/download
    - title: BMI Screening Guidelines for Schools (2014)
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/bmi-screening-guidelines-for-schools/download
    - title: "105 CMR 201.000: Head Injuries and Concussions in Extracurricular Athletic Activities"
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/105-cmr-201-head-injuries-and-concussions-in-extracurricular-activities/download
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    DPH lists its school health data collection tools publicly (which schools submit which
    report) but does not publish the current Status Report or Monthly Activities Report forms;
    schools request access from the School Health Services epidemiologist. The report layout in
    this file is therefore built from what DPH publishes: the data categories and definitions in
    DPH's Essential School Health Services reports (2006-2012; the 2012 Program Update is used),
    the BMI, SBIRT, and concussion reporting requirements in regulation and statute, and DPH's
    BMI reporting memo (2019). Field names in the tool's workbook are descriptive, not DPH's own;
    match them to DPH's current forms before submitting (medium confidence overall). The subject
    matter expert should obtain the current Status Report form from DPH and review this mapping.

