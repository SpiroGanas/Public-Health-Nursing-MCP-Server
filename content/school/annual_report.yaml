reports:
  - id: status_report
    name: Status Report (year-end)
    who_submits: >-
      Districts and non-public schools funded through DPH's Comprehensive School Health Services
      (CSHS) program
    due: Year end; date set by DPH (ask the School Health Services epidemiologist)
    content:
      - Screenings by type (vision, hearing, postural, BMI) with the number screened, referred, and completed referrals
      - BMI aggregate data (included here, not as a separate submission, for CSHS-funded districts)
      - SBIRT data (included here for CSHS-funded districts)
      - Student characteristics, staffing, and program data as DPH's form requires
    source: dph-data-tools
    section: "Type of report: Status Report"
    confidence: medium
  - id: monthly_activities
    name: Monthly Activities Report
    who_submits: CSHS-funded districts and non-public schools
    due: Monthly during the school year
    content:
      - Student health encounters (any contact in which the nurse gave counseling, treatment, or aid; mandated screenings are not encounters)
      - Disposition after assessment (returned to class, dismissed, other such as stayed in the health office or sent to the counselor)
      - Early dismissals due to illness or injury, and injury reports
      - Referrals for emergency services (medical 911 calls, behavioral health 911 calls, other emergency referrals)
      - Diagnosed or suspected head injuries
      - Medication doses (scheduled, PRN by prescription, PRN by protocol) and prescriptions on file
    source: eshs-2012
    section: "School Health Services Activity, categories 1-3; Tables 5-10"
    confidence: medium
  - id: bmi_report
    name: BMI Report
    who_submits: All public school districts with grades 1, 4, 7, or 10 (CSHS-funded districts include it in the Status Report)
    due: July 15 after the school year ends (online only)
    content:
      - Aggregate counts by grade, gender, and BMI category (underweight, healthy weight, overweight, obese)
      - Number of students measured and enrolled in each grade
    source: cmr200
    section: "200.500(C)"
    confidence: high
  - id: sbirt_report
    name: SBIRT report
    who_submits: All public school districts with a middle or high school (CSHS-funded districts include it in the Status Report)
    due: Within 90 days after completing the screening
    content:
      - De-identified screening results through DPH's data eCollection tool
      - Students enrolled in the grade, parent or guardian opt-outs, and student opt-outs
      - Referrals by type, with no identifying information
    source: mgl-c71-s97
    section: "(a)"
    confidence: high
  - id: concussion_year_end
    name: Head injury year-end report (105 CMR 201.017)
    who_submits: Public middle and high schools and MIAA schools with extracurricular athletics
    due: For 2025-2026, August 14, 2026 (online only; DPH sets the date each year)
    content:
      - Total number of Report of a Head Injury During Sports Season forms (or school equivalents) received
      - Total number of students with head injuries or suspected concussions during extracurricular athletic activities
    source: cmr201
    section: "201.017"
    confidence: high
  - id: epinephrine_report
    name: Epinephrine Administration Report
    who_submits: Any school in which epinephrine was given to a student or staff member
    due: Each time epinephrine is given
    content:
      - One report per administration (online form)
    source: cmr210
    section: "210.010(A)(7)(j)"
    confidence: high
  - id: opioid_antagonist_report
    name: Opioid Antagonist Report
    who_submits: Any school in which an opioid antagonist (naloxone) was given
    due: Each time an opioid antagonist is given during regular school activities
    content:
      - One report per administration (online form)
    source: cmr210
    section: "210.011(A)(5)(b)"
    confidence: high
  - id: medication_error_report
    name: Medication Error Report
    who_submits: Any school in which a medication error occurred
    due: As DPH instructs; errors needing medical care or ongoing assessment are reported
    content:
      - One report per error (online form)
    source: cmr210
    section: "210.009(B)"
    confidence: high
  - id: postural_final_report
    name: Postural Screening Final Report
    who_submits: Each school system (per DPH's postural training material)
    due: July 15 (per the training material; confirm with DPH that it is still collected)
    content:
      - "By grade 5-9 and sex: enrollment, screened, rescreened, under nurse observation, referred to a physician, and outcomes"
    source: dph-postural
    section: "4.5 Record keeping and final report"
    confidence: low

definitions:
  - text: >-
      An encounter is any contact with a student in which the school nurse provided counseling,
      treatment, or aid of any kind; casual conversations and mandated screenings are not
      encounters.
    source: eshs-2012
    section: "1. Health Encounters"
  - text: >-
      The returned-to-class rate is the share of illness or injury assessments after which the
      student returned to class (93.1 percent in ESHS districts in 2011-2012); dismissals and
      "other" (stayed in the health office, referred to the counselor) make up the rest.
    source: eshs-2012
    section: "Table 6. Disposition After Illness/Injury Assessment"
  - text: >-
      A completed referral is one in which an appointment for follow-up care has been made and
      kept.
    source: eshs-2012
    section: "Tables 11a-11b"
  - text: >-
      Health maintenance encounters include illness assessment, acute illness, chronic condition
      care, scheduled medications and procedures, and individual health education; mental and
      behavioral health support encounters are those whose primary reason is a mental or
      behavioral health need.
    source: eshs-2012
    section: "1. Health Encounters; Table 5"

format_note:
  text: >-
    DPH does not publish the current Status Report or Monthly Activities Report forms; schools
    request access from the School Health Services epidemiologist. The workbook this tool writes
    follows the categories DPH has published and must be matched to DPH's current forms before
    submission.
  source: dph-data-tools
  section: "page introduction"
  confidence: high

