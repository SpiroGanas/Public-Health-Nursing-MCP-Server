  - grade: "10"
    height_in: [57, 74]
    weight_lb: [74, 275]
    source: dph-bmi-guidelines
    section: "VIII"

statewide_reference:
  - text: >-
      2011-2012 ESHS districts: 93.1 percent of students returned to class after assessment, 5.1
      percent were dismissed, 1.8 percent other; dismissals were 93.2 percent for illness and 6.8
      percent for injury.
    source: eshs-2012
    section: "Table 6; Figure 1"
  - text: >-
      2011-2012 ESHS districts: vision referrals 11.6 percent of those screened (51.1 percent of
      referrals completed); hearing 2.4 percent (34.5 percent completed); postural 3.3 percent
      (34.4 percent completed); BMI 20.7 percent referred (13.3 percent completed).
    source: eshs-2012
    section: "Table 11a"
