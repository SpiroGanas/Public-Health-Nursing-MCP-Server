# Massachusetts school health year-end data reporting: which DPH reports exist, who submits
# them, when, and what they contain, for build_school_health_annual_report (SCH-07).
#
# REVIEW STATUS: pending. Drafted on 2026-11-08 from DPH School Health Services pages and
# reports, 105 CMR 200.000 and 201.000, and M.G.L. c. 71, section 97, fetched that day.
# Schema: content/schemas/school_annual_report.schema.json
