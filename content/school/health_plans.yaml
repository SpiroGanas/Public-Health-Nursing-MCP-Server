# Individualized health plans (IHPs) and emergency action plans for students with diabetes,
# asthma, seizures, and food allergy/anaphylaxis, for build_individualized_health_plan (SCH-04).
#
# REVIEW STATUS: pending. Drafted on 2026-11-08 from CDC school health and clinical pages,
# CDC's Voluntary Guidelines for Managing Food Allergies, 105 CMR 210.000, M.G.L. c. 71,
# section 54B, and DPH's Comprehensive School Health Manual, all fetched that day.
# Goals and interventions are a nursing template built from those sources; they are not
# orders. Schema: content/schemas/school_health_plans.schema.json
meta:
  id: ma-school-health-plans
  title: Individualized health plans and emergency action plans for students (diabetes, asthma, seizures, food allergy)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: null
  source:
    title: "Voluntary Guidelines for Managing Food Allergies in Schools and Early Care and Education Programs (2013)"
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/school-health-conditions/media/pdfs/20_316712-A_FA_guide_508tag.pdf
  related_sources:
    - title: Managing Diabetes in Schools; Managing Asthma in Schools; Managing Epilepsy in Schools
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/school-health-conditions/chronic/diabetes.html
    - title: "105 CMR 210.000: The Administration of Medications in Public and Non-public Schools"
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/105-cmr-210-the-administration-of-medications-in-public-and-non-public-schools/download
    - title: Massachusetts Comprehensive School Health Manual (2007), Chapter 7
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/comprehensive-school-health-manual/download
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Recognition and emergency steps are transcribed from CDC pages (hypoglycemia and its
    treatment, May 2024; asthma action plan zones, reviewed August 2026; seizure first aid, May
    2024; epilepsy, diabetes, and asthma in schools, July-August 2024) and CDC's 2013 food allergy
    guidelines (high confidence). Medication and plan requirements come from 105 CMR 210.000
    (12/5/2025) and M.G.L. c. 71, section 54B (high). The IHP process follows DPH's 2007 manual
    (medium: older document). Nursing goals, interventions, and suggested Section 504
    accommodations are the developer's organization of those cited statements into a nursing
    plan template (medium); the nurse sets the actual goals, and the Section 504 team decides
    eligibility and accommodations. CDC's two hypoglycemia pages give the severe low threshold as
    below 54 mg/dL and below 55 mg/dL respectively; the student's provider orders govern. NIDDK's
    "Helping the Student with Diabetes Succeed", the Epilepsy Foundation's seizure action plan,
    and AAAAI/FARE emergency care plan forms could not be fetched and are cited by name only.
    The subject matter expert must review before Pilot 2.

