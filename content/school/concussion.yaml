# Head injuries and concussions in Massachusetts schools: 105 CMR 201.000 requirements, DPH
# return-to-learn guidance and forms, and CDC HEADS UP steps, for
# concussion_return_to_learn_tracker (SCH-05).
#
# REVIEW STATUS: pending. Drafted on 2026-11-08 from the sources below, fetched that day.
# Schema: content/schemas/school_concussion.schema.json
meta:
  id: ma-school-concussion
  title: Head injuries and concussions in Massachusetts schools (105 CMR 201.000, DPH and CDC guidance)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: 2014-08-01
  source:
    title: "105 CMR 201.000: Head Injuries and Concussions in Extracurricular Athletic Activities (MA Reg. #1266, dated 8-1-14)"
    publisher: Massachusetts Department of Public Health
    url: https://www.mass.gov/doc/105-cmr-201-head-injuries-and-concussions-in-extracurricular-activities/download
  related_sources:
    - title: "Returning to School After Concussion: Guidelines for Massachusetts Schools (June 2018)"
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/returning-to-school-after-concussion/download
    - title: Post Sports-Related Head Injury Medical Clearance and Authorization Form
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/post-sports-related-head-injury-medical-clearance-and-authorization-form/download
    - title: "HEADS UP: Returning to School After a Concussion; Returning to Sports"
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/heads-up/guidelines/returning-to-school.html
    - title: "M.G.L. c. 111, section 222 (Interscholastic athletic head injury safety training program)"
      publisher: Massachusetts Legislature
      url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXVI/Chapter111/Section222
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Regulatory requirements are transcribed from 105 CMR 201.000 (MA Reg. #1266, 8-1-14) and
    M.G.L. c. 111, section 222 (high confidence). Return-to-learn stages, accommodations, and the
    symptom monitoring tool come from DPH's June 2018 guidelines; the gradual return-to-play
    stages and clearance instructions from DPH's current clearance form (Healey administration
    letterhead); CDC steps, danger signs, and return-to-school advice from CDC HEADS UP pages
    updated August-September 2025. DPH's 2018 guidance (rest 2-4 days, most students miss 1 to 4
    days) predates CDC's 2025 advice that most children return within 1 to 2 days; both are shown
    and flagged as a divergence for the nurse's decision. The year-end report deadline (August
    14, 2026) is for the 2025-2026 school year and changes yearly. The subject matter expert must
    review before Pilot 2.

