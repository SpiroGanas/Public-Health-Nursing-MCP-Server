# Massachusetts school health screening requirements by grade: vision, hearing, height/weight
# (BMI), postural, SBIRT verbal substance use screening, the kindergarten vision certificate,
# and physical examinations. Used by get_ma_school_screening_requirements (SCH-01) and
# track_school_screenings (SCH-02).
#
# REVIEW STATUS: pending. Drafted on 2026-11-08 from the regulation, statutes, and DPH protocols
# fetched that day (see sources). See meta.verification_note.
# Schema: content/schemas/school_screening_requirements.schema.json
meta:
  id: ma-school-screening-requirements
  title: Massachusetts school health screening requirements (105 CMR 200.000 and M.G.L. c. 71)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: 2013-11-08
  source:
    title: "105 CMR 200.000: Physical Examination of School Children (dated 11/08/2013 on mass.gov)"
    publisher: Massachusetts Department of Public Health
    url: https://www.mass.gov/doc/105-cmr-200-physical-examination-of-school-children/download
  related_sources:
    - title: "M.G.L. c. 71, section 57 (Physical examination of pupils; eye examination, written report)"
      publisher: Massachusetts Legislature
      url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXII/Chapter71/Section57
    - title: "M.G.L. c. 71, section 97 (Verbal screening tool for substance abuse disorders)"
      publisher: Massachusetts Legislature
      url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXII/Chapter71/Section97
    - title: Updated Massachusetts Vision Screening Protocols (August 23, 2021; updated September 14, 2022)
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/doc/massachusetts-vision-screening-protocol-for-school-districts-0/download
    - title: School health screening (DPH list of protocols and forms)
      publisher: Massachusetts Department of Public Health, School Health Services
      url: https://www.mass.gov/lists/school-health-screening
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Grades, frequencies, ungraded-classroom ages, notification, opt-out, and confidentiality rules
    are transcribed from 105 CMR 200.000 (the mass.gov page dates it 11/08/2013), M.G.L. c. 71,
    sections 57 and 97, and DPH's 2022 vision protocol, all fetched 2026-11-08 (high confidence).
    BMI reporting deadlines and data-quality ranges come from DPH's 2014 BMI Screening
    Guidelines and its February 2019 reporting memo; current reporting links may have changed
    (medium). DPH's current Pure Tone Audiometer Hearing Screening Protocol is hosted on a
    server this build could not reach, so hearing protocol details come from Exhibit 5-3 of the
    2007 Comprehensive School Health Manual and are low to medium confidence: confirm them
    against the current DPH protocol. The 2007 manual's statement that hearing is screened
    annually K-12 is superseded by 105 CMR 200.400(C) and is not used. The postural screening
    final report and its July 15 date come from DPH's postural screening training material
    (revised 1996, reviewed 2019) and may no longer be collected that way (low). The subject
    matter expert must review before Pilot 2.

