      The school nurse may refuse to give any medication that could be harmful, dangerous, or
      inappropriate, notifying the caregiver and prescriber immediately.
    points:
      - text: >-
          The nurse may refuse to give or allow any medication judged potentially harmful,
          dangerous, or inappropriate, and notifies the caregiver and prescriber immediately.
        source: cmr210
        section: "210.005(H)"
      - text: The school nurse must have access to current, peer-reviewed medication references.
        source: cmr210
        section: "210.005(J)"
      - text: >-
          The Commissioner may waive requirements on a finding of undue hardship, no risk to
          health or safety, substantial compliance with compensating measures, and written
