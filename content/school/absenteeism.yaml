# Illness-related school absenteeism: syndrome definitions, when to notify the local board of
# health, and control measures, for monitor_school_absenteeism (SCH-06).
#
# REVIEW STATUS: pending. Drafted on 2026-11-08 from 105 CMR 300.000, DPH's norovirus guidance
# for child care programs and K-12 schools, 606 CMR 7.11, and CDC FluView, fetched that day.
# Schema: content/schemas/school_absenteeism.schema.json
meta:
  id: ma-school-absenteeism
  title: "Illness absenteeism in schools and child care: syndromes and board of health notification"
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: 2022-05-27
  source:
    title: "105 CMR 300.000: Reportable Diseases, Surveillance, and Isolation and Quarantine Requirements (Mass. Register #1470, 5/27/22)"
    publisher: Massachusetts Department of Public Health
    url: https://www.mass.gov/doc/105-cmr-300-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements/download
  related_sources:
    - title: Norovirus information for child care programs and K-12 schools
      publisher: Massachusetts Department of Public Health
      url: https://www.mass.gov/info-details/norovirus-information-for-child-care-programs-and-k-12-schools
    - title: "U.S. Influenza Surveillance: Purpose and Methods (ILINet case definition)"
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/fluview/overview/index.html
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The reporting duty (105 CMR 300.134 and related sections) and the outbreak definition are
    transcribed from the regulation (high confidence). DPH's norovirus page gives the
    gastrointestinal outbreak definition, three worked school and child care examples, and the
    online cluster reporting form (high). The influenza-like illness definition is CDC's ILINet
    definition (high). DPH publishes no numeric absence threshold for notifying the board of
    health: the tool's statistical signals (EARS C1-C3 and a percent-absent check) are screening
    aids that prompt a call, not a DPH rule. The keyword lists that sort absence reasons into
    syndromes are tool defaults for the nurse to review (medium). No DPH page specific to
    respiratory illness clusters in schools was found on 2026-11-08; the general cluster duty of
    105 CMR 300.134 applies. The subject matter expert must review before Pilot 2.

