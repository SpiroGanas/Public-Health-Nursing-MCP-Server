# Public Health Intervention Wheel for classify_intervention_wheel (CORE-02): 17 interventions,
# 5 wedges, and 3 levels of practice, with definitions and this tool's matching cues.
#
# REVIEW STATUS: pending. MDH's own page could not be retrieved; see meta.verification_note.
# Schema: content/schemas/intervention_wheel.schema.json
meta:
  id: public-health-intervention-wheel
  title: Public Health Intervention Wheel (17 interventions, 5 wedges, 3 levels of practice)
  version: 0.1.0
  prepared: '2026-11-08'
  effective_date: '2019'
  source:
    title: Public Health Intervention Wheel
    publisher: Minnesota Department of Health, Center for Public Health Practice
    url: https://www.health.state.mn.us/communities/practice/research/phncouncil/wheel.html
  related_sources:
  - title: 'Keller LO, Strohschein S, Lia-Hoagberg B, Schaffer MA. Population-based public health interventions:
      practice-based and evidence-supported. Part I. Public Health Nurs 2004;21(5):453-68'
    publisher: Public Health Nursing (PubMed 15363026)
    url: https://pubmed.ncbi.nlm.nih.gov/15363026/
  - title: 'Schaffer MA, Strohschein S, Glavin K. Twenty years with the public health intervention wheel:
      Evidence for practice. Public Health Nurs 2022;39(1):195-201'
    publisher: Public Health Nursing (PubMed 34231267)
    url: https://pubmed.ncbi.nlm.nih.gov/34231267/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: Drafted on 2026-11-08. The Minnesota Department of Health Wheel page could not be
    retrieved (HTTP 403 to automated requests; the host is outside the session's web tool), so nothing
    here was checked against MDH's own text. The 17 interventions and 3 levels are confirmed by the PubMed
    abstracts of Keller et al. 2004 and Schaffer et al. 2022. Thirteen definitions are transcribed from
    LeClair et al., J Adv Nurs 2024 (open access, PMC12623680), which quotes Schaffer and Strohschein
    (2019, 2nd ed.) (medium confidence). The definitions of surveillance, screening, delegated functions,
    and consultation, and the three level definitions, are the developer's recollection of MDH's text
    (low confidence). Wedge groupings and colors follow Kovacevic et al., Int J Nurs Stud Adv 2024 (PMC11554674),
    citing Schaffer et al. 2022; that source omits case-finding, which the tool places in the red wedge
    with screening as on MDH's wheel, and another 2026 article assigns colors differently (medium). 'cues'
    are this tool's matching keywords. The subject matter expert must review before use.
