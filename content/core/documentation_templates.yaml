standards:
- text: A nurse licensed by the Board shall make complete, accurate, and legible entries in all records
    required by federal and state laws and regulations and accepted standards of nursing practice. On
    all documentation requiring a nurse's signature, the nurse shall sign his or her name as it appears
    on his or her license.
  source: cmr244
  section: 244 CMR 9.03(44) Documentation
- text: A nurse shall not inappropriately destroy or alter any record related to the practice of nursing
    (late entries are added, dated, and labeled, never overwritten).
  source: cmr244
  section: 244 CMR 9.03(45) Alteration or Destruction of Records
  confidence: medium
- text: A nurse shall safeguard patient information from any person or entity not entitled to it, and
    share appropriate information only as required by law or for the protection of the patient.
  source: cmr244
  section: 244 CMR 9.03(16) Patient Confidential Information
- text: 'Reference standard for home visits (binding on Medicare-certified home health agencies): the
    record includes assessments and clinical notes, all interventions and the patient''s responses, goals
    and progress, and contact information for continuity; entries are legible, clear, complete, and authenticated,
    dated, and timed with signature and title.'
  source: cfr484-110
  section: 42 CFR 484.110(a)-(b)
formats:
- id: soap
  label: SOAP (Subjective, Objective, Assessment, Plan)
  basis: Problem-oriented charting format in common nursing use; structure is a tool default.
  confidence: medium
  sections:
  - id: subjective
    heading: S - Subjective
    aliases:
    - s
    - subjective
    prompt: 'What the client or family reports, in their words where helpful: concerns, symptoms, adherence,
      needs. Note the language used and interpreter.'
  - id: objective
    heading: O - Objective
    aliases:
    - o
    - objective
    prompt: 'What you observed and measured: vital signs, weight, findings, home environment, screening
      results, documents reviewed.'
  - id: assessment
    heading: A - Assessment
    aliases:
    - a
    - assessment
    prompt: 'Your nursing judgment: problems (for example Omaha System problems with modifiers), risks,
      progress toward goals, and Knowledge-Behavior-Status ratings.'
  - id: plan
    heading: P - Plan
    aliases:
    - p
    - plan
    prompt: Interventions done and planned (teaching, treatments, referrals, surveillance), client response,
      follow-up date, and who will do what.
- id: dar
  label: DAR focus charting (Data, Action, Response)
  basis: Focus charting format in common nursing use; structure is a tool default.
  confidence: medium
  sections:
  - id: focus
    heading: Focus
    aliases:
    - focus
    - f
    prompt: The concern, event, or problem this entry addresses (for example 'Medication adherence' or
      'Food insecurity').
  - id: data
    heading: D - Data
    aliases:
    - d
    - data
    prompt: Subjective and objective information about the focus.
  - id: action
    heading: A - Action
    aliases:
    - a
    - action
    - actions
    prompt: 'What you did: teaching (with teach-back), treatments, referrals, coordination, notifications.'
  - id: response
    heading: R - Response
    aliases:
    - r
    - response
    prompt: The client's response to each action and the follow-up plan.
- id: narrative
  label: Narrative note
  basis: Chronological narrative; the prompts keep required elements visible. Structure is a tool default.
  confidence: medium
  sections:
  - id: purpose
    heading: Purpose of contact
    aliases:
    - purpose
    - reason for visit
    - reason
    prompt: Why the contact happened, who was present, consent, and language/interpreter.
  - id: findings
    heading: Findings
    aliases:
    - findings
    - assessment
    - observations
    prompt: What was reported and observed, with measurements.
  - id: interventions
    heading: Interventions and response
    aliases:
    - interventions
    - intervention
    - actions
    - teaching
    prompt: What you did and how the client responded (teach-back, return demonstration, agreement).
  - id: plan
    heading: Plan and follow-up
    aliases:
    - plan
    - follow up
    - follow-up
    - next steps
    prompt: Next contact date, referrals made, notifications, and responsibilities.
visit_types:
- id: home_visit
  label: Home visit
  prompts:
  - Who was present; client's consent to the visit
  - Home environment and safety (Omaha environmental domain)
  - Caregiver and support system
  - Medications reviewed (names only in the local record)
  - Referrals and resources offered
- id: clinic
  label: Clinic visit (immunization, screening, TB testing)
  prompts:
  - Service provided under standing order (name and date of the order)
  - Screening questions and contraindications reviewed
  - Product, lot, site, route, and VIS edition given (vaccines)
  - Observation period and any reaction
  - Results and when to return (for example TST reading in 48-72 hours)
- id: case_investigation
  label: Communicable disease case investigation
  prompts:
  - Case status and the basis (laboratory result, clinical criteria)
  - Onset date, symptoms, and infectious period
  - Exposure settings and contacts elicited (lists kept in local files)
  - Control measures given (isolation, exclusion, prophylaxis) with dates
  - Notifications and reporting (MAVEN, DPH epidemiologist, school or facility)
  - Dates of initial and follow-up interviews
- id: dot_visit
  label: Directly observed therapy (DOT) visit
  prompts:
  - Dose observed (medication, date and time) or missed dose and why
  - Side-effect and symptom questions asked before the dose
  - Next dose date and mode (in person or video)
  - Doses completed to date toward the completion count
