domains:
- id: environmental
  label: Environmental
  definition: Material resources and physical surroundings both inside and outside the living area, neighborhood,
    and broader community.
- id: psychosocial
  label: Psychosocial
  definition: Patterns of behavior, emotion, communication, relationships, and development.
- id: physiological
  label: Physiological
  definition: Functions and processes that maintain life.
- id: health_related_behaviors
  label: Health-related Behaviors
  definition: Patterns of activity that maintain or promote wellness, promote recovery, and decrease the
    risk of disease.
modifiers:
  scope:
  - id: individual
    label: Individual
  - id: family
    label: Family
  - id: community
    label: Community
  type:
  - id: health_promotion
    label: Health promotion
  - id: potential
    label: Potential
  - id: actual
    label: Actual
  note:
    text: 'The third level of the Problem Classification Scheme consists of two sets of problem modifiers:
      health promotion, potential, and actual, as well as individual, family, and community. Signs and
      symptoms describe actual problems; problems are neutral, not negative.'
    source: omaha-pcs
    section: Problem Classification Scheme
