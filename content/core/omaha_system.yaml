rating_scale:
  concepts:
  - id: knowledge
    label: Knowledge
    definition: What the client knows.
    ratings:
    - value: 1
      label: No knowledge
      verified: true
    - value: 2
      label: Minimal knowledge
      verified: true
    - value: 3
      label: Basic knowledge
      verified: true
    - value: 4
      label: Adequate knowledge
      verified: false
    - value: 5
      label: Superior knowledge
      verified: false
  - id: behavior
    label: Behavior
    definition: What the client does.
    ratings:
    - value: 1
      label: Not appropriate behavior
      verified: true
    - value: 2
      label: Rarely appropriate behavior
      verified: true
    - value: 3
      label: Inconsistently appropriate behavior
      verified: true
    - value: 4
      label: Usually appropriate behavior
      verified: false
    - value: 5
      label: Consistently appropriate behavior
      verified: false
  - id: status
    label: Status
    definition: The number and severity of the client's signs and symptoms or predicament.
    ratings:
    - value: 1
      label: Extreme signs/symptoms
      verified: true
    - value: 2
      label: Severe signs/symptoms
      verified: true
    - value: 3
      label: Moderate signs/symptoms
      verified: true
    - value: 4
      label: Minimal signs/symptoms
      verified: false
    - value: 5
      label: No signs/symptoms
      verified: false
  note:
    text: Three five-point, Likert-type scales measure Knowledge, Behavior, and Status for each problem
      at regular or predictable times; suggested times include admission, specific interim points, and
      dismissal.
    source: omaha-prso
    section: Problem Rating Scale for Outcomes
