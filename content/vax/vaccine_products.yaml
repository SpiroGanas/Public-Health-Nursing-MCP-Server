beyond_use:
  definition: >-
    The beyond-use date (BUD) is the last date or time a vaccine can be used after it is moved from
    one storage state to another (e.g., frozen to refrigerated), prepared for administration (e.g.,
    reconstituted), or first punctured (multidose vials). The provider calculates it from the
    manufacturer's guidance; it replaces but never extends the expiration date.
  calculation:
    - Begin counting with day 0, the date the vaccine was transitioned.
    - Calculate the number of days or hours allowed from the manufacturer's guidance.
    - Write the BUD on the label and initial it.
    - Always use the earlier of the BUD and the expiration date.
  examples:
    - Previously frozen lyophilized varicella vaccine may be stored in the refrigerator up to 72 hours before reconstitution (BUD 72 hours).
    - Moderna mResvia may be stored refrigerated up to 90 days or at room temperature up to 24 hours.
    - Varicella-containing vaccines must be given within 30 minutes of reconstitution.
    - MMR vaccines (except MMRV) must be given within 8 hours of reconstitution.
  note: Not all vaccines have a BUD; the package insert or EUA fact sheet says when one applies. Manufacturers may extend expiration dates after the insert is printed (FDA expiration dating extensions or a "Dear Health Care Provider" letter).

storage_classes:
  refrigerated: Store at 2-8 C (36-46 F).
  frozen: Store in a stand-alone freezer at -50 to -15 C (-58 to +5 F).
  frozen_or_refrigerated: Merck MMR may be stored in the freezer or refrigerator; DPH advises the freezer to reduce losses from excursions.

