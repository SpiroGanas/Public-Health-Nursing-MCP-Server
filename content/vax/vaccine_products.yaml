    VIS edition dates were transcribed from CDC's current VIS page (page dated May 29, 2025;
    retrieved 2026-11-07). Licensed or minimum ages come from the source named on each product
    (DPH's 2026-27 COVID-19 recommendations, DPH's 2026-27 influenza and adult RSV tables, and the
