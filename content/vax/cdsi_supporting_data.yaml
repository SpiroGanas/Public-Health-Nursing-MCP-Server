engine_choices:
  - topic: Interval reference dose (CALCDTINT-1)
    choice: Intervals from the previous dose are measured from the most recent earlier dose that was evaluated Valid or Not Valid and was not an inadvertent administration; extraneous and sub-standard doses are skipped.
    confidence: medium
  - topic: Live virus conflict with a dose of another antigen (CALCDTCONFLICT-2)
    choice: An earlier live vaccine of another antigen (for example varicella before MMR) has no evaluation status in the series being evaluated, so the minimum conflict end interval (with the 4-day grace period) applies. An earlier dose of the same antigen that was not valid uses the full conflict end interval.
    confidence: medium
  - topic: Completed-series conditional skips (Table 6-7)
    choice: During evaluation a series in the referenced series group counts as complete only if it was completed before the dose being evaluated; during forecasting, if it was completed on or before the reference date.
    confidence: medium
  - topic: Vaccine-count conditional skips (CONDSKIP-1)
    choice: During evaluation only doses before the dose being evaluated are counted; during forecasting, doses on or before the reference date.
    confidence: medium
  - topic: Equivalent series groups (Table 8-14)
    choice: A series group's equivalents are the groups its own prioritized series lists; the relation is not assumed to be symmetric.
    confidence: medium
  - topic: Forecast finish date (SELECTB-12)
    choice: The earliest date plus the minimum intervals (and minimum ages) of the remaining target doses.
    confidence: medium
  - topic: Trade names and manufacturers (Table 6-26)
    choice: Compared only when both the supporting data and the dose record give one; the tool resolves trade names to CVX codes and does not pass them on.
    confidence: medium
  - topic: Several vaccine group forecasts for one vaccine group
    choice: CDSi can select more than one best series (for example a risk series and the standard series, or the childhood and age-50+ pneumococcal series). The tool lists every forecast; forecasts first due more than a year away are summarized on one line.
    confidence: medium
  - topic: Country of birth (Table 7-3)
    choice: Not assumed. Birth-date evidence of immunity that requires U.S. birth (varicella, before 1980) is applied only when the nurse says the person was born in the United States. The test harness assumes U.S. birth.
    confidence: high

limitations:
  - Seasonal series (influenza, COVID-19, RSV) follow the season dates in Supporting Data 4.65 (the 2025-26 season). After the season's end date they show "not recommended now" until CDC publishes supporting data with new season dates.
  - Dose conditions (expired, sub-potent, recalled) and lot expiration dates are supported by the engine but not yet exposed as tool arguments.
  - Observations are CDSi coded observations (three-digit codes). SNOMED and other codes mapped in the supporting data are not yet accepted.
  - CDSi encodes CDC/ACIP recommendations only. Massachusetts DPH and AAP/ACOG positions issued since 2025 may differ; compare_vaccine_recommendations covers those.
