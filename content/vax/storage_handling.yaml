  verification_note: >-
    Steps are transcribed from the CDC Vaccine Storage and Handling Toolkit (July 2026, page 16)
    and the DPH Vaccine Management SOP 2026 (page 5). Reporting thresholds are transcribed from the
    MA Vaccine Program Guidelines for Reporting Out of Range Temperatures (January 2026). The DPH
