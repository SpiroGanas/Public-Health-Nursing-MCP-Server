# and precautions (VAX-01 get_immunization_schedule; minimum ages and intervals are also used by
# VAX-04 check_ma_school_immunization_requirements).
#
# REVIEW STATUS: pending. See meta.verification_note.
# Schema: content/schemas/vax_schedule.schema.json
