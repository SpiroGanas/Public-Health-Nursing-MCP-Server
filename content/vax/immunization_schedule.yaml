  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Minimum ages and intervals were transcribed from CDC Table 3-2 and contraindications and
    precautions from CDC Table 4-1 (web pages retrieved 2026-11-07). Routine ages for children
    come from the 2026 schedule as published by AAFP (which DPH and AAP describe as the AAP 2026
    schedule; the AAP PDF itself could not be downloaded because downloads.aap.org and
    publications.aap.org were blocked). CDC's own schedule pages still showed the 2025 schedules
    with a July 2, 2025 addendum; the January 5, 2026 CDC change is described in
