    - title: M.G.L. c. 76, section 15 (Vaccination and immunization)
      publisher: Massachusetts Legislature
      url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXII/Chapter76/Section15
    - title: Meningococcal Conjugate Vaccine (MenACWY) Requirement for School Entry (Updated May 2026)
