# Massachusetts school immunization requirements, 2026-2027 school year (VAX-04
# check_ma_school_immunization_requirements).
#
# REVIEW STATUS: pending. Transcribed from DPH's 2026-2027 requirements document and
# 105 CMR 220.000 (both fetched 2026-11-07). See meta.verification_note.
# Schema: content/schemas/vax_school_requirements.schema.json
meta:
  id: ma-school-immunization-requirements
  title: Massachusetts School Immunization Requirements, 2026-2027
  version: 0.1.0
  prepared: 2026-11-07
  effective_date: 2026-02-12
