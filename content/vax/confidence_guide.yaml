mi_principles:
  - Ask open questions and listen before giving information.
  - Reflect what you heard, including the feeling behind it, and affirm the parent's goal of protecting their child.
  - Ask permission before sharing information ("Would it help if I shared what we know?").
  - Offer a small amount of clear information, then check understanding.
  - Summarize, respect autonomy, and agree on a next step (even a partial one); keep the door open.

