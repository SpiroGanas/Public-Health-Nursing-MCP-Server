concerns:
  - id: safety
    title: General vaccine safety
    aliases: [is it safe, side effects, vaccine injury, dangerous, long term effects, safety]
    open_question: What have you heard about vaccine safety that worries you most?
    reflection: >-
      It sounds like you want to be sure anything you give your child is safe. That is exactly what
      a careful parent would want.
    permission: Would it help if I shared how vaccines are checked for safety and what side effects to expect?
    facts:
      - text: >-
          Most side effects are minor, like redness and soreness where the shot was given, muscle
          aches, fever, and tiredness. In rare cases vaccines have caused fainting or allergic
          reactions.
        source: aap_faq
      - text: >-
          Rumors about long-term effects on development are not true. When two things happen around
          the same time, it can look like one caused the other; research does not support these
          claims.
        source: aap_faq
      - text: Vaccines are tested in clinical trials before licensure and are monitored for safety after.
        source: immunize_adjuvants
      - text: >-
          Fainting can happen after shots, mostly in teens. Sitting or lying down during the shot and
          for 15 minutes after helps prevent injury.
        source: cdc_adverse
    next_step: Offer the Vaccine Information Statement for each vaccine and invite questions after the family reads it.
  - id: ingredients
    title: Vaccine ingredients (adjuvants, preservatives, aluminum)
    aliases: [ingredients, aluminum, adjuvant, preservative, thimerosal, toxins, formaldehyde, whats in it]
    open_question: Which ingredients are you wondering about?
    reflection: You want to know exactly what goes into your child's body. That makes sense.
    permission: Can I tell you what those ingredients do and how they are tested?
    facts:
      - text: >-
          Adjuvants are added to some vaccines to help the body build a stronger immune response.
          Other ingredients inactivate viruses or bacteria, preserve the vaccine, or keep it from
          losing strength over time.
        source: immunize_adjuvants
      - text: Adjuvants and other ingredients are tested for safety in clinical trials before a vaccine is licensed in the United States.
        source: immunize_adjuvants
    divergence: >-
      ACIP (June 2025) recommended only single-dose, thimerosal-free influenza vaccines for children,
      pregnant women, and adults; single-dose syringes are widely used for children.
    next_step: Offer the package insert or the Immunize.org ingredients handout for the specific vaccine.
  - id: autism
    title: Vaccines and autism
    aliases: [autism, mmr autism, asd, causes autism, wakefield]
    open_question: What have you heard about vaccines and autism?
    reflection: >-
      You love your child and you want to do everything you can to support their development. It is
      hard when you hear different things from different places.
    permission: May I share what the research shows?
    facts:
      - text: >-
          Studies in many countries, involving thousands of children over several decades, have found
          no credible link between childhood vaccines and autism.
        source: aap_autism
      - text: >-
          The original report claiming the MMR vaccine causes autism was retracted because of
          fraudulent data, and its author lost his license to practice medicine.
        source: aap_autism
      - text: >-
          Autism is often first noticed between 12 and 24 months, the same age many vaccines are
          given, which can give a false impression of a link.
        source: aap_autism
      - text: Many scientific studies have tested the MMR, thimerosal, and "too many vaccines" claims; none has shown any correlation between vaccines and autism.
        source: immunize_autism
    divergence: >-
      CDC's "Autism and Vaccines" page (dated July 22, 2026) now says the claim "vaccines do not cause
      autism" is "not an evidence-based claim" and describes an HHS assessment of autism causes. AAP
      and Immunize.org continue to state that research shows no link. Families may have seen the CDC
      page; acknowledge it calmly and explain what the body of research shows.
    next_step: Offer to talk about autism screening and early support, which help children most when started early.
  - id: too_many_too_soon
    title: Too many vaccines too soon, or spacing them out
    aliases: [too many shots, too soon, overwhelm immune system, spread out, alternative schedule, delay, one at a time]
    open_question: What worries you about the number of shots?
    reflection: Seeing several shots at one visit can feel like a lot for a small baby.
    permission: Would it help to hear how the schedule was designed?
    facts:
      - text: >-
          Babies meet about 2,000 to 6,000 immune-triggering substances (antigens) every day. The
          entire childhood schedule contains about 165 antigens.
        source: aap_overwhelm
      - text: Research shows getting several vaccines at the same visit is safe; there is no medical reason to delay or space out childhood vaccines.
        source: aap_overwhelm
      - text: >-
          Alternative schedules have not been tested, reviewed, or approved by any medical authority
          or public health group; they delay immunity and leave children unprotected longer.
        source: immunize_altsched
      - text: The time a child goes without a recommended vaccine is time they stay vulnerable to infections, some of them severe.
        source: aap_faq
    next_step: If the family will accept only some shots today, discuss which diseases are most likely right now and book the next visit before they leave.
  - id: cdc_changes
    title: '"The CDC changed the schedule - which do I follow?"'
    aliases: [cdc changed, new schedule, denmark, shared clinical decision making, optional vaccines, which schedule]
    open_question: What have you heard about the changes?
    reflection: It is confusing when the advice you hear in the news is different from what your child's doctor says.
    permission: Can I explain what changed and what Massachusetts recommends?
    facts:
      - text: >-
          In January 2026 the CDC stopped routinely recommending vaccines against hepatitis A,
          hepatitis B, rotavirus, RSV, flu, and meningococcal disease for all children; they are now
          based on risk or a discussion with a clinician.
        source: aap_faq
      - text: There was no new information showing these vaccines are unsafe or do not work.
        source: aap_faq
      - text: >-
          The Massachusetts Department of Public Health recommends that families and clinicians use
          the American Academy of Pediatrics schedule.
        source: dph_pediatric_reference
      - text: Public and private insurers should continue to cover vaccines that have been on the childhood schedule.
        source: aap_faq
    next_step: Review the child's record against the AAP schedule and the Massachusetts school requirements together.
  - id: hpv
    title: HPV vaccine
    aliases: [hpv, gardasil, cervical cancer, too young for hpv, sexual activity]
    open_question: What questions do you have about the HPV vaccine?
    reflection: You want to make the right choice for your child at the right time.
    permission: May I tell you why it is given at this age?
    facts:
      - text: >-
          Almost all adults get some type of HPV during their lives. HPV is the leading cause of at
          least six types of cancer.
        source: aap_hpv
      - text: HPV vaccination during adolescence protects against over 90% of the cancers caused by the virus.
        source: aap_hpv
      - text: AAP recommends routine HPV vaccination for all adolescents starting between ages 9 and 12.
        source: aap_hpv
    next_step: Offer the first dose today with the other adolescent vaccines, and schedule the second dose 6 to 12 months later.
  - id: covid19
    title: COVID-19 vaccine
    aliases: [covid, covid shot, booster, mrna, myocarditis]
    open_question: What is on your mind about the COVID-19 vaccine?
    reflection: You have heard a lot of different advice about COVID-19 shots, and you want to know what makes sense now.
    permission: Can I share what the Massachusetts Department of Public Health recommends this season?
    facts:
      - text: >-
          Babies 6 to 23 months have COVID-19 hospitalization rates similar to adults 50 to 64, and
          most hospitalized babies had no underlying conditions. DPH recommends vaccination for this
          age group.
        source: dph_covid
      - text: >-
          COVID-19 vaccines are effective in children; one CDC analysis found 76% effectiveness against
          emergency or urgent care visits in children 9 months to 4 years in the first months after
          vaccination.
        source: dph_covid
      - text: Healthy children 2 to 18 years who are not in a higher-risk group may receive one dose.
        source: dph_covid
    divergence: Federal guidance (ACIP, September 2025) makes COVID-19 vaccination an individual decision for everyone 6 months and older.
    next_step: Check whether the child or a household member is at higher risk, which makes the recommendation stronger.
  - id: influenza
    title: Flu vaccine
    aliases: [flu, flu shot, influenza, never get the flu, flu shot gave me flu]
    open_question: How have flu shots gone for your family in the past?
    reflection: It makes sense to wonder whether a yearly shot is worth it.
    permission: Would it help to hear what we know about flu in children?
    facts:
      - text: >-
          During the 2025-2026 season, nine children died of flu in Massachusetts and 191 nationwide.
          In one study, flu vaccination reduced the risk of dying from flu by 80% in children with or
          without underlying conditions.
        source: dph_flu
      - text: DPH recommends that everyone 6 months and older get a flu vaccine every year unless there is a contraindication.
        source: dph_flu
    divergence: The January 2026 federal change no longer routinely recommends flu vaccine for all children; DPH and AAP still do.
    next_step: Offer the vaccine today; children under 9 who have not had 2 doses before need 2 doses 4 weeks apart.
  - id: pregnancy
    title: Vaccines during pregnancy
    aliases: [pregnant, pregnancy, expecting, breastfeeding, lactation, tdap pregnancy, rsv pregnancy]
    open_question: What are you weighing as you think about vaccines during your pregnancy?
    reflection: You are thinking about protecting both yourself and your baby. That matters a lot.
    permission: May I share how vaccines during pregnancy protect newborns?
    facts:
      - text: >-
          COVID-19 vaccination during pregnancy can cut the risk of COVID-19 hospitalization for
          infants by more than half in the first three months of life; there is no evidence of harm to
          the pregnant person or fetus.
        source: dph_covid
      - text: >-
          Maternal RSV vaccine (Abrysvo) given at 32 to 36 weeks protects the baby through antibodies
          passed before birth; in a recent review, it lowered RSV hospitalization of infants by 51% to
          74% across studies.
        source: dph_rsv_peds
      - text: Flu vaccine during pregnancy has been linked in multiple studies to less flu in babies during their first months, before they can be vaccinated.
        source: dph_flu
    divergence: Federal guidance no longer routinely recommends COVID-19 vaccination in pregnancy; DPH and ACOG (as adopted by DPH) do.
    next_step: Coordinate timing with the prenatal care provider (Tdap at 27-36 weeks; RSV vaccine at 32-36 weeks in season).
