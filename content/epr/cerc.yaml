# Crisis and emergency risk communication (CERC) content for crisis_risk_communication_builder
# (EPR-10): the CERC rhythm by phase, message-map rules and limits, initial-statement elements,
# spokesperson preparation, audiences, and pre-scripted messages for seven hazards.
#
# The six CERC principles and the media release checklist live in content/comms/campaigns.yaml
# (shared with draft_press_materials); this file does not repeat them.
#
# REVIEW STATUS: pending. See meta.verification_note.
# Schema: content/schemas/epr_cerc.schema.json
meta:
  id: epr-cerc
  title: Crisis and emergency risk communication (CERC) phases, message maps, and pre-scripted messages
  version: 0.1.0
  prepared: 2026-11-09
  effective_date: 2018-01-01
  source:
    title: Crisis and Emergency Risk Communication (CERC) Manual
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/cerc/php/cerc-manual/index.html
  related_sources:
    - title: "ATSDR Communication Toolkit: Message Mapping Template, Worksheet, and Checklist (February 2015)"
      publisher: Agency for Toxic Substances and Disease Registry
      url: https://www.atsdr.cdc.gov/communications-toolkit/documents/12_message-mapping-tool-final-111015_508.pdf
    - title: "Effective Risk and Crisis Communication during Water Security Emergencies: Summary Report of EPA Sponsored Message Mapping Workshops (EPA/600/R-07/027)"
      publisher: U.S. Environmental Protection Agency
      url: https://www.epa.gov/sites/default/files/2015-08/documents/effective_risk_and_crisis_communication_during_water_security_emergencies.pdf
    - title: Public Health Emergency Preparedness and Response Capabilities (Capability 4, Emergency Public Information and Warning)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/readiness/media/pdfs/CDC_PreparednesResponseCapabilities_October2018_Final_508.pdf
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted 2026-11-09. The CERC rhythm, phase tasks, five pitfalls, audience concerns, message
    construction advice, initial-statement elements, media holding lines, first-48-hours steps,
    and spokesperson tips are paraphrased from CDC's CERC manual chapters (Introduction 2018,
    Psychology of a Crisis 2019, Messages and Audiences 2018, Crisis Communication Plans 2014,
    Spokesperson 2014), fetched from cdc.gov on 2026-11-09 (high confidence). The message-map
    structure (three key messages, three supporting facts each) and the 27 words / 9 seconds / 3
    messages limits are from ATSDR's 2015 message mapping checklist and EPA's 2007 message
    mapping report (high confidence); EPA notes these limits come from media sound-bite research,
    not a federal standard. The 3 words per second speaking rate is derived from 27 words in 9
    seconds (tool rule). PHEP Capability 4 functions were checked against the 2018 standards
    (high confidence). PRE-SCRIPTED MESSAGES: each statement is paraphrased from the cited CDC or
    DPH page (dates in sources) and marked high or medium confidence; medium means the wording
    goes beyond the page or depends on local plans. The mass dispensing messages depend on your
    POD plan (forms, who may pick up medicine) and are medium or low confidence. The boil water
    messages follow CDC's drinking water advisory page; MassDEP's boil order pages could not be
    found (404) on 2026-11-09, so coordinate wording with your water supplier and MassDEP.
    Pet-related guidance on the CDC pages is intentionally left out.

