# Exercise scenarios for design_hseep_exercise (EPR-08): three fully developed tabletop scenarios
# for Pilot 3 (measles outbreak, coastal storm with power outage, extreme heat) and scenario seeds
# for other hazards. Written for a Massachusetts local health department.
#
# ALL SCENARIO EVENTS, PEOPLE, AND NUMBERS ARE FICTIONAL EXERCISE CONTENT. {{town}} and
# {{agency}} are replaced with the exercise's town and sponsoring agency.
#
# REVIEW STATUS: pending. See meta.verification_note.
# Schema: content/schemas/epr_exercise_scenarios.schema.json
