    Drafted 2026-11-09. The scenario narratives, injects, numbers, key issues, discussion
    questions, and suggested objectives are THIS PROJECT'S FICTIONAL EXERCISE CONTENT, written to
    HSEEP's scenario guidance (plausible, realistic, challenging; conditions that let players meet
    the objectives) and keyed to the PHEP capabilities (medium confidence that they fit a
    Massachusetts local health department; have your planning team and DPH regional staff vet
    them). The few clinical and safety facts the scenarios rely on are cited in each scenario's
    facts list: the measles infectious period (CDC clinical overview, fetched 2026-11-09), the
