# Expected FEMA National Risk Index table columns (tool assumption; not verified).
nri:
  county_id_columns: [STCOFIPS, COUNTYFIPS, STATEFIPS_COUNTYFIPS]
  tract_id_columns: [TRACTFIPS]
  overall_score: RISK_SCORE
  overall_rating: RISK_RATNG
  hazard_score_suffix: _RISKS
  hazard_rating_suffix: _RISKR
  hazard_frequency_suffix: _AFREQ
  note: >-
    Column names follow the National Risk Index table downloads as this tool expects them
    (prefix + _RISKS for the hazard risk score, _RISKR for its rating, _AFREQ for annualized
    frequency). They could not be checked against FEMA's data dictionary; the tool reports which
    columns it found.
