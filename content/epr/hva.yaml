method:
  summary: >-
    For each hazard the planning group scores probability (1-3) and six severity items (0-3):
    three impacts (people, property and infrastructure, and health department operations and
    services) and three preparedness gaps (planning and training, internal response capacity,
    and external partners and resources; 1 = strong, 2 = moderate, 3 = weak or none). Severity =
    sum of the six items divided by 18. Relative risk = (probability / 3) x severity x 100, from 0
    to 100%. Hazards are ranked by relative risk; ties keep the order of higher probability.
  formula: relative_risk_percent = (probability / 3) * (human + property + operations + preparedness + internal_response + external_response) / 18 * 100
  basis: tool_method
  note: >-
    This is the tool's documented method. It follows the common probability x severity structure
    of hospital and public health HVA worksheets, but no published version could be retrieved to
    check it. Use your HMCC's or agency's own HVA method if it differs, and keep the group's
    reasoning for each score.
  phep_link:
    text: Jurisdictional risk assessments identify the hazards and at-risk populations that public health preparedness plans address; CDC's Capability 1 asks health departments to use them with partners.
    source: cdc-phep
    section: Capability 1, Community Preparedness (jurisdictional risk assessment)
    confidence: medium

scales:
  probability:
    - {score: 0, label: Not applicable, description: The hazard cannot occur here.}
    - {score: 1, label: Low, description: "Unlikely in a planning cycle; few or no local occurrences (ResilientMass likelihood low or very low)."}
    - {score: 2, label: Moderate, description: "Likely at least once in about 50 years (ResilientMass medium)."}
    - {score: 3, label: High, description: "Likely every year or more often (ResilientMass high or very high)."}
  impact:
    - {score: 0, label: None, description: No effect expected.}
    - {score: 1, label: Low, description: "Inconvenience, limited effects, minor outages."}
    - {score: 2, label: Moderate, description: "Disruption of daily life and services; injuries possible."}
    - {score: 3, label: High, description: "Deaths or serious injuries, long disruption of essential services or facilities."}
  preparedness_gap:
    - {score: 1, label: Strong, description: "Current plans, trained staff, exercised recently, resources on hand."}
    - {score: 2, label: Moderate, description: "Plans exist but are dated or partly exercised; some gaps in staff or supplies."}
    - {score: 3, label: Weak or none, description: "No plan, not trained or exercised, or depends on resources not secured."}
  seed_mapping:
    likelihood: {"Very high": 3, "High": 3, "Medium": 2, "Low": 1, "Very low": 1}
    human_consequence: {"Very high": 3, "High": 2, "Medium": 1, "Low": 1, "Very low": 0}
    note: Tool mapping from ResilientMass's five-level statewide ratings to the 0-3 scales; statewide ratings are only a starting point for local scoring.

