# Registry of every data source the server uses or plans to use.
# Read by the get_data_source_status tool (CORE-08).
# Schema: content/schemas/data_sources.schema.json
meta:
  id: data-source-registry
  title: Data source registry
  version: 0.2.0
  prepared: 2026-11-07
  effective_date: null
  source:
    title: Public Health Nursing MCP Server project plan
    publisher: Public Health Nursing MCP Server project
    url: https://github.com/SpiroGanas/Public-Health-Nursing-MCP-Server/blob/main/project_plan.md
  related_sources: []
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Lists the sources used through Phase 1 and the main sources planned for later phases. The
    product owner should confirm the caveats when each source is first used.

general_caveats:
  - >-
    Several federal public health web pages and datasets were taken offline or modified for a
    time in 2025, and some were later restored. The server keeps dated snapshots so answers stay
    reproducible, and each answer states whether live or snapshot data was used.
  - >-
    Web addresses change. The mass.gov address recorded for 105 CMR 300.000 in Phase 0 no longer
    worked when it was checked on 2026-11-07; get_data_source_status probes each address so a
    broken link shows up.

sources:
  - id: ma-reportable-conditions
    name: Massachusetts reportable diseases and conditions (105 CMR 300.000)
    publisher: Massachusetts Department of Public Health
    kind: content
    status: active
    content_id: ma-reportable-conditions
    homepage: https://www.mass.gov/regulations/105-CMR-30000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
    probe_url: https://www.mass.gov/regulations/105-CMR-30000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
    used_by: [lookup_reportable_condition]
    caveats:
      - >-
        Content bundled with the server, transcribed on 2026-11-07 from 105 CMR 300.000 (Mass.
        Register #1470, 5/27/22) and DPH's current reporting lists. It is pending review by the
        subject matter expert. Changes to the regulation or to DPH's lists require a content update.
      - >-
        The Commissioner can add conditions for up to 12 months at a time by declaration under
        105 CMR 300.150 (for example alpha-gal syndrome from April 1, 2026). Check DPH's current
        reporting page for declarations newer than the bundled content.

  - id: ma-municipalities
    name: Massachusetts cities and towns, counties, and DPH preparedness regions
    publisher: MassGIS
    kind: snapshot
    status: active
    snapshot_id: ma-municipalities
    homepage: https://www.mass.gov/info-details/massgis-data-municipalities
    probe_url: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles/state/townssurvey_shp.zip
    used_by: [configure_jurisdiction, lookup_reportable_condition]
    caveats:
      - >-
        HMCC regions are derived from the 2005 DPH Emergency Preparedness Region layer (Regions 4A
        and 4B merged into 4AB), corrected for one town (Wilmington, Region 3) to match DPH's HMCC
        Regional Boundaries map (December 2019). Confirm with your HMCC.

  - id: ma-school-districts
    name: Massachusetts public school districts
    publisher: MassGIS, from DESE data
    kind: snapshot
    status: active
    snapshot_id: ma-school-districts
    homepage: https://www.mass.gov/info-details/massgis-data-public-school-districts
    probe_url: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles/state/schooldistricts.zip
    used_by: [configure_jurisdiction]
    caveats:
      - >-
        District list reflects the MassGIS layer's vintage (June 2019); districts formed, merged,
        or renamed since then may be missing. Confirm with DESE School and District Profiles.

  - id: local-files
    name: Your files in the mounted /data folder
    publisher: Your agency
    kind: local
    status: active
    homepage: null
    probe_url: null
    used_by: [read_local_file, search_agency_policies, profile_local_dataset, deidentify_dataset, apply_small_cell_suppression, check_document_accessibility, export_document]
    caveats:
      - Files never leave the container. Tools return aggregates by default; identifiable output is written to /data/output only.

  # --- Phase 4: public data and evidence ------------------------------------
  - id: census-acs
    name: American Community Survey 5-year estimates
    publisher: U.S. Census Bureau
    kind: live
    status: active
    snapshot_id: census-acs5-ma
    homepage: https://www.census.gov/programs-surveys/acs
    probe_url: https://api.census.gov/data/2024/acs/acs5/variables/B01003_001E.json
    used_by: [build_community_health_profile, language_access_profile]
    caveats:
      - >-
        Live figures come from api.census.gov (the newest published 5-year vintage). From
        some networks the API answers requests without a key with a "missing key" page; set
        PHN_CENSUS_API_KEY (free) or rely on the bundled 2020–2024 snapshot, which was built
        from the keyless summary files on www2.census.gov.
      - >-
        Estimates carry sampling error (90% margins of error are shown); derived percentages
        use the Census Bureau's approximation formulas, and figures with a coefficient of
        variation above 30% are flagged as unreliable.
      - >-
        Detailed languages (B16001) are published only for the state and PUMAs; towns and tracts
        use the 12 language groups of C16001.
  - id: census-geographies
    name: Census geographies, crosswalks, and map boundaries for Massachusetts
    publisher: U.S. Census Bureau
    kind: snapshot
    status: active
    snapshot_id: ma-boundaries
    homepage: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    probe_url: https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_25_cousub_500k.zip
    used_by: [build_community_health_profile, get_social_vulnerability_index, language_access_profile, get_places_estimates, create_choropleth_map]
    caveats:
      - >-
        Towns are Census county subdivisions (2024 Gazetteer); tract-to-town shares come from the
        2020 block assignment file and count blocks, not people. ZCTAs approximate ZIP Codes and
        cross town lines.
      - >-
        Map boundaries are simplified cartographic boundary files (2024 towns and tracts, 2020
        ZCTAs), not survey-grade; school districts are unions of member towns from the 2019
        MassGIS district list.
  - id: cdc-socrata
    name: CDC open data portal (data.cdc.gov) — PLACES 2025 release
    publisher: Centers for Disease Control and Prevention
    kind: live
    status: active
    snapshot_id: cdc-places-2025-ma
    homepage: https://www.cdc.gov/places/index.html
    probe_url: https://data.cdc.gov/resource/swc5-untb.json?$limit=1
    used_by: [get_places_estimates, build_community_health_profile]
    caveats:
      - Some datasets were removed or changed in 2025; snapshots are kept for reproducibility.
      - >-
        PLACES 2025 datasets: county swc5-untb, place eav7-hnsx, tract cwsq-ngmh, ZCTA qnzd-25i4.
        Most measures use BRFSS 2023 data (five use 2022); the data year differs from the release
        year.
      - >-
        PLACES values are model-based small-area estimates, not local survey results.
        Massachusetts and U.S. reference values are population-weighted means of county
        estimates computed by this server, not official CDC state estimates.
  - id: cdc-svi
    name: CDC/ATSDR Social Vulnerability Index 2022
    publisher: Centers for Disease Control and Prevention / ATSDR
    kind: snapshot
    status: active
    snapshot_id: cdc-svi-2022-ma
    homepage: https://www.atsdr.cdc.gov/place-health/php/svi/index.html
    probe_url: https://svi.cdc.gov/Documents/Data/2022/csv/states/Massachusetts.csv
    used_by: [get_social_vulnerability_index, build_community_health_profile]
    caveats:
      - >-
        Released about every two years; SVI 2022 (ACS 2018–2022, released May 2024, MOE
        correction December 2024) is the latest. Ranks are relative percentiles and cannot be
        compared across releases or between the Massachusetts and national rankings.
  - id: ncbi-eutils
    name: NCBI E-utilities (PubMed)
    publisher: National Library of Medicine
    kind: live
    status: active
    homepage: https://www.ncbi.nlm.nih.gov/books/NBK25501/
    probe_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/einfo.fcgi
    used_by: [search_pubmed, search_cdc_guidance]
    caveats:
      - >-
        Requests identify the tool (tool=public-health-nursing-mcp-server) and never send an
        email address; they are spaced to stay under 3 per second (10 with PHN_NCBI_API_KEY) and
        cached for one day. No snapshot: searches need the network unless cached.
  - id: cdc-guidance
    name: CDC MMWR and Health Alert Network (HAN) notices
    publisher: Centers for Disease Control and Prevention
    kind: live
    status: active
    homepage: https://www.cdc.gov/mmwr/index.html
    probe_url: https://tools.cdc.gov/api/v2/resources/media?max=1
    used_by: [search_cdc_guidance]
    caveats:
      - >-
        MMWR: CDC content syndication API v2 title search and a PubMed search of the MMWR journal.
        HAN: the HAN archive's JSON module, the next notice pages in sequence, and the retired HAN
        feed (2023 and earlier). CDC Stacks refuses automated searches, so only a search link is
        given.
      - >-
        CDC reorganized its website in 2024–2025 and retired several RSS feeds; these methods were
        checked in November 2026 and may need updating when CDC changes its site again.
  # --- Planned sources (later phases) ----------------------------------------
  - id: openfda
    name: openFDA, DailyMed, and RxNorm
    publisher: U.S. Food and Drug Administration; National Library of Medicine
    kind: live
    status: active
    homepage: https://open.fda.gov
    probe_url: https://api.fda.gov/drug/label.json?limit=1
    used_by: [lookup_medication_information, lookup_vaccine_product]
    caveats:
      - Live only (answers are cached for a day); there is no offline snapshot, so offline answers say what could not be checked.
      - openFDA states its data are unvalidated and must not be relied on for medical decisions; the package insert on DailyMed is the label of record.
      - An optional free openFDA key (PHN_OPENFDA_API_KEY) raises the rate limit; it is never shown in answers.
  # --- Phase 5: immunization content and snapshots ---------------------------
  - id: cdc-iis-vaccine-codes
    name: CDC IIS vaccine code sets (CVX, MVX, trade names, NDC)
    publisher: Centers for Disease Control and Prevention
    kind: snapshot
    status: active
    snapshot_id: cdc-iis-vaccine-codes
    homepage: https://www2a.cdc.gov/vaccines/iis/iisstandards/vaccines.asp?rpt=cvx
    probe_url: https://www2a.cdc.gov/vaccines/iis/iisstandards/downloads/cvx.txt
    used_by: [lookup_vaccine_product]
    caveats:
      - The CVX table is refreshed live when reachable; MVX, trade names, and NDCs come from the bundled snapshot.
  - id: ma-school-immunization-survey
    name: Massachusetts school immunization survey results by school
    publisher: Massachusetts Department of Public Health
    kind: snapshot
    status: active
    snapshot_id: ma-school-immunization-survey
    homepage: https://www.mass.gov/info-details/school-immunizations
    probe_url: https://www.mass.gov/info-details/school-immunizations
    used_by: [analyze_vaccination_coverage]
    caveats:
      - Self-reported by schools; DPH withholds schools with fewer than 30 students and publishes rates without enrollment counts.
  - id: nis-coverage-ma-us
    name: National Immunization Survey and VaxView coverage, Massachusetts and United States
    publisher: Centers for Disease Control and Prevention
    kind: snapshot
    status: active
    snapshot_id: nis-coverage-ma-us
    homepage: https://www.cdc.gov/vaxview/index.html
    probe_url: https://data.cdc.gov/resource/fhky-rtsk.json?$limit=1
    used_by: [analyze_vaccination_coverage]
    caveats:
      - Survey estimates with sampling error; NIS-Child is reported by birth year and lags the calendar.
  - id: vax-reference-content
    name: Immunization reference content (schedules, recommendations by body, school requirements, storage and handling, products, clinic planning, conversation guide, thresholds)
    publisher: DPH, CDC/ACIP, AAP, AAFP, ACOG, Immunize.org (drafted by this project)
    kind: content
    status: active
    content_id: vax-recommendations
    homepage: https://www.mass.gov/info-details/dph-recommended-vaccines
    probe_url: https://www.mass.gov/info-details/dph-recommended-vaccines
    used_by: [get_immunization_schedule, compare_vaccine_recommendations, check_ma_school_immunization_requirements, analyze_vaccination_coverage, vaccine_temperature_excursion_helper, lookup_vaccine_product, plan_vaccination_clinic, vaccine_confidence_conversation_guide]
    caveats:
      - Drafted from documents retrieved 2026-11-07 and pending subject-matter review. Federal and Massachusetts guidance have diverged since 2025; refresh whenever any body issues new guidance.
  - id: cdc-cdsi
    name: CDC Clinical Decision Support for Immunization (CDSi) supporting data
    publisher: Centers for Disease Control and Prevention
    kind: snapshot
    status: planned
    planned_phase: 6
    homepage: https://www.cdc.gov/iis/cdsi/index.html
    probe_url: https://www.cdc.gov
    used_by: []
    caveats: []
  - id: nws-alerts
    name: National Weather Service alerts API
    publisher: National Weather Service
    kind: live
    status: planned
    planned_phase: 12
    homepage: https://www.weather.gov/documentation/services-web-api
    probe_url: https://api.weather.gov/alerts/active?area=MA
    used_by: []
    caveats: []
