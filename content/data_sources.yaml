# Registry of every data source the server uses or plans to use.
# Read by the get_data_source_status tool (CORE-08).
# Schema: content/schemas/data_sources.schema.json
meta:
  id: data-source-registry
  title: Data source registry
  version: 0.2.0
  prepared: 2026-11-07
  effective_date: null
  source:
    title: Public Health Nursing MCP Server project plan
    publisher: Public Health Nursing MCP Server project
    url: https://github.com/SpiroGanas/Public-Health-Nursing-MCP-Server/blob/main/project_plan.md
  related_sources: []
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Lists the sources used through Phase 1 and the main sources planned for later phases. The
    product owner should confirm the caveats when each source is first used.

general_caveats:
  - >-
    Several federal public health web pages and datasets were taken offline or modified for a
    time in 2025, and some were later restored. The server keeps dated snapshots so answers stay
    reproducible, and each answer states whether live or snapshot data was used.
  - >-
    Web addresses change. The mass.gov address recorded for 105 CMR 300.000 in Phase 0 no longer
    worked when it was checked on 2026-11-07; get_data_source_status probes each address so a
    broken link shows up.

sources:
  - id: ma-reportable-conditions
    name: Massachusetts reportable diseases and conditions (105 CMR 300.000)
    publisher: Massachusetts Department of Public Health
    kind: content
    status: active
    content_id: ma-reportable-conditions
    homepage: https://www.mass.gov/regulations/105-CMR-30000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
    probe_url: https://www.mass.gov/regulations/105-CMR-30000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
    used_by: [lookup_reportable_condition]
    caveats:
      - >-
        Content bundled with the server, transcribed on 2026-11-07 from 105 CMR 300.000 (Mass.
        Register #1470, 5/27/22) and DPH's current reporting lists. It is pending review by the
        subject matter expert. Changes to the regulation or to DPH's lists require a content update.
      - >-
        The Commissioner can add conditions for up to 12 months at a time by declaration under
        105 CMR 300.150 (for example alpha-gal syndrome from April 1, 2026). Check DPH's current
        reporting page for declarations newer than the bundled content.

  - id: ma-municipalities
    name: Massachusetts cities and towns, counties, and DPH preparedness regions
    publisher: MassGIS
    kind: snapshot
    status: active
    snapshot_id: ma-municipalities
    homepage: https://www.mass.gov/info-details/massgis-data-municipalities
    probe_url: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles/state/townssurvey_shp.zip
    used_by: [configure_jurisdiction, lookup_reportable_condition]
    caveats:
      - >-
        HMCC regions are derived from the 2005 DPH Emergency Preparedness Region layer (Regions 4A
        and 4B merged into 4AB), corrected for one town (Wilmington, Region 3) to match DPH's HMCC
        Regional Boundaries map (December 2019). Confirm with your HMCC.

  - id: ma-school-districts
    name: Massachusetts public school districts
    publisher: MassGIS, from DESE data
    kind: snapshot
    status: active
    snapshot_id: ma-school-districts
    homepage: https://www.mass.gov/info-details/massgis-data-public-school-districts
    probe_url: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles/state/schooldistricts.zip
    used_by: [configure_jurisdiction]
    caveats:
      - >-
        District list reflects the MassGIS layer's vintage (June 2019); districts formed, merged,
        or renamed since then may be missing. Confirm with DESE School and District Profiles.

  - id: local-files
    name: Your files in the mounted /data folder
    publisher: Your agency
    kind: local
    status: active
    homepage: null
    probe_url: null
    used_by: [read_local_file, search_agency_policies, profile_local_dataset, deidentify_dataset, apply_small_cell_suppression, check_document_accessibility, export_document]
    caveats:
      - Files never leave the container. Tools return aggregates by default; identifiable output is written to /data/output only.

  # --- Planned sources (later phases) ----------------------------------------
  - id: census-acs
    name: American Community Survey 5-year estimates
    publisher: U.S. Census Bureau
    kind: live
    status: planned
    planned_phase: 4
    homepage: https://www.census.gov/programs-surveys/acs
    probe_url: https://api.census.gov/data.html
    used_by: []
    caveats:
      - Requires a free Census API key for heavy use.
  - id: cdc-socrata
    name: CDC open data portal (data.cdc.gov)
    publisher: Centers for Disease Control and Prevention
    kind: live
    status: planned
    planned_phase: 4
    homepage: https://data.cdc.gov
    probe_url: https://data.cdc.gov
    used_by: []
    caveats:
      - Some datasets were removed or changed in 2025; snapshots are kept for reproducibility.
  - id: cdc-svi
    name: CDC/ATSDR Social Vulnerability Index
    publisher: Centers for Disease Control and Prevention / ATSDR
    kind: snapshot
    status: planned
    planned_phase: 4
    homepage: https://www.atsdr.cdc.gov/place-health/php/svi/index.html
    probe_url: https://www.atsdr.cdc.gov
    used_by: []
    caveats:
      - Released about every two years.
  - id: ncbi-eutils
    name: NCBI E-utilities (PubMed)
    publisher: National Library of Medicine
    kind: live
    status: planned
    planned_phase: 4
    homepage: https://www.ncbi.nlm.nih.gov/books/NBK25501/
    probe_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/einfo.fcgi
    used_by: []
    caveats: []
  - id: openfda
    name: openFDA, DailyMed, and RxNorm
    publisher: U.S. Food and Drug Administration; National Library of Medicine
    kind: live
    status: planned
    planned_phase: 5
    homepage: https://open.fda.gov
    probe_url: https://api.fda.gov
    used_by: []
    caveats: []
  - id: cdc-cdsi
    name: CDC Clinical Decision Support for Immunization (CDSi) supporting data v4.65 and logic specification v4.6
    publisher: Centers for Disease Control and Prevention
    kind: content
    status: active
    content_id: cdsi-supporting-data
    homepage: https://www.cdc.gov/iis/cdsi/index.html
    probe_url: https://www.cdc.gov/iis/cdsi/index.html
    used_by: [forecast_immunizations_due]
    caveats:
      - Supporting data v4.65 (August 2026) is embedded with checksums; CDC updates it with each schedule change, so check the CDSi page for a newer version at each review.
      - Encodes CDC/ACIP recommendations only; Massachusetts DPH and AAP/ACOG positions issued since 2025 may differ.
      - Seasonal series (influenza, COVID-19, RSV) use the 2025-26 season dates in this version.
      - The engine passes all 1,064 healthy childhood and adult CDC test cases and 301 of 337 underlying-condition cases; exceptions are documented in docs/cdsi-test-results.md.
  - id: cdc-nndss-weekly
    name: NNDSS Weekly Data (National Notifiable Diseases Surveillance System)
    publisher: Centers for Disease Control and Prevention
    kind: live
    status: active
    snapshot_id: cdc-nndss-weekly
    homepage: https://data.cdc.gov/d/x9gk-5huc
    probe_url: https://data.cdc.gov/resource/x9gk-5huc.json?$limit=1
    used_by: [get_notifiable_disease_trends]
    caveats:
      - >-
        Provisional weekly counts (MMWR years 2022 onward) as published each week by reporting
        jurisdiction; CDC revises them, and finalized annual tables (CDC Stacks) can differ.
        Massachusetts DPH (MAVEN) counts can differ.
      - >-
        Condition rows change names and case definitions between years; rows are not combined,
        so some have fewer than five baseline years.
      - >-
        The bundled snapshot covers only the latest published week for Massachusetts, New England,
        and U.S. residents.
  - id: cdc-respiratory-surveillance
    name: CDC respiratory virus surveillance (NHSN admissions, NSSP ED visits, NREVSS test positivity, ARI activity level)
    publisher: Centers for Disease Control and Prevention
    kind: live
    status: active
    snapshot_id: cdc-respiratory-ma
    homepage: https://www.cdc.gov/respiratory-viruses/data/index.html
    probe_url: https://data.cdc.gov/resource/vdzy-6i9v.json?$limit=1
    used_by: [get_respiratory_and_wastewater_surveillance]
    caveats:
      - >-
        Datasets vdzy-6i9v (NHSN), rdmq-nq56 (NSSP), gvsb-yw6g and 3cxc-4k8q (NREVSS, HHS Region
        1), seuz-s2cv (national percent positive), and f3zz-zga5 (ARI level), checked 2026-11-08.
        CDC renames and replaces respiratory datasets between seasons; check the IDs each season.
      - >-
        Provisional and revised weekly; the latest week is often incomplete. NHSN depends on
        hospital reporting, NSSP on participating emergency departments, NREVSS on participating
        laboratories.
  - id: cdc-nwss
    name: CDC National Wastewater Surveillance System (NWSS) viral activity levels
    publisher: Centers for Disease Control and Prevention
    kind: live
    status: active
    snapshot_id: cdc-nwss-ma
    homepage: https://www.cdc.gov/wastewater/respiratory-viruses/state.html
    probe_url: https://data.cdc.gov/resource/atcp-73re.json?$limit=1
    used_by: [get_respiratory_and_wastewater_surveillance]
    caveats:
      - >-
        Site-level wastewater viral activity levels (dataset atcp-73re) for SARS-CoV-2, influenza
        A, and RSV. Sites are identified only by an arbitrary number, counties served, and
        population served; on 2026-11-08 six Massachusetts sites reported.
  - id: mwra-deer-island-biobot
    name: MWRA Deer Island wastewater SARS-CoV-2 (Biobot), final series
    publisher: Massachusetts Water Resources Authority
    kind: snapshot
    status: active
    snapshot_id: mwra-deer-island-biobot
    homepage: https://www.mwra.com/biobot/biobotdata.htm
    probe_url: https://www.mwra.com/biobot/biobotdata.htm
    used_by: [get_respiratory_and_wastewater_surveillance]
    caveats:
      - >-
        MWRA's Biobot testing ended with samples collected through 2026-07-27; MWRA reports that
        DPH is replacing it with its own program and plans a dashboard. Check the MWRA page for
        the new link.
  - id: ma-dph-respiratory-dashboard
    name: DPH respiratory illness reporting dashboard
    publisher: Massachusetts Department of Public Health, Bureau of Infectious Disease and Laboratory Sciences
    kind: live
    status: active
    homepage: https://www.mass.gov/info-details/respiratory-illness-reporting
    probe_url: https://www.mass.gov/info-details/respiratory-illness-reporting
    used_by: [get_respiratory_and_wastewater_surveillance]
    caveats:
      - >-
        Linked, not read: the briefing points to this dashboard (hospital admissions and ED
        visits for COVID-19, influenza, and RSV) as the Massachusetts source of record.
  - id: nws-alerts
    name: National Weather Service alerts API
    publisher: National Weather Service
    kind: live
    status: planned
    planned_phase: 12
    homepage: https://www.weather.gov/documentation/services-web-api
    probe_url: https://api.weather.gov/alerts/active?area=MA
    used_by: []
    caveats: []
