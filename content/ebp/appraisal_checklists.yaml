# Design-specific critical appraisal questions for appraise_evidence (EBP-03): how to tell the
# study design, the questions to ask of each design, the answer scales, and how the instruments
# that define an overall rating (the Cochrane 2011 risk-of-bias tool, ROBINS-I, AMSTAR 2) combine
# answers. Every question is THIS PROJECT'S OWN WORDING of an item or domain from the open-access
# source named on it; none is copied from a licensed checklist.
#
# REVIEW STATUS: pending. Drafted from full texts retrieved 2026-11-12 through the NCBI
# E-utilities (PubMed Central). Schema: content/schemas/ebp_appraisal_checklists.schema.json
meta:
  id: ebp-appraisal-checklists
  title: Critical appraisal questions by study design (risk of bias, reporting, and review quality)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: The Cochrane Collaboration's tool for assessing risk of bias in randomised trials (BMJ 2011)
    publisher: BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3196245/
  related_sources:
    - title: ROBINS-I, a tool for assessing risk of bias in non-randomised studies of interventions (BMJ 2016)
      publisher: BMJ
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5062054/
    - title: AMSTAR 2, a critical appraisal tool for systematic reviews (BMJ 2017)
      publisher: BMJ
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5833365/
    - title: STROBE statement and its explanation and elaboration (PLoS Medicine 2007)
      publisher: PLoS Medicine
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2020496/
    - title: Appraising qualitative research in health education (Health Promotion Practice 2010)
      publisher: SAGE
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3012622/
    - title: SQUIRE 2.0 (BMJ Quality and Safety 2016)
      publisher: BMJ
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5256233/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The questions were written from the full texts listed under `sources` (read 2026-11-12 from
    PubMed Central through the NCBI E-utilities). They are NOT the CASP checklists: the CASP
    site (casp-uk.net) could not be reached from the build environment, so no CASP wording was
    read, and CASP's licence terms (believed to be Creative Commons Attribution-NonCommercial-
    ShareAlike, confidence low) were not verified; the tool links to CASP instead of copying it.
    Several instruments are used as published but with limits: the randomised trial questions follow
    the 2011 Cochrane risk-of-bias tool (its 2019 successor, RoB 2, was not read); the
    non-randomised intervention questions are the seven ROBINS-I domains, not its signalling
    questions (those are in the paper's supplement, which was not read); AMSTAR 2 is paraphrased
    from the paper's item rationale (the supplementary user guide was not read, so how a
    "partial yes" counts toward the overall rating is not verified); STROBE and SQUIRE 2.0 are
    reporting guidelines, and their authors say they are not quality scores, so the cohort,
    case-control, cross-sectional, and improvement questions are prompts for the nurse's judgment
    and are never summed into a score. The qualitative questions follow one health-education
    paper (its guidelines are not a published instrument; confidence medium). The design
    identification word lists are heuristics written for this tool (confidence medium); the nurse
    confirms the design.

