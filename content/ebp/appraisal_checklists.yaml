    response: yes_no
    source: qual_ph
    section: "Question 2"
    confidence: medium
  - id: qual_sampling
    designs: [qualitative]
    domain: Participants
    text: "Are the source of the sample, the sampling method, and the inclusion and exclusion criteria described, and was the amount of data adequate (for example, data collection continued until no new information emerged)?"
    look_for: "Adequacy is judged by the quality and amount of data, not by the number of participants."
    response: yes_no
    source: qual_ph
    section: "Question 3"
    confidence: medium
  - id: qual_researcher
    designs: [qualitative]
