# CASP (Critical Appraisal Skills Programme) is offered as a link only.
casp:
  title: CASP checklists (Critical Appraisal Skills Programme)
  publisher: CASP UK (Oxford)
  url: https://casp-uk.net/casp-tools-checklists/
  licence_note: >-
    CASP checklists are believed to be published under a Creative Commons Attribution-
    NonCommercial-ShareAlike licence. This was NOT verified (the site could not be reached when
    this content was built; confidence low). Read the licence printed on the checklist you
    download. The questions in this tool are original wording from other open-access sources, not
    CASP text, so using them carries no CASP licence conditions; if you adapt CASP's own wording,
    credit CASP and keep its licence terms.
  checklists_note: >-
    From memory, not verified: CASP publishes separate checklists for randomised controlled
    trials, systematic reviews, cohort studies, case-control studies, qualitative studies,
    diagnostic studies, and economic evaluations (confidence low).

scales:
  yes_no:
    label: Yes, partly, no, can't tell, not applicable
    values: ["yes", partly, "no", cant_tell, not_applicable]
    concern: [partly, "no", cant_tell]
    meaning: "Questions are worded so that 'yes' is the reassuring answer. 'cant_tell' means the report does not say."
  yes_partial_no:
    label: Yes, partial yes, no (AMSTAR 2 style)
    values: ["yes", partial_yes, "no", not_applicable]
    concern: [partial_yes, "no"]
    meaning: "As in AMSTAR 2, when the review does not give the information, answer 'no' rather than giving the benefit of the doubt. 'not_applicable' is allowed only for the items that depend on a meta-analysis."
  risk_3:
    label: Low, unclear, or high risk of bias
    values: [low, unclear, high]
    concern: [unclear, high]
    meaning: "The 2011 Cochrane tool's judgments. Unclear means too little is reported, or the risk is not known."
  risk_4:
    label: Low, moderate, serious, critical risk, or no information (ROBINS-I)
    values: [low, moderate, serious, critical, no_information]
    concern: [serious, critical, no_information]
    meaning: "ROBINS-I judgments. Low means comparable to a well-performed randomised trial for that domain; only exceptionally is a non-randomised study low risk of bias from confounding."

# Design identification. A design is suggested from words in the text; the nurse confirms it.
# Phrases are matched at the start of a word after lower-casing and replacing punctuation with
# spaces ("randomi" matches "randomised" and "randomized"; "non-randomised" is read as one word).
designs:
  - id: randomized_trial
    label: Randomized controlled trial
    how_to_tell: >-
      Participants (or groups) were allocated to the intervention or comparison by a random
      process, then followed for outcomes.
    instrument: Cochrane risk-of-bias tool (2011 version) domains, plus reporting and applicability questions
    overall_method: rob_table3
    starts_certainty: high
    signals:
      - {phrase: randomly assigned, weight: 4}
      - {phrase: randomly allocated, weight: 4}
      - {phrase: randomised controlled, weight: 4}
      - {phrase: randomized controlled, weight: 4}
      - {phrase: cluster randomi, weight: 4}
      - {phrase: randomi, weight: 2}
      - {phrase: allocation concealment, weight: 3}
      - {phrase: random allocation, weight: 3}
      - {phrase: consort, weight: 2}
      - {phrase: double blind, weight: 2}
      - {phrase: placebo, weight: 1}
  - id: non_randomized_intervention
    label: Non-randomized study of an intervention (quasi-experimental, before-and-after, controlled before-after, interrupted time series)
    how_to_tell: >-
      An intervention or program was evaluated, but the groups were not formed by random
      allocation (for example comparison communities, before-and-after counts, or a policy change).
    instrument: ROBINS-I bias domains
    overall_method: robins_table2
    starts_certainty: low
    signals:
      - {phrase: quasi experiment, weight: 4}
      - {phrase: nonrandomi, weight: 4}
      - {phrase: non equivalent, weight: 3}
      - {phrase: interrupted time series, weight: 4}
      - {phrase: difference in differences, weight: 4}
      - {phrase: controlled before, weight: 4}
      - {phrase: pre post, weight: 3}
      - {phrase: pretest posttest, weight: 3}
      - {phrase: before and after, weight: 2}
      - {phrase: historical control, weight: 3}
      - {phrase: comparison group, weight: 1}
      - {phrase: natural experiment, weight: 3}
  - id: cohort
    label: Cohort study
    how_to_tell: >-
      The investigators followed people over time from baseline exposures to later outcomes
      (STROBE explanation and elaboration, Box 1).
    instrument: STROBE-based reporting and bias prompts (not a score)
    overall_method: none
    starts_certainty: low
    signals:
      - {phrase: cohort, weight: 4}
      - {phrase: prospective study, weight: 3}
      - {phrase: retrospective study, weight: 2}
      - {phrase: followed up, weight: 2}
      - {phrase: follow up, weight: 1}
      - {phrase: person years, weight: 2}
      - {phrase: hazard ratio, weight: 2}
      - {phrase: incidence, weight: 1}
  - id: case_control
    label: Case-control study
    how_to_tell: >-
      People with the outcome (cases) are compared with people without it (controls) on past
      exposures (STROBE explanation and elaboration, Box 1).
    instrument: STROBE-based reporting and bias prompts (not a score)
    overall_method: none
    starts_certainty: low
    signals:
      - {phrase: case control, weight: 5}
      - {phrase: cases and controls, weight: 4}
      - {phrase: matched controls, weight: 3}
      - {phrase: control group of, weight: 1}
      - {phrase: odds ratio, weight: 1}
      - {phrase: controls were, weight: 2}
  - id: cross_sectional
    label: Cross-sectional study or survey
    how_to_tell: >-
      Everyone in a sample was assessed at one point in time, often to estimate prevalence or to
      look at associations measured together (STROBE explanation and elaboration, Box 1).
    instrument: STROBE-based reporting and bias prompts (not a score)
    overall_method: none
    starts_certainty: low
    signals:
      - {phrase: cross sectional, weight: 5}
      - {phrase: prevalence, weight: 2}
      - {phrase: survey, weight: 2}
      - {phrase: questionnaire, weight: 1}
      - {phrase: response rate, weight: 2}
      - {phrase: point in time, weight: 1}
  - id: systematic_review
    label: Systematic review or meta-analysis
    how_to_tell: >-
      The authors searched for and selected studies by stated methods, appraised them, and
      summarised or pooled the results.
    instrument: AMSTAR 2 items (16) with its critical domains
    overall_method: amstar2_box2
    starts_certainty: none
    signals:
      - {phrase: systematic review, weight: 5}
      - {phrase: meta analys, weight: 5}
      - {phrase: prisma, weight: 4}
      - {phrase: prospero, weight: 4}
      - {phrase: databases were searched, weight: 4}
      - {phrase: search strategy, weight: 3}
      - {phrase: pooled, weight: 1}
      - {phrase: heterogeneity, weight: 2}
      - {phrase: scoping review, weight: 2}
  - id: qualitative
    label: Qualitative study
    how_to_tell: >-
      Interviews, focus groups, or observation were analysed for themes or patterns to describe
      experiences or meanings, usually in a small purposive sample.
    instrument: Six appraisal questions from a health-education appraisal guide, plus findings and limitations
    overall_method: none
    starts_certainty: none
    signals:
      - {phrase: qualitative, weight: 4}
      - {phrase: focus group, weight: 3}
      - {phrase: semi structured, weight: 3}
      - {phrase: interview, weight: 2}
      - {phrase: thematic analys, weight: 4}
      - {phrase: grounded theory, weight: 4}
      - {phrase: phenomenolog, weight: 4}
      - {phrase: ethnograph, weight: 4}
      - {phrase: content analysis, weight: 2}
      - {phrase: themes emerged, weight: 3}
      - {phrase: purposive, weight: 3}
      - {phrase: saturation, weight: 3}
      - {phrase: coreq, weight: 3}
  - id: quality_improvement
    label: Quality improvement or program improvement report
    how_to_tell: >-
      A local effort to improve care or a process, usually with repeated measurement over time
      and small tests of change (SQUIRE 2.0 covers reports of such work).
    instrument: SQUIRE 2.0 reporting prompts (not a score)
    overall_method: none
    starts_certainty: low
    signals:
      - {phrase: quality improvement, weight: 4}
      - {phrase: plan do study act, weight: 5}
      - {phrase: pdsa, weight: 5}
      - {phrase: model for improvement, weight: 4}
      - {phrase: run chart, weight: 3}
      - {phrase: statistical process control, weight: 3}
      - {phrase: improvement project, weight: 3}
      - {phrase: squire, weight: 3}
      - {phrase: change idea, weight: 2}

# Designs the tool recognises but has no questions for. The reason and a pointer are returned.
unsupported_designs:
  - id: diagnostic_accuracy
    label: Diagnostic accuracy study
    signals:
      - {phrase: diagnostic accuracy, weight: 4}
      - {phrase: sensitivity and specificity, weight: 4}
      - {phrase: reference standard, weight: 4}
      - {phrase: index test, weight: 4}
    pointer: >-
      The ROBINS-I paper names QUADAS 2 as the risk-of-bias tool for diagnostic test accuracy
      studies (the tool itself was not read, so no questions are bundled).
    source: robins_i
  - id: case_report_series
    label: Case report or case series
    signals:
      - {phrase: case report, weight: 4}
      - {phrase: case series, weight: 4}
    pointer: >-
      No appraisal instrument for case reports or series was read. Treat it as the weakest
      kind of evidence about effects and use it to generate questions, not to answer them.
    source: null
  - id: economic_evaluation
    label: Economic evaluation (cost-effectiveness, cost-benefit)
    signals:
      - {phrase: cost effectiveness, weight: 4}
      - {phrase: cost benefit, weight: 4}
      - {phrase: cost utility, weight: 4}
      - {phrase: qaly, weight: 3}
    pointer: >-
      No economic evaluation checklist was read. Reporting guidelines for each design are listed
      by the EQUATOR Network (equator-network.org, named in the SQUIRE 2.0 paper; not reached
      from the build environment).
    source: squire
  - id: clinical_guideline
    label: Clinical practice guideline
    signals:
      - {phrase: practice guideline, weight: 4}
      - {phrase: consensus statement, weight: 3}
      - {phrase: guideline development, weight: 3}
    pointer: >-
      No guideline appraisal instrument was read. Check how the guideline rated its evidence
      (for example with GRADE) and use the systematic review questions for the reviews it relies on.
    source: null

# ---------------------------------------------------------------------------------------------
# Questions. `designs` lists the designs a question applies to. `response` names the answer
# scale. `in_overall` marks the questions that feed the instrument's own overall rating
# (rob_table3, robins_table2, amstar2_box2). `critical` marks AMSTAR 2's critical domains.
# `na_allowed` allows "not_applicable" on a yes_partial_no question.
questions:
  # ---- Randomised trial: Cochrane 2011 risk-of-bias domains (judge each main outcome)
  - id: rct_sequence
    designs: [randomized_trial]
    domain: Selection bias
    text: "Random sequence generation: how well does the report show that the allocation sequence was produced by a method that should give comparable groups?"
    look_for: "The method used to generate the sequence, in enough detail to judge it; give your judgment as low, unclear, or high risk."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1, random sequence generation"
    confidence: high
  - id: rct_concealment
    designs: [randomized_trial]
    domain: Selection bias
    text: "Allocation concealment: could the people enrolling participants have foreseen the next assignment before or during enrolment?"
    look_for: "How the sequence was hidden until assignment (for example central allocation). Low risk means it could not be foreseen."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1, allocation concealment"
    confidence: high
  - id: rct_blind_participants
    designs: [randomized_trial]
    domain: Performance bias
    text: "Blinding of participants and personnel: were they kept unaware of which intervention was given, or, if that was impossible, is it unlikely that knowing changed what they did or reported?"
    look_for: "Any measures taken to blind, and whether the blinding was effective. Not being able to blind does not make a trial 'low quality', but outcomes that depend on knowing the assignment may still be at risk."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1 and principle 3 (blinding of participants and personnel)"
    confidence: high
  - id: rct_blind_outcome
    designs: [randomized_trial]
    domain: Detection bias
    text: "Blinding of outcome assessment: were the people who assessed the outcome unaware of the assigned intervention, or is the outcome unlikely to be influenced by that knowledge?"
    look_for: "Who measured the outcome and what they knew. Judge each main outcome separately (the tool is outcome-specific)."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1 (blinding of outcome assessment) and principle 7"
    confidence: high
  - id: rct_attrition
    designs: [randomized_trial]
    domain: Attrition bias
    text: "Incomplete outcome data: is the amount, nature, and handling of missing outcome data unlikely to distort the result?"
    look_for: "Numbers lost in each group compared with those randomised, reasons, and whether anyone was excluded from the analysis. Reported to be the hardest domain to judge."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1, incomplete outcome data; evaluation of initial implementation"
    confidence: high
  - id: rct_reporting
    designs: [randomized_trial]
    domain: Reporting bias
    text: "Selective outcome reporting: is it unlikely that outcomes were picked for reporting because of their results?"
    look_for: "Compare the outcomes named in the trial registration or protocol with those reported. Changes to outcomes after the trial started should be stated (CONSORT 2010 item 6)."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1, selective reporting"
    confidence: high
  - id: rct_other
    designs: [randomized_trial]
    domain: Other bias
    text: "Other sources of bias: is the trial free of other important concerns about bias (ideally ones you decided to look for in advance, such as problems specific to the trial design)?"
    look_for: "Anything not covered above, for example an inadequate washout period in a crossover trial."
    response: risk_3
    in_overall: true
    source: rob
    section: "Table 1, other bias; principle 5"
    confidence: medium
  # ---- Randomised trial: reporting and applicability (not part of the risk-of-bias judgment)
  - id: rct_analysis_groups
    designs: [randomized_trial]
    domain: Reporting and applicability (not part of the risk-of-bias judgment)
    text: "Were participants analysed in the groups they were assigned to, and is it clear how many were included in each analysis?"
    look_for: "CONSORT 2010 item 16 asks for the numbers analysed and for keeping participants in their original groups instead of the loosely used term 'intention to treat'."
    response: yes_no
    source: consort
    section: "Box 2, item 16 (numbers analysed)"
    confidence: medium
  - id: rct_registered
    designs: [randomized_trial]
    domain: Reporting and applicability (not part of the risk-of-bias judgment)
    text: "Is the trial registered and its protocol available, so that what was planned can be compared with what was reported?"
    response: yes_no
    source: consort
    section: "Box 2, items 23 and 24"
    confidence: medium
  - id: rct_harms
    designs: [randomized_trial]
    domain: Reporting and applicability (not part of the risk-of-bias judgment)
    text: "Are harms reported as well as benefits, and does the interpretation match the results?"
    response: yes_no
    source: consort
    section: "Box 2, items 19 and 22"
    confidence: medium
  - id: rct_effect_scale
    designs: [randomized_trial]
    domain: Reporting and applicability (not part of the risk-of-bias judgment)
    text: "For yes-or-no outcomes, are both relative and absolute effects given, so you can judge how large the effect is for people like yours?"
    response: yes_no
    source: consort
    section: "Box 2, item 17b"
    confidence: medium
  - id: rct_funding
    designs: [randomized_trial]
    domain: Reporting and applicability (not part of the risk-of-bias judgment)
    text: "Are the sources of funding stated, and have you considered whether they could have influenced the results?"
    response: yes_no
    source: consort
    section: "Box 2, item 25"
    confidence: medium
  - id: rct_applicability
    designs: [randomized_trial]
    domain: Reporting and applicability (not part of the risk-of-bias judgment)
    text: "Do the participants, setting, intervention, and outcomes match your population and question closely enough to apply the result?"
    look_for: "The Cochrane tool deliberately keeps applicability and precision separate from risk of bias (principle 2). A small, well-run trial can be unbiased but imprecise."
    response: yes_no
    source: rob
    section: "Principle 2 (internal validity, external validity, and precision are separate)"
    confidence: high
  # ---- Non-randomised intervention study: ROBINS-I domains
  - id: nrsi_target
    designs: [non_randomized_intervention]
    domain: Planning
    text: "Before judging the domains, did you write down the 'target trial' (population, intervention, comparator, outcomes) and the main confounders and co-interventions to look for?"
    response: yes_no
    source: robins_i
    section: "The target trial; planning the risk of bias assessment"
    confidence: high
  - id: nrsi_confounding
    designs: [non_randomized_intervention]
    domain: Before the intervention
    text: "Bias due to confounding: how well were the factors that predict both the outcome and which intervention people received measured and controlled (in the design or analysis)?"
    look_for: "Only exceptionally is a non-randomised study low risk from confounding. Judge low, moderate, serious, critical, or no information."
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias due to confounding; table 2"
    confidence: medium
  - id: nrsi_selection
    designs: [non_randomized_intervention]
    domain: Before the intervention
    text: "Bias in selection of participants: could leaving out eligible people, or starting follow-up at different times, be related to both the intervention and the outcome (for example including only people already on the intervention)?"
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias in selection of participants into the study"
    confidence: medium
  - id: nrsi_classification
    designs: [non_randomized_intervention]
    domain: At the intervention
    text: "Bias in classification of interventions: was intervention status defined and recorded the same way for everyone, without being influenced by the outcome?"
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias in classification of interventions"
    confidence: medium
  - id: nrsi_deviations
    designs: [non_randomized_intervention]
    domain: After the intervention
    text: "Bias due to deviations from the intended intervention: were there systematic differences between groups in other care received (co-interventions), or in adherence if the question is about starting and sticking with the intervention?"
    look_for: "The answer depends on whether the effect of interest is that of being assigned or starting the intervention, or of starting and adhering to it."
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias due to deviations from intended interventions; the effect of interest"
    confidence: medium
  - id: nrsi_missing
    designs: [non_randomized_intervention]
    domain: After the intervention
    text: "Bias due to missing data: is missing follow-up, or missing information on intervention status or confounders, unlikely to be related to prognosis or to differ between groups?"
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias due to missing data"
    confidence: medium
  - id: nrsi_measurement
    designs: [non_randomized_intervention]
    domain: After the intervention
    text: "Bias in measurement of outcomes: were outcomes measured the same way in every group, by assessors who did not know intervention status, or are measurement errors unrelated to the intervention?"
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias in measurement of outcomes"
    confidence: medium
  - id: nrsi_reporting
    designs: [non_randomized_intervention]
    domain: After the intervention
    text: "Bias in selection of the reported result: is it unlikely that the reported result was chosen from several outcomes or analyses because of what it showed?"
    response: risk_4
    in_overall: true
    source: robins_i
    section: "Table 1, bias in selection of the reported result"
    confidence: medium
  - id: nrsi_applicability
    designs: [non_randomized_intervention]
    domain: Applicability (not part of the risk-of-bias judgment)
    text: "Do the participants, setting, intervention, and outcomes match your population and question closely enough to apply the result?"
    look_for: "ROBINS-I treats bias as distinct from generalisability to people who were not in the study."
    response: yes_no
    source: robins_i
    section: "The target trial (bias is distinct from generalisability)"
    confidence: medium
  # ---- Cohort, case-control, and cross-sectional studies: STROBE-based prompts
  - id: obs_design_question
    designs: [cohort, case_control, cross_sectional]
    domain: Question and design
    text: "Is the study design stated early, and are the objectives or hypotheses specific?"
    response: yes_no
    source: strobe_ee
    section: "Items 1a, 3, and 4"
    confidence: high
  - id: obs_setting
    designs: [cohort, case_control, cross_sectional]
    domain: Participants and setting
    text: "Are the setting, locations, and relevant dates (recruitment, exposure, follow-up, data collection) described?"
    response: yes_no
    source: strobe_ee
    section: "Item 5"
    confidence: high
  - id: obs_selection_cohort
    designs: [cohort]
    domain: Participants and setting
    text: "Are the eligibility criteria and how participants were selected and followed described?"
    response: yes_no
    source: strobe_ee
    section: "Item 6a (cohort)"
    confidence: high
  - id: obs_selection_cc
    designs: [case_control]
    domain: Participants and setting
    text: "Are the sources and methods for finding cases and choosing controls given, with the reason for choosing them, and do the controls represent the population the cases came from?"
    response: yes_no
    source: strobe_ee
    section: "Item 6a (case-control) and Box 1"
    confidence: high
  - id: obs_selection_xs
    designs: [cross_sectional]
    domain: Participants and setting
    text: "Are the eligibility criteria and the sources and methods of selecting participants described, with the response rate?"
