# How an instrument's own overall rating is formed from the answers marked in_overall.
overall_methods:
  rob_table3:
    label: Summary risk of bias within a trial (2011 Cochrane tool, table 3)
    rule: "Low risk of bias if every key domain is low; high if any key domain is high; otherwise unclear."
    source: rob
    section: "Table 3, within a trial"
    note: >-
      The paper leaves the choice of key domains to the review team (for example blinding of
      participants matters most for subjective outcomes). Unless you name key domains, all seven
      domains count. The paper says to judge each main outcome separately and not to use quality
      scores.
  robins_table2:
    label: Overall risk of bias for an outcome (ROBINS-I, table 2)
    rule: "Low if every domain is low; moderate if domains are low or moderate; serious if at least one domain is serious and none is critical; critical if any domain is critical; no information when there is no clear sign of serious or critical risk but information is missing in key domains."
    source: robins_i
    section: "Table 2"
    note: "A judgment is still required when information is missing (the table says so); this tool reports 'no information' and leaves that call to you."
  amstar2_box2:
    label: Overall confidence in the review's results (AMSTAR 2, box 2)
    rule: "High: no or one non-critical weakness. Moderate: more than one non-critical weakness and no critical flaw. Low: one critical flaw. Critically low: more than one critical flaw."
    source: amstar2
    section: "Box 2 and box 1 (critical domains: items 2, 4, 7, 9, 11, 13, 15)"
    note: >-
      AMSTAR 2's authors strongly recommend against adding the item ratings into a score, and
      say the scheme is advisory and appraisers may add or substitute critical domains. Here a
      'no' answer is a flaw or weakness; a 'partial yes' is listed but not counted (how the
      user guide counts it was not read; confidence low).
