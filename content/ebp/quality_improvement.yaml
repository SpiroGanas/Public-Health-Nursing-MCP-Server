# Quality improvement planning content for plan_quality_improvement (EBP-05): the Model for
# Improvement and its three questions, aim statements, outcome/process/balancing measures,
# driver diagrams, fishbone diagrams, process maps, PDSA cycles, run chart and control chart
# rules, and the SQUIRE 2.0 reporting checklist (paraphrased).
#
# REVIEW STATUS: pending. Drafted from the open-access articles listed under `sources`, which
# were read in full through NCBI E-utilities on 2026-11-12. IHI's own pages (ihi.org) and
# squire-statement.org were NOT reachable from the build environment, so nothing here was read
# from IHI or the SQUIRE website; items that rest on general knowledge of the IHI approach are
# marked confidence: low. Schema: content/schemas/ebp_quality_improvement.schema.json
meta:
  id: ebp-quality-improvement
  title: Quality improvement planning (Model for Improvement, PDSA, run charts, SQUIRE 2.0)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: "SQUIRE 2.0 (Standards for QUality Improvement Reporting Excellence): revised publication guidelines from a detailed consensus process. BMJ Qual Saf 2016;25:986-992"
    publisher: BMJ Publishing Group (article open access, CC BY-NC 4.0 per PubMed Central)
    url: https://doi.org/10.1136/bmjqs-2015-004411
  related_sources:
    - title: "Integrating theory and practice: the core components guide for rigorous quality improvement design. Front Health Serv 2026;6:1751580"
      publisher: Frontiers Media (CC BY 4.0)
      url: https://doi.org/10.3389/frhs.2026.1751580
    - title: "Run charts revisited: a simulation study of run chart rules for detection of non-random variation in health care processes. PLoS One 2014;9:e113825"
      publisher: Public Library of Science (CC BY 4.0)
      url: https://doi.org/10.1371/journal.pone.0113825
    - title: "Systematic review of the application of the plan-do-study-act method to improve quality in healthcare. BMJ Qual Saf 2014;23:290-298"
      publisher: BMJ Publishing Group (CC BY-NC 3.0)
      url: https://doi.org/10.1136/bmjqs-2013-001862
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Read in full on 2026-11-12 through NCBI E-utilities (PubMed Central full text): the SQUIRE 2.0
    article (all 18 items), the core components guide for QI design (Model for Improvement
    questions, aim attributes, measure families, driver diagrams), two run chart papers (shift,
    trend, and too-few-runs rules; the published prediction-limit table), the PDSA systematic
    review (stages and application criteria), a fishbone diagram primer, and two QI methods
