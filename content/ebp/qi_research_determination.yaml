# Decision logic and document template for qi_vs_research_determination (EBP-07): is a project
# quality improvement, program evaluation, public health practice or surveillance, or possible
# human subjects research? Screening questions with their sources, category descriptions, and the
# project description / IRB determination request template.
#
# REVIEW STATUS: pending. Drafted from the sources below, all read on 2026-11-12 (OHRP's own QI
# FAQ pages on hhs.gov and the CDC and PubMed web pages for the Hastings Center framework could not
# be read; see verification_note). This is decision support: the institution's IRB decides.
# Schema: content/schemas/ebp_qi_research_determination.schema.json
meta:
  id: ebp-qi-research-determination
  title: QI versus research determination (45 CFR 46, CDC guidelines, QI ethics literature)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2018-07-19
  source:
    title: "45 CFR 46.102 Definitions for purposes of this policy (Common Rule, 2018 requirements)"
    publisher: U.S. Department of Health and Human Services, Office for Human Research Protections (text from the eCFR)
    url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-A/part-46/subpart-A/section-46.102
  related_sources:
    - title: Guidelines for Defining Public Health Research and Public Health Non-Research (revised October 4, 1999)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/scientific-integrity/media/pdfs/2024/10/defining-public-health-research-non-research-1999.pdf
    - title: The ethics of using quality improvement methods in health care (Ann Intern Med 2007;146:666-73), abstract
      publisher: National Library of Medicine (PubMed)
      url: https://pubmed.ncbi.nlm.nih.gov/17438310/
    - title: Determining when quality improvement initiatives should be considered research (JAMA 2000;283:2275-80), abstract
      publisher: National Library of Medicine (PubMed)
      url: https://pubmed.ncbi.nlm.nih.gov/10807388/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The regulatory definitions (45 CFR 46.101, .102, .104, .109, current eCFR text, last amended
    2018-07-19) and the CDC guidelines (the 1999 revision, the version CDC still posts; it was
    written under the 1991 Common Rule, before the 2018 public health surveillance exclusion) were
    read in full (high confidence for what they say). The Hastings Center framework (Ann Intern Med
    2007) and the JAMA 2000 criteria were read as PubMed abstracts only, because the full texts are
    not open (medium confidence; the tool does not reproduce either framework's detailed
    characteristics). OHRP's quality improvement FAQ pages (hhs.gov) could not be read (blocked), so
    OHRP guidance beyond the regulation text is not summarized. The screening questions and the
    rules that turn answers into a provisional category are THIS PROJECT'S synthesis of those
    sources (medium confidence); they are not an OHRP decision chart. Nothing here describes any
    Massachusetts institution's IRB policy, forms, or categories.

