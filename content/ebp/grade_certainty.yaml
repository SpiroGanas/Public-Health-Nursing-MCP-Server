# GRADE certainty-of-evidence domains and GRADE-CERQual components for appraise_evidence (EBP-03).
# The tool never rates evidence itself: it lists the questions GRADE asks, takes the nurse's
# judgment for each domain, and adds up the nurse's rating changes from the starting level.
#
# REVIEW STATUS: pending. Drafted 2026-11-12 from PubMed abstracts (retrieved through the NCBI
# E-utilities) of the GRADE guidelines series (J Clin Epidemiol 2011-2013) and the Core GRADE
# series (BMJ 2025), the full text of GRADE guidance 24 (2022), and the full text of the
# GRADE-CERQual series (Implementation Science 2018).
# Schema: content/schemas/ebp_grade_certainty.schema.json
meta:
  id: ebp-grade-certainty
  title: GRADE certainty of evidence and GRADE-CERQual confidence in qualitative findings
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: "GRADE guidelines: 3. Rating the quality of evidence (J Clin Epidemiol 2011)"
    publisher: Journal of Clinical Epidemiology
    url: https://pubmed.ncbi.nlm.nih.gov/21208779/
  related_sources:
    - title: Core GRADE 1 to 7 (BMJ 2025)
      publisher: BMJ
      url: https://pubmed.ncbi.nlm.nih.gov/40262844/
    - title: Applying GRADE-CERQual to qualitative evidence synthesis findings, introduction and paper 2 (Implementation Science 2018)
      publisher: Implementation Science
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5791040/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The GRADE Handbook and the BMJ Core GRADE full texts were not reachable from the build
    environment (the GRADE and BMJ sites were blocked; the JCE series and Core GRADE are not in
    PubMed Central), so the domain descriptions come from PubMed ABSTRACTS only, which state the
    main points but not every detail. Items marked confidence low are not stated in the text that
    was read: the number of levels to rate down for a serious or very serious concern in the
    domains other than indirectness, and the levels to rate up for a dose-response gradient or
    opposing plausible confounding. The wording of the four certainty levels beyond "our
    confidence that the estimate of effect is correct" was not verified. The CERQual definitions
    are from the full text (high confidence). Check the current GRADE Handbook before relying
    on a rating, and remember GRADE ratings are judgments, not sums.

