standing_order:
  signed: 2026-07-13
  authority: "Issued under M.G.L. c. 94C, s. 19B (as amended by chapter 208 of the acts of 2018): authorizes licensed pharmacists to dispense naloxone rescue kits to a person at risk of an opioid-related overdose, or a family member, friend, or other person in a position to assist."
  formulations:
    - name: Naloxone 4 mg/0.1 mL nasal spray
      dispense: 2 doses
      directions: Administer a single spray in one nostril. Repeat after 3 minutes if no or minimal response.
    - name: Naloxone 4 mg/0.25 mL nasal spray
      dispense: 2 doses
      directions: Administer a single spray in one nostril. Repeat after 3 minutes if no or minimal response.
    - name: Naloxone 2 mg/2 mL single-dose Luer-Jet prefilled syringe with a mucosal atomization device (MAD 300) per dose
      dispense: 2 doses
      directions: Spray 1 mL in each nostril. Repeat after 3 minutes if no or minimal response.
    - name: Naloxone 3 mg/0.1 mL nasal spray
      dispense: 2 doses
      directions: Administer a single spray in one nostril. Repeat after 3 minutes if no or minimal response.
    - name: Naloxone 0.4 mg/mL in 1 mL single-dose vial, with a 3 cc, 25 gauge, 1-inch syringe per dose
      dispense: 2 doses
      directions: Inject 1 mL IM in shoulder or thigh. Repeat after 3 minutes if no or minimal response.
  why_preferred: "These doses and formulations are preferred because they give the best combination of effectiveness at displacing fentanyl, titratability when multiple doses are needed, and minimizing the risk of naloxone-precipitated withdrawal."

access:
  - text: "Anyone can get naloxone at a pharmacy counter without a prescription under the statewide standing order; the pharmacy can bill insurance, including MassHealth. Some stores sell it on the shelf (not covered by insurance)."
    source: pharmacy_page
    section: How?
  - text: "MassHealth members have no co-pay for naloxone. Most private Massachusetts-based insurers must fully cover it without a co-pay; insurers based outside Massachusetts may not."
    source: naloxone_faq
    section: Where to get naloxone
  - text: "BSAS-approved naloxone distribution programs (OEND and the Community Naloxone Program) train people and give out naloxone rescue kits; find them on DPH's Naloxone Program Locator map."
    source: naloxone_locator
    section: Naloxone Program Locator
  - text: "Naloxone can be ordered for home delivery through DPH's You Can Save a Life website, which also has short training videos."
    source: naloxone_faq
    section: Where to get naloxone
  - text: "State and municipal agencies (such as police, fire departments, and public schools) can buy naloxone through the State Office of Pharmacy Services at the public interest price; some organizations qualify for the DPH Community Naloxone Program."
    source: naloxone_faq
    section: Where to get naloxone
  - text: "Naloxone products should be stored at room temperature (68-77 F) away from direct sunlight. If naloxone is frozen during an overdose, do not wait for it to thaw: call 911 and give rescue breaths. Expired naloxone will likely still work and should be used if it is all you have."
    source: naloxone_faq
    section: Product information

pharmacy_rules:
  - text: "Massachusetts pharmacies must stock naloxone and keep a continuous, sufficient supply (M.G.L. c. 94C, s. 19C)."
    source: pharmacy_policy
    section: Policy 2024-01 (introduction)
  - text: "The pharmacy must offer to dispense naloxone whenever a Schedule II opioid is dispensed."
    source: pharmacy_policy
    section: I.C
  - text: "There is no regulatory limit on the amount of naloxone that may be dispensed to one person, although insurance may limit coverage."
    source: pharmacy_policy
    section: I.F
  - text: "The pharmacy must counsel the person and give an Opioid Antagonist Information Pamphlet (for example DPH's Stop an Overdose wallet card in English, Portuguese, and Spanish)."
    source: pharmacy_policy
    section: I.G

legal:
  - text: "The standing order's statute protects practitioners prescribing or dispensing naloxone from criminal or civil liability or professional discipline (M.G.L. c. 94C, s. 19B(f)) and gives criminal and civil immunity to anyone who, in good faith, gives an opioid antagonist to a person who appears to be having an opioid-related overdose (s. 19B(g))."
    source: standing_order
    section: Introduction
  - text: "The Good Samaritan law (M.G.L. c. 94C, s. 34A) protects a person who seeks medical help for an overdose, and the person overdosing, from charges for possession of controlled substances. DPH's training notes that it does not protect against losing public housing, arrest on prior warrants, or Department of Children and Families involvement if children are present."
    source: oend_competencies
    section: Recognizing and Responding to an Opioid Overdose (Call 9-1-1)

