fentanyl_test_strips:
  - text: "Fentanyl test strips are inexpensive and typically give results within 5 minutes. Even if a test is negative, take caution: strips might not detect more potent fentanyl-like drugs such as carfentanil."
    source: cdc_fentanyl
    section: Fentanyl and overdose
    confidence: high
  - text: "Drugs may contain deadly levels of fentanyl that cannot be seen, tasted, or smelled; it is nearly impossible to tell without testing."
    source: cdc_fentanyl
    section: Fentanyl and overdose
    confidence: high
  - text: "Program staff can order fentanyl test strips through DPH's Bureau of Substance Addiction Services; the order link is under 'Program Resources' on DPH's Stop an Overdose with Naloxone page."
    source: naloxone_landing
    section: Program Resources
    confidence: medium
  - text: "Legal status not confirmed: the drug paraphernalia definition in M.G.L. c. 94C, s. 1, as published on malegislature.gov (retrieved 2026-11-08), includes testing equipment used to identify or analyze controlled substances. Whether a later law exempts fentanyl test strips or other drug-checking supplies could not be confirmed. Check with agency counsel before advising on legality."
    source: mgl_94c_1
    section: Drug paraphernalia, clause (4)
    confidence: low
  - text: "DPH points to the Massachusetts Drug Supply Data Stream (streetcheck.org) for current drug-checking results, including fentanyl and xylazine."
    source: risk_factors
    section: Information on fentanyl
    confidence: medium

risk_factors:
  - text: "Changes in tolerance from not using or using less, such as after a hospital stay, jail, or a period of less or no opioid use."
    source: risk_factors
    section: Risk factors
  - text: "Changes in the drug supply."
    source: risk_factors
    section: Risk factors
  - text: "Mixing opioids with alcohol or benzodiazepines, or with stimulants such as cocaine and methamphetamine."
    source: risk_factors
    section: Risk factors
  - text: "Chronic health conditions such as HIV, hepatitis C, lung disease, or heart disease, and a history of past overdoses."
    source: risk_factors
    section: Risk factors
  - text: "Stopping methadone, buprenorphine, or naltrexone raises overdose risk for several weeks; taking them as prescribed is protective."
    source: oend_competencies
    section: Preventing Overdose

teaching_script:
  - step: Recognize an overdose
    text: "Signs of an opioid overdose: no response when you shout or rub the breastbone; slow breathing (fewer than 8 breaths a minute) or no breathing; deep snoring or gurgling; blue, purple, or gray lips and fingertips; pinpoint pupils. Someone who is very high still responds and breathes 8 or more times a minute. If you are not sure, treat it as an overdose."
    sources: [oend_competencies, cdc_response]
  - step: Try to wake the person
    text: "Call the person's name, tap their shoulders, then rub your knuckles hard up and down the breastbone (sternal rub). If there is no response, act as if it is an overdose."
    sources: [oend_competencies]
  - step: Call 911
    text: "Call 911. The person needs medical care even if they wake up, because naloxone wears off in 30 to 90 minutes and the opioid can last longer. Massachusetts' Good Samaritan law protects the caller and the person overdosing from drug possession charges."
    sources: [oend_competencies]
  - step: Give naloxone
    text: "Nasal spray: peel open the package, hold the device with your thumb on the plunger and two fingers on the nozzle, put the tip in one nostril until your fingers touch the nose, and press the plunger firmly. Injectable: inject 1 mL into the shoulder or thigh. If there is no or minimal response after 3 minutes, give a second dose. Fentanyl overdoses may need more than one dose."
    sources: [standing_order, oend_competencies, cdc_naloxone]
  - step: Support breathing
    text: "Between doses, if you are trained and able: check that the mouth is clear, tilt the head back, lift the chin, pinch the nose, and give 1 breath every 5 seconds. If you are trained in CPR, give chest compressions. Stop when the person is breathing 8 or more times a minute on their own."
    sources: [oend_competencies]
  - step: Recovery position and stay
    text: "If the person is breathing, lay them on their side so they do not choke. Stay until help arrives (CDC: until emergency help arrives or for at least 4 hours) and tell responders how many doses you gave. If you must leave, give naloxone first, put the person in the recovery position, and leave the rest of the naloxone next to them."
    sources: [oend_competencies, cdc_naloxone, cdc_response]
  - step: When they wake up
    text: "Explain that they overdosed and you gave naloxone. Naloxone can cause sudden withdrawal (anxiety, chills, nausea, vomiting, cravings). Encourage them not to use again for several hours, because the overdose can return when naloxone wears off."
    sources: [oend_competencies]
  - step: Safety plan
    text: "Carry naloxone and tell others where it is (you cannot use it on yourself). Avoid using alone: use with someone who has naloxone, take turns, or call the Massachusetts Overdose Prevention Helpline (Never Use Alone New England), 1-800-972-0590. Assume drugs may contain fentanyl, start low and go slow, and avoid mixing opioids with alcohol or benzodiazepines."
    sources: [risk_factors, oend_competencies, cdc_naloxone]
