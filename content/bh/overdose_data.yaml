definitions:
  - id: dph_opioid_related
    text: "DPH town table: opioid-related overdose deaths of all intents (unintentional, undetermined, and suicide). Underlying cause X40-X44, X60-X64, X85, or Y10-Y14 with any of T40.0-T40.4 or T40.6 among the multiple causes (CDC's case definition, used by DPH since August 2019). Opioids include heroin, illicitly manufactured fentanyl, prescription opioids, and unspecified opioids."
    source: dph_town_table
    section: Technical Notes
  - id: dph_bases
    text: "DPH's Table 1 counts deaths by the decedent's city or town of residence (Massachusetts residents only); Table 2 counts deaths by the city or town where the death occurred (including non-residents; residents who died outside Massachusetts are listed as 'Out of Massachusetts')."
    source: dph_town_table
    section: Note to Readers
  - id: cdc_state
    text: "CDC state counts are provisional numbers of drug overdose deaths in the 12 months ending in the month shown, counted by the jurisdiction where the death occurred. Predicted values adjust for reporting delays. Reporting of specific drugs varies by jurisdiction, so CDC advises against comparing drug-specific death rates between jurisdictions."
    source: cdc_vsrr_page
    section: Dataset description
  - id: cdc_county
    text: "CDC county counts are provisional drug overdose deaths (all drugs) in the 12 months ending in the month shown, by county of residence. Counts of 1-9 are suppressed under NCHS confidentiality standards."
    source: cdc_vsrr_county
    section: Dataset description
  - id: dph_2024_method
    text: "DPH's 2024 report counts 'opioid-involved' overdose deaths with updated methods; its numbers differ slightly from the earlier 'opioid-related' town table, and all death data are preliminary until DPH's Annual Death Report."
    source: dph_2024_report
    section: "Data Sources (p. 6); Overview (p. 7)"

rules:
  rate_min_deaths: 5
  rate_min_deaths_source: "DPH 2024 report p. 14: a rate 'is not calculated ... due to low death count (fewer than 5 deaths) rendering the rate unstable.'"
  county_suppression: "NCHS suppresses county counts of 1-9 (gb4e-yj24 dataset description)."

findings_2024:
  - text: "In 2024, 1,667 Massachusetts residents died from a drug overdose; 80% (1,336) were opioid-involved, about 19 opioid-involved overdose deaths per 100,000 residents."
    source: dph_2024_report
    section: "Overview of overdoses in Massachusetts, p. 7"
  - text: "From 2023 to 2024, opioid-involved overdose deaths in Massachusetts decreased by 37%."
    source: dph_2024_report
    section: "Hypotheses for the 2024 drop in overdose deaths, p. 8"
  - text: "In 2024 there were 14,678 opioid-involved EMS incidents, a 19% drop from 2023."
    source: dph_2024_report
    section: "Overview of overdoses in Massachusetts, p. 7"
  - text: "In 2024, all racial and ethnic groups saw a decrease in opioid-involved overdose deaths for the first time since 2010, but inequities persist: Black non-Hispanic residents made up 6% of all deaths in Massachusetts but 10% of opioid-involved overdose deaths, and Hispanic residents 5% of all deaths but 17% of opioid-involved overdose deaths."
    source: dph_2024_report
    section: "Race and Hispanic ethnicity, p. 14"
  - text: "In 2024, Suffolk (212 deaths) and Middlesex (193) Counties had the most residents who died of an opioid-involved overdose; Boston (171), Springfield (83), and Worcester (68) had the most among cities."
    source: dph_2024_report
    section: "Geography and rurality, p. 17"
  - text: "Berkshire, Hampden, and Suffolk Counties had the highest age-adjusted rates in 2024; North Adams (81.4 per 100,000), Salisbury (68.2), and Pittsfield (55.6) had the highest town rates. 2024 was the first year since 2018 that rates in rural areas dipped below rates in urban areas."
    source: dph_2024_report
    section: "Geography and rurality, pp. 17-18"
