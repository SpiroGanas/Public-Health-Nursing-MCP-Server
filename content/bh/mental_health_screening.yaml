meta:
  id: bh-mental-health-screening
  title: Mental health screening instruments (PHQ-2, PHQ-9, GAD-2, GAD-7, EPDS, NIMH ASQ, C-SSRS screener)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: null
  source:
    title: Ask Suicide-Screening Questions (ASQ) Toolkit
    publisher: National Institute of Mental Health (NIMH)
    url: https://www.nimh.nih.gov/research/research-conducted-at-nimh/asq-toolkit-materials
  related_sources:
    - title: "Kroenke K, Spitzer RL, Williams JB. The PHQ-9: validity of a brief depression severity measure. J Gen Intern Med. 2001;16(9):606-13"
      publisher: PubMed (National Library of Medicine)
      url: https://pubmed.ncbi.nlm.nih.gov/11556941/
    - title: "Kroenke K, Spitzer RL, Williams JB, Löwe B. The PHQ somatic, anxiety, and depressive symptom scales: a systematic review. Gen Hosp Psychiatry. 2010;32(4):345-59"
      publisher: PubMed (National Library of Medicine)
      url: https://pubmed.ncbi.nlm.nih.gov/20633738/
    - title: "Cox JL, Holden JM, Sagovsky R. Detection of postnatal depression: development of the 10-item Edinburgh Postnatal Depression Scale. Br J Psychiatry. 1987;150:782-6"
      publisher: PubMed (National Library of Medicine)
      url: https://pubmed.ncbi.nlm.nih.gov/3651732/
    - title: The Columbia Protocol (C-SSRS)
      publisher: Suicide Prevention Resource Center
      url: https://sprc.org/resources/c-ssrs-columbia-suicide-severity-rating-scale-screener-training/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted 2026-11-08. NIMH ASQ items, scoring, result categories, and next steps are transcribed
    from the NIMH screening tool (dated 9/29/25), information sheet (7/1/2020), adult outpatient
    Brief Suicide Safety Assessment (12/8/2025), and youth outpatient pathway (11/10/2021) (high
    confidence). PHQ-9, PHQ-2, GAD-7, and GAD-2 cutoffs come from the developers' published
    abstracts (PubMed; high confidence). The PHQ publisher's site (phqscreeners.com) could not be
    reached, so PHQ and GAD item wording is NOT bundled; items are listed by topic only, and the
    PHQ license statement is recorded from the forms with medium confidence. EPDS scoring and
    cut-points come from secondary sources in PubMed Central (medium confidence); EPDS wording is
    not bundled. The Columbia Lighthouse Project's site (cssrs.columbia.edu) could not be reached:
    C-SSRS screener wording is not bundled, and its risk levels come from a peer-reviewed
    description (PMC10291825, medium confidence). Safety-alert rules for PHQ-9 item 9 and EPDS
    item 10 (any non-zero response) follow the product owner's brief and common practice (medium
    confidence). Not a diagnosis tool.

