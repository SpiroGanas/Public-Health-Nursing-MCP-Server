  verification_note: >-
    Drafted 2026-11-09. The steps are short paraphrases of After a Suicide: A Toolkit for Schools
    (2nd edition, 2018) with page numbers (high confidence that each reflects the toolkit). License
    (from the toolkit's copyright page): "This publication may be copied, reproduced, and
