    excerpting a portion of the material for publication, please contact permissions@edc.org." The
    message templates are therefore the developer's own drafts that follow the toolkit's
    structure; they do not reproduce the toolkit's sample statements, which agencies can use
    directly from the PDF with the required credit. The toolkit lists the former Lifeline number;
    templates use 988 (DPH). The nurse and the school's crisis team must review every template
    before use. Toolkit copyright: (c) 2018 Education Development Center and American Foundation
    for Suicide Prevention.

