surveys:
  - id: MYHS
    name: Massachusetts Youth Health Survey
    text: "DPH's surveillance survey of students in grades 6-12, run with DESE in randomly selected public middle and high schools every odd-numbered year; weighted to represent all Massachusetts public middle and high school students. In 2025, 1,897 high school and 3,135 middle school students completed it."
    source: myhs_2025
    section: Introduction
  - id: MYRBS
    name: Massachusetts Youth Risk Behavior Survey
    text: "The Massachusetts YRBS (high school), reported with the MYHS in DPH's joint report; high school results in the joint report are from the MYRBS unless marked as MYHS, and all middle school results are from the MYHS."
    source: joint_2023
    section: "Data Tables: Analysis and Statistics Presented"
  - id: CDC
    name: CDC Youth Risk Behavior Surveillance System
    text: "CDC's state and national YRBS estimates of mental health indicators for high school students (Massachusetts YRBS and the national YRBS, 2019-2023), with 95% confidence intervals."
    source: cdc_yrbs_mh
    section: Dataset description

notes:
  - text: "Data are not presented if the underlying sample size is less than 100 respondents and/or the relative standard error is above 30%."
    source: joint_2023
    section: "Data Tables: Analysis and Statistics Presented"
  - text: "Statistically significant differences between percent estimates can be determined if their 95% confidence intervals do not overlap."
    source: joint_2023
    section: "Data Tables: Analysis and Statistics Presented"
  - text: "Data are self-reported by public school students; students in private schools, state custody, or other settings are not represented, and students with severe limitations or frequent absences may be under-represented. The data are cross-sectional and should not be used to assess causality."
    source: joint_2023
    section: "Data Tables: Analysis and Statistics Presented"
  - text: "Starting in 2023 the MYHS included a nonbinary gender option; estimates for that group are unreliable and are not presented."
    source: myhs_2025
    section: Introduction

crisis:
  text: "If you or a loved one are having emotional distress or thoughts of suicide, call or text 988, or chat online, to reach the 988 Suicide and Crisis Lifeline: free, confidential, 24/7. Veterans press 1; Spanish press 2. You do not need to be suicidal to contact 988."
  source: ma_988
  section: 988 Lifeline
