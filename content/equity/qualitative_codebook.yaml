# Starter codes. Keywords are whole words, matched without case; a trailing * matches any ending
# (transport* matches transportation); a keyword with a space matches that phrase.
codes:
  - code: ACCESS_CARE
    theme: Health care access
    definition: Getting (or not getting) medical, dental, or behavioral health care, including appointments, wait times, insurance, and where to go.
    keywords: [doctor*, clinic*, appointment*, insurance, uninsured, masshealth, medicaid, "primary care", specialist*, pharmacy, prescription*, copay*, emergency room, "health center"]
    confidence: low
  - code: COST
    theme: Cost and money
    definition: Cost of care, medicine, food, or living; bills, debt, and not having enough money.
    keywords: [afford*, cost*, expensive, bill*, debt, pay, paying, paycheck, income, poor, poverty, "can't pay", wage*]
    confidence: low
  - code: HOUSING
    theme: Housing
    definition: Rent, housing quality and stability, eviction, homelessness, and crowding.
    keywords: [housing, rent, rents, landlord*, evict*, homeless*, apartment*, mold, shelter, lease, mortgage, crowded]
    confidence: low
  - code: FOOD
    theme: Food
    definition: Having, affording, or reaching healthy food; hunger; food programs.
    keywords: [food, hungry, hunger, grocer*, snap, pantry, pantries, meal*, nutrition, "fresh produce", "food stamps"]
    confidence: low
  - code: TRANSPORT
    theme: Transportation
    definition: Getting to care, work, school, or stores; buses, rides, cars, and distance.
    keywords: [transport*, bus, buses, ride*, "no car", parking, commute*, "public transit", walkable]
    confidence: low
  - code: MENTAL_HEALTH
    theme: Mental health
    definition: Stress, anxiety, depression, loneliness, trauma, and getting help for them.
    keywords: [stress*, anxi*, depress*, "mental health", lonely, loneliness, isolat*, trauma*, counsel*, therap*, worry, worried, overwhelmed, "burned out"]
    confidence: low
  - code: SUBSTANCE_USE
    theme: Substance use
    definition: Alcohol, opioids, other drugs, vaping and tobacco, overdose, and recovery.
    keywords: [opioid*, overdos*, alcohol*, drug*, addict*, recovery, fentanyl, vap*, smok*, tobacco, narcan, naloxone, sober*]
    confidence: low
  - code: SAFETY
    theme: Safety and violence
    definition: Feeling safe at home, at school, or in the neighborhood; crime, violence, and abuse.
    keywords: [safe, safety, unsafe, violence, violent, crime*, gun*, shooting*, abuse*, assault*, "domestic violence", bully*]
    confidence: low
  - code: DISCRIMINATION_TRUST
    theme: Discrimination and trust
    definition: Racism, bias, stigma, being treated differently, and trust or distrust of institutions and providers.
    keywords: [discriminat*, racis*, racial, bias*, stigma*, respect*, trust*, distrust*, "treated differently", disrespect*, immigration, deport*]
    confidence: low
  - code: LANGUAGE_CULTURE
    theme: Language and culture
    definition: Language barriers, interpreters, translated materials, and culturally fitting services.
    keywords: [language*, interpret*, translat*, bilingual, "speak english", cultur*, "plain language"]
    confidence: low
  - code: CHILDREN_SCHOOL
    theme: Children, child care, and school
    definition: Child care, school, youth, and parenting.
    keywords: ["child care", childcare, daycare, school*, teacher*, student*, teen*, youth, parent*, kids, children]
    confidence: low
  - code: WORK
    theme: Work and income
    definition: Jobs, hours, benefits, unemployment, and the effect of work on health and time.
    keywords: [job, jobs, work, working, employ*, unemploy*, shift*, schedule*, "paid leave", "sick leave", "sick days", overtime]
    confidence: low
  - code: CHRONIC_DISEASE
    theme: Chronic disease
    definition: Diabetes, heart disease, high blood pressure, cancer, asthma, obesity, and managing them.
    keywords: [diabet*, "blood pressure", hypertension, heart, cancer, asthma, obes*, cholesterol, "chronic disease", stroke]
    confidence: low
  - code: OLDER_ADULTS_CAREGIVING
    theme: Older adults and caregiving
    definition: Aging in place, dementia, home care, and caring for a family member.
    keywords: [caregiv*, elder*, senior*, dementia, alzheimer*, "home care", "nursing home", "aging in place", "falls"]
    confidence: low
  - code: ENVIRONMENT
    theme: Neighborhood and environment
    definition: Parks, sidewalks, air, water, noise, heat, and the built environment.
    keywords: [park, parks, sidewalk*, "air quality", pollution, polluted, noise, noisy, "green space", heat, flood*, "drinking water", lead]
    confidence: low
  - code: INFORMATION_NAVIGATION
    theme: Information and navigation
    definition: Knowing what services exist, how to sign up, paperwork, phone trees, and who to call.
    keywords: [information, resources, navigat*, "don't know where", "hard to find", paperwork, forms, application*, referral*, website, "phone calls"]
    confidence: low
  - code: COMMUNITY_STRENGTHS
    theme: Community strengths
    definition: "What is working: neighbors, faith and cultural groups, volunteers, local organizations, and a sense of community."
    keywords: [neighbor*, church*, mosque*, temple*, volunteer*, "community center", "come together", "look out for", supportive, friends, family, pride, proud, "mutual aid"]
    confidence: low
