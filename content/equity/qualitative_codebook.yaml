# Starter codebook and de-identification settings for analyze_qualitative_data (EQ-10).
#
# The codes below are THIS PROJECT'S OWN DRAFT: a starter list of themes that commonly come up when
# community members and key informants talk about health, with plain keywords for the tool's
# keyword matching. No published codebook was copied or used. Keyword matching is a heuristic (it
# finds words, not meaning; it cannot tell "I can't afford it" from "it is not a problem of
# affording it"). Replace it with your own codebook (a CSV or YAML file in /data) before any
# findings are reported, and read the coded excerpts yourself.
#
# REVIEW STATUS: pending. Every code is low confidence (not checked against any source).
# Schema: content/schemas/equity_qualitative_codebook.schema.json
meta:
  id: equity-qualitative-codebook
  title: Starter codebook and de-identification settings for qualitative analysis (project draft)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: Starter codebook drafted for this project (not from a published instrument)
    publisher: Public Health Nursing MCP Server contributors
    url: https://github.com/SpiroGanas/Public-Health-Nursing-MCP-Server/blob/main/content/equity/qualitative_codebook.yaml
  related_sources:
    - title: Community context assessment (qualitative data) in MAPP 2.0, as described by Front Public Health 2025;13:1601406
      publisher: Frontiers in Public Health
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12283569/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The codes and keywords are this project's own draft and were not checked against any published
    codebook or tested on real transcripts (low confidence). The rare-theme rule (a theme is
    reported only when at least three different participants raised it) is a disclosure-control
    choice made for this tool, not a published standard. The facilitator labels and the words the
    name scrubber leaves alone are tool defaults. De-identification by pattern, name lists, and
    capitalization is a heuristic: read the de-identified output before sharing it.

# The smallest number of different participants that may raise a theme before its counts are shown.
min_voices_floor: 3
# Longest excerpt, in characters, written to the coded excerpt matrix.
excerpt_max_chars: 320

# Speaker labels treated as the facilitator or interviewer (their turns are not coded). Matched
# without case, ignoring a trailing number.
facilitator_labels:
  - interviewer
  - facilitator
  - moderator
  - note taker
  - notetaker
  - researcher
  - host
  - int
  - fac
  - mod
  - q
  - question

# Labels that are not speakers even though they are followed by a colon.
non_speaker_labels:
  - note
  - notes
  - date
  - time
  - location
  - place
  - topic
  - summary
  - agenda
  - transcript
  - group
  - focus group
  - interview
  - participants
  - present
  - attendees
  - session
  - recording
  - duration
  - purpose
  - context

