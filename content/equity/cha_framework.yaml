# Community health assessment framework for community_health_assessment_builder (EQ-08): the
# MAPP 2.0 phases and assessments, the requirements and Massachusetts guidance for hospital
# community health needs assessments (CHNAs), where to find hospital CHNAs, a partner sector
# checklist, context assessment prompts, theme words for reading CHNA priority lists, and the
# outline of the report the tool drafts.
#
# REVIEW STATUS: pending. NACCHO's own MAPP 2.0 pages and handbook (naccho.org) could not be
# fetched from the build environment (the proxy refused the connection), so MAPP 2.0 was
# verified against peer-reviewed articles that describe it. What those articles confirm is marked
# medium confidence; anything NACCHO's materials may say that the articles do not is marked low or
# listed under not_verified. The federal CHNA rule and the Attorney General's Community Benefits
# Guidelines were read in full (eCFR and mass.gov) and are high confidence. Retrieved 2026-11-12.
