# Refugee and immigrant (newcomer) health for newcomer_health_navigator (EQ-11): CDC domestic
# screening, Massachusetts refugee programs (DPH, ORI), MassHealth coverage by immigration status
# (including the October 2026 federal changes), and family shelter resources.
#
# REVIEW STATUS: pending. See meta.verification_note. Schema: content/schemas/newcomer_health.schema.json
