    publisher: MassHealth
    url: https://www.mass.gov/info-details/masshealth-information-for-noncitizens
  - title: Office for Refugees and Immigrants
    publisher: Massachusetts Executive Office of Health and Human Services
    url: https://www.mass.gov/orgs/office-for-refugees-and-immigrants
  - title: Refugee health information for health care and public health professionals
    publisher: Massachusetts Department of Public Health
    url: https://www.mass.gov/info-details/refugee-health-information-for-health-care-and-public-health-professionals
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: 'Drafted on 2026-11-08 from CDC''s domestic refugee screening guidance pages (overview
    and 13 topics, page dates 2024-2025), DPH''s refugee health page and RHAP guide list, ORI''s program
    pages, MassHealth''s noncitizen page (updated 2026-10-08), EOM 26-10 (September 2026), MassHealth''s
    Overview of Noncitizen Groups (April 2022), and the EOHLC Emergency Assistance pages. Screening items
    are summaries of CDC''s key points (high confidence for the cited thresholds). The status-to-group
    table follows the 2022 Overview and EOM 26-10; statuses EOM 26-10 does not list are marked not_listed
    (coverage depends on MassHealth''s determination). ORI''s RMA pages disagree on its length (low confidence).
    Immigration rules are changing quickly: check the MassHealth page and EOMs before each use. The subject
    matter expert must review before use.'
