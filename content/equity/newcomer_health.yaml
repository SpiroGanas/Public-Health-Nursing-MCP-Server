coverage_rules:
- text: 'MassHealth coverage types for noncitizens: Standard (full range), CommonHealth (disabled adults
    and children not eligible for Standard), CarePlus (adults not eligible for Standard), Family Assistance
    (certain children and adults, including noncitizens), the Medicare Savings Program, Limited (emergency
    services for people whose immigration status keeps them from more services), and the Health Safety
    Net (certain hospital and community health center services for uninsured or underinsured Massachusetts
    residents). The type depends on the noncitizen group, age, disability, and income; MassHealth decides.'
  source: mh-noncitizens
  section: General Information for Members and Applicants
- text: Pregnant people in any noncitizen group may be eligible for full MassHealth benefits during pregnancy
    and for 12 months postpartum, if otherwise eligible and within financial guidelines.
  source: mh-noncitizens
  section: General Information for Members and Applicants
- text: Children under 21 who are lawfully present immigrants or nonqualified PRUCOL may be eligible for
    comprehensive MassHealth benefits; children under 19 who are other noncitizens may be able to get
    the Children's Medical Security Plan (CMSP).
  source: mh-noncitizens
  section: General Information for Members and Applicants
- text: 'From October 1, 2026 (federal law), adults 21 and older who are refugees, asylees, persons with
    deportation withheld, Iraqi or Afghan special immigrants, trafficking victims, certain veterans, Amerasians,
    pre-1980 conditional entrants, certain Native Americans born outside the U.S., and parolees or battered
    noncitizens who met the five-year bar (Group 2) lose comprehensive MassHealth: ages 21-64 without
    a disability generally get MassHealth Limited and/or the Health Safety Net; those with a disability
    or 65 and older generally get Family Assistance. Children under 21 and pregnant or postpartum people
    keep their coverage. About 7,300 members are affected.'
  source: mh-eom-26-10
  section: 'Impacted Qualified Noncitizens: Group 2'
- text: 'Not affected (Group 1): green card holders who met (or are exempt from) the five-year bar, Cuban
    and Haitian entrants, and COFA migrants. Someone in a Group 2 category who also holds a Group 1 status
    is not affected.'
  source: mh-eom-26-10
  section: 'Non-Impacted Qualified Noncitizens: Group 1'
- text: The federal 'public charge' review changes as of September 18, 2026 (DHS); see ORI's resource
    page. SNAP is not part of a public charge test, and it is safe to apply for an eligible family member
    such as a U.S.-citizen child.
  source: mh-noncitizens
  section: The Federal Public Charge Rule; Resources for EA Eligible Families
  confidence: medium
- text: For questions about how status affects benefits, MassHealth recommends speaking with an immigration
    expert; ORI lists trusted immigration legal services (beware of organizations not on the list).
  source: mh-noncitizens
  section: General Information for Members and Applicants
shelter:
- text: Emergency Assistance (EA) Family Shelter is for Massachusetts families who are pregnant or have
    a child under 21, with gross income at or below 115% of the federal poverty guidelines, homeless for
    a qualifying reason (no-fault fire, flood, disaster, condemnation, or foreclosure; risk of domestic
    violence; no-fault eviction; or a substantial health and safety risk to the children). Each family
    member must have a lawful immigration status, or a child with eligible status satisfies the requirement
    for the family.
  source: ea-apply
  section: Eligibility; What documents do I need
- text: Apply online through the Massachusetts Housing Help Hub, by phone at the Massachusetts Emergency
    Family Shelter Contact Line (866) 584-0653 (M-F 8am-5pm), or at an area office (Boston, Brockton,
    Chelsea, Hyannis, Lawrence, Lowell, New Bedford, Salem, Springfield, Worcester).
  source: ea-apply
  section: How to apply
- text: Families can stay up to six months in Bridge Shelter (case management, employment help, and connection
    to health resources) or up to 30 business days in Rapid Shelter; some families waiting for documents
    may be placed in Clinical and Safety Risk Assessment sites with a temporary verification waiver.
  source: ea-expect
  section: How long can my family stay in shelter?; ea-apply Temporary Verification Waivers
  confidence: medium
- text: The Family Welcome Center in Mattapan (1626 Blue Hill Ave; Fridays 11am-7pm, Saturday and Sunday
    9am-2pm) connects families to food and cash benefits and basic supplies and may help with work authorization
    applications; it does not take EA applications.
  source: ea-resources
  section: Immediate Support
- text: 'Other help for families in or near shelter: SNAP through DTA ((877) 382-2363; DTAConnect), Mass
    211 ((877) 211-6277) for non-EA shelter and local resources, HomeBASE for EA-eligible families, MassHire
    Career Centers, Family Resource Centers, and ORI''s list of trusted immigration legal services.'
  source: ea-resources
  section: Food Resources; Housing Resources; Meeting Basic Needs
language_access:
  text: Use a qualified medical interpreter in the patient's preferred language; provide HIV and other
    health information in the languages of the populations served and make sure interpreters and bilingual
    staff are competent.
  source: cdc-hp
  section: Key Points; HIV Infection Overview
