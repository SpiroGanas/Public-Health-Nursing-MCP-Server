screening:
- id: timing
  label: Timing and visits
  items:
  - text: The domestic medical screening highlights screening during the first 90 days after arrival and
      can include up to three clinical visits, because results must be reviewed with the patient; start
      and finish it as soon as possible. Screenings usually occur 30-90 days after arrival.
    source: cdc-domestic
    section: Overview; At a glance
  - text: All refugees should receive a comprehensive domestic medical screening within 90 days of arrival.
    source: cdc-tb
    section: Domestic Refugee Screening for Tuberculosis
- id: history_physical
  label: History and physical
  items:
  - text: Review overseas medical documents (DS-3025 vaccination worksheet, DS-3026 history and physical),
      including vaccinations and screening for communicable conditions of public health importance.
    source: cdc-hp
    section: Key Points
  - text: Work with a qualified medical interpreter who speaks the patient's preferred language. Reassure
      the patient that the visit is confidential, for their health, and does not affect resettlement or
      visa status.
    source: cdc-hp
    section: Key Points; Recommendations for New Arrival History and Physical Examination
  - text: Address immediate health concerns, take a detailed history (including travel history), measure
      blood pressure (age 3 and older), and screen vision (3 and older) and hearing (4 and older); complete
      a head-to-toe examination as the patient permits.
    source: cdc-hp
    section: Key Points
- id: tuberculosis
  label: Tuberculosis
  items:
  - text: Anyone with signs or symptoms of TB, whatever the country of origin, needs clinical evaluation
      for TB disease.
    source: cdc-tb
    section: Testing Newly Arrived Refugees for TB Infection and Disease
  - text: 'Under 2 years (no TB signs, never treated): if no overseas test (or indeterminate), or a negative
      overseas test 6 or more months before, give a TST; a negative overseas test within 6 months needs
      no further domestic evaluation.'
    source: cdc-tb
    section: Testing Newly Arrived Refugees for TB Infection and Disease
  - text: 'Age 2 and older (no TB signs, never treated): if no overseas test (or indeterminate), give
      an IGRA; repeat the IGRA (or TST) if the negative overseas test was 6 or more months before; a negative
      overseas test within 6 months needs no further evaluation.'
    source: cdc-tb
    section: Testing Newly Arrived Refugees for TB Infection and Disease
  - text: 'Class B3 (recent contact of infectious TB): if the overseas test was within 8 weeks of the
      end of contact and negative or indeterminate, test again at least 8-10 weeks after contact ended.'
    source: cdc-tb
    section: Additional Testing Considerations
  - text: Offer LTBI treatment after TB disease is excluded for anyone with a positive IGRA or TST (see
      ltbi_treatment_calendar). LTBI reactivation causes about 85% of U.S. TB cases.
    source: cdc-tb
    section: Testing; Background
- id: immunizations
  label: Immunizations
  items:
  - text: U.S.-bound refugees are not required to be vaccinated before arrival, though most receive some
      vaccines through the overseas Vaccination Program for U.S.-bound Refugees. Review all records and
      update or revaccinate per ACIP.
    source: cdc-imm
    section: At a glance; Overview
  - text: Accept doses given outside the U.S. when schedules and doses are compatible with ACIP; serologic
      evidence of immunity is an acceptable alternative when prior vaccination or disease is likely.
    source: cdc-imm
    section: Overview
  - text: TST or IGRA may be given the same day as live vaccines or deferred 28 days after them; give
      live injectable vaccines the same day or at least 28 days apart. Help schedule follow-up visits
      to complete series.
    source: cdc-imm
    section: Evaluating Vaccination Records for Arriving Refugees; At a glance
  - text: In Massachusetts, RHAP providers review overseas vaccines, determine dose validity per ACIP,
      and start or continue catch-up. For refugees adjusting status, USCIS gives a blanket certification
      for public health departments to complete the vaccination assessment and forms.
    source: dph-refugee-hcp
    section: Immunizations Provided During Refugee Health Assessment; Adjustment of Status
- id: laboratory
  label: Laboratory testing
  items:
  - text: All recently resettled refugees, regardless of age or ethnicity, should have a complete blood
      count with red cell indices, white cell differential, and platelet count; infants should have the
      state newborn screening panel.
    source: cdc-lab
    section: Key points
- id: lead
  label: Lead
  items:
  - text: Blood lead test at the first domestic visit for all refugee infants and children 16 and younger,
      all pregnant or lactating women and girls, and refugees aged 17 with suspicion of exposure.
    source: cdc-lead
    section: Table 1
  - text: 'Children 6 and younger: repeat the blood lead test 3-6 months after the first screen regardless
      of the first result. The blood lead reference value is 3.5 micrograms per deciliter; confirm capillary
      results at or above it by venous sample.'
    source: cdc-lead
    section: Key points; Table 1
- id: hepatitis
  label: Viral hepatitis
  items:
  - text: Screen all untested new arrivals for hepatitis B (HBsAg, anti-HBs, total anti-HBc), including
      children and every pregnancy; test HBsAg-positive patients for hepatitis D.
    source: cdc-hep
    section: Overview
  - text: Screen untested adults 18 and older, pregnant women each pregnancy, and children with risk factors
      for hepatitis C. Do not routinely screen for hepatitis A or E.
    source: cdc-hep
    section: Overview
- id: hiv
  label: HIV
  items:
  - text: Refugees are no longer tested for HIV before arrival. Offer opt-out HIV screening to all refugees
      aged 13-64 (screening all ages is encouraged); repeat 3-6 months after resettlement after recent
      exposure; document a declined test.
    source: cdc-hiv
    section: 'Overview: Post-arrival screening'
- id: parasites
  label: Intestinal parasites
  items:
  - text: Most refugees receive presumptive ivermectin (Strongyloides) before departure unless contraindicated;
      asymptomatic refugees who did not may be treated presumptively on arrival or tested and treated.
      Refugees from Loa loa-endemic areas are not treated with ivermectin until high Loa loa microfilarial
      load is ruled out.
    source: cdc-parasites
    section: 'Strongyloides: Presumptive Treatment'
- id: malaria
  label: Malaria
  items:
  - text: Refugees from sub-Saharan Africa who did not receive recommended pre-departure antimalarial
      treatment should receive presumptive treatment or screening within 3 months of arrival (not in the
      first trimester of pregnancy or under 5 kg). Evaluate anyone with symptoms who was in an endemic
      area promptly.
    source: cdc-malaria
    section: Overview
- id: mental_health
  label: Mental health
  items:
  - text: Review overseas records for trauma, mental and physical disorders with harmful behavior, and
      substance-related disorders; ask directly about symptoms, functioning, and suicidal ideation as
      part of the overall health assessment.
    source: cdc-mh
    section: Quick Guide for Mental Health Screening, Steps 1-2
  - text: Screen adults 18 and older with standardized tools; screen children and adolescents with a structured
      or semi-structured assessment; screen for substance use; make an action plan with referral for those
      who need support.
    source: cdc-mh
    section: Quick Guide for Mental Health Screening, Steps 3-5
- id: nutrition
  label: Nutrition and growth
  items:
  - text: Include a nutrition examination with anthropometrics and laboratory testing, nutrition counseling,
      and referrals; refugees with evidence of poor nutrition may benefit from vitamin supplementation.
    source: cdc-nutrition
    section: At a glance
- id: sexual_reproductive
  label: Sexual and reproductive health
  items:
  - text: Explain confidentiality; urine pregnancy test for women of childbearing age and pubescent girls;
      discuss family planning and offer condoms; evaluate for STIs; screen women and girls from countries
      where FGM/C is practiced for complications and document findings.
    source: cdc-srh
    section: Overview
- id: cancer
  label: Cancer screening
  items:
  - text: Refugees often have little prior cancer screening; follow USPSTF recommendations and consider
      infection-related cancer risks. Referral to primary care for cancer screening is acceptable.
    source: cdc-cancer
    section: Key points
programs:
- id: rhap
  name: Refugee Health Assessment Program (RHAP)
  description: In collaboration with DPH, makes sure newly arriving refugees receive an initial health
    assessment (free medical screening, providers with refugee-care expertise, follow-up of overseas screening,
    mental and physical health recommendations) and are linked to primary care. All refugees are eligible
    for the initial domestic screening.
  contact: Office for Refugees and Immigrants (617) 727-7888 (TTY (617) 727-8147), 9:00 a.m.-5:00 p.m.
    M-F; 1 Ashburton Place, 5th floor, Boston, MA 02108
  source: ori-rhap
  section: Refugee Health Assessment Program (RHAP)
- id: rhpp
  name: Refugee Health Promotion Program (RHPP)
  description: Ongoing help for the newest arrivals to obtain affordable health care and insurance; health
    education (the Massachusetts health system, immunizations, choosing a primary care physician, mental
    health, home safety); case management with interpretation, follow-up of conditions found in the health
    assessment, referrals, and home visits.
  contact: 'Providers listed by ORI: Congolese Development Center (Lynn); Edward M. Kennedy Community
    Health Center (Worcester); Haitian American Public Health Initiatives (Mattapan); Immigrants'' Assistance
    Center (New Bedford); International Institute of New England (Boston, Lowell); Jewish Family Services
    of Western Massachusetts; New American Association of Massachusetts (Lynn); Somali Development Center
    (Roxbury)'
  source: ori-rhpp
  section: Services Include; Find an ORI Service Provider Near You
- id: rma
  name: Refugee Medical Assistance (RMA)
  description: 'Temporary medical coverage for refugees who are not eligible for MassHealth, through an
    agreement between ORI and MassHealth. ORI''s pages state the length differently (up to 8 months on
    the services page; both ''eight months or less'' and ''four months or less'' on the RMA page): confirm
    the current limit with ORI.'
  contact: Office for Refugees and Immigrants (617) 727-7888
  source: ori-rma
  section: Refugee Medical Assistance (RMA)
  confidence: low
- id: ori_services
  name: Other ORI services
  description: Refugee case management (resettlement benefits intake, orientation, employability assessment,
    referrals), the Refugee School Impact program for school-aged children, youth mentoring, the Unaccompanied
    Refugee Minors Program (with DCF), and citizenship and legal assistance programs.
  contact: Office for Refugees and Immigrants (617) 727-7888
  source: ori-services
  section: Education, Youth, Health & Other Services
- id: dph_arrivals
  name: DPH arrival notifications and overseas records
  description: CDC notifies DPH of all refugees arriving in Massachusetts from overseas, with pre-departure
    examination forms, immunization records, and pre-departure treatments; RHAP providers follow up conditions
    identified overseas. Providers who lack overseas results can ask the state refugee health coordinator
    or CDC (MHINx@cdc.gov).
  contact: DPH Bureau of Infectious Disease and Laboratory Sciences, Division of Global Populations and
    Infectious Disease Prevention (617) 983-6970
  source: dph-refugee-hcp
  section: Arrival notifications; Refugee Health Assessment Program
ori_eligibility:
  text: ORI services are for refugees, asylees, Cuban/Haitian entrants, Amerasians from Vietnam, certified
    victims of severe trafficking, and Special Immigrant Visa holders from Iraq and Afghanistan; legal
    permanent residents can get citizenship assistance, and certain TAFDC clients employment services.
    Eligibility also depends on residence, date of entry, and income.
  source: ori-eligible
  section: ORI Eligible Populations
