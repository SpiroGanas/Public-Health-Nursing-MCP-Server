# Income limits for a benefit eligibility SCREEN (not a determination): federal poverty
# guidelines, WIC, SNAP, MassHealth, the Health Safety Net, and home energy assistance
# (LIHEAP/HEAP), for estimate_benefit_eligibility (EQ-06).
#
# REVIEW STATUS: pending. Drafted 2026-11-08 from the sources below. Refresh every year: FPL
# (January), MassHealth (March 1), WIC (June/July), SNAP and HEAP (October 1).
# Schema: content/schemas/equity_benefits.schema.json
meta:
  id: equity-benefit-eligibility
  title: Benefit eligibility income limits (FPL, WIC, SNAP, MassHealth, Health Safety Net, HEAP)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: null
  source:
    title: HHS Poverty Guidelines for 2026
    publisher: U.S. Department of Health and Human Services, ASPE
    url: https://aspe.hhs.gov/topics/poverty-economic-mobility/poverty-guidelines
  related_sources:
    - title: Check eligibility for WIC (income eligibility guidelines June 11, 2026 - June 30, 2027)
      publisher: Massachusetts Department of Public Health, WIC Nutrition Program
      url: https://www.mass.gov/info-details/check-eligibility-for-wic
    - title: Supplemental Nutrition Assistance Program (SNAP) eligibility chart
      publisher: Massachusetts Department of Transitional Assistance
      url: https://www.mass.gov/how-to/apply-for-snap-benefits-food-stamps
    - title: Member Booklet for Health and Dental Coverage and Help Paying Costs
      publisher: MassHealth
      url: https://www.mass.gov/doc/member-booklet-for-health-and-dental-coverage-and-help-paying-costs-0/download
    - title: Learn about Home Energy Assistance (HEAP), FY 2027 income guidelines
      publisher: Massachusetts Executive Office of Housing and Livable Communities
      url: https://www.mass.gov/info-details/learn-about-home-energy-assistance-heap
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted on 2026-11-08. The 2026 poverty guidelines are transcribed from ASPE's page. WIC
    limits (185% of FPL) are transcribed from DPH's WIC page (June 11, 2026 - June 30, 2027).
    SNAP gross income limits (200% of FPL) and maximum benefits are transcribed from DTA's page,
    which is undated; they match the 2026 FPL and are assumed to be the federal fiscal year 2027
    values effective October 1, 2026 (medium confidence on the date). MassHealth limits by
    coverage type are transcribed from the MassHealth Member Booklet (PDF modified 2026-08-12;
    income standards effective March 1, 2026). Health Safety Net limits are from the same
    booklet. HEAP limits (60% of state median income) are transcribed from EOHLC's page (FY
    2027). The FNS WIC page (fns.usda.gov, now redirecting to a blocked host) could not be
    reached. These are income screens only: every program has other rules.

refresh_schedule: "FPL each January (ASPE); MassHealth income standards March 1; WIC income guidelines in June or July; SNAP October 1; HEAP October 1 (season November 1 - April 30)."

