# Methods for ranking community health issues, for prioritize_health_issues (EQ-09): the Hanlon
# method (basic priority rating and the PEARL test), the nominal group technique, and a strategy
# grid. This file holds the method definitions the tool uses and cites; the arithmetic is in
# crates/phn-tools/src/equity/prioritize.rs.
#
# REVIEW STATUS: pending. NACCHO's own Hanlon page (naccho.org) could not be fetched from the build
# environment, so the formula and factors were verified against the peer-reviewed papers below,
# which quote the original Hanlon and Pickett equation (1984). Retrieved 2026-11-12.
# Schema: content/schemas/equity_prioritization.schema.json
meta:
  id: equity-prioritization
  title: Prioritization methods for community health issues (Hanlon method, PEARL, nominal group technique, strategy grid)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: null
  source:
    title: The Pan American Health Organization-adapted Hanlon method for prioritization of health programs (Rev Panam Salud Publica 2019;43:e61)
    publisher: Pan American Health Organization (Revista Panamericana de Salud Pública)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6611209/
  related_sources:
    - title: Setting health priorities in a community - a case example (Rev Saude Publica 2017)
      publisher: Revista de Saúde Pública
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5336317/
    - title: A systematized review of prioritization methods used in community health needs assessments among nonprofit hospital systems in the US (J Public Health Manag Pract 2026)
      publisher: Journal of Public Health Management and Practice
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12998767/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The Hanlon formula, the ranges of its components, the four seriousness factors, the five PEARL
    factors and their questions were read in the three open-access papers listed (high confidence
    for what those papers say). NACCHO's Hanlon method page and the original 1984 textbook were not
    reachable, so whether NACCHO's worksheet divides by 3, scores seriousness 0-20 from four 0-5
    factors, or uses another range for effectiveness was not checked; the Illinois IPLAN
    variant (effectiveness 0.5-1.5) described in the 2017 paper is NOT implemented. The strategy
    grid is this project's own two-axis grid (importance by feasibility); the sources name strategy
    grids as a common method but do not describe one in a form that could be copied (low
    confidence). No scoring anchors (for example what percent of the population earns a size of 8)
    were found in a readable source, so none are bundled: the nurse sets her own and records
    them.

