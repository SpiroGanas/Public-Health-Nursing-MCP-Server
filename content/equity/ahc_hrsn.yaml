rules:
  safety_threshold: 11
  phq2_threshold: 3
  physical_activity:
    under_age: 6
    youth_max_age: 17
    youth_min_minutes_per_day: 60
    adult_min_minutes_per_week: 150
  notes:
    - text: "If someone chooses the underlined answers, they might have an unmet health-related social need."
      source: cms-ahc-tool
      section: Core Questions (instructions)
    - text: "A score of 11 or more when the numerical values for answers to questions 7-10 are added shows that the person might not be safe."
      source: cms-ahc-tool
      section: Safety
    - text: "If you get 3 or more when you add the answers to questions 23a and 23b the person may have a mental health need."
      source: cms-ahc-tool
      section: Mental Health
    - text: "Physical activity: minutes per week = days x minutes. Under 6 years the need cannot be determined; ages 6-17, less than an average of 60 minutes a day; 18 or older, less than 150 minutes a week."
      source: cms-ahc-tool
      section: Physical Activity
    - text: "The questions are meant for individual respondents who answer for themselves; a parent or caregiver can answer for an individual."
      source: cms-ahc-tool
      section: Who should use the AHC HRSN Screening Tool?

referrals:
  living_situation:
    - text: "Families with children under 21 or pregnant who need shelter: Emergency Assistance (EA) Family Shelter (Massachusetts Emergency Family Shelter Contact Line (866) 584-0653, Monday-Friday 8am-5pm, or apply online through the Housing Help Hub). Eligibility includes Massachusetts residency, income at or below 115% of the federal poverty guidelines, and a qualifying reason."
      source: ea-apply
      section: Eligibility; How to apply
    - text: "Non-EA shelter and local housing help: Mass 211 ((877) 211-6277, www.mass211.org). EA-eligible families may use HomeBASE (up to $30,000 over 2 years) and should join MRVP and Section 8 waitlists."
      source: ea-resources
      section: Housing Resources
    - text: "MassHealth members in an accountable care organization (ACO) may get housing search, housing navigation, transitional goods, or Healthy Homes services through their ACO."
      source: masshealth-hrsn
      section: Housing Services
    - text: "Housing quality problems (pests, mold, lead, lack of heat, broken stove, missing smoke detectors, leaks): the local board of health enforces the State Sanitary Code's minimum housing standards."
      source: cmr410
      section: 105 CMR 410.000 summary
  food:
    - text: "SNAP through the Department of Transitional Assistance: DTA Assistance Line (877) 382-2363 or DTAConnect.com; noncitizens may still be eligible, a family can apply for an eligible member such as a U.S.-citizen child, and SNAP is not part of a public charge test."
      source: ea-resources
      section: Food Assistance (SNAP)
    - text: "WIC for pregnant and breastfeeding people and children under 5: (800) 942-1007 or a local WIC office."
      source: wic
      section: Who we serve; contact
    - text: "MassHealth ACO members may get nutrition services (medically tailored or nutritionally appropriate meals, food boxes, food prescriptions, nutrition counseling) through their ACO."
      source: masshealth-hrsn
      section: Nutrition Services
  transportation:
    - text: "Mass 211 ((877) 211-6277) for local transportation resources. MassHealth members can ask MassHealth Customer Service ((800) 841-2900) about transportation to covered medical appointments."
      source: masshealth-contact
      section: MassHealth Customer Service Center
      confidence: medium
  utilities:
    - text: "Home Energy Assistance Program (HEAP): helps eligible households (income up to 60% of state median income) pay part of winter heating bills and can qualify them for electric and gas rate discounts; find the local provider at 1 (800) 632-8175 or through Mass 211."
      source: heap
      section: What you need; Contacts
  safety:
    - text: "Follow your agency's protocol for a positive safety screen: talk privately, assess immediate danger (call 911 in an emergency), offer domestic violence advocacy and safety planning, and meet mandated-reporter obligations when a child, elder, or person with a disability may be at risk. Mass 211 is available 24 hours with interpreters."
      source: heap
      section: Contacts (Mass 211)
      confidence: medium
  financial_strain:
    - text: "Benefits screening: SNAP (DTA (877) 382-2363), HEAP (1 (800) 632-8175), and Mass 211 for local programs; Family Resource Centers help families with basic needs."
      source: ea-resources
      section: Food Resources; Meeting Basic Needs
  employment:
    - text: "MassHire Career Centers: job search help, career planning, workshops, and training referrals."
      source: ea-resources
      section: MassHire Career Centers
  family_community_support:
    - text: "Family Resource Centers (statewide) and Mass 211 for local support services; cultural community connections through Local Cultural Councils."
      source: ea-resources
      section: Meeting Basic Needs; Cultural Communities
  education:
    - text: "MassHire Career Centers and approved training programs (including work-readiness ESOL). A 'yes' to item 15 (another language at home) calls for a qualified interpreter and translated materials, not a deficit."
      source: ea-resources
      section: Approved and Authorized Training Programs
  physical_activity:
    - text: "Discuss physical activity with the person's primary care provider and local community programs; for ages 6-17 the goal behind the screen is an average of 60 minutes a day, for adults 150 minutes a week."
      source: cms-ahc-tool
      section: Physical Activity
  substance_use:
    - text: "A positive substance use screen needs a follow-up assessment and referral per agency protocol; in a crisis, the 988 Suicide & Crisis Lifeline takes calls and texts 24 hours a day."
      source: nimh-help
      section: In Crisis? Call or Text 988
      confidence: medium
  mental_health:
    - text: "A PHQ-2 score of 3 or more calls for a full depression assessment (for example the PHQ-9) and a suicide-risk screen per agency protocol. For suicidal crisis or emotional distress, call or text 988 (988 Suicide & Crisis Lifeline)."
      source: nimh-help
      section: In Crisis? Call or Text 988
  disabilities:
    - text: "Assess functional needs and connect to the primary care provider; MassHealth members in an ACO can ask about care coordination and HRSN services."
      source: masshealth-hrsn
      section: Additional Resources
      confidence: medium
