items:
  - id: living_situation
    number: "1"
    domain: living_situation
    topic: Living situation today
    item_source: PRAPARE (National Association of Community Health Centers and partners)
    reuse: "Wording not bundled: CMS's permission covers the AHC Model only; PRAPARE has its own terms."
    wording: null
    multi: false
    options:
      - {key: steady, label: Steady place to live, positive: false}
      - {key: worried_about_losing, label: "Place to live today, worried about losing it", positive: true}
      - {key: not_steady, label: "No steady place to live (staying with others, hotel, shelter, outside, car...)", positive: true}
  - id: housing_problems
    number: "2"
    domain: living_situation
    topic: Problems with the place you live (choose all)
    item_source: Nuruzzaman et al., J Health Care Poor Underserved 2015
    reuse: "Wording not bundled: published instrument; CMS's permission covers the AHC Model only."
    wording: null
    multi: true
    options:
      - {key: pests, label: Pests, positive: true}
      - {key: mold, label: Mold, positive: true}
      - {key: lead, label: Lead paint or pipes, positive: true}
      - {key: lack_of_heat, label: Lack of heat, positive: true}
      - {key: oven_stove, label: Oven or stove not working, positive: true}
      - {key: smoke_detectors, label: Smoke detectors missing or not working, positive: true}
      - {key: water_leaks, label: Water leaks, positive: true}
      - {key: none, label: None of these, positive: false}
