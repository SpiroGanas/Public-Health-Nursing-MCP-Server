# CMS Accountable Health Communities (AHC) Health-Related Social Needs (HRSN) Screening Tool:
# item scoring, domains, item licensing, and Massachusetts referral categories, for
# screen_health_related_social_needs (EQ-05).
#
# REVIEW STATUS: pending. Drafted from the CMS tool PDF (retrieved 2026-11-08); positive answers
# are the ones CMS underlines (read from the PDF's underline marks). Schema:
# content/schemas/ahc_hrsn.schema.json
#
# Item wording is bundled only where reuse is clearly free (U.S. government sources and the
# PHQ-2). CMS says it got permission from the original authors "for the AHC Model and our use
# only"; for the other items the tool shows a short topic label and points to the CMS form.
meta:
  id: ahc-hrsn-screening
  title: CMS Accountable Health Communities Health-Related Social Needs Screening Tool (scoring and referral categories)
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: "2021-08-12"
  source:
    title: The Accountable Health Communities Health-Related Social Needs Screening Tool
    publisher: Centers for Medicare & Medicaid Services, Center for Medicare and Medicaid Innovation
    url: https://www.cms.gov/priorities/innovation/files/worksheets/ahcm-screeningtool.pdf
  related_sources:
    - title: "Billioux A, et al. Standardized Screening for Health-Related Social Needs in Clinical Settings: The Accountable Health Communities Screening Tool. NAM Perspectives, 2017"
      publisher: National Academy of Medicine
      url: https://nam.edu/wp-content/uploads/2017/05/Standardized-Screening-for-Health-Related-Social-Needs-in-Clinical-Settings.pdf
    - title: Resources for EA Eligible Families
      publisher: Massachusetts Executive Office of Housing and Livable Communities
      url: https://www.mass.gov/info-details/resources-for-ea-eligible-families
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Scoring was transcribed on 2026-11-08 from the CMS AHC HRSN Screening Tool PDF (created
    2018-01-03, modified 2021-08-12): the answers CMS underlines as possible unmet needs were read
    from the PDF's underline marks, the safety threshold (11 or more on items 7-10), the PHQ-2
    threshold (3 or more), and the physical activity thresholds are stated in the PDF (high
    confidence). The PDF does not include the per-item citation-and-notification table it refers
    to; the reuse status of each item is the developer's reading of each item's source (medium);
    the PHQ-2 reuse statement follows the product owner's decision (PHQ screeners need no
    permission) and was not re-fetched.
    Referral categories cite mass.gov pages retrieved 2026-11-08; the transportation entry is
    medium confidence (MassHealth's transportation page could not be located). The subject
    matter expert must review before use.

