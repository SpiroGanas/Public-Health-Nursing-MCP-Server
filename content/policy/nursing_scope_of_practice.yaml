# Snapshot of the Massachusetts nursing scope-of-practice sources that could be read on 2026-11-12,
# for nursing_scope_of_practice_guide (POL-06): sections of 244 CMR (Board of Registration in
# Nursing) and M.G.L. c. 112, section 80B, the Board's scope-of-practice decision guidelines, and
# the text of Board advisory rulings, each with a citation, a short quotation (25 words or fewer),
# and a paraphrase. PARTIAL: only the provisions listed in `read_scope` were read; other advisory
# rulings are listed by title only.
#
# REVIEW STATUS: pending. mass.gov carries unofficial copies of the regulations; the official text
# is published by the Secretary of the Commonwealth.
# Schema: content/schemas/policy_nursing_scope_of_practice.schema.json
