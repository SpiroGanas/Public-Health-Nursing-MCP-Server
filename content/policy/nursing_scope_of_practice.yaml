entries:
  - id: mgl80b_accountability
    topics: [scope_framework, rn_lpn]
    citation: "M.G.L. c. 112, section 80B"
    source: mgl112_80b
    section: 80B
    applies_to: [rn, lpn, aprn]
    quote: Each individual licensed to practice nursing in the commonwealth shall be directly accountable for safety of nursing care he delivers.
    paraphrase: The statute defines the practice of nursing (clinical decision making, a strategy of care, medication and treatments prescribed by authorized prescribers, evaluating responses, health counseling and teaching, collaboration, teaching and supervising others, and participating in research that adds to nursing knowledge) and makes each licensed nurse directly accountable for the safety of the care he or she delivers.
    confidence: high
  - id: mgl80b_delegation
    topics: [delegation, rn_lpn]
    citation: "M.G.L. c. 112, section 80B (RN and LPN practice)"
    source: mgl112_80b
    section: 80B
    applies_to: [rn, lpn]
    quote: including the delegation of selected activities to unlicensed assistive personnel
    paraphrase: The statute lists management, direction, and supervision of nursing practice, including delegation of selected activities to unlicensed assistive personnel, within the practice of both registered nurses and licensed practical nurses. For RNs it also lists applying nursing theory to plans of care for individuals, families, and communities.
    confidence: high
  - id: mgl80b_research
    topics: [research]
    citation: "M.G.L. c. 112, section 80B"
    source: mgl112_80b
    section: 80B
    applies_to: [rn, lpn, aprn]
    quote: participation in research which contributes to the expansion of nursing knowledge
    paraphrase: Participation in research that contributes to nursing knowledge is within the statutory definition of nursing practice. Whether a particular project is research, and what review it needs, is a separate question (see qi_vs_research_determination).
    confidence: high
  - id: guideline_statute_check
    topics: [scope_framework]
    citation: Board decision making guidelines, step 2
    source: born_scope_page
    section: Decision making guidelines
    applies_to: [rn, lpn, aprn]
    quote: Is this practice specifically permitted or prohibited in any existing statute or regulation?
    paraphrase: The Board's guidelines start by checking whether a statute or regulation specifically permits or prohibits the activity; if permitted or unclear, the nurse answers six further questions on education, consistency with scope, competence, standard of care, resources for complications, and accountability.
    confidence: high
  - id: cmr9_10_scope
    topics: [scope_framework, rn_lpn]
    citation: 244 CMR 9.03(10)
    source: cmr9
    section: 9.03(10)
    applies_to: [rn, lpn, aprn]
    quote: shall only perform acts within the scope of nursing practice as defined in M.G.L. c. 112, § 80B
    paraphrase: A nurse with a valid license who practices in Massachusetts may perform only acts within the scope of nursing practice as defined in M.G.L. c. 112, section 80B, and 244 CMR 3.00.
    confidence: high
  - id: cmr9_11_techniques
    topics: [scope_framework, new_procedures]
    citation: 244 CMR 9.03(11)
    source: cmr9
    section: 9.03(11)
    applies_to: [rn, lpn, aprn]
    quote: shall perform nursing techniques and procedures only after appropriate education and demonstrated clinical competency
    paraphrase: A nurse performs techniques and procedures only after appropriate education and demonstrated clinical competency.
    confidence: high
  - id: cmr9_12_competency
    topics: [scope_framework, new_procedures]
    citation: 244 CMR 9.03(12)
    source: cmr9
    section: 9.03(12)
    applies_to: [rn, lpn, aprn]
    quote: shall only assume those duties and responsibilities within his or her scope of practice
    paraphrase: A nurse assumes only duties and responsibilities within his or her scope of practice for which he or she has acquired and maintained the necessary knowledge, skills, and abilities.
    confidence: high
  - id: cmr9_9_accountability
    topics: [scope_framework]
    citation: 244 CMR 9.03(9)
    source: cmr9
    section: 9.03(9)
    applies_to: [rn, lpn, aprn]
    quote: shall be responsible and accountable for his or her nursing judgments, actions, and competency
    paraphrase: Each licensed nurse is responsible and accountable for his or her nursing judgments, actions, and competency.
    confidence: high
  - id: cmr9_38_drugs
    topics: [standing_orders, vaccines]
    citation: 244 CMR 9.03(38)
    source: cmr9
    section: 9.03(38)
    applies_to: [rn, lpn]
    quote: except as directed by an authorized prescriber
    paraphrase: A nurse may not administer a prescription or non-prescription drug to any person in the course of nursing practice except as directed by an authorized prescriber (with an exception for nurse anesthetists working under protocols). Read the full provision before relying on this summary.
    confidence: high
  - id: cmr9_18_research
    topics: [research]
    citation: 244 CMR 9.03(18)
    source: cmr9
    section: 9.03(18)
    applies_to: [rn, lpn, aprn]
    quote: has approved the study in accordance with accepted standards for the protection of human subjects
    paraphrase: A nurse who enrolls subjects in a research study or conducts one must verify that a board, committee, or other group designated by an institution to protect human subjects has approved the study.
    confidence: high
  - id: cmr9_4_telecom
    topics: [licensure]
    citation: 244 CMR 9.03(4)
    source: cmr9
    section: 9.03(4)
    applies_to: [rn, lpn, aprn]
    quote: shall also be governed by the licensure and practice laws and regulations of the state or jurisdiction
    paraphrase: A Massachusetts-licensed nurse who is in Massachusetts and provides a nursing service by telecommunications to a person located outside Massachusetts is also governed by the licensure and practice laws and regulations of the state or jurisdiction where the recipient is located. Section 10.00 also treats a service provided into Massachusetts from outside the state as the practice of nursing.
    confidence: high
  - id: cmr9_1_license
    topics: [licensure]
    citation: 244 CMR 9.03(1) to (3)
    source: cmr9
    section: 9.03(1)-(3)
    applies_to: [rn, lpn, aprn]
    quote: a nurse shall only engage in the practice of nursing in Massachusetts with a valid license
    paraphrase: Practice requires a valid license (with the exceptions in M.G.L. c. 112, sections 80, 80A and 81); practice after expiration, surrender, suspension, or revocation is the unlicensed practice of nursing. An RN may practice as an APRN only with the Board's written authorization.
    confidence: high
  - id: cmr9_6_laws
    topics: [conduct_reporting]
    citation: 244 CMR 9.03(6)(a)
    source: cmr9
    section: 9.03(6)(a)
    applies_to: [rn, lpn, aprn]
    quote: obligation to report child abuse
    paraphrase: A nurse must comply with M.G.L. c. 112, sections 74 to 81C and other laws related to licensure and practice. The regulation lists examples, among them reports of elder abuse (c. 19A, section 15), abuse of a disabled person (c. 19C, section 10), child abuse (c. 119, section 51A), abuse of a patient or resident (c. 111, section 72G), and lead poisoning (c. 111, section 191), and the controlled substances act (c. 94C).
    confidence: high
  - id: cmr9_16_confidential
    topics: [conduct_reporting]
    citation: 244 CMR 9.03(16)
    source: cmr9
    section: 9.03(16)
    applies_to: [rn, lpn, aprn]
    quote: shall share appropriate information only as required by law or for the protection of the patient
    paraphrase: A nurse safeguards patient information from any person or entity not entitled to it and shares appropriate information only as required by law or for the protection of the patient.
    confidence: high
  - id: cmr9_26_report_nurse
    topics: [conduct_reporting]
    citation: 244 CMR 9.03(26)
    source: cmr9
    section: 9.03(26)
    applies_to: [rn, lpn, aprn]
    quote: directly observes another nurse engaged in any of the following shall report that nurse to the Board
    paraphrase: A nurse who directly observes another nurse abusing a patient, practicing while impaired by substance misuse, or diverting controlled substances must report that nurse to the Board in accordance with Board guidelines.
    confidence: high
  - id: cmr9_44_documentation
    topics: [conduct_reporting]
    citation: 244 CMR 9.03(44)
    source: cmr9
    section: 9.03(44)
    applies_to: [rn, lpn, aprn]
    quote: shall make complete, accurate, and legible entries in all records
    paraphrase: A nurse makes complete, accurate, and legible entries in all records required by law and accepted standards of nursing practice, and signs his or her name as it appears on the license.
    confidence: high
  - id: cmr9_46_management
    topics: [management_charge]
    citation: 244 CMR 9.03(46)
    source: cmr9
    section: 9.03(46)
    applies_to: [rn, lpn]
    quote: shall adhere to accepted standards of practice for that role
    paraphrase: A nurse in a nursing management role must adhere to accepted standards of practice for that role, which include developing and implementing the measures needed to promote and manage the delivery of safe nursing care.
    confidence: high
  - id: cmr9_04_aprn
    topics: [aprn]
    citation: 244 CMR 9.04(1) and (5)
    source: cmr9
    section: "9.04"
    applies_to: [aprn]
    quote: shall practice only in the category of advanced practice registered nursing for which the Board has authorized him or her
    paraphrase: An APRN practices only in the authorized category and in areas where he or she has formal advanced education and documented competency. When proposing a diagnostic or therapeutic intervention beyond the scope of generic nursing practice, an APRN fully discloses the risks, benefits, and alternatives to the patient and documents the disclosure.
    confidence: high
  - id: cmr3_02_rn
    topics: [rn_lpn]
    citation: 244 CMR 3.02(2)
    source: cmr3
    section: 3.02(2)
    applies_to: [rn]
    quote: shall act, within his or her generic and continuing education and experience
    paraphrase: A registered nurse acts, within generic and continuing education and experience, to assess the health status of individuals and groups, analyze and interpret the data, plan and implement nursing interventions including prescribed regimens, provide and coordinate health teaching, evaluate outcomes, collaborate with other providers, and serve as patient advocate within the limits of the law.
    confidence: high
  - id: cmr3_04_lpn
    topics: [rn_lpn]
    citation: 244 CMR 3.04(2)
    source: cmr3
    section: 3.04(2)
    applies_to: [lpn]
    quote: A licensed practical nurse participates in direct and indirect nursing care
    paraphrase: A licensed practical nurse assesses an individual's basic health status, participates in analyzing data, planning, and implementing care, incorporates the prescribed medical regimen, participates in health teaching, evaluates outcomes of basic nursing intervention, and collaborates, within generic and continuing education and experience.
    confidence: high
  - id: cmr3_05_preamble
    topics: [delegation]
    citation: 244 CMR 3.05 (introduction)
    source: cmr3
    section: "3.05"
    applies_to: [rn, lpn]
    quote: such persons cannot be used as a substitute for the licensed nurse
    paraphrase: Assessment, planning, implementation, and evaluation of the nursing plan of care are essential functions of the licensed nurse. Unlicensed persons may complement, but not substitute for, the licensed nurse.
    confidence: high
  - id: cmr3_05_2_b
    topics: [delegation]
    citation: 244 CMR 3.05(2)(a) and (b)
    source: cmr3
    section: 3.05(2)(a)-(b)
    applies_to: [rn, lpn]
    quote: The final decision as to what can be safely delegated in any specific situation is within the scope of the delegating nurse's judgment.
    paraphrase: The delegating nurse is directly responsible for the nature and quality of the care given under his or her direction (but not for the outcome if a qualified unlicensed person deviates from the instructions or plan of care).
    confidence: high
  - id: cmr3_05_2_c
    topics: [delegation]
    citation: 244 CMR 3.05(2)(c)
    source: cmr3
    section: 3.05(2)(c)
    applies_to: [rn, lpn]
    quote: must make an assessment of the patient's nursing care needs and care delivery setting
    paraphrase: Before delegating, the nurse assesses the patient's nursing care needs and the care delivery setting to be sure the activity can be safely delegated.
    confidence: high
  - id: cmr3_05_2_d
    topics: [delegation]
    citation: 244 CMR 3.05(2)(d)
    source: cmr3
    section: 3.05(2)(d)
    applies_to: [rn, lpn]
    quote: can be properly performed by the unlicensed person without jeopardizing the patient's safety and welfare
    paraphrase: The activity must be one a reasonable and prudent nurse would judge delegable, that does not require the unlicensed person to systematically assess, analyze, interpret, plan, or evaluate patient data, and that the unlicensed person can properly perform safely.
    confidence: high
    note: The mass.gov PDF text for this paragraph has spacing errors; the paraphrase follows the page image.
  - id: cmr3_05_2_e
    topics: [delegation]
    citation: 244 CMR 3.05(2)(e)
    source: cmr3
    section: 3.05(2)(e)
    applies_to: [rn, lpn]
    quote: Employer policy or contractual language can not mandate the licensed nurse to delegate
    paraphrase: Delegation must fall within the unlicensed person's job description and the employer's policies and procedures, which must acknowledge that only the delegating nurse makes the final decision to delegate.
    confidence: high
  - id: cmr3_05_2_f
    topics: [delegation]
    citation: 244 CMR 3.05(2)(f) and (g)
    source: cmr3
    section: 3.05(2)(f)-(g)
    applies_to: [rn, lpn]
    quote: must have on file within the employing agency current documentation of the unlicensed person's competencies
    paraphrase: The employing agency keeps current, periodically validated documentation of the unlicensed person's competencies for each nursing activity in the job description, and a designated nurse communicates them to the delegating nurse. Uniform training and certification may be used to presume baseline competencies. Other competencies to consider include collaboration and communication.
    confidence: high
  - id: cmr3_05_2_h
    topics: [delegation]
    citation: 244 CMR 3.05(2)(h) to (j)
    source: cmr3
    section: 3.05(2)(h)-(j)
    applies_to: [rn, lpn]
    quote: adverse side effects to be reported to the appropriate licensed nurse
    paraphrase: The delegating nurse gives the unlicensed person a nursing plan of care (desired effect, sequence of steps, adverse effects to report, what to report if the activity does not work), adequately supervises, and may decide at any time that the activity can no longer be delegated.
    confidence: high
  - id: cmr3_05_3_supervision
    topics: [delegation]
    citation: 244 CMR 3.05(3)
    source: cmr3
    section: 3.05(3)
    applies_to: [rn, lpn]
    quote: The delegating nurse must provide adequate supervision of all nursing activities delegated to unlicensed persons
    paraphrase: The nurse decides the degree of supervision after weighing the stability of the patient's condition, the unlicensed person's training and demonstrated competency, the complexity of the activity, the nurse's proximity and availability (which may include telephone or other telecommunication), and the availability of other personnel and written employer policies, which must set out channels of communication and a way to report deviations from the plan of care.
    confidence: high
  - id: cmr3_05_4_delegable
    topics: [delegation]
    citation: 244 CMR 3.05(4)
    source: cmr3
    section: 3.05(4)
    applies_to: [rn, lpn]
    quote: can be performed according to an established sequence of steps leading to a predictable outcome
    paraphrase: Examples of activities usually considered delegable (when 3.05(2) is met) include those that follow an established sequence with a predictable outcome, need no nursing assessment and judgment during implementation, or involve no modification; collecting, reporting, and documenting simple data; and activities that meet basic human needs such as nutrition, hydration, mobility, comfort, elimination, socialization, rest, and hygiene.
    confidence: high
  - id: cmr3_05_5_not_delegable
    topics: [delegation]
    citation: 244 CMR 3.05(5)
    source: cmr3
    section: 3.05(5)
    applies_to: [rn, lpn]
    quote: Formulation of the nursing plan of care or evaluation of the patient's response to the care provided, or both
    paraphrase: Examples of activities that are not within sound nursing judgment to delegate include those that require nursing assessment, analysis, planning, and evaluation leading to a clinical conclusion, may lead to an unpredictable outcome, or involve anticipated modification; physical, psychological, and social assessment requiring nursing judgment; and formulating the plan of care or evaluating the response to it.
    confidence: high
  - id: cmr3_05_5_medication
    topics: [delegation, delegation_medication, otc_school]
    citation: 244 CMR 3.05(5)(d) and the numbered requirements printed with it
    source: cmr3
    section: 3.05(5)(d)
    applies_to: [rn, lpn]
    quote: Administration of medications except as permitted in M.G.L. 94C, and 105 CMR 700.000
    paraphrase: Administering medications is listed as not delegable except as M.G.L. c. 94C and 105 CMR 700.000 permit. Delegation of medication to an unlicensed person must also meet seven listed requirements (validated medication competencies on file, a valid prescriber order and a properly labeled medication, regular assessment of the patient and review of medication records, a plan of care that states the desired effect, dose, route, frequency and adverse effects to report, and, before delegating, checks that nursing resources are reachable, emergency instructions exist, and storage instructions are given), and, for a school nurse, 105 CMR 210.000.
    confidence: medium
    note: In the mass.gov PDF the numbered list of seven requirements is printed on the page before the 3.05(5)(d) lead-in and without its own lead-in, so its exact place in the section structure could not be confirmed; check the official text.
  - id: cmr3_05_6_teaching
    topics: [delegation]
    citation: Advisory Ruling 9803
    source: ar9803
    section: Advisory Ruling
    applies_to: [rn, lpn]
    quote: Health teaching and health counseling, as it relates to nursing and nursing services, may not be delegated.
    paraphrase: The Board's advisory ruling on delegation says health teaching and counseling that relate to nursing may not be delegated, and that Board regulations prohibit delegating activities that need ongoing nursing assessment and judgment (244 CMR 3.05(6) places ultimate responsibility for patient teaching and counseling with the licensed nurse).
    confidence: high
    note: AR 9803 (1998) quotes an earlier wording of 244 CMR 3.05 with different paragraph letters than the 2021 text; use the regulation for citations.
  - id: ar9803_five_rights
    topics: [delegation]
    citation: Advisory Ruling 9803 (Five Rights of Delegation)
    source: ar9803
    section: Five Rights of Delegation
    applies_to: [rn, lpn]
    quote: the right task; the right circumstances; the right person; the right direction/communication; and the right supervision and evaluation
    paraphrase: The Board's framework for delegation decisions and accountability has five key elements, applied by nursing service administrators and staff nurses. A licensed nurse remains accountable for all aspects of the delegation decision, its implementation, supervision, and evaluation, and the final decision on what to delegate is the nurse's professional judgment.
    confidence: high
  - id: ar9803_assess
    topics: [delegation]
    citation: Advisory Ruling 9803
    source: ar9803
    section: Advisory Ruling
    applies_to: [rn, lpn]
    quote: A nurse must assess a patient's nursing care needs prior to his/her delegation of any nursing activity.
    paraphrase: Before delegating, the nurse assesses the patient's needs; unlicensed assistive personnel have no nursing knowledge base for nursing judgments; the nurse must determine that the person has documented competency and set the degree of supervision.
    confidence: high
  - id: cmr10_delegation_defs
    topics: [delegation]
    citation: 244 CMR 10.01 (definitions of delegation, supervision, unlicensed person)
    source: cmr10
    section: "10.01"
    applies_to: [rn, lpn]
    quote: The authorization by a licensed nurse to an unlicensed person to provide selected nursing activities.
    paraphrase: 244 CMR 10.01 defines delegation as that authorization; supervision (for 244 CMR 3.00) as the delegating nurse's guidance with initial direction and periodic inspection of the activity; and an unlicensed person as a qualified, responsible individual with documented initial and ongoing competencies who functions in a complementary or assistive role and is employed by an entity other than the patient.
    confidence: high
  - id: ar2501_rn_lpn
    topics: [rn_lpn, scope_framework]
    citation: Advisory Ruling 25-01
    source: ar2501
    section: Advisory
    applies_to: [rn, lpn]
    quote: There is no regulatory requirement for RNs to supervise LPNs.
    paraphrase: RNs and LPNs are each responsible and accountable for their own scope; neither may perform activities outside it; authorized prescribers may not delegate activities outside a nurse's scope even if the prescriber is on site; RNs may not delegate to LPNs, and neither delegates to other licensed nurses.
    confidence: high
  - id: ar2501_assessment
    topics: [rn_lpn]
    citation: Advisory Ruling 25-01
    source: ar2501
    section: Definitions; comparison table
    applies_to: [rn, lpn]
    quote: RNs are responsible for completing the systematic patient assessment and developing the nursing plan of care
    paraphrase: LPNs perform basic, focused assessments and may contribute to the systematic assessment, but completing a systematic assessment is not within an LPN's scope; an RN may review an LPN's assessment data to determine needs and develop the plan of care. LPNs evaluate outcomes of basic nursing interventions; RNs coordinate the teaching plan, which LPNs may help implement.
    confidence: high
  - id: ar2501_groups
    topics: [rn_lpn]
    citation: Advisory Ruling 25-01
    source: ar2501
    section: Definitions (Groups)
    applies_to: [rn, lpn]
    quote: only RNs may provide care to groups
    paraphrase: The ruling defines groups as specific patient populations in specific settings (for example transitions in chronic disease, communicable disease care, and maternity care at various levels of the health system) and says only RNs may provide care to groups, citing the RN functions in 244 CMR 3.02. Check the ruling's wording before applying it to a public health role.
    confidence: medium
    note: The ruling's footnote cites a scoping review for the definition of groups, not a regulation; how it applies to population-level public health work is a question for the Board.
  - id: ar2501_supervision_nonnurse
    topics: [rn_lpn, management_charge]
    citation: Advisory Ruling 25-01 (Supervision; Dual Licensure)
    source: ar2501
    section: Supervision
    applies_to: [rn, lpn]
    quote: non-nurses may not evaluate nursing practice but can supervise basic employment issues
    paraphrase: Non-nurses may supervise employment matters such as human resources and administration but may not evaluate nursing practice. Both RNs and LPNs may assign nursing care within licensed nurses' scope and delegate nursing tasks to unlicensed personnel. A dual-licensed nurse is held to the standard of the highest nursing credential held.
    confidence: high
  - id: ar9802_charge
    topics: [management_charge]
    citation: Advisory Ruling 98-02
    source: ar9802
    section: Advisory
    applies_to: [lpn, rn]
    quote: It is within LPN scope of practice to function in the charge or supervisor nurse role.
    paraphrase: The charge or supervisor role is administrative (assignments, schedules, evaluations, budgets, teaching policy). Making a patient care assignment differs from delegation, which is the clinical authorization to an unlicensed person; an assignment must be consistent with the assignee's scope of practice, competency, job description, and the agency's policies.
    confidence: high
  - id: ar9324_prescriber
    topics: [standing_orders]
    citation: Advisory Ruling 9324
    source: ar9324
    section: Purpose
    applies_to: [rn, lpn]
    quote: duly authorized prescriber (i.e., Advanced Practice Registered Nurses with prescriptive authority, Physician Assistants, and Physicians)
    paraphrase: The ruling guides RNs and LPNs in accepting, verifying, transcribing, and implementing patient care orders from a duly authorized prescriber. The nurse must make sure a proper order exists before administering any prescription or non-prescription medication or an activity that requires an order.
    confidence: high
  - id: ar9324_question
    topics: [standing_orders]
    citation: Advisory Ruling 9324
    source: ar9324
    section: Nurse's Responsibility and Accountability
    applies_to: [rn, lpn]
    quote: It is the responsibility and the obligation of a nurse to question a patient care order that is deemed inappropriate
    paraphrase: If an order is unclear, or the nurse questions its appropriateness, accuracy, or completeness, the nurse may not implement it until it is verified with a duly authorized prescriber. Altering the directions in an order, or prescribing, renewing, refilling, or extending a prescription, is outside RN and LPN scope.
    confidence: high
  - id: ar9324_standing_elements
    topics: [standing_orders]
    citation: Advisory Ruling 9324 (Standing Order / Protocol)
    source: ar9324
    section: Standing Order / Protocol
    applies_to: [rn, lpn]
    quote: either directly on the standing order/protocol or on file with the facility/agency/program employing the nurse
    paraphrase: "The ruling lists what every standing order or protocol must include: the name of the substance or activity; the route and specific dose for a substance; inclusion and exclusion criteria the nurse assesses first; the signature or approval of a duly authorized prescriber (on the order or on file with the employing facility, agency, or program); the details of patient presentation; when it is to be given, including dosing tied to objective parameters and follow-up; when to seek emergency help; record keeping; regular review by medical, pharmacy, and nursing staff; and authentication by a prescriber within the required time frame."
    confidence: high
  - id: ar9324_standing_limits
    topics: [standing_orders]
    citation: Advisory Ruling 9324 (Standing Order / Protocol)
    source: ar9324
    section: Standing Order / Protocol
    applies_to: [rn, lpn]
    quote: determine choice of intervention based upon a menu of medications, dosing instructions or actions
    paraphrase: Standing orders and protocols cannot authorize the nurse to change the order once started (for example to start a new medication on his or her own), to choose among a menu of medications, doses, or actions, or to prescribe, renew, refill, or extend a prescription.
    confidence: high
  - id: ar9324_range
    topics: [standing_orders]
    citation: Advisory Ruling 9324 (Range Orders)
    source: ar9324
    section: Range Orders
    applies_to: [rn, lpn]
    quote: Range orders require specific, objective measures that must be collected and assessed prior to administering the correct dosing.
    paraphrase: A range order without specific objective measures (such as blood pressure, pulse, lab values, or oxygen saturation) would involve diagnosing and prescribing and be outside RN and LPN practice.
    confidence: high
  - id: ar9324_container
    topics: [standing_orders, otc_school]
    citation: Advisory Ruling 9324 (Pharmacy labeled container)
    source: ar9324
    section: Pharmacy labeled container
    applies_to: [rn, lpn]
    quote: it is within the licensed nurse's discretion to accept an original pharmacy labeled container in lieu of an order
    paraphrase: In certain limited settings (the ruling names schools, adult and pediatric day care, and summer camp) a nurse may accept an intact, legibly labeled original pharmacy container instead of a separate prescriber order if the setting has a policy, the medication is not expired, consent is obtained when indicated, allergies are checked, and the label has the information needed to give the medication safely.
    confidence: high
  - id: ar9324_management
    topics: [standing_orders, management_charge]
    citation: Advisory Ruling 9324 (Role of the Nurse in a Management Role)
    source: ar9324
    section: Role of the Nurse in a Management Role
    applies_to: [rn, lpn]
    quote: Licensed nurses in a management role must ensure an infrastructure is in place
    paraphrase: Nurses in management roles must define acceptable order methods in the practice setting, when each can be used, how competency is determined, and safety measures such as read-back for verbal orders, authentication time frames, abbreviation policies, and limits on substances unsafe to order verbally.
    confidence: high
  - id: ar9804_scope
    topics: [vaccines, standing_orders]
    citation: Advisory Ruling 9804
    source: ar9804
    section: Advisory
    applies_to: [rn, lpn]
    quote: It is within the scope of the Registered Nurse and Licensed Practical Nurse to administer immunizing agents and vaccines.
    paraphrase: The Board says RNs and LPNs may administer immunizing agents and vaccines to any member of the public in any setting after acquiring and maintaining knowledge and skills (storage, handling, administration, contraindications and precautions, managing reactions, adverse event reporting, documentation), and only as directed by an authorized prescriber.
    confidence: high
  - id: ar9804_standing_order
    topics: [vaccines, standing_orders]
    citation: Advisory Ruling 9804
    source: ar9804
    section: Advisory
    applies_to: [rn, lpn]
    quote: A nurse may administer an immunizing agent and vaccine from a Standing Order Protocol
    paraphrase: A vaccine standing order protocol must include the vaccine names, dose, route or method, inclusion and exclusion criteria (indications, contraindications, precautions), and the signature or approval of a duly authorized prescriber on the order or on file with the facility, agency, or program that provides individual or mass immunization. The ruling points to DPH Immunization Program and Immunization Action Coalition model standing orders and to Advisory Ruling 9324.
    confidence: high
  - id: ar9804_steps
    topics: [vaccines]
    citation: Advisory Ruling 9804
    source: ar9804
    section: Advisory
    applies_to: [rn, lpn]
    quote: Complete an assessment of the patient, including an allergy history
    paraphrase: Before giving a vaccine the nurse assesses the patient (with an allergy history), verifies the order, educates the patient or parent or guardian about the risks and benefits of accepting or refusing, obtains parental or guardian permission for a child as required, gives the federal Vaccine Information Statement, and complies with Massachusetts Immunization Information System reporting (M.G.L. c. 111, section 24M). Required documentation includes the VIS edition and date given, the office address and the name and title of the person who administers the vaccine, the date, and the manufacturer, lot number, and expiration date. Nurses in management roles must make sure resources (policies on consent, competency, VIS, MIIS reporting, errors, and emergencies) are in place.
    confidence: high
  - id: ar2001_cma
    topics: [vaccines, aprn, delegation]
    citation: Advisory Ruling 20-01
    source: ar2001
    section: Advisory
    applies_to: [aprn]
    quote: to delegate the administration of immunizations to a CMA
    paraphrase: For this ruling, "primary care provider" means an APRN. The Board's position is that an APRN acting as a primary care provider under M.G.L. c. 112, section 265 may delegate administering immunizations to a qualified certified medical assistant (CMA) who works in a health facility or a licensed primary care provider's practice, with the APRN present in the facility and immediately available (not necessarily in the room). Before delegating, the APRN assesses the CMA's training or certification and validates competency by observation, and reports immunizations to the MIIS. The ruling is about APRNs, not RNs or LPNs.
    confidence: high
  - id: ar9205_otc
    topics: [otc_school, standing_orders]
    citation: Advisory Ruling 92-05
    source: ar9205
    section: Advisory
    applies_to: [rn, lpn]
    quote: School Nurses may develop protocols for the administration of OTC medications
    paraphrase: School nurses may develop over-the-counter medication protocols that meet the standing order criteria in Advisory Ruling 9324. Licensed nurses may administer OTCs based on individual orders or on protocols with written authorization by an authorized prescriber. School nurses also follow 105 CMR 210, the DPH SHIELD training objectives, and 603 CMR 7.00.
    confidence: high
  - id: ar2401_harm_reduction
    topics: [harm_reduction, standing_orders]
    citation: Advisory Ruling 24-01
    source: ar2401
    section: Advisory
    applies_to: [rn, lpn]
    quote: Licensed nurses shall not be subject to professional disciplinary action solely for the provision of harm reduction supplies or services
    paraphrase: The Board's position is that nursing practice consistent with harm reduction, including providing opioid antagonists, fentanyl test strips, sterile pipes, and sterile syringes, does not violate the 9.03(7) standard on aiding unlawful acts as long as the nurse follows organizational policies and procedures. The ruling notes a DPH statewide naloxone standing order for pharmacists under M.G.L. c. 94C, section 19B, that DPH recommends prescribers issue standing orders for naloxone in their facility or practice setting, and that licensed nurses may use standing orders and protocols under Advisory Ruling 9324.
    confidence: high
    note: The ruling cites Advisory Ruling 9324 as "92-34" and "93-24" in places; the ruling on the Board's list is numbered 9324.
  - id: ar9401_map
    topics: [map_program, delegation_medication]
    citation: Advisory Ruling 9401
    source: ar9401
    section: Advisory
    applies_to: [rn, lpn]
    quote: It is not within the scope of practice of the RN or LPN to implement recommendations
    paraphrase: The ruling covers licensed nurses who train, consult, or monitor in the DPH Medication Administration Program (MAP) for community programs funded, operated, or licensed by DMH, DDS, MRC, or DCF. Those nurses do not bear responsibility for the medication practice of MAP-certified staff they trained but remain accountable for the content they taught, and may not implement recommendations such as ordering labs, hospitalization, or medication changes before a duly authorized prescriber confirms them. The ruling does not apply to programs outside those agencies.
    confidence: high
  - id: ar1801_licensure
    topics: [licensure, management_charge]
    citation: Advisory Ruling 1801
    source: ar1801
    section: Advisory
    applies_to: [rn, lpn, aprn]
    quote: Unless an individual possesses a current MA nursing license, that individual cannot hold a position
    paraphrase: A position that requires an LPN or RN license or APRN authorization to perform nursing activities that cannot be delegated (activities needing nursing assessment and judgment, physical, psychological, and social assessment needing nursing judgment, forming the plan of care and evaluating the response, and giving medication except as M.G.L. c. 94C permits) requires a current Massachusetts license. Administrative supervision of clinical components of nursing care also requires a current Massachusetts license.
    confidence: high
  - id: ar2303_larc
    topics: [new_procedures]
    citation: Advisory Ruling 23-03
    source: ar2303
    section: Advisory
    applies_to: [rn]
    quote: may perform procedures associated with LARC, including removal
    paraphrase: An RN with the required knowledge and competencies, on the order of an authorized prescriber and consistent with organizational policies, may perform long-acting reversible contraception procedures (implants and intrauterine devices, including removal). Shown as an example of how an advisory ruling pairs a scope statement with competence and order requirements.
    confidence: high
  - id: cmr4_titles
    topics: [aprn]
    citation: 244 CMR 4.03 and 4.04
    source: cmr4
    section: 4.03-4.04
    applies_to: [aprn]
    quote: No person shall announce or represent to the public that such person is an APRN
    paraphrase: The Board recognizes APRN clinical categories of certified registered nurse anesthetist, certified nurse midwife, certified nurse practitioner, clinical nurse specialist, and psychiatric nurse mental health clinical specialist. No one may represent himself or herself as an APRN or use a category title without Board authorization.
    confidence: medium
    note: 244 CMR 4.00 was read in part; the 4.03 list in the mass.gov PDF text is garbled, so the category list should be checked against the regulation.
  - id: cmr4_cnp_scope
    topics: [aprn]
    citation: 244 CMR 4.06 (CNP scope)
    source: cmr4
    section: "4.06"
    applies_to: [aprn]
    quote: including health promotion, disease prevention, health education
    paraphrase: The scope of certified nurse practitioner practice is described as health care services in diverse settings to individuals across the lifespan, including health promotion, disease prevention, health education, counseling and referral, and diagnosis and management of acute and chronic illness. Each APRN is responsible and accountable for their nursing judgments, actions, and competency, and practices in the clinical categories for which he or she is certified.
    confidence: medium
  - id: cmr4_prescribing
    topics: [aprn, standing_orders]
    citation: 244 CMR 4.07
    source: cmr4
    section: "4.07"
    applies_to: [aprn]
    quote: may engage in prescriptive practice with supervision by a Qualified Healthcare Professional
    paraphrase: CRNAs, CNPs, and PNMHCSs with at least two years of supervised practice may prescribe without supervision after submitting an attestation to the Board; those with less supervised experience prescribe with supervision by a Qualified Healthcare Professional under written guidelines (kept on file; signed for CNPs and PNMHCSs) that cover who supervises, when consultation or referral is required, and conformity to M.G.L. c. 94C and 105 CMR 700.000. The Board may ask to review the guidelines. Only part of 4.07 was read.
    confidence: medium

