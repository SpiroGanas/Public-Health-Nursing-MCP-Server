limits:
  - This guide returns citations, short quotations, summaries, and decision questions. It does not say that any specific act is within a particular nurse's scope of practice; that depends on the nurse's education and competence, the order or protocol, the setting, and the facts, and the Board decides questions about its own rules.
  - It is a partial snapshot (see read_scope). Provisions and advisory rulings that were not read are not covered, and rulings are revised over time.
  - The mass.gov copies of the regulations are not the official text; the Secretary of the Commonwealth publishes the official Code of Massachusetts Regulations.
  - It is not legal advice. Employer policy, other state and federal law (for example M.G.L. c. 94C, 105 CMR 700.000, and DPH rules for school and public health programs), and licensing of other professions also apply.
