    read in part (4.03, 4.04, 4.06 for CNPs, 4.07). 244 CMR 5.00 to 8.00 and the rest of M.G.L. c.
    112 sections 74 to 81C were not read, and the other advisory rulings on the Board's list (23) are listed by title only. Quotations were checked against the fetched text. The mass.gov
    PDFs have layout problems (noted where they affect a section). The regulations on mass.gov are
    marked by the Board as not the official version; the official text is published by the
    Secretary of the Commonwealth. Advisory rulings are the Board's guidance and are revised from
    time to time (dates shown); this guide cannot say that any specific act is within a nurse's
    scope of practice.

