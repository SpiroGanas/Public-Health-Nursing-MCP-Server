read_scope:
  read_in_full:
    - 244 CMR 3.00 (3.01 to 3.05)
    - 244 CMR 9.00 (9.01 to 9.04)
    - 244 CMR 10.00 (definitions)
    - "M.G.L. c. 112, section 80B"
    - The Board's scope of practice decision making guidelines, framework flow chart, and case study
    - "Advisory rulings 9324, 9804, 9803, 25-01, 92-05, 9401, 20-01, 24-01, 98-02, 1801, and 23-03"
  read_in_part:
    - "244 CMR 4.00: 4.03 (categories), 4.04 (use of the title), 4.06 (CNP scope), and 4.07 (prescriptive practice) only"
  not_read:
    - 244 CMR 5.00 (continuing education), 6.00 (education programs), 7.00 (investigations, complaints and board actions), 8.00 (licensure requirements)
    - "M.G.L. c. 112, sections 74 to 81C except 80B, and M.G.L. c. 13, sections 13 to 15D"
    - "The other advisory rulings listed by the Board (titles only below), including AR 0201, 0801, 0802, 0901, 1001, 1002, 1301, 2101, 2102, 9101, 9204, 9301, 9305, 9801, 9901, 9902, 23-01, 23-02, 24-02, 25-02, 25-03, 25-04, and 26-01"
    - The Board's Nursing Practice Advisory Panel pages and the Five Rights of Delegation news page
    - "Advisory ruling memos (the list page links a 'View Advisory Ruling memos' page that was not opened)"

decision_guidelines:
  intro:
    text: To evaluate a certain nursing practice or activity as within the scope of practice for an LPN, RN or APRN, the Board's guidelines have the nurse describe the activity, check whether a statute or regulation specifically permits or prohibits it, and then answer six questions.
    source: born_scope_page
    section: Decision making guidelines
    confidence: high
  questions:
    - number: 1
      question: Does the basic educational preparation of the nurse provide the necessary knowledge base and skills to engage in the practice or perform the activity?
      if_yes: The activity may be within the scope of practice of the RN or LPN.
      if_no: Documentation of additional educational preparation, training and experience may be required, or it may be an act within the scope of a nurse authorized to practice in an advanced role.
      source: born_scope_page
      section: Decision making guidelines, question 1
      confidence: high
    - number: 2
      question: Is the act or practice consistent with the scope of practice based on one of the listed factors? (The factors are not legible in the page text that was read; the flow chart words this as consistency with the scope of practice in the nursing literature and research.)
      if_yes: Continue.
      if_no: It is not within the nurse's scope of practice (or scope within a particular facility).
      source: born_scope_page
      section: Decision making guidelines, question 2
      confidence: medium
    - number: 3
      question: Does the nurse have documented evidence of knowledge and competence, including continued competence, to perform the activity?
      if_yes: Continue.
      if_no: It is not within the nurse's scope of practice.
      source: born_scope_page
      section: Decision making guidelines, question 3
      confidence: high
    - number: 4
      question: Is the practice within an accepted standard of care that a reasonable and prudent nurse with similar education and experience would provide?
      if_yes: Continue.
      if_no: It is not within the nurse's scope of practice.
      source: born_scope_page
      section: Decision making guidelines, question 4
      confidence: high
    - number: 5
      question: Does the nurse have the ability and resources to respond to complications so that patient safety and quality of care are assured?
      if_yes: Continue.
      if_no: It is not within the nurse's scope of practice and may place both the patient and the nurse at risk.
      source: born_scope_page
      section: Decision making guidelines, question 5
      confidence: high
    - number: 6
      question: Is the nurse prepared to accept the consequences of performing the activity?
      if_yes: The nurse may perform the activity, based on a valid order when required, and in accordance with established policies, procedures and standards of care.
      if_no: It is not within the nurse's scope of practice.
      source: born_scope_page
      section: Decision making guidelines, question 6
      confidence: high
  framework_steps:
    - Describe the nursing practice or activity.
    - Check the Nurse Practice Act and Board regulations (permitted, unsure or not clear, or prohibited; prohibited means stop).
    - Does basic educational preparation provide the necessary knowledge, skills and abilities? (If not, additional education is required, or it may be advanced practice.)
    - Is it consistent with the scope of practice in nursing literature and research?
    - Is there documented evidence of experience and of initial and continued competence?
    - Is the practice within the standards of care for a reasonable and prudent nurse?
    - Is patient safety assured?
    - Is the nurse prepared to accept accountability for performing the activity?
  framework_source: born_framework
  framework_note: The flow chart has eight numbered boxes (the first describes the activity); the nurse may perform the activity only after a yes at each step.

referral:
  text: Questions about whether a specific act is within scope go to the Board of Registration in Nursing, which issues advisory rulings and has the final word on the practice of nursing it licenses. M.G.L. c. 30A, section 8 authorizes the Board to issue advisory rulings on the applicability of statutes and regulations it enforces.
  contacts:
    - "BHPL Help Line (Board of Registration in Nursing): (617) 973-0800; alternate (617) 973-0900; hours 9 a.m. to 4:30 p.m., Monday to Friday"
    - "Email: nursing.admin@state.ma.us"
    - "Mail: Board of Registration in Nursing, 100 Cambridge St., 19th Floor, Boston, MA 02114-2509"
  source: born_scope_page
  contact_source: born_laws_page
  retrieved: "2026-11-12"

