  - title: Public Health Code of Ethics (2019), official PDF and web page
    url: https://www.apha.org/codeofethics/
    reason: apha.org is blocked from this environment; the code's own wording, definitions, and section structure were not read.
  - title: "Kass NE. An ethics framework for public health. Am J Public Health 2001 (full text)"
    url: https://doi.org/10.2105/ajph.91.11.1776
    reason: The full text is not available through the open E-utilities and the PMC and journal web pages are blocked; only the abstract and a secondary description were read.
  - title: "Childress JF et al. Public health ethics: mapping the terrain. J Law Med Ethics 2002"
