# Structure for public_health_ethics_analysis (POL-05): Kass's six-question framework, the
# justification conditions of Childress and colleagues, the six core values and analysis steps of the
# APHA Public Health Code of Ethics (2019), and decision profiles with least-restrictive-alternative
# options for quarantine and isolation, school exclusion, and scarce-resource allocation.
#
# REVIEW STATUS: pending. IMPORTANT: the APHA code itself (apha.org) and the full text of Kass's
# 2001 article (publisher full text not open; PMC web pages blocked) could NOT be read. The
# framework content below comes from the PubMed abstract of Kass's article and from open-access
# papers that describe the frameworks (read 2026-11-12). The decision profiles and the sub-prompts
# are this project's drafting aids, not source text (confidence low).
# Schema: content/schemas/policy_public_health_ethics.schema.json
meta:
  id: policy-public-health-ethics
  title: Public health ethics analysis structure (Kass framework; APHA Public Health Code of Ethics 2019)
  version: 0.1.0
  prepared: 2026-11-12
  effective_date: 2019-11-05
  source:
    title: An ethics framework for public health (Am J Public Health 2001;91:1776-82), abstract; and an open-access overview of ethical frameworks that tabulates its six questions (BMC Public Health 2010;10:638)
    publisher: American Public Health Association (journal); National Library of Medicine; BioMed Central
    url: https://pubmed.ncbi.nlm.nih.gov/11684600/
  related_sources:
    - title: Public Health Code of Ethics (2019), described in open-access papers (the code itself was not read)
      publisher: American Public Health Association
      url: https://www.apha.org/codeofethics/
    - title: Public Health Ethics (page)
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/scientific-integrity/php/public-health-ethics/index.html
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The six Kass questions, her three categories of ethical burden, and her balancing criteria are
    taken from an open-access overview (BMC Public Health 2010, CC BY) and from the PubMed abstract
    of the 2001 article, not from the article's full text (medium confidence; the wording is
    paraphrased). The five justification conditions are Childress and colleagues' (2002) as
    described in the same overview (medium). The APHA code's six core values come from two
    open-access papers that quote the 2019 code (medium); the four-part analysis approach and the
    list of additional considerations come from one such paper (low to medium); the code's own
    text, section structure, and definitions were not read (apha.org was blocked), so verify them
    against the official PDF before relying on this content. The decision profiles (what burdens to
    look for, the ordered options) are this project's drafting aids for structuring a discussion,
    not sourced content (low confidence); they say nothing about Massachusetts law, which applies
    to quarantine, isolation, and school exclusion and is not covered here. All source texts are
    copyrighted by their owners and are paraphrased; see the copyright notes.

