# Rules that bear on sharing health information, for health_information_sharing_guide (POL-07):
# HIPAA (45 CFR 160 and 164), FERPA (34 CFR 99), 42 CFR Part 2, the Massachusetts public records law
# (M.G.L. c. 66, section 10; c. 4, section 7, clause twenty-sixth), 105 CMR 300.000 and the
# Massachusetts statutes on confidentiality of health records. Each provision has a citation, a
# short quotation (25 words or fewer, checked against the fetched text), and a paraphrase. PARTIAL:
# only the provisions listed in `read_scope` were read.
#
# REVIEW STATUS: pending. The federal texts are the eCFR (versioner API) texts "up to date as of
# 2026-11-10"; the Massachusetts statutes are from malegislature.gov and the regulations from
# mass.gov (unofficial copies). The tool never gives a yes or no on whether a disclosure is allowed.
# Schema: content/schemas/policy_information_sharing.schema.json
meta:
  id: policy-information-sharing
  title: Which rules govern a health record and its sharing (HIPAA, FERPA, 42 CFR Part 2, Massachusetts) - partial snapshot
  version: 0.1.0
  prepared: 2026-11-13
  effective_date: null
  source:
    title: Electronic Code of Federal Regulations, titles 34, 42, and 45 (parts 99, 2, 160, 164)
    publisher: Office of the Federal Register and the Government Publishing Office
    url: https://www.ecfr.gov/
  related_sources:
    - title: Massachusetts General Laws (chapters 4, 66, 71, 111, 112)
      publisher: Massachusetts Legislature
      url: https://malegislature.gov/Laws/GeneralLaws
    - title: 105 CMR 300.000 (reportable diseases, surveillance, and isolation and quarantine requirements)
      publisher: Massachusetts Department of Public Health (unofficial copy on mass.gov)
      url: https://www.mass.gov/regulations/105-CMR-30000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    PARTIAL SNAPSHOT. Read on 2026-11-12 and 2026-11-13: 45 CFR 160.103 (definitions), 164.103,
    164.105, 164.501 (public health authority), 164.502, 164.506, 164.512 (all paragraphs, with
    (a), (b), (e), (f), (i), (j) read closely), 164.514 (a and the start of b); 34 CFR 99.1, 99.3,
    99.30, 99.31, 99.36; 42 CFR 2.11, 2.12, 2.13, 2.32, 2.33, 2.51, 2.54 (2.1 to 2.4, 2.14 to 2.16, 2.22, 2.31, 2.52, and 2.53 were fetched and only skimmed);
    M.G.L. c. 66 sections 10 and 10A; c. 4 section 7 (clause twenty-sixth); c. 71 sections 34D and
    34E; c. 111 sections 24M, 70F, 111, and 119; c. 112 section 12CC; and 105 CMR 300.120 and
    300.191. NOT read: the FERPA statute itself (20 U.S.C. 1232g), the HHS and Department of
    Education joint guidance on HIPAA and FERPA (hhs.gov is blocked from this environment), 603 CMR
    23.00 (Massachusetts student records; its mass.gov page is marked unpublished and the DESE site
    is blocked), 42 CFR Part 2 subpart E (court orders), the rest of 45 CFR 164 (including 164.508
    authorizations and 164.520 notices), M.G.L. c. 214 section 1B, c. 93H, and the preamble of the
    2024 Part 2 final rule (the Federal Register is blocked). Quotations were checked against the
    fetched text. The HIPAA definition of public health (45 CFR 160.103) and parts of 164.502 and
    164.512 were amended in 2024 and later (the eCFR lists amendments at 89 FR 33062 and 91 FR 14404
    for 160.103); the text shown is the eCFR text as of 2026-11-10 and its current status should be
    confirmed with counsel.

