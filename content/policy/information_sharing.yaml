cross_rules:
  - id: school_vs_hipaa
    text: >-
      A school health record that is an education record is outside HIPAA's definition of
      protected health information, so a school nurse in a school covered by FERPA asks FERPA's
      questions, not HIPAA's. A community provider sending information to the school is still bound
      by HIPAA on its side (for example the immunization permission in 45 CFR 164.512(b)(1)(vi)).
    regimes: [hipaa, ferpa]
    sources: [ecfr_160_103, ecfr_164_512]
    confidence: high
  - id: nurse_two_hats
    text: >-
      A nurse can hold records in more than one role (for example a board of health nurse who also
      runs a clinic that bills electronically). The rules attach to the record and the entity that
      holds it, so answer the questions once for each role and for each kind of record.
    regimes: [hipaa, ma_public_records]
    sources: [ecfr_164_105]
    confidence: medium
  - id: public_records_and_statutes
    text: >-
      A public agency's records are presumed public, but statutes and regulations that bar
      disclosure (c. 111 section 119, 105 CMR 300.120, HIPAA for a covered component, FERPA for
      education records) can place health records within the statutory exemption, and the privacy
      exemption covers medical information about a named person. The agency's records access
      officer and counsel decide.
    regimes: [ma_public_records, ma_health_confidentiality, hipaa, ferpa]
    sources: [mgl_4_7, mgl_111_119, cmr_300]
    confidence: medium
  - id: strictest_applies
    text: >-
      When more than one regime applies to the same record, a disclosure must meet each of them.
      A permission under one (for example HIPAA's public health permission) does not lift a
      restriction under another (for example Part 2 or c. 111 section 70F).
    regimes: [hipaa, part2, ma_health_confidentiality]
    sources: [ecfr_part2_13, mgl_111_70f]
    confidence: medium

referral:
  text: >-
    This guide lists rules and cautions; it does not tell you whether a particular disclosure is
    allowed. Take the question to your agency's counsel (town counsel, the school district's
    counsel, or your employer's privacy officer) before disclosing, especially for a subpoena or
    police request, a public records request, a substance use disorder record, or an HIV test
    result.
  contacts:
    - "Your agency's counsel or privacy officer"
    - "The records access officer of your agency or municipality (public records requests)"
    - "The Massachusetts Department of Public Health, Bureau of Infectious Disease and Laboratory Sciences, for questions about reporting and confidentiality under 105 CMR 300.000"

