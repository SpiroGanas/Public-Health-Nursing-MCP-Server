questions:
  - id: holder_role
    question: Who holds the record, and in what role are you holding it?
    why: Which regimes apply depends first on who holds the record. A school nurse, a board of health, a clinic, and a substance use treatment program are bound by different rules.
    choices:
      - {value: health_care_provider, label: "A health care provider or health plan that bills or transmits health information electronically (clinic, practice, hospital)"}
      - {value: local_health_department, label: "A local board of health or health department (municipal agency)"}
      - {value: school_nurse_public, label: "A school nurse in a public school or school district"}
      - {value: school_nurse_private, label: "A school nurse in a private or independent school"}
      - {value: substance_use_program, label: "A program that diagnoses, treats, or refers for substance use disorder (possible 42 CFR Part 2 program)"}
      - {value: state_agency, label: "A state agency (for example the Department of Public Health)"}
      - {value: other, label: "Something else or not sure"}
  - id: record_type
    question: What kind of record or information is it?
    why: The type of record can bring in rules of its own (education records, substance use treatment records, HIV test results, disease reports, immunization records).
    choices:
      - {value: clinical_record, label: "Clinical or treatment record of a patient or client"}
      - {value: school_health_record, label: "Student health record kept by a school (health office notes, health plan, screening results)"}
      - {value: immunization_record, label: "Immunization record or immunization registry information"}
      - {value: communicable_disease_report, label: "Disease report, case investigation, or contact tracing record"}
      - {value: hiv_test_result, label: "HIV test result or the identity of the person tested"}
      - {value: substance_use_treatment_record, label: "Substance use disorder treatment record from a program"}
      - {value: administrative_record, label: "Agency administrative record (inspection, permit, minutes, correspondence) that may mention people"}
      - {value: other, label: "Something else or not sure"}
  - id: recipient
    question: Who wants or would receive the information?
    why: Some rules turn on the recipient (a school, a public health authority, a court, an employer, the public).
    choices:
      - {value: individual_or_parent, label: "The person the record is about, a parent or guardian, or a personal representative"}
      - {value: school, label: "A school or school nurse"}
      - {value: health_care_provider, label: "Another health care provider"}
      - {value: public_health_authority, label: "The Department of Public Health or a local board of health"}
      - {value: law_enforcement_or_court, label: "Law enforcement, a court, or a party with a subpoena"}
      - {value: employer, label: "An employer"}
      - {value: researcher, label: "A researcher or evaluator"}
      - {value: public_requester, label: "A member of the public, a reporter, or any requester of public records"}
      - {value: exposed_person, label: "A person who may have been exposed to a disease (contact notification)"}
      - {value: other_agency, label: "Another agency or organization"}
  - id: purpose
    question: What is the purpose of the sharing?
    why: Most permissions in HIPAA, FERPA, and Part 2 are tied to a purpose.
    choices:
      - {value: treatment_or_care, label: "Treatment or coordination of care"}
      - {value: public_health_reporting, label: "Required public health reporting"}
      - {value: disease_investigation, label: "Disease investigation, surveillance, or control"}
      - {value: school_immunization, label: "Checking school immunization requirements"}
      - {value: emergency_threat, label: "A health or safety emergency or threat"}
      - {value: research, label: "Research, evaluation, or a study"}
      - {value: public_records_request, label: "Responding to a public records request"}
      - {value: legal_process, label: "A subpoena, court order, or law enforcement request"}
      - {value: other, label: "Something else or not sure"}
  - id: consent
    question: Is there a signed consent or authorization from the person (or parent)?
    why: Consent changes what is needed under each regime, but a consent form that does not meet the specific requirements of the regime in question may not be enough.
    choices:
      - {value: written, label: "Yes, signed and written"}
      - {value: verbal, label: "Verbal agreement only"}
      - {value: none, label: "No"}
      - {value: unknown, label: "Not sure"}

regimes:
  - id: hipaa
    name: HIPAA Privacy Rule (45 CFR parts 160 and 164)
    what_it_is: >-
      A federal rule that limits use and disclosure of protected health information by covered
      entities (health plans, clearinghouses, and health care providers that conduct certain
      electronic transactions) and their business associates. It allows disclosures for public
      health, to prevent a serious threat, and as required by law, among other purposes.
    depends_on: Whether the holder is a covered entity (or the health care component of a hybrid entity), and whether the record is an education record.
  - id: ferpa
    name: FERPA (20 U.S.C. 1232g; 34 CFR part 99)
    what_it_is: >-
      A federal law that protects education records of students at schools that receive funds from
      the U.S. Department of Education. It gives parents and eligible students access and requires
      consent for most disclosures, with exceptions such as school officials with legitimate
      educational interests and health or safety emergencies.
    depends_on: Whether the school receives funds under a program the Secretary of Education administers (34 CFR 99.1) and whether the record is an education record.
  - id: part2
    name: 42 CFR Part 2 (confidentiality of substance use disorder patient records)
    what_it_is: >-
      Federal rules that restrict use and disclosure of records that identify a patient as having
      a substance use disorder, when the records come from a federally assisted program that holds
      itself out as providing substance use disorder diagnosis, treatment, or referral. The rules
      were amended by a final rule published in February 2024.
    depends_on: Whether the holder is a Part 2 program (or a lawful holder who received the records from one), and whether the program is federally assisted.
  - id: ma_public_records
    name: Massachusetts public records law (M.G.L. c. 66, section 10; c. 4, section 7, clause twenty-sixth)
    what_it_is: >-
      Records made or received by Massachusetts agencies and municipalities are presumed to be
      public unless an exemption applies (for example a statute that bars disclosure, or the
      privacy exemption for medical files and data about a named individual).
    depends_on: Whether the holder is a public agency or municipality and whether the record is a public record as defined in c. 4, section 7.
  - id: ma_health_confidentiality
    name: Massachusetts health confidentiality provisions (105 CMR 300.000 and M.G.L. c. 111 and c. 112 sections)
    what_it_is: >-
      State rules on disease reports, HIV test results, immunization registry data, and
      health records, including the confidentiality rule in the reportable disease regulation and
      the authority for school nurses to obtain immunization records for school admission.
    depends_on: The type of record (disease report, HIV test, venereal disease record, immunization registry, patient record) and who holds it.
  - id: ma_student_records
    name: Massachusetts student record provisions (M.G.L. c. 71, sections 34D and 34E; 603 CMR 23.00)
    what_it_is: >-
      State law on parents' and students' access to school records. The student records regulation
      (603 CMR 23.00) could not be read for this guide.
    depends_on: Whether the record is a school record of a public school student.

provisions:
  # ---- HIPAA
  - id: hipaa_covered_entity
    regime: hipaa
    citation: "45 CFR 160.103 (covered entity)"
    source: ecfr_160_103
    quote: "A health care provider who transmits any health information in electronic form in connection with a transaction covered by this subchapter."
    paraphrase: >-
      HIPAA binds health plans, health care clearinghouses, and health care providers that conduct
      covered electronic transactions (for example billing insurers electronically). Whether a
      health department, clinic, or school-based program is covered is a fact question about that
      organization.
    confidence: high
    purposes: []
    recipients: []
    record_types: []
  - id: hipaa_hybrid
    regime: hipaa
    citation: "45 CFR 164.105(a)(1) (health care component)"
    source: ecfr_164_105
    quote: "apply only to the health care component(s) of the entity, as specified in this section."
    paraphrase: >-
      If a covered entity is a hybrid entity (one legal entity that does covered and non-covered
      work, as a municipal health department might), the rule applies only to its designated health
      care component(s). Find out whether your agency has designated one.
    confidence: high
    purposes: []
    recipients: []
    record_types: []
  - id: hipaa_phi_excludes_ferpa
    regime: hipaa
    citation: "45 CFR 160.103 (protected health information, paragraph (2)(i))"
    source: ecfr_160_103
    quote: "In education records covered by the Family Educational Rights and Privacy Act, as amended, 20 U.S.C. 1232g;"
    paraphrase: >-
      Protected health information does not include health information in education records that
      FERPA covers, so a student health record held by a school generally falls under FERPA, not
      HIPAA. The definition also excludes employment records held by a covered entity as employer.
    confidence: high
    purposes: []
    recipients: []
    record_types: [school_health_record, immunization_record]
  - id: hipaa_general_rule
    regime: hipaa
    citation: "45 CFR 164.502(a)"
    source: ecfr_164_502
    quote: "may not use or disclose protected health information, except as permitted or required by this subpart"
    paraphrase: >-
      The starting point: a covered entity may use or disclose protected health information only
      when the rule permits or requires it. Each permission below has its own conditions.
    confidence: high
    purposes: []
    recipients: []
    record_types: []
  - id: hipaa_min_necessary
    regime: hipaa
    citation: "45 CFR 164.502(b)(1)"
    source: ecfr_164_502
    quote: "must make reasonable efforts to limit protected health information to the minimum necessary to accomplish the intended purpose"
    paraphrase: >-
      For most disclosures the covered entity must limit the information to the minimum necessary
      for the purpose. Paragraph (b)(2) lists exceptions (for example disclosures to a provider for
      treatment); read it with the permission you rely on.
    confidence: high
    purposes: [public_health_reporting, disease_investigation, school_immunization, emergency_threat, research, other]
    recipients: []
    record_types: []
  - id: hipaa_personal_rep
    regime: hipaa
    citation: "45 CFR 164.502(g)(1)"
    source: ecfr_164_502
    quote: "treat a personal representative as the individual for purposes of this subchapter."
    paraphrase: >-
      A covered entity generally treats a personal representative (for an unemancipated minor,
      usually a parent, guardian, or person acting in loco parentis) as the individual, with
      exceptions in paragraphs (g)(3) and (g)(5) (not read closely here). Massachusetts law on
      minors' consent to their own care was not read for this guide.
    confidence: medium
    purposes: []
    recipients: [individual_or_parent]
    record_types: []
  - id: hipaa_tpo
    regime: hipaa
    citation: "45 CFR 164.506(c)(1) and (c)(2)"
    source: ecfr_164_506
    quote: "may disclose protected health information for treatment activities of a health care provider."
    paraphrase: >-
      A covered entity may use and disclose protected health information for its own treatment,
      payment, and health care operations, and may disclose it for another provider's treatment
      activities (paragraph (c)(2)).
    confidence: high
    purposes: [treatment_or_care]
    recipients: [health_care_provider]
    record_types: []
  - id: hipaa_required_by_law
    regime: hipaa
    citation: "45 CFR 164.512(a)(1)"
    source: ecfr_164_512
    quote: "may use or disclose protected health information to the extent that such use or disclosure is required by law"
    paraphrase: >-
      A covered entity may disclose protected health information to the extent that a law
      requires it and the disclosure is limited to what that law requires. Paragraph (a)(2) sends
      some required-by-law disclosures (abuse, judicial and administrative proceedings, law
      enforcement) through the conditions in paragraphs (c), (e), and (f).
