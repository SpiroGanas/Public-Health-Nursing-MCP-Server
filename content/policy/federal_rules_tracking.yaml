document_types:
  - id: proposed_rule
    code: PRORULE
    label: Proposed rule (usually has a comment period)
  - id: final_rule
    code: RULE
    label: Final rule (comments are normally closed)
  - id: notice
    code: NOTICE
    label: Notice (some invite comment, for example on information collections and guidance)

# Short quotations (25 words or fewer) and paraphrases of EPA's tips, keyed for the outline.
tips:
  - id: identify
    quote: "Identify the docket ID number and other identifying information (e.g., subject heading, Federal Register date and page number) in your subject line."
    paraphrase: Put the docket ID and the Federal Register date and page in the subject line, so the comment is not lost.
    source: epa_tips
    section: Tips for Effective Comments
  - id: read
    quote: "Read and understand the document you are commenting on."
    paraphrase: Read the proposal first; if something is unclear, ask the agency contact named in it and say so in the comment.
    source: epa_tips
    section: Tips for Effective Comments
  - id: follow
    quote: "Follow directions provided."
    paraphrase: Answer any questions the agency asks and organize the comment the way it asks; cite the proposed part and section of the CFR for each provision you address.
    source: epa_tips
    section: Tips for Effective Comments
  - id: concise
    quote: "Be concise but support your claims."
    paraphrase: Say why you agree or disagree, give specific examples, and suggest alternatives and substitute language for changes you request.
    source: epa_tips
    section: Tips for Effective Comments
  - id: evidence
    quote: "Base your comments on sound reasoning, scientific evidence, and/or how you will be impacted by the agency's proposal."
    paraphrase: Describe assumptions and data; if you estimate costs or burdens, explain the method so it can be reproduced.
    source: epa_tips
    section: Tips for Effective Comments
  - id: tradeoffs
    quote: "Address trade-offs and opposing views."
    paraphrase: Acknowledge the other side and explain why your position still holds.
    source: epa_tips
    section: Tips for Effective Comments
  - id: not_a_vote
    quote: "The comment process is not a vote"
    paraphrase: One well-supported comment is often more useful to the agency than many form letters.
    source: epa_tips
    section: Tips for Effective Comments
  - id: deadline
    quote: "Make sure to submit your comments by the comment period deadline identified in the Federal Register document."
    paraphrase: The deadline is the one stated in the Federal Register document.
    source: epa_tips
    section: Tips for Effective Comments
  - id: public
    quote: "will be posted to Regulations.gov"
    paraphrase: EPA posts comments, including any personal information in the body, to Regulations.gov; do not put private or confidential information in a comment (EPA's rule; check the agency you are commenting to).
    source: epa_tips
    section: Rules and Restrictions

# The comment outline. Each section has guidance and the tips it follows. Placeholders are [NURSE: ...].
outline:
  - id: header
    heading: Subject line and identification
    tips: [identify]
    guidance: Put the docket ID, document title, agency, and the Federal Register date, page, or document number in the subject line and at the top of the letter.
    placeholders:
      - field: docket_id
        text: "[NURSE: docket ID]"
      - field: fr_citation
        text: "[NURSE: Federal Register document number, date, and page]"
  - id: who
    heading: Who is commenting and why it matters to us
    tips: [not_a_vote]
    guidance: State your agency or organization, your role, and the community you serve. Comments are usually public, so use only information you are willing to publish.
    placeholders:
      - field: organization
        text: "[NURSE: organization and role]"
      - field: population
        text: "[NURSE: population served, in general terms]"
  - id: position
    heading: Summary of our position
    tips: [concise]
    guidance: In a short paragraph, say whether you support, oppose, or support with changes, and the two or three main reasons.
    placeholders:
      - field: position
        text: "[NURSE: support / oppose / support with changes]"
      - field: reasons
        text: "[NURSE: main reasons]"
  - id: provisions
    heading: Comments on specific provisions
    tips: [follow, concise]
    guidance: One row for each provision you address, with the part and section of the CFR (or the page of the notice), your position, why, and the change or substitute language you ask for.
    table:
      columns: [Provision (CFR part and section, or page), Position, Reasons and evidence, Requested change or substitute language]
      rows: 3
  - id: agency_questions
    heading: Answers to the agency's specific questions
    tips: [follow]
    guidance: If the document asks for comment on particular questions, answer each one under its own number.
    placeholders:
      - field: agency_questions
        text: "[NURSE: the agency's question, then our answer]"
  - id: evidence
    heading: Evidence and data
    tips: [evidence]
    guidance: Give the sources, local data, and assumptions behind your position. Use aggregate numbers only; never include information about individuals. If you estimate costs or burdens, show how you calculated them.
    placeholders:
      - field: evidence
        text: "[NURSE: published evidence, with citations]"
      - field: local_data
        text: "[NURSE: local data as aggregate numbers, with years and sources]"
      - field: cost_estimate
        text: "[NURSE: cost or burden estimate and how it was calculated]"
  - id: impacts
    heading: Effects on our community and our department
    tips: [evidence]
    guidance: Describe who in your community would be affected and how (benefits, burdens, capacity, timing), and what the department would need to implement it.
    placeholders:
      - field: community_effects
        text: "[NURSE: effects on residents and on groups with greater risk]"
      - field: department_effects
        text: "[NURSE: effects on department staffing, funding, and timelines]"
  - id: tradeoffs
    heading: Trade-offs and opposing views
    tips: [tradeoffs]
    guidance: Name the strongest argument on the other side and explain why your position still holds, or what would change your mind.
    placeholders:
      - field: opposing_view
        text: "[NURSE: opposing view and our response]"
  - id: closing
    heading: Closing and submission checklist
    tips: [deadline, public]
    guidance: Thank the agency, offer to answer questions, and check the list below before submitting on Regulations.gov or by the method the document gives.
    checklist:
      - Docket ID and Federal Register date or page are in the subject line.
      - The comment is submitted by the deadline in the Federal Register document (check the time of day too).
      - Every provision you address cites its CFR part and section.
      - Any estimate shows its method; every number has a source.
      - No information about individuals, no confidential information, and no profanity or threats.
      - Attachments are the documents you cite, in an accessible format.
      - You kept a copy and the confirmation number.

countdown_note: The countdown counts calendar days from today (your computer's local date) to the comment close date that the Federal Register gives; the close date itself counts as open ("closes today"). The Federal Register document's DATES section states the exact deadline and time of day (electronic comments are often due at 11:59 pm Eastern, but check; in one recorded Regulations.gov response the end time was 04:59:59 UTC, which is 11:59:59 pm Eastern standard time the evening before).

limits:
  - "Live data comes only from the Federal Register API (no key) and, when you set PHN_REGULATIONS_GOV_API_KEY, Regulations.gov. When neither can be reached the tool says so and returns no documents; it never shows old data as current. Cached searches are used for at most two days and are labeled."
  - "Agency slugs other than EPA, HHS, USDA, and FNS are unverified; use agency_slugs if one finds nothing."
  - "The outline follows EPA's tips; other agencies, and individual notices, may require a different format or a specific form."
  - "The tool does not file comments or contact any agency."
