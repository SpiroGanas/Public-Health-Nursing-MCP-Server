# Reference content for monitor_federal_rules (POL-03): the federal agencies to watch and their
# Federal Register slugs, the document types, and the structure of a public comment (an outline
# with [NURSE: ...] placeholders), built from EPA's published "Tips for Effective Comments".
#
# REVIEW STATUS: pending. IMPORTANT: federalregister.gov, regulations.gov, and api.regulations.gov were
# blocked in the build environment (HTTP 403), so the Federal Register and Regulations.gov APIs could not
# be called. The request filters and response fields come from the Federal Register's own open-source
# repository (federalregister-api-core, read 2026-11-13) and from Regulations.gov v4 responses recorded in
# its tests; the agency slugs for EPA, HHS, and USDA are listed in that repository's agency mapping file
# (verified), and the slugs for CDC, CMS, HRSA and the other agencies are written from memory of
# federalregister.gov agency page addresses (confidence low: if a slug is wrong the search returns nothing
# or an error; give `agency_slugs` yourself). The comment structure follows the tips on EPA's web page
# (read 2026-11-12), which is one agency's guidance; other agencies may ask for other things.
# Schema: content/schemas/policy_federal_rules_tracking.schema.json
