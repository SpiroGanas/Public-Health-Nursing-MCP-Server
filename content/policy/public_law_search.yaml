referral:
  text: >-
    This tool finds and cites law; it does not interpret it for your situation. Check the cited
    section on the Legislature's or mass.gov's page (the links are in the results) and ask your
    agency's counsel or town counsel before relying on it. Regulations are amended; a section's
    date here is the date shown when the snapshot was built.
  contacts:
    - "Your agency's counsel or town counsel"
    - "The Massachusetts Department of Public Health, Office of Local and Regional Health, for local board of health questions"
    - "The Trial Court Law Libraries (law librarians answer legal research questions on mass.gov)"

limits:
  - "Decision support, not legal advice. It lists provisions that match your words and quotes at most 25 words of each; it does not say what the law requires in your case."
  - "The bundled corpus is partial: see coverage for each source. A search that finds nothing does not mean no law applies. Sections that are index-only are shown by title and link, without text."
  - "Matching is by words and citations, not by meaning. Use the section numbers and the topic starting points to confirm you have seen the right provisions."
  - "Regulation text came from PDF extraction; tables, forms, and appendices may be missing or garbled. Read the source."
  - "Your local regulations are searched only in your container. Files that look like client records are refused. Nothing is written."
