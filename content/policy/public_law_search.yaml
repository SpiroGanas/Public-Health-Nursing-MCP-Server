# Settings and starting points for search_public_health_law (POL-02). The law text itself is in the
# bundled snapshots (snapshots/ma_law_mgl_c111.json, ma_law_105_cmr.json, ma_law_244_cmr.json,
# built by xtask/scripts/build_law_snapshots.py from malegislature.gov and mass.gov on 2026-11-12);
# this file holds the review status, what each source covers, and topic starting points (lists of
# citations chosen from the section titles in those snapshots; the tool checks that each one exists).
#
# REVIEW STATUS: pending. The tool is decision support, not legal advice. Regulations on mass.gov
# are unofficial copies; the Secretary of the Commonwealth publishes the official text.
# Schema: content/schemas/policy_public_law_search.schema.json
meta:
  id: policy-public-law-search
  title: Public health law search - corpus coverage and topic starting points (M.G.L. c. 111, 105 CMR, 244 CMR)
  version: 0.1.0
  prepared: 2026-11-13
  effective_date: null
  source:
    title: Massachusetts General Laws, chapter 111 (Public Health)
    publisher: Massachusetts Legislature
    url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXVI/Chapter111
  related_sources:
    - title: 105 CMR (Department of Public Health regulations), Code of Massachusetts Regulations on mass.gov
      publisher: Massachusetts Trial Court Law Libraries (mass.gov)
      url: https://www.mass.gov/regulations/105-CMR-30000-reportable-diseases-surveillance-and-isolation-and-quarantine-requirements
    - title: 244 CMR (Board of Registration in Nursing regulations)
      publisher: Massachusetts Trial Court Law Libraries (mass.gov)
      url: https://www.mass.gov/regulations/244-CMR-900-standards-of-conduct-for-nurses
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The corpus was read by script from malegislature.gov and mass.gov on 2026-11-12 (see the
    snapshot manifest). The topic starting points below were chosen from the section titles in the
    snapshots on 2026-11-13; their selection is this project's judgment and has not been checked by
    a lawyer or the subject matter expert. Section text came from PDF and web page text extraction
    (tables, forms, and appendices are not reliably extracted). The mass.gov copies of regulations
    are unofficial. The chapter dates are the dates mass.gov shows and may not reflect amendments
    not yet posted.

corpus:
  mgl_c111:
    label: "M.G.L. c. 111 (Public Health)"
    snapshot_id: ma-law-mgl-c111
    coverage: >-
      Index of every section of chapter 111 that is not repealed (number, title, link). Full text
      is bundled for 45 core sections (the Department's and boards of health's powers, disease
      reporting, isolation and quarantine, nuisances and the sanitary code, immunization registry,
      newborn screening, confidentiality of HIV and venereal disease records). Other sections are
      index-only: the tool gives the title and link but not the text.
    not_included:
      - "Repealed sections (listed only as a count)"
      - "Other chapters of the General Laws, including c. 111D, c. 94C, c. 112, c. 71, c. 66, and c. 4 (the last four are used in the information sharing guide)"
  cmr_105:
    label: "105 CMR (Department of Public Health)"
    snapshot_id: ma-law-105-cmr
    coverage: >-
      Every chapter on mass.gov's 105 CMR table of contents with its date and a section number and
      title index read from each chapter's PDF. Full text is bundled for 20 chapters: 172, 200,
      201, 210, 220, 221, 222, 223, 270, 271, 300, 335, 360, 365, 400, 410, 460, 590, 661, and 665
      (reportable diseases, isolation and quarantine, school health and immunization, lead, the
      housing, food, and general sanitary code chapters, tobacco, rabies, tuberculosis). Other
      chapters are index-only.
    not_included:
      - "Chapters not listed on mass.gov's 105 CMR table of contents on the retrieval date"
      - "Guidance, policies, and forms of the Department (see search_ma_disease_control_guide)"
  cmr_244:
    label: "244 CMR (Board of Registration in Nursing)"
    snapshot_id: ma-law-244-cmr
    coverage: >-
      All eight chapters (3.00 to 10.00) in full text. For advisory rulings and the Board's
      decision-making guidelines use nursing_scope_of_practice_guide, which cites the provisions
      that bear on scope and delegation questions.
    not_included:
      - "Board advisory rulings and decision guidelines (in nursing_scope_of_practice_guide)"

local:
  default_folder: local_regulations
  description: >-
    Your board of health's own regulations, in a folder under your data folder (default
    local_regulations; PDF, Word, Markdown, text, or HTML). They are indexed in your container and
    searched with the same citations as the state texts. Files that look like client records (a
    date of birth, record number, or health plan number) are refused, not indexed for results.

extended:
  folders:
    - law_corpus
  description: >-
    An optional larger corpus built by xtask/scripts/build_law_snapshots.py with --extended (every
    section of chapter 111 and every chapter of 105 CMR in full text) can be installed as
    law_corpus/ in the data folder or in the cache folder. The tool uses it only when its manifest
    and file checksums match, and says so.

excerpt_words: 25

