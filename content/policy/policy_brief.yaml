# Template content for draft_policy_brief (POL-04): the eight steps of Bardach's "Eightfold Path"
# as described in two open-access articles (CC BY 4.0) and PubMed abstracts that could be read,
# the criteria those articles used, and the sections of a one-page and a longer policy brief.
# Bardach's book is copyrighted and was NOT read: the steps are paraphrased from the articles that
# describe them, and the brief's section prompts are this project's drafting aids (marked as such).
#
# REVIEW STATUS: pending. Nothing here is a fact about a policy problem; the tool never invents
# facts or statistics (every fact in a draft is a [NURSE: ...] placeholder or text the nurse supplies).
# Schema: content/schemas/policy_policy_brief.schema.json
meta:
  id: policy-policy-brief
  title: Policy brief template and the Eightfold Path of policy analysis (Bardach, as described in open-access articles)
  version: 0.1.0
  prepared: 2026-11-13
  effective_date: null
  source:
    title: "Analysing disability policy in Namibia: An occupational justice perspective (African Journal of Disability, 2018; PMC6111379, CC BY 4.0)"
    publisher: AOSIS (African Journal of Disability)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6111379/
  related_sources:
    - title: "Community water fluoridation policy and population oral health: a policy analysis (Frontiers in Oral Health, 2026; PMC13422374, CC BY 4.0)"
      publisher: Frontiers Media
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13422374/
    - title: "Health policy analysis: a simple tool for policy makers (Public Health, 2005; PubMed 15661129, abstract only)"
      publisher: Public Health (Elsevier), via PubMed
      url: https://pubmed.ncbi.nlm.nih.gov/15661129/
    - title: "Improving Breastfeeding in Rural Tanzania Using Eight-Step Policy Analysis Methodology (Policy, Politics, & Nursing Practice, 2020; PubMed 32799754, abstract only)"
      publisher: Policy, Politics, & Nursing Practice (SAGE), via PubMed
      url: https://pubmed.ncbi.nlm.nih.gov/32799754/
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    PARTIAL. Read on 2026-11-13 through NCBI E-utilities: the full text of two open-access
    articles (PMC6111379 and PMC13422374, both CC BY 4.0) that describe and apply the eightfold
    path, and the PubMed abstracts of a 2005 paper that adapted it for health policy (PubMed
    15661129) and a 2020 nursing application (PubMed 32799754). NOT read: Bardach's book (a
    copyrighted work; the Namibia article cites its 4th edition, 2012, and later editions exist),
    Collins (2005) in full, and any Massachusetts or nursing-specific policy brief guidance. The
    step names below are this project's short labels for the steps those articles describe. The
    criteria are the ones the two articles used, plus drafting suggestions marked as this
    project's own. Reading-level targets come from the check_readability tool's defaults, not from
    a source on policy briefs.

