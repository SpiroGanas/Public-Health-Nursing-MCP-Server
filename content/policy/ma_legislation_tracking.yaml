general_court:
  number: 194
  years: "2025-2026"
  note: The 194th General Court's documents are dated from January 2025. Bills not enacted by the end of the session (January 2027) end; they must be refiled in the 195th General Court.

how_to_search:
  - "Bill search page: https://malegislature.gov/Bills/Search (keyword, committee, and sponsor filters)."
  - "A bill's page is https://malegislature.gov/Bills/194/<number>, for example H3444 or S2518."
  - "Committee hearings are announced on the Legislature's hearings calendar; a bill's history shows 'Hearing scheduled for ...' lines."
  - "To testify or submit written testimony, use the committee's instructions on the hearing notice (the tool does not submit anything)."

