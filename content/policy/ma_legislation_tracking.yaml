# Stage rules. The stage of a bill is the stage of its LATEST history action that matches a rule; the
# first matching rule (in this order) decides a single action. Patterns are case-insensitive regular
# expressions applied to the action text. Actions that match no rule (for example "Senate concurred",
# "Rules suspended", amendments) do not change the stage.
stage_rules:
  - stage: enacted
    label: Enacted (signed by the Governor)
    patterns: ["signed by the governor", "chapter \\d+ of the acts"]
  - stage: awaiting_governor
    label: Enacted by the legislature; with the Governor
    patterns: ["^enacted", "laid before the governor"]
  - stage: study_or_new_draft
    label: Sent to study, combined into another bill, or replaced by a new draft (usually the end of this bill)
    patterns: ["study order", "accompanied a new draft", "^accompanied( by)? [hs]\\d", "ought not to pass", "withdrawn"]
  - stage: floor
    label: On the floor of a branch (reading, engrossment, orders of the day)
    patterns: ["third reading", "engrossed", "read second", "orders of the day", "^read third"]
  - stage: reported_out
    label: Reported out of a committee (may go to another committee or the floor)
    patterns: ["reported favorably", "^reported from the committee", "committee recommended", "committee reported", "^reported,", "reported by committee", "^reported on a part"]
  - stage: in_committee
    label: Referred to a committee (not yet reported)
    patterns: ["^referred", "^discharged", "reporting date extended", "^hearing", "^new draft of"]
default_stage:
  stage: filed
  label: Filed (no committee action recorded yet)

# Structured questions to put to any bill (drafting aids for the nurse's own analysis).
analysis_questions:
  - id: who_acts
    question: "Who would have to do something differently if this became law (the health department, the board of health, schools, providers, employers, residents)?"
  - id: what_changes
    question: "What would change in our current duties, authority, forms, or procedures? Which section of the bill says so? (Read that section; the excerpt shown is only a short quotation.)"
  - id: money
    question: "Does the bill provide funding, and who would pay (state, municipality, grant, fee)? What would it cost our department in staff time?"
  - id: existing_law
    question: "Which existing statute or regulation does it amend or replace? Ask counsel what the cited chapter or section currently requires."
  - id: evidence
    question: "What local data and published evidence bear on the problem the bill addresses (for example from the community health profile tools)?"
  - id: equity
    question: "Who would benefit or be burdened most, and are there groups in our community the bill leaves out?"
  - id: positions
    question: "Who supports or opposes it (professional associations, DPH, the Massachusetts Association of Health Boards), and what do they say?"
  - id: timing
    question: "What is the next step and date (committee hearing, reporting deadline, floor session), and when must written testimony be in?"
  - id: our_role
    question: "Is our role to inform, testify, or stay neutral, and what do our agency's policies and our employer's rules about lobbying or public statements allow?"

limits:
  - "Titles only: a bill is found only if its title contains a topic keyword or your keyword."
  - "The tool shows what the Legislature's public data say; it does not say what a bill would do in practice, and it is not legal advice."
  - "Bill text is quoted in at most 25 words; the stage label is this project's reading of the history, so read the last action itself."
  - "Live mode needs access to malegislature.gov. The offline snapshot is dated and its status may be out of date."
