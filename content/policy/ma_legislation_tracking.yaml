# Reference content for track_ma_legislation (POL-01): the topic keyword lists used to find public
# health bills in the Massachusetts Legislature's public data, the rules that turn a bill's history
# into a plain "stage", and the structured questions a nurse asks of a bill.
#
# REVIEW STATUS: pending. The Legislature's API was read (its Swagger document and live responses,
# 2026-11-12/13). The topic keyword lists, the stage rules, and the analysis questions are this
# project's drafting aids (confidence low to medium), not official classifications. Nothing here
# says what a bill would do; the tool only quotes up to 25 words of bill text and asks questions.
# Schema: content/schemas/policy_ma_legislation_tracking.schema.json
meta:
  id: policy-ma-legislation-tracking
  title: Massachusetts legislation tracking (topics, stage rules, analysis questions)
  version: 0.1.0
  prepared: 2026-11-13
  effective_date: null
  source:
    title: Massachusetts Legislature Public API (Swagger document and live responses)
    publisher: Massachusetts Legislature
    url: https://malegislature.gov/api/swagger/v1/swagger.json
  related_sources:
    - title: Massachusetts Legislature bill search
      publisher: Massachusetts Legislature
      url: https://malegislature.gov/Bills/Search
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The API endpoints, field names, and the 194th General Court (2025-2026) were verified by calling the
    API on 2026-11-12 and 2026-11-13: /GeneralCourts/194/Documents lists 12,061 documents (9,018 with a bill
    number), each bill's record has Title, Pinslip, DocumentText and CommitteeRecommendations, and its
    DocumentHistoryActions list has dated actions. The API has no search parameters, so the tool matches
    topic keywords against bill TITLES only; a bill whose title does not use a keyword is not found. The topic
    keyword lists are this project's choices for a public health nursing practice (confidence low: edit them
    to suit your agency). The stage rules are this project's reading of the action wording seen in 850 bills'
    histories (medium confidence; the Legislature publishes no official stage field, so always read the last
    action itself). The analysis questions are drafting aids, not legal or policy advice. The Legislature's
    terms of use were not found in the API description.

