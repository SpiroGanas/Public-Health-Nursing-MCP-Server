  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted on 2026-11-08 from the MMWR 2010 recommendations, CDC's "Growth Charts: What to
    know" page and data-file pages (last reviewed 2024-09-02), CDC's Child and Teen BMI
    Categories page, and CDC's SAS programs (cdc-source-code.sas, revised 2022;
    who-source-code.sas). Chart selection, the WHO +/-2 SD cut points, BMI categories, the
    extended BMI method, and the extreme-value cut points are transcribed (high confidence).
    The corrected-age rule for prematurity (until 24 months) is common practice but no CDC
    source states it; AAP's parent page could not be reached (low confidence; the nurse should
    confirm the agency's rule).

