# Growth chart selection, screening cut points, BMI categories, extreme-value checks, and
# corrected age for calculate_growth_percentiles (MCH-03). The LMS tables themselves are
# snapshots (snapshots/manifest.json: cdc-growth-charts, who-growth-standards).
#
# REVIEW STATUS: pending. Drafted 2026-11-08 from the fetched CDC sources below.
# Schema: content/schemas/mch_growth.schema.json
