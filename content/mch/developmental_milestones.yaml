definition:
  text: "Developmental milestones are things most children (75% or more) can do by a certain age. CDC's checklists are not a substitute for standardized, validated developmental screening tools."
  source: cdc-milestones
  section: "Ways to monitor milestones; Keep in mind"

share_with_doctor:
  - "What are some things you and your child do together?"
  - "What are some things your child likes to do?"
  - "Is there anything your child does or does not do that concerns you?"
  - "Has your child lost any skills he/she once had?"
  - "Does your child have any special healthcare needs or was he/she born prematurely?"

act_early:
  - text: "If the child is not meeting one or more milestones, has lost skills once had, or the family has other concerns, act early: talk with the child's doctor, share the concerns, and ask about developmental screening. Don't wait."
    source: cdc-concerned
    section: "Talk to Your Child's Doctor; milestone pages, 'Share with your child's doctor'"
  - text: "If the family or doctor is still concerned, ask for a referral to a specialist for an in-depth evaluation (developmental pediatrician, child neurologist, or child psychologist or psychiatrist)."
    source: cdc-concerned
    section: "Ask For a Referral"
  - text: "At the same time, request a free evaluation from the public early childhood system; no doctor's referral or diagnosis is needed. Under 3 years: the local Early Intervention program. Age 3 or older: call any local public elementary school and ask for an evaluation for preschool special education services (ask for the district's special education director if needed)."
    source: cdc-concerned
    section: "Get an Evaluation"

screening:
  general_months: [9, 18, 30]
  autism_months: [18, 24]
  text: "The American Academy of Pediatrics recommends screening for general development with standardized, validated tools at 9, 18, and 30 months, and for autism at 18 and 24 months, or whenever a parent or provider has a concern."
  source: cdc-concerned
  section: "Ask About Developmental Screening"

early_intervention:
  - text: "Massachusetts Early Intervention (EI) serves children from birth to 3 who are not reaching age-appropriate milestones, are diagnosed with certain conditions, or have a medical or social history that puts them at risk for a developmental delay."
    source: ma-ei-about
    section: "Who is eligible?"
  - text: "Anyone can refer a child to Early Intervention by contacting the program that serves the family's city or town. There are no out-of-pocket costs for families."
    source: ma-ei-about
    section: "Make a referral; Is there a cost?"
  - text: "EI works with the family in everyday routines (usually home visits) on outcomes in an Individualized Family Service Plan (IFSP). Children diagnosed with autism spectrum disorder are eligible based on the diagnosis, with specialty services available."
    source: ma-ei-about
    section: "What do services look like?; EI Services Program Information"

