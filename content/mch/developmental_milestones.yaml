  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    The milestones are transcribed word for word from CDC's twelve age pages (each page updated
    2026-05-16; CDC and AAP revised the checklists in February 2022: milestones most children,
    75% or more, reach by each age). The act-early steps, screening ages (AAP, as stated by
    CDC), and preschool special education steps come from CDC's "Concerned About Your Child's
    Development?" page (updated 2026-02-17). Massachusetts EI eligibility, cost, and referral
    come from DPH's EI pages; the program directory is DPH's CSV (snapshot ma-ei-programs).
    CDC does not say how to adjust milestones for prematurity; the tool shows both ages and
    defers to the child's provider.

