# CDC "Learn the Signs. Act Early." developmental milestones (2022 revision, as published on
# cdc.gov) and Massachusetts Early Intervention referral steps, for
# check_developmental_milestones (MCH-02).
#
# REVIEW STATUS: pending. Milestones transcribed 2026-11-08 from CDC's milestone pages (updated
# 2026-05-16). Schema: content/schemas/mch_milestones.schema.json
