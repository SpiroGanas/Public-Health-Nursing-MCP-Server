conditions:
  - id: moisture_mold
    label: Moisture, leaks, and mold
    keywords: [mold, mildew, moisture, damp, dampness, leak, leaks, water damage, condensation, flooding, musty]
    urgent: false
    urgent_note: >-
      Mold and excess moisture are not on the list of conditions that are always deemed to
      endanger health (410.630(A)) unless they come from a structural defect that does (for
      example a roof leak under 410.630(A)(12)); the inspector may still find that they may
      endanger or impair health (410.630(B)). Otherwise the order allows up to 30 days to correct.
    code:
      - section: "410.010"
        text: Excess moisture means the unwanted presence of moisture or water on permeable surfaces that occurs on a periodic, chronic, or acute basis and presents a risk of mold growth.
      - section: "410.500(A)(1)"
        text: The owner must keep the building and its structural elements protected from wind, rain, and snow, watertight, free from excess moisture or the appearance of mold, and pest resistant.
      - section: "410.500(B)"
        text: After leaks and flooding, the owner must make sure all surfaces are dried within 48 hours of being notified or of the end of the event, whichever is sooner.
      - section: "410.420(A)"
        text: No room or area may be used for living if it is subject to excess moisture.
      - section: "410.220(A)-(B)"
        text: Living rooms and rooms with a toilet, tub, or shower need openable windows, skylights, or doors equal to at least 4% of the floor area, or mechanical ventilation to the outdoors; when the board of health finds natural ventilation is not enough to remove excess moisture, mechanical ventilation is required.
      - section: "410.170(B)"
        text: Electric and gas clothes dryers must be vented to the outdoors unless listed and labeled as ventless.
      - section: "410.235(C)"
        text: After any maintenance or repair, the owner must dispose of debris, leave the area clean, and dry all surfaces exposed to moisture.
      - section: "410.620(E)"
        text: An inspector who finds excess moisture or the appearance of mold must investigate the sources (plumbing leaks, structural defects, poorly maintained ventilation, heating, air conditioning, or ductwork). Environmental testing is not required, and test results may not be the only basis for deciding whether excess moisture or mold exists.
    owner:
      - Keep the building watertight and free from excess moisture and the appearance of mold (410.500(A)(1)).
      - Dry surfaces within 48 hours after a leak or flood (410.500(B)) and after repairs (410.235(C)).
      - Provide and maintain the required ventilation, including mechanical ventilation when the board of health requires it (410.220).
    occupant:
      - Use the building and its parts with reasonable care (410.510) and keep the unit sanitary (410.003(F)).
      - Give the owner access for repairs with at least 48 hours' notice, or without notice for emergency repairs (410.003(E)).
    health_effects:
      - text: Damp and moldy homes may cause a stuffy nose, sore throat, coughing or wheezing, burning eyes, or skin rash in some people; people with asthma or mold allergy may have severe reactions, and people with weakened immune systems or chronic lung disease may get lung infections from mold.
        source: cdc-mold
        section: Possible health effects
        confidence: high
      - text: The Institute of Medicine (2004) found sufficient evidence linking indoor mold with upper respiratory symptoms, cough, and wheeze in healthy people and with asthma symptoms in people with asthma; some studies suggest early mold exposure may contribute to asthma in some children.
        source: cdc-mold
        section: Possible health effects
        confidence: high
    at_risk: [people with asthma, people allergic to mold, people with weakened immune systems, people with chronic lung disease, young children]
    advice:
      - text: Fix the moisture problem and clean up the mold; you do not need to know the type of mold. CDC does not recommend mold testing.
        source: cdc-mold
        section: Cleaning; Home testing
        confidence: high
      - text: Keep indoor humidity no higher than 50%, use kitchen and bathroom exhaust fans that vent outside, and dry wet areas within 24 to 48 hours.
        source: cdc-mold
        section: Preventing
        confidence: high
      - text: Clean mold on hard surfaces with soap and water, household products, or no more than 1 cup of household bleach in 1 gallon of water; never mix bleach with ammonia or other cleaners, open windows, and wear rubber gloves, boots, and goggles.
        source: cdc-mold
        section: Cleaning
        confidence: high
  - id: pests
    label: Pests (cockroaches, mice and rats, bed bugs, and others)
    keywords: [pest, pests, cockroach, cockroaches, roach, roaches, mice, mouse, rat, rats, rodent, rodents, bed bug, bed bugs, bedbugs, insects, infestation, exterminator, ants, flies]
    urgent: true
    urgent_note: >-
      Failure to keep the premises free from pests as required by 410.550(A) and (B) is always
      deemed a condition that may endanger health (410.630(A)(17)); the order requires a good
      faith effort to correct within 24 hours (410.640(A)(1)).
    code:
      - section: "410.010"
        text: Pests include insects (such as mosquitoes, bees, flies, ants, termites, cockroaches, and bed bugs), arachnids (such as spiders and ticks), rodents, and other unwanted animal life; a pest infestation is the recurrent presence of pests.
      - section: "410.550(A)"
        text: In a residence with one dwelling unit, the occupant must keep the unit free from pest infestation and is responsible for pest elimination, but the owner is responsible if the owner has not maintained the structural or building elements needed to keep pests out.
      - section: "410.550(B)"
        text: In a residence with two or more dwelling units (and in rooming houses and homeless shelters), the owner must keep it and its premises free from infestation and is responsible for pest elimination.
      - section: "410.550(C)-(D)"
        text: Extermination means removing harborage, removing or sealing off food and breeding sources, and poisoning, spraying, fumigating, or trapping; indoor commercial pesticide use needs at least 48 hours' written notice to occupants with the company, date, locations, and products.
      - section: "410.550(F)-(G)"
        text: The owner must inspect each unit for pests before a new occupancy and keep records of monitoring, repairs, pesticides applied, and follow-up inspections for the board of health.
      - section: "410.540"
        text: The owner must provide tight-fitting screens (at least 16 mesh) on openable exterior windows, and screen doors where required, from April 1 through October 31 each year.
      - section: "410.500(A)(2)"
        text: Buildings must be free from holes, cracks, and defects that provide an entry or harborage for pests.
      - section: "410.620(D)"
        text: A pest inspection covers the unit, nearby common areas, the exterior, and, for insects, units next door where bed bugs are confirmed; for rodents, accessible attics, basements, and crawl spaces.
    owner:
      - Eliminate pests in buildings with two or more units, and in single-unit homes when the cause is the building's condition (410.550(A)-(B)).
      - Inspect for pests before each new tenancy and keep records (410.550(F)-(G)); seal entry points (410.500(A)(2)); install screens April 1 to October 31 (410.540).
      - Give 48 hours' written notice before indoor commercial pesticide applications (410.550(D)).
    occupant:
      - Keep the unit sanitary so it does not attract pests (410.550(E)) and store garbage in covered, pest-resistant containers (410.560(D)).
      - Give access and follow the pest control company's preparation instructions (410.550(D)(3)).
    health_effects:
      - text: Droppings and body parts of cockroaches and other pests can trigger asthma; proteins in cockroach droppings and saliva can cause allergic reactions, and cockroach allergens likely play a significant role in asthma in many urban areas.
        source: epa-asthma
        section: Cockroaches and Pests
        confidence: high
      - text: Bed bugs are not known to spread disease, but bites can cause itching, loss of sleep, anxiety, and, rarely, allergic reactions; scratching can lead to skin infection.
        source: cdc-bed-bugs
        section: Signs and symptoms
        confidence: high
    at_risk: [people with asthma, people with allergies, children with asthma]
    advice:
      - text: Keep counters, sinks, tables, and floors clean; clean up dishes, crumbs, and spills right away; store food in airtight containers; and seal cracks around cabinets. Pesticides can harm people too, so use lower-risk pest control.
        source: epa-asthma
        section: Cockroaches and Pests (Actions You Can Take)
        confidence: high
      - text: Bed bugs hide in mattress seams, box springs, bed frames, headboards, and cracks near beds; early detection makes them easier to control.
        source: cdc-bed-bugs
        section: Where to look for bed bugs; Reducing risk
        confidence: high
  - id: heat
    label: No heat or not enough heat
    keywords: [heat, heating, no heat, cold, cold apartment, furnace, boiler, radiator, thermostat, temperature, space heater, heater, too hot]
    urgent: true
    urgent_note: >-
      Failure to provide heat as required by 410.180, or improper venting or use of a prohibited
      space heater or water heater, is always deemed a condition that may endanger health
      (410.630(A)(2)); the order requires a good faith effort to correct within 24 hours.
    code:
      - section: "410.180(A)"
        text: From September 15 through May 31, the owner must heat every habitable room and every room with a toilet, shower, or tub to at least 68°F between 7:00 a.m. and 11:00 p.m. and at least 64°F between 11:01 p.m. and 6:59 a.m.
      - section: "410.180(B)"
        text: During the heating season the required heating system must not raise the temperature above 78°F in any room.
      - section: "410.180(C)"
        text: Temperature is measured 5 feet above the floor on a wall, at any point more than 5 feet from the exterior wall.
      - section: "410.180(D)"
        text: A board of health may change the heating season for its municipality, ending it no earlier than May 15 or starting it no later than September 30, by posting notice on the municipality's website.
      - section: "410.160(A)-(B)"
        text: The owner must provide and maintain a heating system able to heat every habitable room and bathroom to the required temperatures; a fireplace, wood or pellet stove, or portable electric space heater does not count as the heating system.
      - section: "410.160(C)"
        text: "Prohibited in any residence: portable space heaters with a barometric fuel control and a fuel tank less than 42 inches from the burner, heaters adapted to burn propane, kerosene, range oil, or number one fuel oil, portable wick-type space heaters, and unvented propane or natural gas space heaters not approved under the fire code."
      - section: "410.200; 410.210"
        text: The owner pays for the electricity, gas, or oil used for heat unless it is metered (or tanked) for that unit alone and a written rental agreement says the occupant pays.
      - section: "410.620(B)(3)"
        text: From September 15 through May 31, a complaint only about lack of heat is investigated first; a comprehensive inspection requested at the same time follows within 1 business day for 410.630(A) violations or 5 business days for others.
    owner:
      - Provide heat to the required temperatures from September 15 to May 31 (410.180), and maintain the heating system (410.160(A); 410.235(A)(6)).
      - Pay for heating fuel unless separately metered and the written rental agreement says otherwise (410.200; 410.210).
    occupant:
      - Do not use prohibited heaters (410.160(C)); give access for repairs (410.003(E)).
      - Pay for heating fuel only when the unit has its own meter or tank and a written agreement requires it (410.200; 410.210).
    health_effects:
      - text: Hypothermia can happen with long exposure to cold and affects thinking and movement, so a person may not know it is happening; warning signs in adults are shivering, exhaustion, confusion, fumbling hands, memory loss, slurred speech, and drowsiness, and in babies bright red, cold skin and very low energy.
        source: cdc-hypothermia
        section: What is hypothermia?; What to look out for
        confidence: high
      - text: Using the wrong heat source can cause carbon monoxide poisoning; never heat a home with a gas oven.
        source: cdc-co
        section: Oil and gas furnaces and other household appliances
        confidence: high
    at_risk: [older adults with inadequate food, clothing, or heating, babies sleeping in cold bedrooms, people who drink alcohol or use drugs]
    advice:
      - text: Older adults with inadequate food, clothing, or heating and babies sleeping in cold bedrooms are among those most often affected by hypothermia.
        source: cdc-hypothermia
        section: Risk factors
        confidence: high
  - id: water_utilities
    label: Hot water, water, and utility shutoffs
    keywords: [hot water, no hot water, water, water shutoff, electricity, electric, gas, utilities, utility, shutoff, shut off, power, plumbing, toilet, sewage]
    urgent: true
    urgent_note: >-
      No water (hot and cold) meeting the ordinary needs of the occupant for 24 hours or longer,
      a shutoff or failure to restore electricity, gas, or water, and lack of a working toilet,
      sink, tub or shower, or sewage system are always deemed conditions that may endanger health
      (410.630(A)(1), (3), (5), (6)).
    code:
      - section: "410.150(A)-(C)"
        text: The owner must provide hot water in sufficient quantity and pressure, at 110°F to 130°F at fixtures other than a tub or shower, and 110°F to 120°F at a tub or shower.
      - section: "410.130(A)"
        text: The owner must provide potable water sufficient in quantity and pressure for the ordinary needs of every occupant.
      - section: "410.003(C)"
        text: No owner or occupant may shut off a required service, facility, utility, or equipment except temporarily for repairs with reasonable notice, or in a temporary emergency approved by the board of health; whoever is responsible must take immediate steps to restore it (see M.G.L. c. 186, § 14).
      - section: "410.130(D)"
        text: An owner who submeters water may not shut off water because the occupant has not paid a separate water or sewer charge.
    owner:
      - Provide and maintain hot water, potable water, and the plumbing and sewage system (410.130; 410.150; 410.235).
      - Do not shut off utilities except as allowed, and restore them immediately (410.003(C)).
    occupant:
      - Do not shut off required utilities (410.003(C)); keep fixtures you use sanitary (410.240(B)).
    health_effects: []
    at_risk: []
    advice: []
  - id: lead
    label: Lead paint
    keywords: [lead, lead paint, paint, peeling paint, chipping paint, deleading, lead poisoning, old paint, dust]
    urgent: true
    urgent_note: >-
      Lead-based paint on a dwelling in violation of 105 CMR 460.000 is always deemed a condition
      that may endanger health (410.630(A)(11)). The Lead Law (M.G.L. c. 111, §§ 189A-199B) and
      105 CMR 460.000 set the owner's deleading duties.
    code:
      - section: "410.470"
        text: All residences must comply with 105 CMR 460.000, Lead Poisoning Prevention and Control.
      - section: "410.630(A)(11)"
        text: The presence of lead-based paint on a dwelling in violation of 105 CMR 460.000 (see M.G.L. c. 111, §§ 190-199) is a condition deemed to endanger or materially impair health or safety.
      - section: "M.G.L. c. 111, § 197(a)"
        text: Whenever a child under six years of age lives in premises where any paint, plaster, or other accessible structural material contains dangerous levels of lead, the owner must abate or contain it.
      - section: "M.G.L. c. 111, § 197(f)-(g)"
        text: Repainting over lead paint without containment or abatement is not compliance, and pregnant women and children under six may not occupy the unit during deleading.
    owner:
      - Delead or bring under interim control homes built before 1978 where a child under 6 lives; hire a licensed lead inspector, and use licensed or trained and authorized people for the work (DPH Lead Law page; M.G.L. c. 111, § 197).
      - The owner is legally responsible if a child is poisoned by lead hazards where the child lives, and cannot avoid liability by having tenants sign an agreement accepting lead paint (DPH Lead Law page).
    occupant:
      - Tell the owner and the board of health about peeling or chipping paint, and keep children away from it and from the dust.
    health_effects:
      - text: No safe blood lead level in children has been identified; even low levels are associated with developmental delays, difficulty learning, and behavioral issues, and the effects can be permanent.
        source: cdc-lead
        section: Lead in blood
        confidence: high
      - text: Children younger than 6 are more likely to be exposed because of hand-to-mouth behavior; chipping or peeling paint in homes built before 1978 is a common source.
        source: cdc-lead
        section: Overview; Causes
        confidence: high
    at_risk: [children under 6, pregnant women, families in homes built before 1978]
    advice:
      - text: The Lead Law requires removing or covering lead paint hazards in homes built before 1978 where any child under 6 lives; hazards include loose lead paint, lead paint on windows and friction surfaces, and other surfaces children can reach.
        source: dph-lead-law
        section: What does the Lead Law require?
        confidence: high
      - text: An owner cannot evict or refuse to rent to a family because of lead paint; discrimination is against the law.
        source: dph-lead-law
        section: Can I evict or refuse to rent to a family with children under six if there is lead paint in the home?
        confidence: high
      - text: A blood lead test is the best way to know whether a child has been exposed; renters can ask the landlord to have the home inspected or to share recent lead inspection results.
        source: cdc-lead
        section: Testing
        confidence: high
  - id: smoke_co
    label: Smoke and carbon monoxide alarms, venting, and fuel-burning appliances
    keywords: [smoke detector, smoke alarm, carbon monoxide, co detector, co alarm, alarm, alarms, venting, vent, chimney, gas smell, fumes, generator]
    urgent: true
    urgent_note: >-
      Failure to provide a required smoke detector or carbon monoxide alarm, and improper venting
      of fuel-burning heaters or water heaters, are always deemed conditions that may endanger
      health (410.630(A)(2), (15)).
    code:
      - section: "410.330(A)"
        text: The owner must provide, install, and maintain working smoke detectors and carbon monoxide alarms wherever state law and the building and fire codes require them.
      - section: "410.330(B)"
        text: The board of health must immediately notify the local fire chief of any smoke or carbon monoxide alarm violation seen during an inspection.
      - section: "410.170(A)"
        text: Furnaces, boilers, wood and pellet stoves, water heaters, and permitted space heaters that burn fuel must be properly vented to the outdoors (except unvented gas heaters approved under the fire code).
    owner:
      - Provide, install, and maintain smoke and carbon monoxide alarms (410.330; 410.235(A)(13)) and properly vented fuel-burning equipment (410.170).
    occupant:
      - Keep smoke and carbon monoxide alarms in sanitary condition and use them with reasonable care (410.240(B)(5)); do not disable them.
    health_effects:
      - text: Carbon monoxide is an odorless, colorless gas that can cause sudden illness and death; common symptoms are headache, dizziness, weakness, upset stomach, vomiting, chest pain, and confusion, and people who are asleep or intoxicated can die before they have symptoms.
        source: cdc-co
        section: What it is; Symptoms
        confidence: high
    at_risk: [infants, older adults, people with chronic heart disease, people with anemia, people with breathing problems]
    advice:
      - text: Install battery-operated or battery back-up carbon monoxide detectors near every sleeping area, check batteries each spring and fall, and replace detectors as the maker directs or every 5 years.
        source: cdc-co
        section: CO detectors
        confidence: high
      - text: Never use a generator inside a home or garage (only outside, more than 20 feet from windows, doors, and vents), never burn charcoal indoors, and have heating systems and fuel-burning appliances serviced every year.
        source: cdc-co
        section: Reducing risk
        confidence: high
  - id: refuse_sanitation
    label: Trash, garbage, and unsanitary common areas
    keywords: [trash, garbage, refuse, rubbish, dumpster, recycling, filth, unsanitary, hallway, common area, smell, odor]
    urgent: true
    urgent_note: >-
      An accumulation of refuse, filth, or other causes of sickness that may provide food or
      harborage for pests or contribute to accidents or disease (violations of 410.560 or
      410.570) is always deemed a condition that may endanger health (410.630(A)(10)).
    code:
      - section: "410.560(A)"
        text: The owner of a building with two or more units (or a rooming house or homeless shelter) is responsible for final collection and disposal of refuse; the occupant of a single-unit residence is responsible for it there.
      - section: "410.560(D)-(E)"
        text: Garbage must be stored in watertight, pest-resistant receptacles with tight-fitting covers; the owner provides enough receptacles, and occupants place their refuse in them and follow local rules, including recycling and pay-as-you-throw.
      - section: "410.570(B)-(C)"
        text: Occupants keep the part of the residence they control free of refuse and filth; the owner keeps common areas clean, sanitary, and safe; occupants keep the landing, porch, or deck next to their unit clear.
      - section: "410.630(A)(8)"
        text: Blocking any exit, passageway, or common area with objects, including refuse, so that people cannot get out in an emergency is always deemed a condition that may endanger health or safety.
    owner:
      - Provide enough covered receptacles and arrange collection in multi-unit buildings (410.560); keep common areas clean and safe (410.570(C)(1)).
    occupant:
      - Use the receptacles provided and follow local trash and recycling rules (410.560(B), (E)(3)); keep your unit and the landing outside it clean and clear (410.570(B), (C)(2)).
    health_effects:
      - text: Refuse and filth can provide food and shelter for rodents, insects, and other pests, and contribute to accidents or the spread of disease (the reason 105 CMR 410.630(A)(10) treats them as conditions that may endanger health).
        source: cmr410
        section: "410.630(A)(10)"
        confidence: high
    at_risk: []
