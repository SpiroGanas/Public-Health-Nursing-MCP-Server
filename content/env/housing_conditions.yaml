urgent_list:
  source: cmr410
  section: "410.630(A)"
  items:
    - "(1) No water, hot and cold, sufficient for ordinary needs for 24 hours or longer (410.130, 410.140, 410.150)"
    - "(2) No heat as required by 410.180, or improper venting or use of a prohibited space heater or water heater"
    - "(3) Shutoff or failure to restore electricity, gas, or water"
    - "(4) Missing required electrical facilities (410.300(A)-(E))"
    - "(5) No safe supply of water (410.130(A))"
    - "(6) No toilet, sink, shower or tub, or a sewage disposal system that does not work"
    - "(7) No kitchen sink, or an owner-supplied stove, oven, or refrigerator that does not work"
    - "(8) Inadequate or blocked exits, passageways, or common areas"
    - "(9) Failure to meet the lock and security requirements (410.270(A))"
    - "(10) Accumulated refuse, filth, or other causes of sickness (410.560, 410.570)"
    - "(11) Lead-based paint in violation of 105 CMR 460.000"
    - "(12) Roof, foundation, or other structural defects that may expose people to fire, burns, shock, accident, or other dangers"
    - "(13) Electrical, plumbing, heating, or gas facilities not installed or maintained to accepted standards, exposing people to danger"
    - "(14) Damaged asbestos insulation or covering on a pipe, boiler, or furnace that may release asbestos"
    - "(15) No smoke detector or carbon monoxide alarm as required (410.330)"
    - "(16) No railing or guard for a stairway, porch, balcony, or roof as required (410.520)"
    - "(17) Pests in violation of 410.550(A) and (B)"
    - "(18) Any other violation the owner fails to fix within the time the board of health ordered"

inspection:
  request:
    - text: If you think conditions in your home are unsafe or unsanitary, tell your landlord first; if the landlord does not fix them, contact your local health department, which inspects for free and orders the landlord to fix violations. Find it through your city or town hall or mass.gov/lists/massachusetts-city-and-town-websites.
      source: dph-olrr
      section: Your Right to Safe and Healthy Housing and Protection from Retaliation
      confidence: high
    - text: The board of health must inspect a unit and its common areas when an occupant asks in writing, in person, by phone, or electronically, whether or not the occupant told the owner first, even if an eviction or other dispute is pending, and even if the occupant is anonymous or asks that their name be kept confidential.
      source: cmr410
      section: "410.600(A)"
      confidence: high
    - text: A request from someone who does not live in the unit (for example a nurse, neighbor, or relative) is investigated to decide whether to inspect, by looking from the street, reviewing records, or contacting the occupants, owner, or manager.
      source: cmr410
      section: "410.600(B)"
      confidence: high
    - text: The inspection must take place within 1 business day of the request if the conditions alleged include any listed in 410.630(A), and within 5 business days otherwise, at a time that works for the occupant when possible.
      source: cmr410
      section: "410.600(C)"
      confidence: high
  during:
    - text: At the start, the inspector tells the occupant of the right to a comprehensive inspection and does one if asked; every inspection covers at least the condition reported and all the conditions listed in 410.630(A). A violation in a common area counts as a violation in every unit with access to it.
      source: cmr410
      section: "410.620(B)"
      confidence: high
    - text: The inspector gives the occupant a verbal summary at the end and a written summary on request; the inspection report is signed under the pains and penalties of perjury and comes with DPH's Occupants' Legal Rights and Responsibilities.
      source: cmr410
      section: "410.610; 410.620(C)"
      confidence: high
  after:
    - text: For conditions listed in 410.630(A), the board of health orders the responsible person within 12 hours of the inspection to make a good faith effort to correct within 24 hours of service; for other violations it orders correction within 30 days, issued within 7 days of the inspection. No order may allow more than 30 days, or be extended, without a hearing.
      source: cmr410
      section: "410.640"
      confidence: high
    - text: A reinspection is done within 24 hours after the deadline for urgent violations and within 7 days after the deadline for others; the occupant gets a summary of what was and was not corrected.
      source: cmr410
      section: "410.660"
      confidence: high
    - text: Every order is in writing with the inspection report and the Occupants' Legal Rights and Responsibilities, states the hearing rights and deadlines, includes "This is an important legal document. It may affect your rights. You should have it translated" in any language spoken by more than 1% of the community, and tells the owner that the occupant may be able to use statutory remedies.
      source: cmr410
      section: "410.670(A)-(B)"
      confidence: high
    - text: If a comprehensive inspection finds no violations, the inspector sends the report and a letter saying so within 7 days.
      source: cmr410
      section: "410.670(C)"
      confidence: high
    - text: A home or part of it can be found unfit for human habitation after notice and a public hearing (or at once if the danger is immediate); if it is condemned and the occupant is not the owner, the owner must provide comparable, suitable housing for a set period.
      source: cmr410
      section: "410.650; 410.900(E)"
      confidence: high
  hearings:
    - text: "An occupant may ask the board of health in writing for a hearing: within 30 days after asking for an inspection that was not done; within 30 days after an inspection for which no report was issued; within 30 days after receiving the inspection report if violations the occupant claimed were not found or no order was issued; and within 45 days after receiving the order if it is not enforced. A person served with an order, and every affected person, has 7 days after service to ask for a hearing."
      source: cmr410
      section: "410.800"
      confidence: high
    - text: The hearing must start within 14 days of the request, the board decides in writing within 5 days after the hearing, and anyone aggrieved by the final decision can go to court; a late request waives the right to a hearing.
      source: cmr410
      section: "410.810-410.860"
      confidence: high

tenant_protections:
  - id: retaliation
    label: Protection from retaliation
    text: >-
      A landlord who threatens or takes reprisals against a tenant for reporting a suspected code
      violation to the board of health, complaining about it in writing to the landlord, taking
      legal action to enforce housing laws, or joining a tenants' union is liable for damages of
      at least one and up to three months' rent (or actual damages if greater) plus costs and
      attorney's fees. A notice to end the tenancy (except for nonpayment of rent), a rent
      increase, or a big change in the terms within six months after such a report creates a
      presumption of reprisal. Lease terms that waive this are void.
    source: mgl-186-18
    section: "Section 18"
    confidence: high
  - id: rent_withholding
    label: Withholding rent (defense in an eviction for nonpayment)
    text: >-
      In an eviction for nonpayment, a tenant may raise the condition of the home as a defense
      or counterclaim if the landlord knew of the conditions before the tenant fell behind on
      rent, the tenant did not cause them, and other conditions are met. A board of health
      inspection notice sent to the landlord is presumed to show the landlord knew; a certified
      inspection report is evidence of the conditions. The court can require the tenant to pay
      the fair value of the use of the home into court. DPH advises saving withheld rent, because
      a judge may require some or all of it to be paid.
    source: mgl-239-8a
    section: "Section 8A; DPH Notice, Option 2"
    confidence: high
  - id: repair_and_deduct
    label: Repair and deduct
    text: >-
      When the board of health or a court has certified that violations may endanger or
      materially impair health, safety, or well-being, and the owner was notified in writing and
      did not begin repairs (or sign a contract for them) within 5 days and substantially finish
      within 14 days (or a shorter period the board or court ordered), the tenant may have the
      repairs made and deduct the cost from rent, up to four months' rent in any 12 months. This
      does not apply to conditions the tenant or the tenant's household or guests caused, or if
      the tenant unreasonably denied the owner access.
    source: mgl-111-127l
    section: "Section 127L"
    confidence: high
  - id: court
    label: Going to court
    text: >-
      A tenant or the local health department can ask a Housing or District Court to order the
      owner to fix violations (M.G.L. c. 111, §§ 127A and 127C), and a tenant can ask for a
      refund of rent paid while violations existed (breach of the warranty of habitability or
      M.G.L. c. 93A); the tenant must show there were violations that the owner knew about and
      did not fix. A tenant may also be able to end the lease and move out.
    source: dph-olrr
    section: Your Options if an Owner Does Not Fix the Problems (Options 1 and 4)
    confidence: high
  - id: legal_help
    label: Free legal help
    text: >-
      DPH advises talking to an attorney before withholding rent or taking other legal action.
      People who cannot afford an attorney may be eligible for free legal aid: masslrf.org lists
      options, and masslegalhelp.org/legal-tactics and madeuptocode.org explain tenants' rights;
      Court Service Centers help with filing.
    source: dph-olrr
    section: Introduction; Your Options if an Owner Does Not Fix the Problems
    confidence: high
legal_notice: >-
  This is general information, not legal advice. Tenants' rights depend on the facts and on
  conditions in the statutes not summarized here. Refer tenants to legal aid (masslrf.org lists
  free options) before they withhold rent, repair and deduct, or take other legal action.

teaching_sheets:
  - id: inspection
    title: How to Get Your Home Inspected
    condition: null
    sources: [dph-olrr, cmr410, mgl-186-18]
    markdown: |
      # How to Get Your Home Inspected

      Your home must be safe and healthy. A state law sets the rules. It is called the Housing Code.

      ## Step 1: Tell your landlord

      Tell your landlord about the problem. Write it down if you can. Keep a copy. Write the date.

      ## Step 2: Call the board of health

      If the problem is not fixed, call your local board of health. The inspection is free.

      Board of health phone: {{board_of_health_phone}}

      The board of health must inspect even if you did not tell your landlord first. You can ask them to keep your name private.

      ## How fast they come

      - For no heat, no water, pests, or other serious problems: within 1 business day.
      - For other problems: within 5 business days.

      Ask the inspector to check your whole home. This is called a full inspection. You can ask for it.

      ## After the inspection

      The inspector will tell you what they found. You can ask for it in writing. The landlord gets an order to fix the problems.

      ## Your rights

      Your landlord cannot punish you for asking for repairs or calling the board of health. This sheet is not legal advice. For free legal help, go to masslrf.org.
  - id: moisture_mold
    title: Mold and Leaks in Your Home
    condition: moisture_mold
    sources: [cdc-mold, cmr410]
    markdown: |
      # Mold and Leaks in Your Home

      Mold grows where there is water. It can look like spots. It can smell musty.

      ## How mold can hurt your health

      Mold can cause a stuffy nose, cough, wheezing, sore throat, or itchy eyes. It can make asthma worse. People with lung disease or a weak immune system can get very sick.

      ## What your landlord must do

      - Fix leaks and keep the building dry.
      - Dry wet areas within 48 hours after a leak or flood.
      - Keep your home free of mold.

      ## What you can do

      - Tell your landlord about leaks right away. Write it down.
      - Use the bathroom fan. Use the kitchen fan when you cook.
      - Wipe mold off hard surfaces with soap and water.
      - Never mix bleach with ammonia or other cleaners.
      - You do not need a mold test.

      ## If it is not fixed

      Call the board of health at {{board_of_health_phone}}. The inspection is free.
  - id: pests
    title: Pests in Your Home
    condition: pests
    sources: [epa-asthma, cdc-bed-bugs, cmr410]
    markdown: |
      # Pests in Your Home

      Pests include cockroaches, mice, rats, and bed bugs.

      ## How pests can hurt your health

      Droppings from cockroaches and mice can make asthma worse. Bed bug bites can itch and make it hard to sleep.

      ## Who must get rid of pests

      - In a building with 2 or more homes, the landlord must get rid of pests.
      - In a 1-family home, the person living there does it. But the landlord must do it if pests get in because the building is not kept in good repair.
      - The landlord must tell you 48 hours before spraying inside.

      ## What you can do

      - Keep food in closed containers.
      - Clean up crumbs and spills right away.
      - Put trash in a can with a tight lid.
      - Follow the pest company's instructions before they come.
      - Look for bed bugs in mattress seams and bed frames.

      ## If it is not fixed

      Tell your landlord in writing. Then call the board of health at {{board_of_health_phone}}. Pests are a serious problem under the code. The board of health must inspect within 1 business day.
  - id: heat
    title: No Heat in Your Home
    condition: heat
    sources: [cmr410, cdc-hypothermia, cdc-co]
    markdown: |
      # No Heat in Your Home

      From September 15 to May 31, your landlord must give you heat.

      ## How warm it must be

      - Day (7 a.m. to 11 p.m.): at least 68°F.
      - Night (11 p.m. to 7 a.m.): at least 64°F.
      - It should not be over 78°F.

      Your town may start heat season a little later or end it a little sooner.

      ## Stay safe when it is cold

      - Never use the stove or oven to heat your home.
      - Never use a grill or generator inside.
      - Do not use kerosene or propane heaters inside.
      - Check on older adults and babies. Cold can make them very sick.
      - Signs of being too cold: shivering, confusion, sleepiness, slurred speech. Babies may have bright red, cold skin.

      ## If there is no heat

      Tell your landlord right away. Then call the board of health at {{board_of_health_phone}}. No heat is a serious problem. They must come within 1 business day.
  - id: lead
    title: Lead Paint and Your Child
    condition: lead
    sources: [cdc-lead, dph-lead-law, mgl-111-197]
    markdown: |
      # Lead Paint and Your Child

      Many homes built before 1978 have lead paint. Lead can hurt how a child grows, learns, and behaves. The harm can last a lifetime.

      ## Who is most at risk

      Children under 6 years old. Young children put their hands and toys in their mouths. Lead dust gets on hands and toys.

      ## What the law says

      - If a child under 6 lives in the home, the owner must remove or cover lead paint hazards.
      - A landlord cannot evict you or refuse to rent to you because of lead paint.

      ## What you can do

      - Tell your landlord about peeling or chipping paint. Write it down.
      - Ask your landlord if the home has a lead inspection letter.
      - Keep children away from peeling paint and paint dust.
      - Ask your child's doctor or nurse about a blood lead test.

      ## If it is not fixed

      Call the board of health at {{board_of_health_phone}}.
  - id: smoke_co
    title: Smoke and Carbon Monoxide Alarms
    condition: smoke_co
    sources: [cdc-co, cmr410]
    markdown: |
      # Smoke and Carbon Monoxide Alarms

      Carbon monoxide (CO) is a gas. You cannot see it or smell it. It can make you very sick or kill you.

      ## Signs of CO poisoning

      Headache, dizziness, weakness, upset stomach, throwing up, chest pain, and confusion. It can feel like the flu. People who are asleep can die before they feel sick.

      ## What your landlord must do

      - Put in smoke alarms and CO alarms where the law requires them.
      - Keep them working.
      - Make sure furnaces and water heaters vent outside.

      ## What you can do

      - Do not take down or cover alarms.
      - Have a CO alarm near every place people sleep.
      - Never use a generator, grill, or camp stove inside.
      - Never heat your home with the oven.

      ## If alarms are missing or broken

      Tell your landlord. Then call the board of health at {{board_of_health_phone}}. This is a serious problem under the code.
  - id: refuse_sanitation
    title: Trash and Clean Common Areas
    condition: refuse_sanitation
    sources: [cmr410]
    markdown: |
      # Trash and Clean Common Areas

      Trash that piles up brings mice, rats, and bugs. It can also block a way out in a fire.

      ## What your landlord must do

      - In a building with 2 or more homes, give enough trash cans with tight lids.
      - Arrange for trash pickup.
      - Keep hallways, stairs, and other shared areas clean and safe.

      ## What you must do

      - Keep your own home clean.
      - Put trash in the cans the landlord gives you.
      - Follow your town's trash and recycling rules.
      - Keep the landing or porch by your door clean and clear.
      - Never block hallways, stairs, or exits.

      ## If it is not fixed

      Tell your landlord in writing. Then call the board of health at {{board_of_health_phone}}.

