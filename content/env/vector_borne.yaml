prevention:
  public:
    - text: Use insect repellent any time you are outdoors, wear long-sleeved clothing, schedule outdoor activities to avoid the hours from dusk to dawn during peak mosquito season, repair damaged window and door screens, and remove standing water around your home.
      source: dph-mosquito-prevention
      section: Prevention tips
      confidence: high
    - text: Repellents with DEET, permethrin, IR3535, or picaridin protect against mosquitoes; oil of lemon eucalyptus has given as much protection as low concentrations of DEET. Permethrin is for clothing, shoes, bed nets, and camping gear, not skin.
      source: dph-repellents
      section: Which repellent should I use?
      confidence: high
    - text: Do not use DEET on infants under 2 months; children older than 2 months should use products with 30% DEET or less. Do not use oil of lemon eucalyptus on children under 3. For infants, use mosquito netting on carriages and playpens and avoid outdoor activity from dusk to dawn.
      source: dph-repellents
      section: Which repellent should I use?; protecting infants
      confidence: high
    - text: Do not apply repellent under clothing, on cuts or irritated skin, or near the mouth or eyes; put it on your hands first, then on a child (never on a child's hands); wash it off skin and clothes when you come inside.
      source: dph-repellents
      section: Always Use Repellents Safely
      confidence: high
    - text: Check yourself, your children, and your pets for ticks once a day, especially inside and behind the ears, along the hairline, back of the neck, armpits, groin, legs, behind the knees, and between the toes. Ticks are tiny, so look for new "freckles."
      source: dph-tick-prevention
      section: Personal protection against ticks
      confidence: high
    - text: Remove an attached tick as soon as possible with fine-point tweezers, gripping close to the skin and pulling straight out with steady pressure; do not use kerosene, petroleum jelly, nail polish, or a hot match. Note the date and where on the body it was.
      source: dph-tick-prevention
      section: Personal protection against ticks
      confidence: high
    - text: In tick areas, stick to the center of trails; wear a light-colored, long-sleeved shirt and long pants tucked into socks; use DEET on exposed skin and permethrin on clothes (DPH advises no more than 30-35% DEET for adults and 10-15% for children, and no repellent on infants).
      source: dph-tick-prevention
      section: When going outside to an area likely to have ticks
      confidence: high
    - text: After being outdoors, check clothing and gear, tumble dry clothes on high heat for 10 minutes to kill ticks, and shower within two hours of coming indoors.
      source: cdc-tick-prevention
      section: After you come indoors
      confidence: high
    - text: Call a health care provider for a rash where you were bitten or symptoms such as fever, headache, fatigue, or sore and aching muscles after a tick bite, or for hives, face or tongue swelling, or stomach symptoms within hours of eating meat or dairy (possible alpha-gal syndrome).
      source: dph-tick-prevention
      section: Talk to your doctor if
      confidence: high
  schools:
    - text: Children can keep spending time outdoors for recess and other daytime activities with repellent, long sleeves, long pants, and socks when possible; avoid outdoor activities between dusk and dawn, when mosquitoes are most active. People under 15 are at particular risk of EEE.
      source: dph-school-repellent
      section: Introduction
      confidence: high
    - text: Repellents are not a drug or medication, so they are not subject to 105 CMR 210.000 and need not be applied only by staff the school nurse authorizes to give medication. Schools should identify staff who can follow the guidance, read the label, communicate with students, and watch for reactions such as a rash.
      source: dph-school-repellent
      section: Within the context of a school setting
      confidence: high
    - text: Notify parents and caregivers of any school-supplied repellent and let them opt out; parents may send their own repellent if they tell the school, so staff can label and lock it up. Staff wash their hands before and after each application (no gloves).
      source: dph-school-repellent
      section: Within the context of a school setting
      confidence: high
    - text: Do not let children handle repellent; apply it from your own hands to the child's arms, legs, neck, and face, never on hands, under clothing or face masks, near the mouth or eyes, or on cuts; if a rash develops, stop, wash with soap and water, and call a provider or poison control (send the product along).
      source: dph-school-repellent
      section: Using Repellents Safely
      confidence: high
    - text: At high EEE risk, DPH urges towns and schools to move practices, games, and other outdoor activities held between dusk and dawn out of the area of risk or reschedule them; at critical risk it strongly recommends restricting group outdoor activities from dusk to dawn.
      source: dph-arbo-plan
      section: Table 2 (EEE High and Critical) and Appendix 2
      confidence: high
    - text: Schools must comply with Massachusetts requirements for filing outdoor integrated pest management (IPM) plans; DPH emphasizes this at every risk level.
      source: dph-arbo-plan
      section: Tables 1 and 2 (category 1 response)
      confidence: high
  camps:
    - text: "Every recreational camp's written health care policy must include procedures for using insect repellent and conducting tick checks (105 CMR 430.159(B)(4))."
      source: cmr430
      section: 430.159(B)(4)
      confidence: high
    - text: "Brush, weeds, grass, and plants must be controlled in central camp areas to minimize harborage of ticks, chiggers, and other insects (105 CMR 430.401(A)), and camp buildings kept free of insect and rodent infestation (430.400)."
      source: cmr430
      section: 430.400(A); 430.401(A)
      confidence: high
    - text: At high or critical EEE risk, DPH advises avoiding overnight camping, particularly near freshwater swamps, and closing campgrounds between dusk and dawn may be recommended in areas at highest risk.
      source: dph-arbo-plan
      section: VII.B Rescheduling of Outdoor Community Activities; EEE risk level actions
      confidence: high
    - text: CDC advises checking clothing, gear, and the whole body for ticks after time outdoors and showering within two hours of coming indoors; camps can build both into the daily schedule (this project's suggestion for camps).
      source: cdc-tick-prevention
      section: After you come indoors
      confidence: medium
  outdoor_workers:
    - text: Workers in construction, farming, forestry, land surveying, landscaping, park or wildlife management, railroad, and utility line work, and indoor workers next to wooded areas, are at higher risk of tickborne disease.
      source: niosh-ticks
      section: Who is at risk
      confidence: high
    - text: "Employers: train workers on how tickborne diseases spread and how to protect themselves; provide EPA-registered repellents (DEET, picaridin, IR3535, oil of lemon eucalyptus, PMD, or 2-undecanone) and permethrin for clothing; offer long-sleeved uniforms; and clear leaf litter, tall grass, and brush where work cannot avoid them."
      source: niosh-ticks
      section: Recommendations for employers
      confidence: high
    - text: "Workers: wear a hat and light-colored long sleeves and long pants tucked into boots or socks, check skin and clothes for ticks every day, shower as soon as possible, remove ticks right away with fine-tipped tweezers, and dry work clothes in a hot dryer. Tell your provider that you work outdoors if you become ill."
      source: niosh-ticks
      section: Recommendations for workers; When to seek medical attention
      confidence: high
    - text: At high West Nile virus risk, people over 50 or with weakened immune systems should adjust outdoor activity to avoid dusk to dawn; at high EEE risk, local boards of health are encouraged to educate workers in outdoor occupations on personal protection.
      source: dph-arbo-plan
      section: Tables 1 and 2 (High); WNV Risk Levels tab
      confidence: high

disease_notes:
  - text: EEE is rare but serious, with 30-50% mortality and lifelong neurologic disability in many survivors; there is no treatment. Massachusetts had 47 EEE cases from 2000 to 2025, 23 of them fatal.
    source: dph-arbo-plan
    section: II.A Eastern Equine Encephalitis Virus
    confidence: high
  - text: About 80% of people infected with West Nile virus have no symptoms and fewer than 1% develop encephalitis or meningitis; people over 50 have a higher risk of severe illness. All of Massachusetts's at least 17 West Nile virus deaths (2002-2025) were in people over 60.
    source: dph-arbo-plan
    section: II.B West Nile Virus
    confidence: high
  - text: Lyme disease, babesiosis, and anaplasmosis are the most common tick-borne diseases in Massachusetts and are all spread by the black-legged (deer) tick, so co-infection is possible; most infections occur in spring and summer when nymphs are active.
    source: dph-tbd-summary
    section: Introduction
    confidence: high
  - text: In 2025 babesiosis and anaplasmosis cases were mostly older adults (mean age 62 and 63); about a quarter of each were hospitalized. Children ages 5-14, especially boys, also have high Lyme disease rates but are often diagnosed without laboratory testing, so surveillance undercounts them.
    source: dph-tbd-summary
    section: Lyme disease; Babesiosis; Human Granulocytic Anaplasmosis
    confidence: high

data_notes:
  - text: >-
      In 2022 the national Lyme disease case definition changed so that high-incidence states,
      including Massachusetts, count probable cases from laboratory evidence alone. County Lyme
      counts from 2022 on cannot be compared with earlier years.
    source: dph-tbd-summary
    section: Lyme disease; Additional information about Lyme disease surveillance
    confidence: high
  - text: >-
      DPH's tick-borne disease emergency department data count visits with a Lyme disease,
      babesiosis, anaplasmosis, or other tick-borne disease diagnosis among the first three
      codes; not everyone with a tick-borne disease is seen in an emergency department. The rate
      is per 10,000 emergency department visits by county residents.
    source: dph-tick-ed
    section: About the data; Visit Definitions
    confidence: high
  - text: >-
      DPH publishes tick-borne disease cases by county of residence; its town-level figures are
      maps only. Dukes and Nantucket counties are reported together.
    source: dph-tbd-summary
    section: Tables 1-3 and Figures 2, 7, 12
    confidence: high
