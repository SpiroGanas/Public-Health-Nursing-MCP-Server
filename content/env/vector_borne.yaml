season:
  first_month: 6
  last_month: 10
  description:
    text: >-
      DPH tests mosquitoes and posts EEE and West Nile virus risk levels by city and town during
      the arbovirus season, June to October. Risk levels are updated at least once a week during
      the season.
    source: dph-arbo-workbook
    section: Data Dictionary tab (Risk by Town; update frequency)
    confidence: high
  hard_frost:
    text: >-
      Risk for mosquito-borne disease is virtually eliminated by the first local hard frost,
      which kills most remaining adult mosquitoes; because Culex mosquitoes overwinter in warm,
      protected places, isolated West Nile virus cases may rarely occur even after a hard frost.
    source: dph-arbo-plan
    section: VII.A Risk Assessment
    confidence: high
  peak:
    text: >-
      Human cases of EEE and West Nile virus occur mainly in August and September; only 2 of 47
      human EEE cases since 2000 had onset after September 15.
    source: dph-arbo-plan
    section: VII.A Risk Assessment
    confidence: high
  focal_areas:
    text: >-
      DPH sets risk levels for "focal areas" that often include several towns: in general the
      highest-risk municipalities are identified and the surrounding municipalities are set at
      the next highest level. A town can therefore be at moderate or high risk without a positive
      finding of its own.
    source: dph-arbo-plan
    section: VII.A Risk Assessment
    confidence: high

eee_levels:
  - level: Remote
    rank: 1
    color: Dark blue
    meaning: EEE is not usually found in your area.
    definition: >-
      No EEE activity in the municipality or focal area for at least 10 years, no current EEE in
      mosquitoes, and no animal or human EEE cases.
    public_actions:
      - Know your risk; check DPH's arbovirus update page regularly.
      - Repair window screens.
    dph_response:
      - DPH provides educational materials and specimen submission protocols to local boards of health, physicians, veterinarians, animal control officers, and stable owners.
      - Education for the public on personal prevention and source reduction, particularly for people at higher risk of severe disease (for example, children and older adults).
      - Emphasize that schools must comply with Massachusetts requirements for filing outdoor integrated pest management (IPM) plans.
  - level: Low
    rank: 2
    color: Light blue
    meaning: EEE may occur in your area.
    definition: >-
      Any EEE activity in the last 10 years, or sporadic EEE in bird-biting (Culiseta melanura)
      mosquitoes this year with no confirmed animal or human cases.
    public_actions:
      - Know your risk; check DPH's arbovirus update page regularly.
      - Repair window screens.
      - Wear mosquito repellent between dusk and dawn.
      - Wear long sleeves and long pants from dusk to dawn.
      - Use mosquito netting on baby carriages and playpens.
    dph_response:
      - "Everything at the Remote level, plus: expand municipal outreach and public education, especially for high-risk groups, on personal protection and source reduction."
      - DPH sends a public health alert after the first EEE-positive mosquito sample of the season.
  - level: Moderate
    rank: 3
    color: Light orange
    meaning: EEE occurred in your area within the last year and/or there is EEE in mosquitoes in your area now.
    definition: >-
      Last year: sustained EEE in bird-biting mosquitoes, EEE in mammal-biting mosquitoes, or a
      human or animal case; or this year: sustained EEE in Cs. melanura above mean infection
      rates, a single EEE isolate from mammal-biting (bridge vector) mosquitoes, or a
      combination of factors pointing to rising risk, with no animal or human case this year.
    public_actions:
      - Know your risk; check DPH's arbovirus update page regularly.
      - Repair window screens.
      - Wear mosquito repellent between dusk and dawn.
      - Wear long sleeves and long pants from dusk to dawn.
      - Use mosquito netting on baby carriages and playpens.
      - Wear mosquito repellent when outdoors, especially between dusk and dawn.
      - Avoid outside areas with obvious mosquito activity.
    dph_response:
      - "Everything at the Low level, plus: intensify outreach and public education, including media alerts as needed."
      - DPH notifies local boards of health of any EEE-positive specimen (HHAN alert or phone call) and advises health care facilities of the increased risk and the need to send specimens to the State Public Health Laboratory.
      - Supplemental mosquito trapping and testing in areas with positive findings if DPH resources allow.
      - Where a mosquito control district operates, targeted ground adulticiding should be considered where surveillance shows human risk.
  - level: High
    rank: 4
    color: Medium orange
    meaning: Conditions likely to lead to infection of a person with EEE are occurring in your area.
    definition: >-
      Sustained or increasing EEE in Cs. melanura above mean infection rates, two or more EEE
      isolates in mammal-biting mosquitoes from two trap sites in the same week, or a confirmed
      animal case this year, together with factors indicating persistent or increasing risk.
    public_actions:
      - Know your risk; check DPH's arbovirus update page regularly.
      - Repair window screens.
      - Wear mosquito repellent between dusk and dawn.
      - Wear long sleeves and long pants from dusk to dawn.
      - Use mosquito netting on baby carriages and playpens.
      - Wear mosquito repellent when outdoors, especially between dusk and dawn.
      - Avoid outside areas with obvious mosquito activity.
      - Adjust outdoor activity to avoid peak mosquito hours (from dusk to dawn).
      - Avoid overnight camping, particularly near freshwater swamps where EEE activity is most likely.
    dph_response:
      - "Everything at the Moderate level, plus: intensify public education on avoiding outdoor activity during peak mosquito hours, clothing, repellents, and source reduction, using multimedia messages."
      - Local boards of health are encouraged to seek out high-risk groups (nursing homes, schools, workers in outdoor occupations) and educate them on personal protection.
      - Towns and schools are urged to move practices, games, and other outdoor activities held between dusk and dawn to places outside the area of risk, or else reschedule evening events to avoid dusk to dawn, focusing on children and older adults (see DPH's recommended cancellation times).
      - Active surveillance for human cases is intensified; local officials may consider focal aerial adulticiding, and DPH may discuss state-funded aerial application with the State Reclamation and Mosquito Control Board and mosquito control districts.
  - level: Critical
    rank: 5
    color: Dark orange
    meaning: Excessive risk from EEE virus exists; a person with EEE infection has been identified in your area.
    definition: >-
      Multiple measures indicating critical risk (sustained high mosquito infection rates and
      conditions favoring further amplification) with a confirmed human EEE case before late
      August, or multiple animal cases clustered in time and space.
    public_actions:
      - Know your risk; check DPH's arbovirus update page regularly.
      - Repair window screens.
      - Wear mosquito repellent between dusk and dawn.
      - Wear long sleeves and long pants from dusk to dawn.
      - Use mosquito netting on baby carriages and playpens.
      - Wear mosquito repellent when outdoors, especially between dusk and dawn.
      - Avoid outside areas with obvious mosquito activity.
      - Adjust outdoor activity to avoid peak mosquito hours (from dusk to dawn).
      - Avoid overnight camping, particularly near freshwater swamps where EEE activity is most likely.
      - Cancel or reschedule outdoor gatherings, organized sporting events, and similar activities to avoid peak mosquito hours (dusk to dawn).
    dph_response:
      - "Everything at the High level, plus: continued, highly intensified outreach on personal protection, frequent media updates, and a strong recommendation to reschedule outdoor evening events."
      - DPH strongly recommends restricting all group outdoor activities during peak mosquito hours (dusk to dawn) in areas of intensive virus activity.
      - DPH may designate high-risk areas where individual no-spray requests can be preempted, and confers on intensive mosquito control, which may include state-funded aerial adulticide.
      - DPH communicates with health care providers in the area and encourages prompt specimen submission from all clinically suspect cases.
eee_source: dph-arbo-workbook
eee_section: EEE Risk Levels tab
eee_response_source: dph-arbo-plan
eee_response_section: Table 2, Guidelines for Phased Response to EEE Surveillance Data

wnv_levels:
  - level: Low
    rank: 1
    color: Light orange/yellow
    meaning: Infection with WNV is unlikely.
    definition: >-
      All localities begin the year at Low: no or sporadic West Nile virus in mosquitoes in the
      focal area and no animal or human cases.
    public_actions:
      - "Be prepared: know your risk (check DPH's arbovirus update page regularly), repair screens, clean up to get rid of mosquito breeding sites, be aware of stagnant water on private property (for example, unused swimming pools), and consult the local board of health."
      - Wear mosquito repellent between dusk and dawn.
      - Wear long sleeves and long pants from dusk to dawn.
      - Use mosquito netting on baby carriages and playpens.
    dph_response:
      - DPH provides educational materials and specimen submission protocols to local boards of health, physicians, veterinarians, animal control officers, and stable owners.
      - Education for the public on personal prevention and source reduction, particularly for people at higher risk of severe disease (for example, older adults).
      - DPH sends a public health alert after the first WNV-positive mosquito sample of the season.
      - Emphasize that schools must comply with Massachusetts requirements for filing outdoor integrated pest management (IPM) plans.
  - level: Moderate
    rank: 2
    color: Light orange
    meaning: Infection with WNV is likely or has already occurred.
    definition: >-
      Sustained or increasing West Nile virus in mosquitoes in the focal area, one confirmed
      human case, or at least one animal case with conditions suggesting risk will rise.
    public_actions:
      - "Be prepared: know your risk (check DPH's arbovirus update page regularly), repair screens, clean up to get rid of mosquito breeding sites, be aware of stagnant water on private property (for example, unused swimming pools), and consult the local board of health."
      - Wear long sleeves and long pants from dusk to dawn when weather permits.
      - Use mosquito netting on baby carriages and playpens.
      - Wear mosquito repellent when outdoors, especially between dusk and dawn.
      - Dump standing water twice weekly.
    dph_response:
      - "Everything at the Low level, plus: expand municipal outreach and public education, particularly among high-risk groups, on personal protection and source reduction."
      - DPH contacts local boards of health by phone or HHAN when West Nile virus is confirmed in any specimen and advises health care facilities to send specimens to the State Public Health Laboratory.
      - Supplemental mosquito trapping and testing may be done in areas with positive findings; where a mosquito control district operates, larval control and source reduction increase and targeted ground adulticiding may be considered.
  - level: High
    rank: 3
    color: Orange-red
    meaning: More people may get infected with WNV in your area.
    definition: >-
      Sustained or increasing West Nile virus in mosquitoes followed by multiple isolations in
      the same week, or two or more confirmed human cases clustered in time, together with
      factors indicating persistent or increasing risk (time left in the season, hot and dry
      weather, large Culex populations).
    public_actions:
      - "Be prepared: know your risk (check DPH's arbovirus update page regularly), repair screens, clean up to get rid of mosquito breeding sites, be aware of stagnant water on private property (for example, unused swimming pools), and consult the local board of health."
      - Wear long sleeves and long pants from dusk to dawn when weather permits.
      - Use mosquito netting on baby carriages and playpens.
      - Wear mosquito repellent when outdoors, especially between dusk and dawn.
      - Dump standing water twice weekly.
      - People over 50 or those who are immune compromised should adjust outdoor activity to avoid peak mosquito hours (from dusk to dawn).
    dph_response:
      - "Everything at the Moderate level, plus: intensify public education on avoiding outdoor activity during peak mosquito hours, clothing, repellents, and source reduction, using multimedia messages."
      - Local boards of health are encouraged to seek out high-risk groups (for example, nursing homes) and educate them on personal protection and avoiding outdoor evening events.
      - Active surveillance for human cases is intensified and expanded.
  - level: Critical
    rank: 4
    color: Dark red
    meaning: An unusually high risk from WNV exists in your area.
    definition: >-
      More than 5 human cases with exposures clustered in time and space, together with factors
      indicating persistent or increasing risk.
    public_actions:
      - Situation-specific recommendations will be made, in addition to all the actions for the High level.
    dph_response:
      - "In addition to the High-level response: DPH confers with local boards of health, the State Reclamation and Mosquito Control Board, and mosquito control districts on additional interventions."
      - DPH recommends reducing outdoor activities during peak mosquito hours, especially by older adults and others at higher risk of severe disease, in areas of intensive virus activity.
wnv_source: dph-arbo-workbook
wnv_section: WNV Risk Levels tab
wnv_response_source: dph-arbo-plan
wnv_response_section: Table 1, Guidelines for Phased Response to WNV Surveillance Data

