post_rules:
  - {id: alt_text, text: "Every image needs alt text that conveys what the image shows and why it matters (WCAG 1.1.1).", source: wcag}
  - {id: camel_case_hashtags, text: "Capitalize each word in multi-word hashtags (#FluShotsSaveLives) so screen readers read them correctly.", source: tool}
  - {id: hashtags_at_end, text: "Put hashtags at the end and use few of them.", source: tool}
  - {id: few_emoji, text: "Use few emoji and never in place of words; screen readers read each one aloud.", source: tool}
  - {id: no_all_caps, text: "Avoid words in all capitals except acronyms; they are harder to read and may be read letter by letter.", source: tool}
  - {id: plain_language, text: "Keep each post at your target reading grade and avoid jargon (check_readability).", source: tool}

cerc_principles:
  - {name: Be First, text: "Crises are time-sensitive; the first source of information often becomes the preferred source.", source: cerc_intro}
  - {name: Be Right, text: "Accuracy establishes credibility: say what is known, what is not known, and what is being done to fill the gaps.", source: cerc_intro}
  - {name: Be Credible, text: "Do not compromise honesty and truthfulness.", source: cerc_intro}
  - {name: Express Empathy, text: "Acknowledge suffering and what people are feeling.", source: cerc_intro}
  - {name: Promote Action, text: "Give people meaningful things to do.", source: cerc_intro}
  - {name: Show Respect, text: "Communicate respectfully, especially when people feel vulnerable.", source: cerc_intro}

press_release_checklist:
  - {id: contact_block, text: "At the top: organization name, address, email, website, phone, and contact name(s); give the media a 24-hour contact number.", source: cerc_media, section: "What Should Your Media Release Include? (p. 20)"}
  - {id: date, text: "Put the date on the release (date and time if more than one release in 24 hours).", source: cerc_media, section: "p. 20"}
  - {id: headline, text: "Give it an active-voice headline that summarizes the core information; never reuse a headline.", source: cerc_media, section: "p. 20"}
  - {id: release_time, text: "Put 'For immediate release' (or the embargo time) at the top under the contact information.", source: cerc_media, section: "p. 20"}
  - {id: five_ws, text: "Answer who, what, when, where, why, and how; put background in an attached fact sheet.", source: cerc_media, section: "p. 19"}
  - {id: inverted_pyramid, text: "Most important information first (inverted pyramid); new phone numbers or web addresses high up.", source: cerc_media, section: "p. 20"}
  - {id: one_page, text: "Keep an emergency release to one page.", source: cerc_media, section: "p. 19"}
  - {id: short_sentences, text: "Keep sentences and paragraphs short, rarely more than 20 words; explain technical terms.", source: cerc_media, section: "p. 20"}
  - {id: no_loaded_words, text: "Remove adjectives and emotionally loaded words.", source: cerc_media, section: "p. 20"}
  - {id: privacy_check, text: "Check facts, security, and privacy (HIPAA and agency policy) before release.", source: cerc_media, section: "pp. 20-21"}

media_advisory_elements:
  - {id: nature, text: "The nature of the event (media opportunity or press conference).", source: cerc_media, section: "p. 25"}
  - {id: when_where, text: "Date, time, and place.", source: cerc_media, section: "p. 25"}
  - {id: who, text: "Contact person and who will appear (name and title, or position and expertise).", source: cerc_media, section: "p. 25"}
  - {id: topics, text: "The topics to be covered; keep it to about half a page.", source: cerc_media, section: "p. 25"}

spokesperson_questions:
  - "Are my family and I safe?"
  - "What can I do to protect myself and my family?"
  - "Who is in charge here?"
  - "What can we expect?"
  - "Why did this happen?"
  - "Were you forewarned?"
  - "Why wasn't this prevented?"
  - "What else can go wrong?"
  - "When did you begin working on this?"
  - "What does this information mean?"

spokesperson_tips:
  - "Keep messages consistent; do not over-reassure; acknowledge uncertainty and people's fear."
  - "Explain the process in place to find answers, and give people things to do."
  - "Know your organization's policies, stay within your scope, tell the truth, and be transparent."
