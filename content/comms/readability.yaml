# Readability formulas, plain-language thresholds, the CDC Clear Communication Index rubric, and
# CDC's Everyday Words jargon list, for check_readability (COMM-01) and the other comms tools.
#
# REVIEW STATUS: pending. See meta.verification_note.
# Schema: content/schemas/comms_readability.schema.json
meta:
  id: comms-readability
  title: Readability, plain language, and the CDC Clear Communication Index
  version: 0.1.0
  prepared: 2026-11-08
  effective_date: null
  source:
    title: CDC Clear Communication Index Score Sheet (full Index, revised July 2014)
    publisher: Centers for Disease Control and Prevention, Office of the Associate Director for Communication
    url: https://www.cdc.gov/ccindex/pdf/full-index-score-sheet.pdf
  related_sources:
    - title: "CDC Clear Communication Index: User Guide (August 2019)"
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/ccindex/pdf/clear-communication-user-guide.pdf
    - title: Everyday Words for Public Health Communication
      publisher: Centers for Disease Control and Prevention
      url: https://www.cdc.gov/ccindex/everydaywords/index.html
    - title: "Simply Put: A Guide for Creating Easy-to-Understand Materials (3rd edition, July 2010)"
      publisher: Centers for Disease Control and Prevention
      url: https://stacks.cdc.gov/view/cdc/11938
    - title: "Health Literacy Online (3rd edition), 4.3 Write in plain language"
      publisher: Office of Disease Prevention and Health Promotion, HHS
      url: https://odphp.health.gov/healthliteracyonline/create-actionable-content/write-plain-language
  review:
    status: pending
    reviewed_by: null
    reviewed_on: null
    review_due: 2027-02-01
  verification_note: >-
    Drafted 2026-11-08. The Clear Communication Index questions, scoring rules, and the 90-point
    passing mark are transcribed from CDC's full Index score sheet (revised July 2014) and the
    User Guide (August 2019), both fetched from cdc.gov (high confidence). The jargon list is every
    active entry in CDC's Everyday Words tool (124 terms, read from the tool's public data service
    at tools.cdc.gov/ewapi on 2026-11-08); the 'match' forms and the check_context flag were added
    by the developer. Sentence, paragraph, and list thresholds come from CDC's plain language
    checklist, Simply Put, ODPHP Health Literacy Online, and the Index (high confidence). The SMOG
    conversion table is transcribed from Simply Put Appendix C (which misprints the 31-42 row as
    "61-42"). The formula coefficients are the standard published ones; the original articles
    (Flesch 1948, Kincaid et al. 1975, McLaughlin 1969, Gunning 1952) could not be fetched in this
    environment, so they are cited but not re-read (high confidence for the coefficients, medium
    for the Flesch interpretation bands and the Gunning complex-word rules). The default target of
    grade 8 is a tool default, not taken from a cited source (low confidence): set it to your
    agency's standard.

