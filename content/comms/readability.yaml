formulas:
  - id: flesch_reading_ease
    name: Flesch Reading Ease
    formula: "206.835 - 1.015 x (words / sentences) - 84.6 x (syllables / words)"
    scale: "0 to 100; higher is easier"
    source: flesch_1948
    confidence: high
  - id: flesch_kincaid_grade
    name: Flesch-Kincaid Grade Level
    formula: "0.39 x (words / sentences) + 11.8 x (syllables / words) - 15.59"
    scale: U.S. school grade
    source: kincaid_1975
    confidence: high
  - id: smog
    name: SMOG (Simple Measure of Gobbledygook)
    formula: "1.0430 x sqrt(polysyllabic words x 30 / sentences) + 3.1291; polysyllabic words have 3 or more syllables"
    scale: "U.S. school grade (years of education needed to understand the text)"
    source: mclaughlin_1969
    confidence: high
  - id: gunning_fog
    name: Gunning Fog Index
    formula: "0.4 x ((words / sentences) + 100 x (complex words / words)); complex words have 3 or more syllables, not counting proper nouns, hyphenated compounds, or words that reach 3 syllables only with -es, -ed, or -ing"
    scale: U.S. school grade
    source: gunning_1952
    confidence: medium

# Flesch's interpretation of Reading Ease scores.
flesch_bands:
  confidence: medium
  source: flesch_1948
  bands:
    - {min: 90, label: very easy}
    - {min: 80, label: easy}
    - {min: 70, label: fairly easy}
    - {min: 60, label: standard}
    - {min: 50, label: fairly difficult}
    - {min: 30, label: difficult}
    - {min: -1000, label: very difficult}

# SMOG conversion table: total polysyllabic words in 30 sentences -> approximate grade.
smog_table:
  source: simply_put
  section: "Appendix C: Formulas for Calculating Readability, Using SMOG (p. 31); table developed by Harold C. McGraw, Baltimore County Schools"
  note: "Simply Put prints the sixth row as 61-42; it is 31-42 (the rows are contiguous)."
  accuracy: "The SMOG formula can predict the grade level difficulty within 1.5 grades in 68 percent of passages."
  rows:
    - {min: 0, max: 2, grade: 4}
    - {min: 3, max: 6, grade: 5}
    - {min: 7, max: 12, grade: 6}
    - {min: 13, max: 20, grade: 7}
    - {min: 21, max: 30, grade: 8}
    - {min: 31, max: 42, grade: 9}
    - {min: 43, max: 56, grade: 10}
    - {min: 57, max: 72, grade: 11}
    - {min: 73, max: 90, grade: 12}
    - {min: 91, max: 110, grade: 13}

thresholds:
  default_target_grade: 8
  default_target_grade_note: "Tool default (not from a cited source). Many health-literacy programs aim lower; set target_grade to your agency's standard."
  long_sentence_words: 20
  long_sentence_source: "CDC plain language checklist ('Strive for an average of 20 words per sentence. Limit each sentence to 1 idea.'); Health Literacy Online 4.3 ('Try to keep sentences to 20 words and under')."
  typical_sentence_words: "8 to 10"
  typical_sentence_source: "Simply Put p. 6: 'Keep most sentences, if possible, between eight to ten words and limit paragraphs to three to five sentences.'"
  paragraph_max_sentences: 5
  paragraph_source: "CDC plain language checklist ('Limit paragraphs to 1 topic and 5 sentences'); Simply Put p. 6 (three to five sentences)."
  list_max_items: 7
  list_source: "CDC Clear Communication Index item 8 (a list of more than 7 items not broken into sub-lists scores 0); Simply Put p. 5 ('Create short lists (3-7 items)')."
  main_ideas_max: 4
  main_ideas_source: "Simply Put p. 5: 'Give your audience no more than three or four main ideas per document or section of your document.'"

guidance:
  - text: "Readability formulas are a mechanical count of syllables and sentences; they don't consider audience, purpose, or most of what makes a material clear. Use them with the Clear Communication Index and testing with your audience."
    source: cci_user_guide
    section: "What Makes the Index Different from Other Communication Guidelines and Readability Formulas? (p. 2)"
  - text: "Comprehension levels are often two or more grades below reading or education level, and drop further when a person is under stress."
    source: simply_put
    section: "Testing for Readability (p. 27)"
  - text: "If long names of organizations, diseases, or other proper nouns raise the grade level, check the score without those words; if it is still too high, use everyday words."
    source: simply_put
    section: "Testing for Readability (p. 27)"
  - text: "Write in the active voice: the subject of the sentence performs the action (for example, 'You may need a test to find out what's wrong,' not 'Tests may be needed to find out what's wrong')."
    source: health_literacy_online
    section: "4.3 Write in plain language"
  - text: "Define a necessary medical term the first time you use it, in the sentence or in parentheses (for example, 'vomiting (throwing up)')."
    source: health_literacy_online
    section: "4.3 Write in plain language"
  - text: "Tell the audience what to do rather than what not to do (for example, 'Wear your helmet every time you ride your bicycle')."
    source: simply_put
    section: "Tell audiences what they need to do (p. 5)"

cci:
  passing_score: 90
  passing_source: "User Guide p. 1: 'Although 100 is an ideal score, 90 or higher is passing.'"
  rules:
    - "Choose one answer for each item you score."
    - "Only score a point when all instances of an item in the material meet the criteria."
    - "If you answered No to item 1, score 0 for items 2-4."
    - "Score = points earned / points possible x 100. Part A (items 1-11) always counts (11 points); Parts B, C, and D count only when they apply; items 19 and 20 can be not applicable, which removes them from the points possible."
    - "If the audiences for English and non-English versions differ, score the materials separately."
  intro_questions:
    - "Who is your primary audience?"
    - "What do you know about the health literacy skills of your audience? (If you have no information, assume average to low health literacy skills.)"
    - "What is your primary communication objective (what you want the audience to think, feel, or do)?"
    - "What is the main message statement in the material (the one thing the audience must remember, 1-3 short sentences)?"
  parts:
    - id: A
      name: Core
      applies_question: null
    - id: B
      name: Behavioral recommendations
      applies_question: "Does the material include one or more behavioral recommendations for the primary audience?"
    - id: C
      name: Numbers
      applies_question: "Does the material include one or more numbers related to the topic?"
    - id: D
      name: Risk
      applies_question: "Does the material present information, including numbers, about risk?"
  items:
    - {number: 1, part: A, area: Main message and call to action, guide_page: 5, na_allowed: false, yes_scores: 1,
       question: "Does the material contain one main message statement?",
       guidance: "A main message is the one thing you want the audience to remember. A topic, such as heart disease or seasonal flu, isn't a main message statement. If the material contains several messages and no main message, answer no."}
    - {number: 2, part: A, area: Main message and call to action, guide_page: 6, na_allowed: false, yes_scores: 1,
       question: "Is the main message at the top, beginning, or front of the material?",
       guidance: "The main message must be in the first paragraph or section (a block of text between headings). For a Web material, the first section must be fully visible without scrolling."}
    - {number: 3, part: A, area: Main message and call to action, guide_page: 7, na_allowed: false, yes_scores: 1,
       question: "Is the main message emphasized with visual cues?",
       guidance: "Font, color, shapes, lines, arrows, or headings such as 'What you need to know' count."}
    - {number: 4, part: A, area: Main message and call to action, guide_page: 8, na_allowed: false, yes_scores: 1,
       question: "Does the material contain at least one visual that conveys or supports the main message?",
       guidance: "Photographs, line drawings, graphs, and infographics count. A visual without a caption or labels, or with people who aren't performing the recommended behaviors, does not."}
    - {number: 5, part: A, area: Main message and call to action, guide_page: 10, na_allowed: false, yes_scores: 1,
       question: "Does the material include one or more calls to action for the primary audience?",
       guidance: "A specific behavioral recommendation, a prompt to get more information, a request to share information, or a broad call for change counts, if it is for the primary audience."}
    - {number: 6, part: A, area: Language, guide_page: 11, na_allowed: false, yes_scores: 1,
       question: "Do both the main message and the call to action use the active voice?",
       guidance: "If only one of them uses the active voice, or you answered no to item 1 or 5, answer no."}
    - {number: 7, part: A, area: Language, guide_page: 12, na_allowed: false, yes_scores: 1,
       question: "Does the material always use words the primary audience uses?",
       guidance: "All specialized or unfamiliar terms must be explained or described (not just defined) the first time they are used; acronyms and abbreviations must be spelled out and explained if unfamiliar."}
    - {number: 8, part: A, area: Information design, guide_page: 14, na_allowed: false, yes_scores: 1,
       question: "Does the material use bulleted or numbered lists?",
       guidance: "A list with more than 7 items not broken into sub-lists, or a list only for additional information or references at the end, scores no."}
    - {number: 9, part: A, area: Information design, guide_page: 15, na_allowed: false, yes_scores: 1,
       question: "Is the material organized in chunks with headings?",
       guidance: "Applies to prose and lists. Chunks with more than one idea, or headings that don't match their chunks, score no."}
    - {number: 10, part: A, area: Information design, guide_page: 17, na_allowed: false, yes_scores: 1,
       question: "Is the most important information the primary audience needs summarized in the first paragraph or section?",
       guidance: "The most important information must include the main message."}
    - {number: 11, part: A, area: State of the science, guide_page: 18, na_allowed: false, yes_scores: 1,
       question: "Does the material explain what authoritative sources, such as subject matter experts and agency spokespersons, know and don't know about the topic?",
       guidance: "Both what is known and what is not known must be addressed."}
    - {number: 12, part: B, area: Behavioral recommendations, guide_page: 19, na_allowed: false, yes_scores: 1,
       question: "Does the material include one or more behavioral recommendations for the primary audience?",
       guidance: "If no, stop and don't score Part B."}
    - {number: 13, part: B, area: Behavioral recommendations, guide_page: 20, na_allowed: false, yes_scores: 1,
       question: "Does the material explain why the behavioral recommendation(s) is important to the primary audience?",
       guidance: "Numbers alone, with no other relevant information for the audience, score no."}
    - {number: 14, part: B, area: Behavioral recommendations, guide_page: 21, na_allowed: false, yes_scores: 1,
       question: "Does the behavioral recommendation(s) include specific directions about how to perform the behavior?",
       guidance: "Step-by-step directions, a simple description, when and how to contact a provider or health official, or when and how often to do the behavior count."}
    - {number: 15, part: C, area: Numbers, guide_page: 22, na_allowed: false, yes_scores: 1,
       question: "Does the material always present numbers the primary audience uses?",
       guidance: "Numbers should be familiar and necessary to support the main message; delete the rest. Most audiences use whole numbers."}
    - {number: 16, part: C, area: Numbers, guide_page: 23, na_allowed: false, yes_scores: 1,
       question: "Does the material always explain what the numbers mean?",
       guidance: "For example, '3 to 4 ounces of meat - about the size of a deck of cards.'"}
    - {number: 17, part: C, area: Numbers, guide_page: 24, na_allowed: false, yes_scores: 0,
       question: "Does the audience have to conduct mathematical calculations?",
       guidance: "Adding, subtracting, multiplying, dividing, or finding a common denominator are calculations. Use the same denominator throughout (for example, 1 out of 3). For this item, Yes scores 0 and No scores 1."}
    - {number: 18, part: D, area: Risk, guide_page: 26, na_allowed: false, yes_scores: 1,
       question: "Does the material explain the nature of the risk?",
       guidance: "State the threat or harm and how and why people may be affected; the threat alone scores no."}
    - {number: 19, part: D, area: Risk, guide_page: 27, na_allowed: true, yes_scores: 1,
       question: "Does the material address both the risks and benefits of the recommended behaviors?",
       guidance: "Actual and perceived risks and benefits; only one of the two scores no. Not applicable when there is no behavioral recommendation."}
    - {number: 20, part: D, area: Risk, guide_page: 28, na_allowed: true, yes_scores: 1,
       question: "If the material uses numeric probability to describe risk, is the probability also explained with words or a visual?",
       guidance: "Numeric risk (such as 1 in 5 or 20%) must also be explained in words or a visual. Not applicable when there is no numeric probability."}

# Extra plain-language swaps given as examples in CDC's Simply Put (pp. 6-7).
extra_terms:
  - term: Contraception
    match: ["contraception", "contraceptive"]
    plain: birth control
    note: null
    check_context: false
    source: simply_put
  - term: Adverse health effects
    match: ["adverse health effect"]
    plain: "say what could happen, for example 'you could get sick'"
    note: "Simply Put p. 6: 'Say: You could get sick if you are near the chemical. Not: Exposure to the chemical could cause adverse health effects.'"
    check_context: false
    source: simply_put

# Every active entry in CDC's Everyday Words for Public Health Communication (retrieved 2026-11-08).
# 'plain' is CDC's everyday alternative; 'note' is CDC's note; examples are CDC's before/after.
jargon:
  - term: "Accessible"
    match: ["accessible"]
    plain: "able to get or reach; usable; findable"
    note: null
    example_before: "Ensure that your facility is fully accessible (e.g., parking, exam tables, restrooms, etc.)."
    example_after: "Make sure people with disabilities can get to and use every part of your facility. Examples include the parking lot, patient exam tables, and restrooms."
    check_context: false
    source: everyday_words
  - term: "Acquire"
    match: ["acquire"]
    plain: "get"
    note: null
    example_before: "Almost every sexually active person will acquire HPV at some point in their lives."
    example_after: "If they don't get the shot to protect against it, almost everyone who is sexually active will get human papillomavirus, or HPV, at some time in their lives."
    check_context: false
    source: everyday_words
  - term: "Activate"
    match: ["activate"]
    plain: "begin, start, turn on, act"
    note: null
    example_before: "If the worker does not exit or enter properly, a foot or hand control may be activated and may cause movement of the lift arms, bucket, or other attachment."
    example_after: "You must get in or out in a safe manner, or you may accidentally start a foot or hand control that moves the lift arms, bucket, or other attachment."
    check_context: false
    source: everyday_words
  - term: "Acute"
    match: ["acute"]
    plain: "sudden; happen without warning; sickness that lasts a short time and goes away"
    note: null
    example_before: "Mumps is an acute viral illness."
    example_after: "Mumps usually causes the following symptoms for about 7 to 10 days: * Fever * Headache * Muscle aches * Tiredness * Loss of appetite (not wanting to eat) * Swollen glands under the ears or jaw"
    check_context: false
    source: everyday_words
  - term: "address"
    match: ["address"]
    plain: "fix, improve, increase, or decrease"
    note: "Address is vague. Using a more specific term that helps your readers understand the goal of addressing the issue. Note: This does not apply to using \"address\" in terms of a location or speaking directly to someone."
    example_before: "This solution will address the dangers of the problem."
    example_after: "This solution will reduce the dangers of the problem. This solution will fix the dangers of the problem."
    check_context: true
    source: everyday_words
  - term: "Adhere and Adherence"
    match: ["adhere", "adherence"]
    plain: "Sticks To"
    note: "Sticks to"
    check_context: false
    source: everyday_words
  - term: "Adverse Event"
    match: ["adverse event", "adverse reaction", "adverse effect"]
    plain: "possible side effect or reaction after getting a shot or taking medicine"
    note: null
    example_before: "Adverse events following smallpox vaccination should be reported to state public health authorities and to the national Vaccine Adverse Events Reporting System (VAERS)."
    example_after: "You should report any reactions that happen after getting the smallpox shot to state public health authorities and the national Vaccine Adverse Events Reporting System (VAERS)."
    check_context: false
    source: everyday_words
  - term: "Agent (biological)"
    match: ["biological agent", "biologic agent"]
    plain: "natural or living thing that can cause an event or result"
    note: "Instead of chemical agent, use chemical."
    example_before: "The U.S. public health system and primary health care providers must be prepared to address various biological agents, including pathogens that are rarely seen in the United States."
    example_after: "The U.S. public health system and primary care providers must be ready to identify and protect against diseases caused by many different germs. Even if they aren't common, we must be ready just in case."
    check_context: false
    source: everyday_words
  - term: "Angina"
    match: ["angina"]
    plain: "Pain in the chest related to the heart that comes and goes; chest pain caused by reduced blood flow to the heart; occasional chest pain"
    note: null
    example_before: "Angina is a symptom of coronary artery disease."
    example_after: "Angina, chest pain caused by reduced blood flow to the heart, is a symptom of the most common type of heart disease."
    check_context: false
    source: everyday_words
  - term: "Anxiety"
    match: ["anxiety"]
    plain: "worry, fear"
    note: null
    example_before: "Someone who is depressed has feelings of sadness or anxiety that last for weeks at a time."
    example_after: "Someone who is depressed feels sad, worried, or fearful for weeks at a time."
    check_context: false
    source: everyday_words
  - term: "Assess or assessment"
    match: ["assess", "assessment"]
    plain: "act or process for collecting and analyzing information about a topic, group of people, or a place; information about size, quality, or value; frequently used for school health assessment, community (needs) assessment, workplace health assessment, health impact assessment, public health assessment; see also evaluate"
    note: null
    example_before: "The last step in the assessment process is to present and report what was learned during the workplace health assessment to key organizational stakeholders and decision makers."
    example_after: "After you have collected and analyzed the workplace information, write a report about what you learned and share the report with the people interested in the results."
    check_context: false
    source: everyday_words
  - term: "Associated with"
    match: ["associated with"]
    plain: "linked to, related to, goes along with, is part of, happens with"
    note: null
    example_before: "This study demonstrates that autism spectrum disorder is not associated with immunological stimulation from vaccines during the first 2 years of life."
    example_after: "This study shows that autism spectrum disorder is not related to shots given to children 2 years old and younger."
    check_context: false
    source: everyday_words
  - term: "Attain"
    match: ["attain"]
    plain: "meet a goal, get, reach, receive"
    note: null
    example_before: "The CDC believes every person should have the opportunity to attain his or her full health potential."
    example_after: "CDC believes everyone should have the chance to be as healthy as possible."
    check_context: false
    source: everyday_words
  - term: "Bacteria"
    match: ["bacteria"]
    plain: "germs or \"bugs\" that can infect people, animals, plants, other living things, soil, water, and other parts of the environment; germs that grow and can cause sickness; we can treat these sicknesses with medicines called antibiotics."
    note: "Depending on the audience, \"bacteria\" may be a familiar term. When the communication objective includes explaining the difference between bacteria and viruses, you may need to use \"bacteria\" and \"virus\" rather than \"germs\". You can use the plain language explanations to help readers understand the differences. (Also see: Virus)"
    example_before: "The bacteria known as Bacillus anthracis produce dormant spores (not active) that can live in the environment, like soil, for a long time, even decades. Contact with anthrax can cause severe illness in both humans and animals."
    example_after: "Anthrax germs can live in soil for decades. When people or animals breathe in anthrax germs, they can get very sick and even die."
    check_context: true
    source: everyday_words
  - term: "biweekly"
    match: ["biweekly"]
    plain: "every other week, every two weeks, or twice per week"
    note: "Biweekly can mean two different things. Be specific to avoid confusion."
    example_before: "Resistance training biweekly can improve your health."
    example_after: "Resistance training twice per week can improve your health."
    check_context: false
    source: everyday_words
  - term: "Capacity"
    match: ["capacity"]
    plain: "what a person, group, or organization can achieve or do; size or what a physical space or thing, such as a program, can hold or manage"
    note: null
    example_before: "A successful program assessment will highlight capacities within and surrounding the participating organization, target population, and problem."
    example_after: "Information about how a program works and what it achieves will be useful if it includes what organizations and people can do about a problem."
    check_context: true
    source: everyday_words
  - term: "Carcinogen"
    match: ["carcinogen"]
    plain: "substance that causes cancer"
    note: null
    example_before: "Wood dust, associated with cancers of the nasal cavities and sinuses, is a known carcinogen for unprotected workers exposed regularly from sanding operations and furniture manufacturing."
    example_after: "Workers who breathe wood dust from sanding operations and furniture manufacturing can develop cancers in their noses and sinuses."
    check_context: false
    source: everyday_words
  - term: "Carcinoma"
    match: ["carcinoma"]
    plain: "cancer"
    note: null
    example_before: "Common kinds of breast cancer are ductal carcinoma, the most common kind of breast cancer. It begins in the cells that line the milk ducts in the breast, also called the lining of the breast ducts."
    example_after: "A common kind of breast cancer is ductal carcinoma, or cancer in the milk \"tubes\" or ducts in the breast. Carcinoma is the medical term for cancer. Cancer of the milk ducts begins in the cells inside the ducts."
    check_context: false
    source: everyday_words
