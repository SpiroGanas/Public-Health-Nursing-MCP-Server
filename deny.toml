# cargo-deny configuration: licenses, advisories, banned crates, and sources.
# Run locally with `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Each exception needs a reason and a date to look at it again (cargo-deny has no expiry, so
# STATUS.md lists the review date as an open item).
ignore = [
    # RUSTSEC-2026-0543: chrono is unmaintained (not a vulnerability). Our own crates moved to
    # jiff (phn_core::time); chrono is still pulled in by rmcp 3.9, which depends on it directly
    # and turns on schemars' `chrono04` feature. Remove this entry when rmcp drops chrono.
    # Review by 2027-02-01.
    { id = "RUSTSEC-2026-0543", reason = "chrono only via rmcp (and schemars' chrono04 feature, enabled by rmcp); our code uses jiff" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only (plus MPL-2.0, a file-level copyleft used by the
# HTML parser, which is compatible with distributing this MIT project).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
